    description: "Os desenhos ou modelos da edifica\xE7\xE3o s\xE3o apresentados online\
      \ por meio de imagens vetoriais ou bitmap.\nCada desenho ou modelo pode ser\
      \ apresentado sob v\xE1rias representa\xE7\xF5es, como pr\xE9-visualiza\xE7\xE3\
      o, imagem original, ou servi\xE7o [IIIF]. Essas imagens devem ser identificadas\
      \ como segue\u2009:\nAs categorias de representa\xE7\xE3o previstas no [LIDO]\
      \ podem ser consultadas em <http://terminology.lido-schema.org/resourceRepresentation_type>\
      \ e s\xE3o inseridas na ficha como um mapa.\nNos Document\xE1rios da Arquitetura\
      \ Tradicional, desdobramos o grupo LIDO [`relatedWorksWrap`](https://lido-schema.org/schema/v1.1/lido-v1.1.html#relatedWorksWrap)\
      \ em quatro tipos de relacionamentos\u2009:\n1. `part_of`\u2009: a edifica\xE7\
      \xE3o descrita na ficha \xE9 intrinsecamente parte\n   de um conjunto arquitet\xF4\
      nico ou urban\xEDstico maior, quando se trata\n   de uma parte fisicamente vinculada\
      \ a outra edifica\xE7ao ou um\n   elemento concebido dentro de um projeto de\
      \ conjunto.\n\n2. `related_works`\u2009: a edifica\xE7\xE3o descrita na ficha\
      \ pode ser\n   relacionada, por meio de interpreta\xE7\xE3o historiogr\xE1fica,\
      \ a outras\n   edifica\xE7\xF5es ou objetos (fontes prim\xE1rias escritas ou\
      \ visuais,\n   obras de arte em geral, outras edifica\xE7\xF5es, etc.).\n\n\
      3. `media`\u2009: fotografias ou imagens hist\xF3ricas (desenhos t\xE9cnicos\
      \ ou\n   art\xEDsticos, pinturas, estampas, etc.) que representem fielmente\
      \ a\n   apar\xEAncia da edifica\xE7\xE3o descrita na ficha.\n\n4. `resources`\u2009\
      : desenhos t\xE9cnicos em formato vetorial e,\n   eventualmente, modelos tridimensionais\
      \ ou outras formas de\n   informa\xE7\xE3o t\xE9cnica que n\xE3o cabem no formato\
      \ da ficha, mas que\n   foram produzidas pela equipe e colaboradores do projeto\
      \ de\n   pesquisa.\n"
    from_schema: https://tradicional.arq.br/schema/resource
    is_a: resources
    domain: Work
    slot_uri: wasth:resources
    alias: resources
    owner: Work
    domain_of:
    - Work
    is_usage_slot: true
    usage_slot_name: resources
    range: Resource
    multivalued: true
    inlined: true
    inlined_as_list: false
  Work_media:
    name: Work_media
    definition_uri: https://tradicional.arq.br/schema/media
    description: "Nos Document\xE1rios da Arquitetura Tradicional, desdobramos o grupo\
      \ LIDO [`relatedWorksWrap`](https://lido-schema.org/schema/v1.1/lido-v1.1.html#relatedWorksWrap)\
      \ em quatro tipos de relacionamentos\u2009:\n1. `part_of`\u2009: a edifica\xE7\
      \xE3o descrita na ficha \xE9 intrinsecamente parte\n   de um conjunto arquitet\xF4\
      nico ou urban\xEDstico maior, quando se trata\n   de uma parte fisicamente vinculada\
      \ a outra edifica\xE7ao ou um\n   elemento concebido dentro de um projeto de\
      \ conjunto.\n\n2. `related_works`\u2009: a edifica\xE7\xE3o descrita na ficha\
      \ pode ser\n   relacionada, por meio de interpreta\xE7\xE3o historiogr\xE1fica,\
      \ a outras\n   edifica\xE7\xF5es ou objetos (fontes prim\xE1rias escritas ou\
      \ visuais,\n   obras de arte em geral, outras edifica\xE7\xF5es, etc.).\n\n\
      3. `media`\u2009: fotografias ou imagens hist\xF3ricas (desenhos t\xE9cnicos\
      \ ou\n   art\xEDsticos, pinturas, estampas, etc.) que representem fielmente\
      \ a\n   apar\xEAncia da edifica\xE7\xE3o descrita na ficha.\n\n4. `resources`\u2009\
      : desenhos t\xE9cnicos em formato vetorial e,\n   eventualmente, modelos tridimensionais\
      \ ou outras formas de\n   informa\xE7\xE3o t\xE9cnica que n\xE3o cabem no formato\
      \ da ficha, mas que\n   foram produzidas pela equipe e colaboradores do projeto\
      \ de\n   pesquisa.\n"
    from_schema: https://tradicional.arq.br/schema/resource
    is_a: media
    domain: Work
    slot_uri: wasth:media
    alias: media
    owner: Work
    domain_of:
    - Work
    is_usage_slot: true
    usage_slot_name: media
    range: MediaObject
    multivalued: true
    inlined: true
    inlined_as_list: true
  Work_record_rights:
    name: Work_record_rights
    definition_uri: https://tradicional.arq.br/schema/record_rights
    description: "Informa\xE7\xF5es estruturadas sobre os direitos que incidem sobre\
      \ o conte\xFAdo textual desta ficha e o detentor desses direitos.\n\u26A0\uFE0F\
      \  Este grupo se refere aos direitos sobre o CONTE\xDADO da ficha, n\xE3o sobre\
      \ os direitos incidentes sobre o objeto descrito.\n"
    notes:
    - A set of structured information about rights regarding the content provided
      in this LIDO record.
    from_schema: https://tradicional.arq.br/schema/thing
    is_a: record_rights
    domain: Work
    slot_uri: wasth:record_rights
    alias: record_rights
    owner: Work
    domain_of:
    - Work
    is_usage_slot: true
    usage_slot_name: record_rights
    range: Right
    required: true
    multivalued: true
    inlined: true
    inlined_as_list: true
  Work_work_rights:
    name: Work_work_rights
    definition_uri: https://tradicional.arq.br/schema/work_rights
    description: "\u26A0\uFE0F  Este bloco se refere a eventuais direitos autorais\
      \ ou de propriedade sobre O OBJETO OU RECURSO QUE EST\xC1 SENDO DESCRITO, n\xE3\
      o sobre o preenchimento da ficha.\n"
    from_schema: https://tradicional.arq.br/schema/resource
    mappings:
    - lido:rightsWorkSet
    is_a: work_rights
    domain: Work
    slot_uri: lido:rightsWorkSet
    alias: work_rights
    owner: Work
    domain_of:
    - Work
    is_usage_slot: true
    usage_slot_name: work_rights
    range: Right
    required: true
    multivalued: true
    inlined: true
    inlined_as_list: true
  Work_content:
    name: Work_content
    definition_uri: https://tradicional.arq.br/schema/content
    description: "Deixe uma linha em branco ap\xF3s o fechamento dos metadados e inclua\
      \ aqui uma descri\xE7\xE3o morfol\xF3gica e hist\xF3rica da edifica\xE7\xE3\
      o com texto livre, usando formata\xE7\xE3o Markdown.\nPoder\xE1 incluir um segundo\
      \ bloco de metadados para indicar as refer\xEAncias bibliogr\xE1ficas da descri\xE7\
      \xE3o textual, no campo `nocite`. O formato \xE9 uma lista de chaves de cita\xE7\
      \xE3o do Zotero (cada uma come\xE7ando com `@`) separadas por v\xEDrgulas:\n\
      ```yaml Conte\xFAdo textual em formato *Markdown* com cita\xE7\xF5es [@citekey].\n\
      --- nocite: \"@*\" --- ```\n"
    from_schema: https://tradicional.arq.br/schema/thing
    mappings:
    - lido:descriptiveNoteValue
    is_a: content
    domain: Work
    slot_uri: lido:descriptiveNoteValue
    alias: content
    owner: Work
    domain_of:
    - Work
    is_usage_slot: true
    usage_slot_name: content
    range: string
    recommended: true
  Topic_concept_name:
    name: Topic_concept_name
    definition_uri: https://tradicional.arq.br/schema/concept_name
    from_schema: https://tradicional.arq.br/schema/concept
    is_a: concept_name
    domain: Topic
    slot_uri: wasth:concept_name
    alias: concept_name
    owner: Topic
    domain_of:
    - Topic
    is_usage_slot: true
    usage_slot_name: concept_name
    range: Concept
    required: true
    inlined: true
    inlined_as_list: true
classes:
  Container:
    name: Container
    definition_uri: https://tradicional.arq.br/schema/Container
    description: "Todos os elementos do document\xE1rio."
    from_schema: https://tradicional.arq.br/schema
    slots:
    - container__works
    - container__concepts
    - container__places
    attributes:
      works:
        name: works
        description: "Todas as edifica\xE7\xF5es documentadas."
        range: Work
        multivalued: true
        inlined_as_list: true
      concepts:
        name: concepts
        description: "Todos os termos de vocabul\xE1rio controlado."
        range: Concept
        multivalued: true
        inlined_as_list: true
      places:
        name: places
        description: Lugares indexados pelo Geonames
        range: GeonamesFeature
        multivalued: true
        inlined_as_list: true
    class_uri: wasth:Container
    tree_root: true
  Concept:
    name: Concept
    definition_uri: https://tradicional.arq.br/schema/Concept
    description: "Um conceito \xE9 uma unidade de conhecimento ou entendimento delimitada\
      \ e definida com clareza, distinta de outros conceitos. Cada conceito pretende\
      \ descrever um aspecto ou recorte da realidade emp\xEDrica ou te\xF3rica, de\
      \ modo que a sua defini\xE7\xE3o seja amplamente conhecida e partilhada dentro\
      \ do campo disciplinar ao qual ele pertence.\nPara al\xE9m da clareza na defini\xE7\
      \xE3o do pr\xF3prio conceito, estabelecer a sua rela\xE7\xE3o com outros conceitos\
      \ mais gerais ou mais espec\xEDficos \xE9 importante ao se constituir um vocabul\xE1\
      rio controlado.\nPor isso, a defini\xE7\xE3o de cada conceito DEVE se referir\
      \ a bibliografia consagrada e, sempre que poss\xEDvel, a outros vocabul\xE1\
      rios controlados nacionais e estrangeiros.\n-------------------------------------------------------------------------\n\
      A SKOS concept can be viewed as an idea or notion; a unit of thought. However,\
      \ what constitutes a unit of thought is subjective, and this definition is meant\
      \ to be suggestive, rather than restrictive.\nThe notion of a SKOS concept is\
      \ useful when describing the conceptual or intellectual structure of a knowledge\
      \ organization system, and when referring to specific ideas or meanings established\
      \ within a KOS.\nNote that, because SKOS is designed to be a vehicle for representing\
      \ semi-formal KOS, such as thesauri and classification schemes, a certain amount\
      \ of flexibility has been built in to the formal definition of this class.\n"
    from_schema: https://tradicional.arq.br/schema/concept
    exact_mappings:
    - skos:Concept
    - schema:DefinedTerm
    is_a: Thing
    slots:
    - id
    - record_author
    - record_date
    - description
    - category
    - record_rights
    - bibliographic_citation
    - thing__title
    - thing__title_source
    - thing__alt_name
    - thing__identifiers
    - thing__tags
    - thing__temporal
    - thing__repositories
    - broader
    - narrower
    - concept__concept_type
    - concept__mapping
    - concept__relation
    - Concept_content
    slot_usage:
      content:
        name: content
        description: Notas de escopo sobre o conceito.
        slot_uri: skos:scopeNote
    attributes:
      concept_type:
        name: concept_type
        description: "Tipos de termos de vocabul\xE1rio baseados no Getty AAT.\n"
        ifabsent: ConceptType(concept)
        range: ConceptType
      mapping:
        name: mapping
        description: "Um conceito com o qual existe um relacionamento sem\xE2ntico\
          \ associativo. Usar em refer\xEAncia a vocabul\xE1rios externos, como o\
          \ Getty Art and Architecture Thesaurus."
        range: MappingConceptReference
        multivalued: true
        inlined_as_list: true
      relation:
        name: relation
        description: "Um conceito com o qual existe um relacionamento sem\xE2ntico\
          \ associativo. Usar em refer\xEAncia ao nosso pr\xF3prio vocabul\xE1rio\
          \ controlado."
        slot_uri: skos:related
        range: ConceptReference
        multivalued: true
        inlined_as_list: true
    class_uri: skos:Concept
  ConceptReference:
    name: ConceptReference
    definition_uri: https://tradicional.arq.br/schema/ConceptReference
    description: "Atribui\xE7\xE3o de vocabul\xE1rio controlado com cita\xE7\xE3o\
      \ de apoio."
    from_schema: https://tradicional.arq.br/schema/concept
    slots:
    - concept_name
    - description
    - bibliographic_citation
    class_uri: wasth:ConceptReference
  BroaderConceptReference:
    name: BroaderConceptReference
    definition_uri: https://tradicional.arq.br/schema/BroaderConceptReference
    description: "Rela\xE7\xF5es hier\xE1rquicas."
    from_schema: https://tradicional.arq.br/schema/concept
    is_a: ConceptReference
    slots:
    - concept_name
    - description
    - bibliographic_citation
    - broaderConceptReference__broader_match
    attributes:
      broader_match:
        name: broader_match
        description: "Tipo da rela\xE7\xE3o."
        alias: match
        range: SkosBroaderRelation
        required: true
    class_uri: wasth:BroaderConceptReference
  NarrowerConceptReference:
    name: NarrowerConceptReference
    definition_uri: https://tradicional.arq.br/schema/NarrowerConceptReference
    description: "Rela\xE7\xF5es hier\xE1rquicas."
    from_schema: https://tradicional.arq.br/schema/concept
    is_a: ConceptReference
    slots:
    - concept_name
    - description
    - bibliographic_citation
    - narrowerConceptReference__narrower_match
    attributes:
      narrower_match:
        name: narrower_match
        description: "Tipo da rela\xE7\xE3o."
        alias: match
        range: SkosNarrowerRelation
        required: true
    class_uri: wasth:NarrowerConceptReference
  MappingConceptReference:
    name: MappingConceptReference
    definition_uri: https://tradicional.arq.br/schema/MappingConceptReference
    description: "Rela\xE7\xF5es sem\xE2nticas."
    from_schema: https://tradicional.arq.br/schema/concept
    is_a: ConceptReference
    slots:
    - concept_name
    - description
    - bibliographic_citation
    - mappingConceptReference__mapping_match
    attributes:
      mapping_match:
        name: mapping_match
        description: "Tipo da rela\xE7\xE3o."
        alias: match
        range: SkosMappingRelation
        required: true
    class_uri: wasth:MappingConceptReference
  BibliographicCitation:
    name: BibliographicCitation
    definition_uri: https://tradicional.arq.br/schema/BibliographicCitation
    description: "Cadastro de uma refer\xEAncia bibliogr\xE1fica.\nUsar o campo `description`\
      \ para formatar a refer\xEAncia, caso a formata\xE7\xE3o autom\xE1tica do Zotero\
      \ n\xE3o for satisfat\xF3ria.\n"
    from_schema: https://tradicional.arq.br/schema/resource
    exact_mappings:
    - dcterms:BibliographicCitation
    close_mappings:
    - crm:E31_Document
    - schema:CreativeWork
    slots:
    - description
    - bibliographicCitation__citation_refid
    - bibliographicCitation__note
    attributes:
      citation_refid:
        name: citation_refid
        description: "Se a fonte for cadastrada, o campo `refid` deve conter a chave\
          \ de cita\xE7\xE3o (`citation key`) que consta do registro bibliogr\xE1\
          fico na biblioteca do nosso projeto de pesquisa no [Zotero]. Em geral, a\
          \ chave de cita\xE7\xE3o \xE9 o DOI ou ISBN da publica\xE7\xE3o, mas pode\
          \ ser diferente.\nSe a refer\xEAncia que necessita citar n\xE3o constar\
          \ da biblioteca do Zotero, deve cadastr\xE1-la primeiro nessa biblioteca\
          \ para ent\xE3o extrair a chave de cita\xE7\xE3o.\n"
        identifier: true
        alias: refid
        range: CslCitekey
      note:
        name: note
        description: "Se necess\xE1rio, incluir no campo `note` uma especifica\xE7\
          \xE3o adicional, como o n\xFAmero da p\xE1gina da refer\xEAncia bibliogr\xE1\
          fica de onde a informa\xE7\xE3o foi extra\xEDda.\n"
        range: string
    class_uri: dcterms:BibliographicCitation
  RelatedObject:
    name: RelatedObject
    definition_uri: https://tradicional.arq.br/schema/RelatedObject
    description: 'A set of structured information about an object or work, or a group
      of objects or works related to the object/work in focus, including the kind
      of relationship between them. May include bibliographic objects in which the
      object/work is documented or mentioned.

      '
    from_schema: https://tradicional.arq.br/schema/resource
    is_a: Thing
    abstract: true
    slots:
    - id
    - record_author
    - record_date
    - description
    - category
    - record_rights
    - bibliographic_citation
    - content
    - thing__title
    - thing__title_source
    - thing__alt_name
    - thing__identifiers
    - thing__tags
    - thing__temporal
    - thing__repositories
    - work_rights
    class_uri: wasth:RelatedObject
  RelatedWork:
    name: RelatedWork
    definition_uri: https://tradicional.arq.br/schema/RelatedWork
    description: "As formas mais comuns de rela\xE7\xE3o no nosso projeto s\xE3o :\n\
      \n  - depicted in: A edifica\xE7\xE3o \xE9 representada numa pintura ou desenho\n\
      \    art\xEDstico;\n\n  - documented by: Informa\xE7\xF5es sobre a edifica\xE7\
      \xE3o est\xE3o publicadas numa\n    refer\xEAncia bibliogr\xE1fica, processo\
      \ administrativo ou outro documento\n    textual impresso, manuscrito ou eletr\xF4\
      nico;\n\n  - has plan / has floor plan / has section / has elevation / has\n\
      \    rendering: Essas rela\xE7\xF5es mostram a exist\xEAncia de desenhos t\xE9\
      cnicos\n    da edifica\xE7\xE3o, sejam eles hist\xF3ricos ou recentes, compilados\
      \ de\n    fontes externas a este projeto de pesquisa.\n\n  - has construction\
      \ drawing / has design / has sketch: Essas rela\xE7\xF5es se\n    referem a\
      \ desenhos hist\xF3ricos (fontes prim\xE1rias) que atestam o\n    processo de\
      \ projeto da edifica\xE7\xE3o.\n\nATEN\xC7\xC3O : OS DESENHOS PRODUZIDOS POR\
      \ ESTE PROJETO DE PESQUISA DEVEM SER CADASTRADOS NO GRUPO resource, MAIS ABAIXO.\n\
      O grupo relation \xE9 destinado unicamente a cadastrar rela\xE7\xF5es desta\
      \ edifica\xE7\xE3o com objetos aut\xF4nomos, tais como outras edifica\xE7\xF5\
      es, conjuntos urbanos, obras de artes visuais, refer\xEAncias bibliogr\xE1ficas\
      \ ou acervos arquiv\xEDsticos."
    from_schema: https://tradicional.arq.br/schema/resource
    is_a: RelatedObject
    slots:
    - id
    - record_author
    - record_date
    - description
    - category
    - record_rights
    - bibliographic_citation
    - content
    - thing__title
    - thing__title_source
    - thing__alt_name
    - thing__identifiers
    - thing__tags
    - thing__temporal
    - thing__repositories
    - work_rights
    - media
    - relatedWork__relation_type
    attributes:
      relation_type:
        name: relation_type
        description: "Indica o tipo de rela\xE7\xE3o entre a edifica\xE7\xE3o descrita\
          \ na ficha e o objeto relacionado. O sujeito do tipo \xE9 sempre a obra\
          \ titular da ficha.\n"
        slot_uri: lido:relatedWorkRelType
        alias: rel_type
        range: RelatedWorkRelType
        required: true
    class_uri: wasth:RelatedWork
  LargerContextReference:
    name: LargerContextReference
    definition_uri: https://tradicional.arq.br/schema/LargerContextReference
    description: "Tipo de rela\xE7\xE3o espec\xEDfica entre obras a ser usado quando\
      \ o objeto descrito na ficha \xE9 ou era parte integrante de outro objeto, f\xED\
      sico ou intelectual.\n"
    from_schema: https://tradicional.arq.br/schema/resource
    is_a: RelatedObject
    slots:
    - id
    - record_author
    - record_date
    - description
    - category
    - record_rights
    - bibliographic_citation
    - content
    - thing__title
    - thing__title_source
    - thing__alt_name
    - thing__identifiers
    - thing__tags
    - thing__temporal
    - thing__repositories
    - work_rights
    - media
    - largerContextReference__larger_context_type
    attributes:
      larger_context_type:
        name: larger_context_type
        description: "O tipo de rela\xE7\xE3o entre os objetos."
        slot_uri: lido:relatedWorkRelType
        alias: type
        range: LargerContextType
        required: true
    class_uri: wasth:LargerContextReference
  Resource:
    name: Resource
    definition_uri: https://tradicional.arq.br/schema/Resource
    description: "Este grupo identifica um recurso visual ou documental que fornece\
      \ informa\xE7\xF5es t\xE9cnicas ou uma representa\xE7\xE3o ilustrativa da obra\
      \ \xE0 qual ele se relaciona.\nRecursos produzidos pela equipe dos Document\xE1\
      rios da Arquitetura Tradicional s\xE3o descritos na ficha de cada edifica\xE7\
      \xE3o, no grupo `resources`. Representa\xE7\xF5es e documentos externos s\xE3\
      o referidos nos grupos `media` e `related_works`, respetivamente.\n"
    notes:
    - "This class comprises identifiable immaterial items that make propositions about\
      \ reality.\nThese propositions may be expressed in text, graphics, images, audiograms,\
      \ videograms, or by other similar means. Documentation databases are regarded\
      \ as instances of E31 Document. This class should not be confused with the concept\
      \ \u201Cdocument\u201D in Information Technology, which is compatible with E73\
      \ Information Object."
    from_schema: https://tradicional.arq.br/schema/resource
    exact_mappings:
    - crm:E31_Document
    close_mappings:
    - schema:ArchiveComponent
    is_a: Thing
    slots:
    - record_author
    - record_date
    - description
    - record_rights
    - bibliographic_citation
    - content
    - thing__title
    - thing__title_source
    - thing__alt_name
    - thing__identifiers
    - thing__tags
    - thing__temporal
    - thing__repositories
    - format
    - scale
    - unit
    - preview_image
    - provided_image
    - provided_3d
    - resource_service
    - credit
    - work_rights
    - resource__resource_type
    - resource__perspective
    - Resource_id
    - Resource_category
    slot_usage:
      id:
        name: id
        identifier: true
      category:
        name: category
        ifabsent: string(http://terminology.lido-schema.org/lido01193)
    attributes:
      resource_type:
        name: resource_type
        description: "Usamos os tipos de rela\xE7\xE3o previstos pelo LIDO em `relatedWorkRelType\
          \ > Associative relationships > Derivative relationships`. Provavelmente\
          \ necessitamos apenas de\u2009:\n- `planFor`\u2009: desenho t\xE9cnico bidimensional\
          \ de levantamento\n  (padr\xE3o, pode ser omitido)\u2009;\n\n- `modelFor`\u2009\
          : modelo tridimensional, com ou sem informa\xE7\xF5es construtivas\n  associadas\
          \ (BIM)\u2009;\n\n- `imageOf`\u2009: outras representa\xE7\xF5es em duas\
          \ dimens\xF5es da edifica\xE7\xE3o\u2009;\n- `preparatoryFor`\u2009: representa\xE7\
          \xE3o t\xE9cnica de projeto para interven\xE7\xF5es a\n  serem realizadas\
          \ (ou j\xE1 realizadas) na edifica\xE7\xE3o.\n"
        slot_uri: lido:relatedWorkRelType
        alias: type
        range: ResourceType
        required: true
      perspective:
        name: perspective
        description: "Tipo de vista do desenho. Usar a numera\xE7\xE3o da ISO\u2009\
          19650\u20132\u2009:\n\n  - 0 = sem proje\xE7\xE3o ou representa\xE7\xE3\
          o n\xE3o visual\n  - 1 = planta baixa\n  - 2 = eleva\xE7\xE3o\n  - 3 = corte\n\
          \  - 4 = mapa de elementos\n  - 5 = detalhe\n  - 6 = mapa de revestimentos\n\
          \  - 7 = planta de forro\n  - 8 = vista ou modelo 3D\n  - 9 = definido pelo\
          \ agente\n"
        range: integer
        required: true
        minimum_value: 0
        maximum_value: 9
    class_uri: crm:E31_Document
  MediaObject:
    name: MediaObject
    definition_uri: https://tradicional.arq.br/schema/MediaObject
    description: "Descri\xE7\xE3o e refer\xEAncia a um \xFAnico arquivo de m\xEDdia.\n\
      O `id` deve ser uma URI apontando para a localiza\xE7\xE3o permanente da m\xED\
      dia, n\xE3o diretamente para um arquivo de imagem.\nObrigatoriamente deve conter\
      \ um link para o recurso online, seja na forma de `provided_image`, `provided_3d`\
      \ ou `resource_service`. \xC9 importante, tamb\xE9m, fornecer o link para uma\
      \ miniatura que ser\xE1 usada como pr\xE9-visualiza\xE7\xE3o, em `preview_image`.\n\
      No caso de `preview_image` ou `provided_image`, o link deve referenciar diretamente\
      \ o arquivo (ficheiro) da imagem. Em se tratando de `provided_3d` ou `service`,\
      \ o link deve remeter a uma p\xE1gina web que forne\xE7a a respetiva API ou\
      \ as informa\xE7\xF5es acerca do modelo.\nPor exemplo, no caso de uma imagem\
      \ hospedada no Wikimedia Commons:\n``` id: https://commons.wikimedia.org/wiki/File:BR-DF-Planaltina-Casarao_azul-PP-090421-3018.jpg\
      \ preview_image: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/86/BR-DF-Planaltina-Casarao_azul-PP-090421-3018.jpg/330px-BR-DF-Planaltina-Casarao_azul-PP-090421-3018.jpg\
      \ provided_image:\n  - https://upload.wikimedia.org/wikipedia/commons/8/86/BR-DF-Planaltina-Casarao_azul-PP-090421-3018.jpg\n\
      resource_service:\n  - https://commons.wikimedia.org/w/api.php?action=query&prop=imageinfo&iiprop=extmetadata&format=json&titles=File:BR-DF-Planaltina-Casarao_azul-PP-090421-3018.jpg\n\
      ```\nN\xE3o armazenamos imagens ou outros arquivos de m\xEDdia nos sites dos\
      \ Document\xE1rios da Arquitetura Tradicional.\n"
    from_schema: https://tradicional.arq.br/schema/resource
    exact_mappings:
    - schema:MediaObject
    close_mappings:
    - dctypes:Image
    is_a: RelatedObject
    slots:
    - id
    - record_author
    - record_date
    - category
    - record_rights
    - bibliographic_citation
    - thing__title_source
    - thing__alt_name
    - thing__identifiers
    - thing__tags
    - thing__temporal
    - thing__repositories
    - format
    - scale
    - unit
    - preview_image
    - provided_image
    - provided_3d
    - resource_service
    - measurements
    - credit
    - mediaObject__depiction_type
    - MediaObject_title
    - MediaObject_description
    - MediaObject_content
    - MediaObject_work_rights
    slot_usage:
      title:
        name: title
        description: "T\xEDtulo breve para identificar este recurso visual na listagem.\n"
        from_schema: https://tradicional.arq.br/schema
        slot_uri: wasth:title
        range: string
        required: true
      description:
        name: description
        description: "Texto alternativo para leitores de tela ou outras formas de\
          \ acessibilidade. Apenas texto sem formata\xE7\xE3o.\n"
        required: true
      content:
        name: content
        description: "Opcional, para descrever com mais detalhe a representa\xE7\xE3\
          o.\n"
      work_rights:
        name: work_rights
        required: true
    attributes:
      depiction_type:
        name: depiction_type
        description: "O tipo de representa\xE7\xE3o que a m\xEDdia cont\xE9m. A edifica\xE7\
          \xE3o descrita na ficha \xE9 sempre o sujeito da rela\xE7\xE3o.\n"
        slot_uri: lido:relatedWorkRelType
        alias: type
        range: DepictionType
        required: true
    class_uri: schema:MediaObject
  TypedReference:
    name: TypedReference
    definition_uri: https://tradicional.arq.br/schema/TypedReference
    description: "Permite referenciar um registro local ou externo por meio da sua\
      \ URI (localizador universal, como um link da internet, por padr\xE3o), IRI\
      \ ou c\xF3digo na base local (n\xE3o recomendado)."
    notes:
    - Reference to a local record, IRI, URI, or LIDO terminology term.
    from_schema: https://tradicional.arq.br/schema/shared
    slots:
    - refid_type
    - TypedReference_refid
    - lido_term
    - description
    - bibliographic_citation
    - source
    slot_usage:
      refid:
        name: refid
        key: true
    class_uri: wasth:TypedReference
  Measurement:
    name: Measurement
    definition_uri: https://tradicional.arq.br/schema/Measurement
    description: "Informa\xE7\xF5es estruturadas sobre as dimens\xF5es do objeto ou\
      \ requisitos de condicionamento ambiental no espa\xE7o que ele ocupa. Para edifica\xE7\
      \xF5es, \xE9 recomend\xE1vel cadastrar ao menos a \xE1rea \xFAtil, testada e\
      \ a altura de coroamento.\nSe a modula\xE7\xE3o original for conhecida ou puder\
      \ ser deduzida por um estudo metrol\xF3gico, \xE9 interessante cadastrar tamb\xE9\
      m as medidas hist\xF3ricas utilizadas (por exemplo, dimens\xF5es em palmos).\n\
      O campo `description` permite uma representa\xE7\xE3o textual das medidas da\
      \ edifica\xE7\xE3o, caso n\xE3o seja vi\xE1vel cadastrar medidas individuais\
      \ com precis\xE3o, ou seja preciso maior flexibilidade para explicar as dimens\xF5\
      es.\n"
    notes:
    - This class comprises actions measuring physical properties and other values
      that can be determined by a systematic, objective procedure of direct observation
      of particular states of physical reality.
    - 'An instance of E16 Measurement may use simple counting or tools, such as yardsticks
      or radiation detection devices. The interest is in the method and care applied,
      so that the reliability of the result may be judged at a later stage, or research
      continued on the associated documents. The date of the event is important for
      dimensions, which may change value over time, such as the length of an object
      subject to shrinkage. Methods and devices employed should be associated with
      instances of E16 Measurement by properties such as: *P33 used specific technique*:
      E29 Design or Procedure, *P125 used object of type*: E55 Type, *P16 used specific
      object (was used for)*: E70 Thing, whereas basic techniques such as "carbon-14
      dating" should be encoded using *P2 has type (is type of)*: E55 Type. Details
      of methods and devices reused or reusable in other instances of E16 Measurement
      should be documented for these entities rather than the measurements themselves,
      whereas details of particular execution may be documented by free text or by
      instantiating adequate sub-activities, if the detail may be of interest for
      an overarching query.'
    - Regardless whether a measurement is made by an instrument or by human senses,
      it represents the initial transition from physical reality to information without
      any other documented information object in between within the reasoning chain
      that would represent the result of the interaction of the observer or device
      with reality. Therefore, determining properties of an instance of E90 Symbolic
      Object is regarded as an instance of E13 Attribute Assignment, which may be
      inferred from observing and measuring representative carriers. In the case that
      the carrier can be named, the property *P16 used specific object (was used for)*
      should be used to indicate the instance(s) of E18 Physical Thing that was used
      as the empirical basis for the attribute assignment. For instance, inferring
      properties of depicted items using image material, such as satellite images,
      is not regarded as an instance of E16 Measurement, but as a subsequent instance
      of E13 Attribute Assignment. Rather, only the production of the images, understood
      as arrays of radiation intensities, is regarded as an instance of E16 Measurement.
      The same reasoning holds for other sensor data.
    from_schema: https://tradicional.arq.br/schema/shared
    exact_mappings:
    - crm:E16_Measurement
    related_mappings:
    - dcterms:format
    slots:
    - Measurement_unit
    - description
    - format_extent
    - bibliographic_citation
    - measurement__measurement_type
    - measurement__measurement_value
    - measurement__measurement_qualifier
    - measurement__measurement_shape
    - measurement__measurement_event
    slot_usage:
      unit:
        name: unit
        required: true
    attributes:
      measurement_type:
        name: measurement_type
        description: "designa a natureza da medida\u2009: largura, altura, \xE1rea,\
          \ etc. \u2014 usar um dos [tipos de dimens\xF5es ](https://www.getty.edu/vow/AATHierarchy?find=&logic=AND&note=&page=1&subjectid=300226820)\
          \ do Art and Architecture Thesaurus do Instituto Getty (AAT), enquanto n\xE3\
          o tivermos um vocabul\xE1rio controlado pr\xF3prio.\n"
        ifabsent: MeasurementType(proper)
        alias: type
        range: MeasurementType
      measurement_value:
        name: measurement_value
        description: "Valor num\xE9rico, usar ponto como separador decimal."
        alias: value
        range: float
        required: true
        minimum_value: 0
      measurement_qualifier:
        name: measurement_qualifier
        description: 'Indica o grau de confiabilidade das medidas.

          '
        ifabsent: MeasurementQualifier(derived)
        alias: qualifier
        range: MeasurementQualifier
      measurement_shape:
        name: measurement_shape
        description: "caso relevante, indicar a forma do elemento medido usando a\
          \ [lista de formas do AAT](https://www.getty.edu/vow/AATHierarchy?find=&logic=AND&note=&page=1&subjectid=300056273),\
          \ enquanto n\xE3o tivermos um vocabul\xE1rio controlado pr\xF3prio.\n"
        alias: shape
        range: TypedReference
      measurement_event:
        name: measurement_event
        description: "Descreve a ocasi\xE3o em que as medidas foram aferidas, caso\
          \ essa informa\xE7\xE3o seja relevante (por exemplo, no \xE2mbito de um\
          \ levantamento pr\xE9vio a interven\xE7\xF5es que alteraram as dimens\xF5\
          es da edifica\xE7\xE3o).\nReferencia um evento cadastrado em `temporal`\
          \ pelo seu `id`.\n"
        alias: event
        range: Event
        inlined: false
    class_uri: crm:E16_Measurement
  MaterialTech:
    name: MaterialTech
    definition_uri: https://tradicional.arq.br/schema/MaterialTech
    description: "Usar discernimento para identificar sistemas, materiais e t\xE9\
      cnicas que interessam ao conhecimento da edifica\xE7\xE3o no seu conjunto, n\xE3\
      o a partes menos extensas ou pouco importantes.\n"
    from_schema: https://tradicional.arq.br/schema/shared
    is_a: ConceptReference
    slots:
    - concept_name
    - description
    - bibliographic_citation
    - materialTech__material_tech_type
    attributes:
      material_tech_type:
        name: material_tech_type
        description: "Tipo da refer\xEAncia a um material ou t\xE9cnica usado na obra:\
          \ material de constru\xE7\xE3o (support), revestimento (medium), t\xE9cnica,\
          \ instrumento, cor, etc.\n"
        alias: type
        range: MaterialTechType
        required: true
    class_uri: wasth:MaterialTech
  Right:
    name: Right
    definition_uri: https://tradicional.arq.br/schema/Right
    description: "* Preencher `earliest_date` com a data de in\xEDcio da vig\xEAncia\
      \ dos\n  direitos ou a data do preenchimento da ficha.\n\n* `latest_date` pode\
      \ ser omitido se n\xE3o houver fim da vig\xEAncia.\n* `holder` pode ser omitido\
      \ se a obra estiver no dom\xEDnio p\xFAblico.\n"
    from_schema: https://tradicional.arq.br/schema/shared
    exact_mappings:
    - crm:E30_Right
    slots:
    - right__rights_type
    - right__rights_statement
    - right__rights_start_date
    - right__rights_end_date
    - right__holder
    attributes:
      rights_type:
        name: rights_type
        description: "Determina se os direitos ora descritos s\xE3o uma licen\xE7\
          a espec\xEDfica (padr\xE3o) ou express\xE3o gen\xE9rica de copyright.\n\
          ---------------------------------------------------------------------\n\
          Qualifies the kind of rights type, whether it refers to a generic kind of\
          \ right, like copyright or performance rights, or is a specific rights or\
          \ license statement, for instance, Rights Statements or Creative Commons\
          \ Licenses.\n"
        range: RightsType
        required: true
      rights_statement:
        name: rights_statement
        description: "Referencia, preferencialmente por meio de uma URI, as informa\xE7\
          \xF5es espec\xEDficas dos direitos autorais incidentes sobre o item descrito.\n\
          Por padr\xE3o, as casas tradicionais pertencem ao dom\xEDnio p\xFAblico\
          \ at\xE9 prova em contr\xE1rio. Essa informa\xE7\xE3o e a declara\xE7\xE3\
          o de direitos NKC (Sem direito autoral conhecido) N\xC3O PODE ser omitida\
          \ da ficha. Para o dom\xEDnio p\xFAblico, portanto, indicar a refer\xEA\
          ncia\u2009: <https://rightsstatements.org/vocab/NKC/1.0/>.\n---------------------------------------------------------------------\n\
          An index element for rights information being recorded. This can refer to\
          \ a generic kind of right, such as copyright or a related right, but also\
          \ be a specific rights or license statement like a standardized statement\
          \ on copyright, usage, or access rights.\n"
        range: TypedReference
        required: true
        inlined: true
      rights_start_date:
        name: rights_start_date
        description: Date on which a right is or was current.
        alias: start_date
        range: EventDate
        inlined: true
      rights_end_date:
        name: rights_end_date
        description: Date on which a right is or will be no longer current.
        alias: end_date
        range: EventDate
        inlined: true
      holder:
        name: holder
        description: 'A set of elements identifying the person or the group of persons
          holding the rights referenced in Rights Type. Often refers to copyright
          and related rights, such as the right to reproduce, distribute, exhibit
          or use the entity in focus, for example, the object/work, resource or metadata
          record.

          '
        alias: holder
        range: LegalBody
        inlined: true
    class_uri: crm:E30_Right
  LegalBody:
    name: LegalBody
    definition_uri: https://tradicional.arq.br/schema/LegalBody
    description: "Refer\xEAncia a uma pessoa jur\xEDdica (pode ser um indiv\xEDduo\
      \ detentor de direitos jur\xEDdicos espec\xEDficos que se queira referenciar)\
      \ ou entidade coletiva hist\xF3rica.\n"
    from_schema: https://tradicional.arq.br/schema/shared
    slots:
    - legalBody__legal_body_type
    - legalBody__legal_body_name
    attributes:
      legal_body_type:
        name: legal_body_type
        description: "Define a natureza do ente legal\u2009: pessoa jur\xEDdica, per\xED\
          metro geogr\xE1fico de tutela, etc.\n"
        ifabsent: RepositoryType(corporate)
        alias: type
        range: RepositoryType
      legal_body_name:
        name: legal_body_name
        description: "Referencia a identidade do ente legal num vocabul\xE1rio controlado\
          \ ou reposit\xF3rio de identidades, tal como o ISNI.\n"
        alias: name
        range: TypedReference
        inlined: true
    class_uri: wasth:LegalBody
  Event:
    name: Event
    definition_uri: https://tradicional.arq.br/schema/Event
    description: "Um evento \xE9 um processo espec\xEDfico e coerente, delimit\xE1\
      vel, de intera\xE7\xF5es entre fatores materiais, humanos e f\xEDsico-ambientais,\
      \ que afetam objetos de modo caracter\xEDstico ao tipo de processo em jogo.\
      \ Pode tratar-se de uma a\xE7\xE3o ou um conjunto articulado de a\xE7\xF5es\
      \ intencionais, de consequ\xEAncias imprevistas de a\xE7\xF5es intencionais,\
      \ ou de processos naturais sem interven\xE7\xE3o humana.\n-------------------------------------------------------------------------\n\
      This class comprises distinct, delimited and coherent processes and interactions\
      \ of a material nature, in cultural, social or physical systems, involving and\
      \ affecting instances of E77 Persistent Item in a way characteristic of the\
      \ kind of process. Typical examples are meetings, births, deaths, actions of\
      \ decision taking, making or inventing things, but also more complex and extended\
      \ ones such as conferences, elections, building of a castle, or battles.\nWhile\
      \ the continuous growth of a tree lacks the limits characteristic of an event,\
      \ its germination from a seed does qualify as an event. Similarly, the blowing\
      \ of the wind lacks the distinctness and limits of an event, but a hurricane,\
      \ flood or earthquake would qualify as an event. Mental processes are considered\
      \ as events, in cases where they are connected with the material externalization\
      \ of their results; for example, the creation of a poem, a performance or a\
      \ change of intention that becomes obvious from subsequent actions or declarations.\n\
      The effects of an instance of E5 Event may not lead to relevant permanent changes\
      \ of properties or relations of the items involved in it, for example an unrecorded\
      \ performance. Of course, in order to be documented, some kind of evidence for\
      \ an event must exist, be it witnesses, traces or products of the event.\nWhile\
      \ instances of E4 Period always require some form of coherence between its constituent\
      \ phenomena, in addition, the essential constituents of instances of E5 Event\
      \ should contribute to an overall effect; for example, the statements made during\
      \ a meeting and the listening of the audience.\nViewed at a coarse level of\
      \ detail, an instance of E5 Event may appear as if it had an \u2018instantaneous\u2019\
      \ overall effect, but any process or interaction of material nature in reality\
      \ have an extent in time and space. At a fine level, instances of E5 Event may\
      \ be analysed into component phenomena and phases within a space and timeframe,\
      \ and as such can be seen as a period, regardless of the size of the phenomena.\
      \ The reverse is not necessarily the case: not all instances of E4 Period give\
      \ rise to a noteworthy overall effect and are thus not instances of E5 Event.\n"
    from_schema: https://tradicional.arq.br/schema/temporal
    exact_mappings:
    - crm:E5_Event
    - schema:Event
    is_a: Thing
    slots:
    - id
    - record_author
    - record_date
    - description
    - category
    - record_rights
    - bibliographic_citation
    - content
    - thing__title
    - thing__title_source
    - thing__alt_name
    - thing__identifiers
    - thing__tags
    - thing__temporal
    - thing__repositories
    - style_period
    - culture
    - measurements
    - material
    - technique
    - media
    - event__event_type
    - event__actor_role
    - event__display_date
    - event__start_date
    - event__end_date
    - event__event_place
    - event__method
    - event__things_present
    - event__related_events
    attributes:
      event_type:
        name: event_type
        description: "Categoriza o evento segundo os v\xE1rios tipos de a\xE7\xF5\
          es, de processos, ou de resultados (in\xEDcio ou fim da exist\xEAncia, transforma\xE7\
          \xE3o).\n"
        alias: type
        range: EventType
        required: true
      actor_role:
        name: actor_role
        description: "Identifica\xE7\xE3o de um agente e do seu papel no evento."
        range: Actor
        multivalued: true
        inlined_as_list: true
      display_date:
        name: display_date
        description: "Permite a express\xE3o descritiva das datas de in\xEDcio e fim\
          \ do evento, para contemplar variados graus de incerteza, ou de modo a representar\
          \ a data em calend\xE1rios diferentes do gregoriano. Omitir apenas se os\
          \ valores num\xE9ricos das datas forem exatos.\n"
        range: string
      start_date:
        name: start_date
        description: "Data inicial do evento ou mais antiga data presumida para o\
          \ seu decurso. Omitir se desconhecida.\nPor ora, \xE9 responsabilidade de\
          \ quem preenche a ficha assegurar que `start_date` e `end_date` ocorram\
          \ em ordem cronol\xF3gica. N\xE3o dispomos de valida\xE7\xE3o autom\xE1\
          tica para tanto.\n"
        range: EventDate
        multivalued: true
        inlined_as_list: true
        minimum_cardinality: 0
        maximum_cardinality: 2
      end_date:
        name: end_date
        description: "Data final do evento ou mais tardia data presumida para o seu\
          \ decurso. Omitir se desconhecida.\nPor ora, \xE9 responsabilidade de quem\
          \ preenche a ficha assegurar que `start_date` e `end_date` ocorram em ordem\
          \ cronol\xF3gica. N\xE3o dispomos de valida\xE7\xE3o autom\xE1tica para\
          \ tanto.\n"
        range: EventDate
        multivalued: true
        inlined_as_list: true
        minimum_cardinality: 0
        maximum_cardinality: 2
      event_place:
        name: event_place
        description: "Lugares associados ao evento, sem incluir o pr\xF3prio local\
          \ no qual se situa a edifica\xE7\xE3o.\n"
        alias: place
        range: Site
        multivalued: true
        inlined_as_list: true
      method:
        name: method
        description: An index element for the method by which the event is or was
          carried out. Examples may include an acquisition method or a field collection
          method.
        range: ConceptReference
        multivalued: true
        inlined_as_list: true
      things_present:
        name: things_present
        description: A set of structured information for a related object or work
          that is or was present at the event in focus. Repeated if there are multiple
          related objects or works.
        range: RelatedWork
        multivalued: true
        inlined_as_list: true
      related_events:
        name: related_events
        description: A set of structured information about an event related to the
          event in focus, indicating the type of relationship where applicable.
        range: RelatedEvent
        multivalued: true
        inlined_as_list: true
    class_uri: crm:E5_Event
  Actor:
    name: Actor
    definition_uri: https://tradicional.arq.br/schema/Actor
    description: Agent and role in an event.
    from_schema: https://tradicional.arq.br/schema/temporal
    slots:
    - bibliographic_citation
    - actor__actor_type
    - actor__actor_name
    - actor__role_in_event
    - actor__actor_qualifier
    - actor__actor_extent
    attributes:
      actor_type:
        name: actor_type
        description: "Define se o agente \xE9 uma pessoa, uma organiza\xE7\xE3o ou\
          \ corpora\xE7\xE3o, uma oficina, uma fam\xEDlia, etc.\n"
        ifabsent: AgentType(personal)
        alias: type
        range: AgentType
      actor_name:
        name: actor_name
        description: "Nome do agente extra\xEDdo de um vocabul\xE1rio controlado."
        alias: name
        range: TypedReference
        inlined: true
      role_in_event:
        name: role_in_event
        description: "A\xE7\xE3o desempenhada pelo agente no evento."
        range: RoleType
      actor_qualifier:
        name: actor_qualifier
        description: 'For the Attribution Qualifier Actor element choose a concept
          URI from the [attribution qualifiers hierarchy](http://vocab.getty.edu/hier/aat/300404264)
          of the Art & Architecture Thesaurus, or another linked open vocabulary.

          '
        alias: qualifier
        range: TypedReference
        multivalued: true
        inlined_as_list: true
      actor_extent:
        name: actor_extent
        description: Parte da obra sobre a qual o agente interveio.
        alias: extent
        range: TypedReference
        multivalued: true
        inlined_as_list: true
    class_uri: wasth:Actor
  EventDate:
    name: EventDate
    definition_uri: https://tradicional.arq.br/schema/EventDate
    description: "Express\xE3o complexa de uma data que pode se referir ao come\xE7\
      o ou ao t\xE9rmino de um evento pontual ou de uma decorr\xEAncia prolongada.\
      \ Permite expressar as datas de corte inicial e final, cada uma com seus respetivos\
      \ graus de confiabilidade e de precis\xE3o.\n"
    notes:
    - 'A wrapper for the expression of a date by providing a set of years as earliest
      and latest date delimiting the respective span of time, usually given in the
      proleptic Gregorian calendar.

      If it is an exact date, possibly with time, repeat the same date (and time)
      in Earliest Date and Latest Date elements.'
    comments:
    - "\u26A0\uFE0F  N\xE3o temos padr\xE3o estabelecido para datas anteriores ao\
      \ calend\xE1rio gregoriano (1583), antes de Cristo, ou convertidas de outros\
      \ calend\xE1rios. Datas no calend\xE1rio juliano podem ser expressadas nominalmente.\
      \ Datas da era ib\xE9rica podem usar o valor nominal do dia e do m\xEAs, tendo\
      \ o ano convertido para o gregoriano. Datas de calend\xE1rios n\xE3o crist\xE3\
      os podem ser convertidas para a data gregoriana correspondente, mesmo as anteriores\
      \ a 1583.\nVer <https://en.wikipedia.org/wiki/ISO_8601#Dates> para a discuss\xE3\
      o dessa dificuldade, cuja solu\xE7\xE3o depende do estabelecimento de um padr\xE3\
      o espec\xEDfico para cada caso."
    from_schema: https://tradicional.arq.br/schema/temporal
    slots:
    - eventDate__date_type
    - eventDate__date_value
    attributes:
      date_type:
        name: date_type
        description: "Qualifica a confiabilidade da data como sendo conhecida ou estimada.\
          \ A confiabilidade independe do grau de precis\xE3o da data.\n"
        alias: type
        range: DateType
        required: true
      date_value:
        name: date_value
        description: "Usar o formato ISO-8601 (AAAA-MM-DD). Para datas imprecisas,\
          \ usar o PRIMEIRO ou o \xDALTIMO dia, m\xEAs ou ano do per\xEDodo delimitado,\
          \ conforme se tratar de uma data de corte inicial ou final para o evento,\
          \ e descrever verbalmente o per\xEDodo no campo `display_date`.\n"
        range: date
    class_uri: wasth:EventDate
  StylePeriod:
    name: StylePeriod
    definition_uri: https://tradicional.arq.br/schema/StylePeriod
    from_schema: https://tradicional.arq.br/schema/temporal
    is_a: ConceptReference
    slots:
    - concept_name
    - description
    - bibliographic_citation
    - stylePeriod__period_name_type
    attributes:
      period_name_type:
        name: period_name_type
        description: "Designa a natureza ou origem do nome do per\xEDodo ou estilo\
          \ indicado.\n"
        alias: type
        range: PeriodNameType
        required: true
    class_uri: wasth:StylePeriod
  RelatedEvent:
    name: RelatedEvent
    definition_uri: https://tradicional.arq.br/schema/RelatedEvent
    from_schema: https://tradicional.arq.br/schema/temporal
    slots:
    - description
    - relatedEvent__event_name
    attributes:
      event_name:
        name: event_name
        description: 'Identifica o evento ralacionado.

          '
        symmetric: true
        range: Event
        required: true
        multivalued: true
        inlined: false
    class_uri: wasth:RelatedEvent
  Thing:
    name: Thing
    definition_uri: https://tradicional.arq.br/schema/Thing
    description: "Esta classe compreende todas as coisas no universo do CIDOC CRM.\
      \ \xC9 um conceito abstrato que prev\xEA tr\xEAs propriedades gerais:\n- Identifica\xE7\
      \xE3o por nome ou t\xEDtulo, em particular por um identificador\n  preferencial.\n\
      - Classifica\xE7\xE3o por tipo, permitindo o refinamento da subclasse\n  espec\xED\
      fica \xE0 qual a inst\xE2ncia pertence.\n- Atribui\xE7\xE3o de texto livre e\
      \ de outros dados n\xE3o estruturados, para\n  expressar informa\xE7\xF5es n\xE3\
      o capturadas por propriedades formais.\n\nTodas as demais classes do CIDOC CRM\
      \ s\xE3o especializa\xE7\xF5es diretas ou indiretas de E1 CRM Entity.\n-------------------------------------------------------------------------\n\
      This class comprises all things in the universe of discourse of the CIDOC Conceptual\
      \ Reference Model.\nIt is an abstract concept providing for three general properties:\n\
      - Identification by name or appellation, and in particular by a preferred\n\
      \  identifier.\n\n- Classification by type, allowing further refinement of the\
      \ specific\n  subclass to which an instance belongs.\n\n- Attachment of free\
      \ text and other unstructured data for the expression\n  of anything not captured\
      \ by formal properties.\n\nAll other classes within the CIDOC CRM are directly\
      \ or indirectly specialisations of E1 CRM Entity.\n"
    from_schema: https://tradicional.arq.br/schema/thing
    exact_mappings:
    - crm:E1_CRM_Entity
    - schema:Thing
    abstract: true
    slots:
    - id
    - record_author
    - record_date
    - description
    - category
    - record_rights
    - bibliographic_citation
    - content
    - thing__title
    - thing__title_source
    - thing__alt_name
    - thing__identifiers
    - thing__tags
    - thing__temporal
    - thing__repositories
    attributes:
      title:
        name: title
        description: "Nome pelo qual este item \xE9 mais comumente conhecido. Outros\
          \ nomes podem ser cadastrados em `alt_name`.\n"
        exact_mappings:
        - schema:name
        slot_uri: dcterms:title
        range: string
      title_source:
        name: title_source
        description: "A fonte do t\xEDtulo title_source \xE9 opcional ; um t\xEDtulo\
          \ pode ser atestado em mais de uma fonte, por isso este campo \xE9 uma lista\
          \ de itens (cada item come\xE7a com um h\xEDfen)."
        range: BibliographicCitation
        multivalued: true
        inlined_as_list: true
      alt_name:
        name: alt_name
        description: "O bloco `alt_name` permite cadastrar outros nomes pelos quais\
          \ o objeto ou conceito ser\xE1 eventualmente conhecido. \xC9 uma lista opcional\
          \ de itens, e se existir, os campos de cada item da lista devem ser preenchidos\
          \ como os do t\xEDtulo principal.\nO campo `label` ou `description` de cada\
          \ item cont\xE9m o texto do t\xEDtulo (nome).\nEste bloco pode ser omitido\
          \ por completo se n\xE3o houver t\xEDtulos alternativos.\n"
        range: Appellation
        multivalued: true
        inlined_as_list: true
      identifiers:
        name: identifiers
        description: "N\xFAmeros de invent\xE1rio e demais c\xF3digos que identificam\
          \ este objeto em outras bases de dados.\nCaso esta edifica\xE7\xE3o esteja\
          \ cadastrada em outras bases de dados (por exemplo, [SICG], [SIPA], [HPIP],\
          \ [iPatrimonio], etc.), pode preencher a lista `identifiers` como segue.\n\
          :clipboard: O conte\xFAdo de cada bloco \xE9 uma lista recuada em dois espa\xE7\
          os com respeito \xE0 categoria superior. Seus itens s\xE3o\u2009:\n* `type`\
          \ \xE9 o tipo de refer\xEAncia\u2009: pode ser `uri` (padr\xE3o), `iri`\
          \ ou\n  `local` \u2014 se estiver em d\xFAvida, omita esta linha\u2009;\n\
          \n* `refid` \xE9 obrigat\xF3rio\u2009: representa o identificador do conceito\
          \ no\n  vocabul\xE1rio controlado ou no reposit\xF3rio de origem \u2014\
          \ normalmente\n  ser\xE1 uma URI (um link para a p\xE1gina web do cadastro)\u2009\
          ;\n\n* `description` deve ser usado para representar textualmente\n  o n\xFA\
          mero de invent\xE1rio, c\xF3digo identificador ou outra informa\xE7\xE3\
          o\n  que individualize o objeto na base externa (por exemplo, livro do\n\
          \  tombo e n\xFAmero do processo de tombamento, no Brasil)\u2009;\n\n* `bibliographic_citation`\
          \ \xE9 opcional e permite citar uma lista de\n  refer\xEAncias bibliogr\xE1\
          ficas que validem a inclus\xE3o deste termo.\n\n* `source` tamb\xE9m \xE9\
          \ opcional e permite cadastrar os dados da pessoa\n  jur\xEDdica respons\xE1\
          vel pelo registro.\n\n---------------------------------------------------------------------\n\
          Published or external identifiers for the object.\n"
        range: TypedReference
        multivalued: true
        inlined_as_list: true
      tags:
        name: tags
        description: "Lista de palavras-chave que caracterizam o objeto, de modo n\xE3\
          o estruturado. Recomenda-se usar uma palavra-chave de cada um dos recortes\
          \ abaixo:\n- Geogr\xE1fico\u2009; - Cronol\xF3gico\u2009; - Hist\xF3rico-cultural\u2009\
          ; - T\xE9cnico-construtivo\u2009; - Tem\xE1tico ou tipol\xF3gico\u2009;\
          \ - Funcional.\n---------------------------------------------------------------------\n\
          Provisional uncontrolled keywords. Prefer `classifications` or `subject`\
          \ for curated vocabulary terms."
        range: string
        multivalued: true
      temporal:
        name: temporal
        description: "Descri\xE7\xE3o dos eventos associados ao ciclo de vida da edifica\xE7\
          \xE3o ou \xE0 exist\xEAncia e/ou uso do objeto ou conceito.\nLer a respetiva\
          \ documenta\xE7\xE3o para estruturar este campo.\n"
        range: Event
        multivalued: true
        inlined_as_list: true
      repositories:
        name: repositories
        description: "Nos Document\xE1rios da Arquitetura Tradicional, usamos reposit\xF3\
          rios para indicar a inclus\xE3o da edifica\xE7\xE3o em per\xEDmetros de\
          \ s\xEDtios tombados/classificados do patrim\xF4nio, \xE1reas de interesse\
          \ hist\xF3rico-cultural, etc.\nO reposit\xF3rio \xE9 cadastrado como uma\
          \ pessoa jur\xEDdica dotada de extens\xE3o geogr\xE1fica.\n---------------------------------------------------------------------\n\
          A set of elements for the identification, name and location of the repository\
          \ that is responsible for the object/work in focus.\nRepeated if there are\
          \ several designations known, or if former repositories or geographic places\
          \ should be listed.\n"
        range: Repository
        multivalued: true
        inlined_as_list: true
    class_uri: crm:E1_CRM_Entity
  Appellation:
    name: Appellation
    definition_uri: https://tradicional.arq.br/schema/Appellation
    from_schema: https://tradicional.arq.br/schema/thing
    slots:
    - bibliographic_citation
    - appellation__label
    - appellation__appellation_preference
    - appellation__appellation_type
    attributes:
      label:
        name: label
        description: "Nome ou t\xEDtulo (texto sem formata\xE7\xE3o)."
        range: string
      appellation_preference:
        name: appellation_preference
        description: "Indica se o nome em quest\xE3o deve ser oculto ou n\xE3o, se\
          \ \xE9 uma vers\xE3o alternativa ou uma variante de grafia, etc."
        ifabsent: LabelType(alternative)
        alias: label_type
        range: LabelType
      appellation_type:
        name: appellation_type
        description: 'Categoriza a natureza do nome dado ao objeto ou conceito.

          '
        ifabsent: TitleType(descriptive)
        alias: title_type
        range: TitleType
    class_uri: wasth:Appellation
  Repository:
    name: Repository
    definition_uri: https://tradicional.arq.br/schema/Repository
    description: "Entidade com exist\xEAncia jur\xEDdica e espacial."
    from_schema: https://tradicional.arq.br/schema/thing
    exact_mappings:
    - schema:Organization
    is_a: Thing
    slots:
    - id
    - record_author
    - record_date
    - description
    - category
    - record_rights
    - bibliographic_citation
    - content
    - thing__title
    - thing__title_source
    - thing__alt_name
    - thing__identifiers
    - thing__tags
    - thing__temporal
    - thing__repositories
    - site
    - legal_body
    - repository__repository_type
    attributes:
      repository_type:
        name: repository_type
        description: "Categoriza a natureza f\xEDsica ou jur\xEDdica do reposit\xF3\
          rio."
        ifabsent: RepositoryType(corporate)
        range: RepositoryType
    class_uri: schema:Organization
  Work:
    name: Work
    definition_uri: https://tradicional.arq.br/schema/Work
    description: "Nos Document\xE1rios da Arquitetura Tradicional, esta ficha \xE9\
      \ usada para cadastrar uma edifica\xE7\xE3o, um conjunto arquitet\xF4nico, ou\
      \ ainda uma parte significativa de uma edifica\xE7\xE3o.\n<h3>Especifica\xE7\
      \xE3o e modelo de preenchimento</h3>\nAs instru\xE7\xF5es de preeenchimento\
      \ para cada elemento da ficha se encontram na se\xE7\xE3o [Slots](#slots).\n\
      Observe como exemplo de ficha (quase) completamente preenchida a [Casa dos Sete\
      \ Candeeiros](https://github.com/arqtrad/casa/blob/main/br-ba-salvador-casa_7_candeeiros.md?plain=1).\n\
      Em caso de d\xFAvidas quanto \xE0 formata\xE7\xE3o da ficha, observe as informa\xE7\
      \xF5es acerca da especifica\xE7\xE3o [YAML](https://www.yaml.info/learn/index.html).\n\
      Todos os grupos que come\xE7am com um h\xEDfen `-` s\xE3o listas que podem conter\
      \ qualquer n\xFAmero de linhas ou blocos.\nA ordem dos blocos n\xE3o \xE9 importante,\
      \ mas a hierarquia dentro de cada bloco e a indenta\xE7\xE3o de dois espa\xE7\
      os por n\xEDvel hier\xE1rquico, sim.\nO caractere `#` indica o in\xEDcio de\
      \ um coment\xE1rio, que prossegue at\xE9 o final da linha. Os coment\xE1rios\
      \ e as linhas que cont\xEAm apenas coment\xE1rios devem ser apagados das fichas\
      \ preenchidas.\nCampos n\xE3o preenchidos tamb\xE9m devem ser apagadas das fichas.\n\
      -------------------------------------------------------------------------\n\
      An historical landmark or building.\n"
    from_schema: https://tradicional.arq.br/schema/work
    exact_mappings:
    - schema:LandmarksOrHistoricalBuildings
    close_mappings:
    - crm:E22_Human-Made_Object
    is_a: Thing
    slots:
    - bibliographic_citation
    - thing__title_source
    - thing__alt_name
    - thing__identifiers
    - thing__tags
    - thing__temporal
    - thing__repositories
    - site
    - measurements
    - material
    - technique
    - style_period
    - culture
    - Work_resources
    - Work_media
    - work__title_type
    - work__work_type_condition
    - work__work_type_form
    - work__work_type_function
    - work__work_type_context
    - work__work_type_material_tech
    - work__work_type_subject_type
    - work__work_type_use
    - work__classification_genre
    - work__classification_subject
    - work__classification_local
    - work__classification_special
    - work__part_of
    - work__former_site
    - work__intended_site
    - work__other_site
    - work__location_historic
    - work__inscriptions
    - work__collection
    - work__related_works
    - work__subject
    - Work_id
    - Work_title
    - Work_record_author
    - Work_record_date
    - Work_description
    - Work_category
    - Work_record_rights
    - Work_work_rights
    - Work_content
    slot_usage:
      id:
        name: id
        description: "Cada edifica\xE7\xE3o ter\xE1 um identificador gerado a partir\
          \ do seu georreferenciamento usando Open Location Code (\"PlusCode\"). Este\
          \ identificador usa o campo `id`, que ser\xE1 gerado automaticamente pelo\
          \ programa WASTH."
        identifier: true
        range: OlcPlusCode11
      title:
        name: title
        is_a: thing__title
        required: true
      record_author:
        name: record_author
        required: true
      record_date:
        name: record_date
        required: true
      description:
        name: description
        required: true
      category:
        name: category
        ifabsent: string(http://terminology.lido-schema.org/lido00096)
      resources:
        name: resources
        description: "Os desenhos ou modelos da edifica\xE7\xE3o s\xE3o apresentados\
          \ online por meio de imagens vetoriais ou bitmap.\nCada desenho ou modelo\
          \ pode ser apresentado sob v\xE1rias representa\xE7\xF5es, como pr\xE9-visualiza\xE7\
          \xE3o, imagem original, ou servi\xE7o [IIIF]. Essas imagens devem ser identificadas\
          \ como segue\u2009:\nAs categorias de representa\xE7\xE3o previstas no [LIDO]\
          \ podem ser consultadas em <http://terminology.lido-schema.org/resourceRepresentation_type>\
          \ e s\xE3o inseridas na ficha como um mapa.\nNos Document\xE1rios da Arquitetura\
          \ Tradicional, desdobramos o grupo LIDO [`relatedWorksWrap`](https://lido-schema.org/schema/v1.1/lido-v1.1.html#relatedWorksWrap)\
          \ em quatro tipos de relacionamentos\u2009:\n1. `part_of`\u2009: a edifica\xE7\
          \xE3o descrita na ficha \xE9 intrinsecamente parte\n   de um conjunto arquitet\xF4\
          nico ou urban\xEDstico maior, quando se trata\n   de uma parte fisicamente\
          \ vinculada a outra edifica\xE7ao ou um\n   elemento concebido dentro de\
          \ um projeto de conjunto.\n\n2. `related_works`\u2009: a edifica\xE7\xE3\
          o descrita na ficha pode ser\n   relacionada, por meio de interpreta\xE7\
          \xE3o historiogr\xE1fica, a outras\n   edifica\xE7\xF5es ou objetos (fontes\
          \ prim\xE1rias escritas ou visuais,\n   obras de arte em geral, outras edifica\xE7\
          \xF5es, etc.).\n\n3. `media`\u2009: fotografias ou imagens hist\xF3ricas\
          \ (desenhos t\xE9cnicos ou\n   art\xEDsticos, pinturas, estampas, etc.)\
          \ que representem fielmente a\n   apar\xEAncia da edifica\xE7\xE3o descrita\
          \ na ficha.\n\n4. `resources`\u2009: desenhos t\xE9cnicos em formato vetorial\
          \ e,\n   eventualmente, modelos tridimensionais ou outras formas de\n  \
          \ informa\xE7\xE3o t\xE9cnica que n\xE3o cabem no formato da ficha, mas\
          \ que\n   foram produzidas pela equipe e colaboradores do projeto de\n \
          \  pesquisa.\n"
      media:
        name: media
        description: "Nos Document\xE1rios da Arquitetura Tradicional, desdobramos\
          \ o grupo LIDO [`relatedWorksWrap`](https://lido-schema.org/schema/v1.1/lido-v1.1.html#relatedWorksWrap)\
          \ em quatro tipos de relacionamentos\u2009:\n1. `part_of`\u2009: a edifica\xE7\
          \xE3o descrita na ficha \xE9 intrinsecamente parte\n   de um conjunto arquitet\xF4\
          nico ou urban\xEDstico maior, quando se trata\n   de uma parte fisicamente\
          \ vinculada a outra edifica\xE7ao ou um\n   elemento concebido dentro de\
          \ um projeto de conjunto.\n\n2. `related_works`\u2009: a edifica\xE7\xE3\
          o descrita na ficha pode ser\n   relacionada, por meio de interpreta\xE7\
          \xE3o historiogr\xE1fica, a outras\n   edifica\xE7\xF5es ou objetos (fontes\
          \ prim\xE1rias escritas ou visuais,\n   obras de arte em geral, outras edifica\xE7\
          \xF5es, etc.).\n\n3. `media`\u2009: fotografias ou imagens hist\xF3ricas\
          \ (desenhos t\xE9cnicos ou\n   art\xEDsticos, pinturas, estampas, etc.)\
          \ que representem fielmente a\n   apar\xEAncia da edifica\xE7\xE3o descrita\
          \ na ficha.\n\n4. `resources`\u2009: desenhos t\xE9cnicos em formato vetorial\
          \ e,\n   eventualmente, modelos tridimensionais ou outras formas de\n  \
          \ informa\xE7\xE3o t\xE9cnica que n\xE3o cabem no formato da ficha, mas\
          \ que\n   foram produzidas pela equipe e colaboradores do projeto de\n \
          \  pesquisa.\n"
      record_rights:
        name: record_rights
        required: true
      work_rights:
        name: work_rights
        required: true
      content:
        name: content
        description: "Deixe uma linha em branco ap\xF3s o fechamento dos metadados\
          \ e inclua aqui uma descri\xE7\xE3o morfol\xF3gica e hist\xF3rica da edifica\xE7\
          \xE3o com texto livre, usando formata\xE7\xE3o Markdown.\nPoder\xE1 incluir\
          \ um segundo bloco de metadados para indicar as refer\xEAncias bibliogr\xE1\
          ficas da descri\xE7\xE3o textual, no campo `nocite`. O formato \xE9 uma\
          \ lista de chaves de cita\xE7\xE3o do Zotero (cada uma come\xE7ando com\
          \ `@`) separadas por v\xEDrgulas:\n```yaml Conte\xFAdo textual em formato\
          \ *Markdown* com cita\xE7\xF5es [@citekey].\n--- nocite: \"@*\" --- ```\n"
    attributes:
      title_type:
        name: title_type
        description: Categoriza a natureza do nome dado ao objeto.
        range: TitleType
        required: true
      work_type_condition:
        name: work_type_condition
        description: "Descreve o estado f\xEDsico da edifica\xE7\xE3o quanto \xE0\
          \ sua apar\xEAncia de completude, deteriora\xE7\xE3o ou capacidade de desempenhar\
          \ sua fun\xE7\xE3o.\nAtende aos campos do [SICG](https://sicg.iphan.gov.br/sicg/manual/manual.html)\
          \ \"estado de preserva\xE7\xE3o\" e \"estado de conserva\xE7\xE3o\".\n---------------------------------------------------------------------\n\
          Descriptors for objects that are distinguishable by their overall state\
          \ such as appearance, level of damage, completeness, or quality. If an object\
          \ is identified by its prevailing physical state, then it is qualified by\
          \ condition.\nBased on [AAT \"conditions\"](http://vocab.getty.edu/page/aat/300389724)\
          \ and [CIDOC CRM \"E3 Condition State\"](http://cidoc-crm.org/html/cidoc_crm_v7.1.1_with_translations.html#E3)"
        slot_uri: term:lido00937
        range: ConceptReference
        recommended: true
        multivalued: true
        inlined_as_list: true
      work_type_form:
        name: work_type_form
        description: "Nos Document\xE1rios da Arquitetura Tradicional, designa uma\
          \ tipologia formal.\nO vocabul\xE1rio controlado para este item est\xE1\
          \ em processo de estrutura\xE7\xE3o.\n---------------------------------------------------------------------\n\
          Descriptors for objects that are distinguishable by their physical form\
          \ or by the manner in which they are presented. If an object is identified\
          \ by sight, then it is qualified by form.\nBased on [AAT Guidelines \"Types\
          \ of Guide Terms\"](https://www.getty.edu/research/tools/vocabularies/guidelines/aat_3_1_hierarchical_rels.html)"
        slot_uri: term:lido00766
        range: ConceptReference
        recommended: true
        multivalued: true
        inlined_as_list: true
      work_type_function:
        name: work_type_function
        description: "Nos Document\xE1rios de edifica\xE7\xF5es, designa um dos sete\
          \ tipos de prop\xF3sitos concebidos por C. William Westfall e Samir Youn\xE9\
          s em *Architectural Type and Character*.\nNo Document\xE1rio de Lugares,\
          \ designa o papel administrativo da localidade, por exemplo freguesia, sede\
          \ municipal, capital estadual ou nacional.\n---------------------------------------------------------------------\n\
          Objects that are distinguishable by the particular purpose for which they\
          \ are designed or used. If an object is identifiable by its intended use,\
          \ then it is qualified by function.\nBased on [AAT Guidelines \"Types of\
          \ Guide Terms\"](https://www.getty.edu/research/tools/vocabularies/guidelines/aat_3_1_hierarchical_rels.html)"
        slot_uri: term:lido00767
        range: ConceptReference
        recommended: true
        multivalued: true
        inlined_as_list: true
      work_type_context:
        name: work_type_context
        description: "Nos Document\xE1rios de edifica\xE7\xF5es, designa sobretudo\
          \ o contexto imediato de implanta\xE7\xE3o de uma edifica\xE7\xE3o\u2009\
          : urbana, rural, isolada, em correnteza, etc.\nNo Document\xE1rio de Lugares\
          \ Tradicionais, designa o tipo de n\xFAcleo populacional\u2009: s\xEDtio\
          \ isolado, povoa\xE7\xE3o rural, vila ou cidade, por exemplo.\n---------------------------------------------------------------------\n\
          Descriptors for objects that are distinguishable by their use or application\
          \ within a particular physical location. If an object is identifiable by\
          \ association with specific surroundings, it is qualified by location or\
          \ context.\nBased on [AAT Guidelines \"Types of Guide Terms\"](https://www.getty.edu/research/tools/vocabularies/guidelines/aat_3_1_hierarchical_rels.html)"
        slot_uri: term:lido00934
        range: ConceptReference
        recommended: true
        multivalued: true
        inlined_as_list: true
      work_type_material_tech:
        name: work_type_material_tech
        description: "Nos Document\xE1rios da Arquitetura Tradicional, refere-se \xE0\
          \ caracteriza\xE7\xE3o construtiva geral da edifica\xE7\xE3o.\n---------------------------------------------------------------------\n\
          Descriptors for objects that are distinguishable by their materials encorporated,\
          \ or the techniques used to create the object or work. If an object is identified\
          \ by the substances detected and/or the processes employed, then it is qualified\
          \ by material or technique."
        slot_uri: term:lido00789
        range: MaterialTech
        recommended: true
        multivalued: true
        inlined_as_list: true
      work_type_subject_type:
        name: work_type_subject_type
        description: "Nos Document\xE1rios da Arquitetura Tradicional, indica, se\
          \ houver, uma classifica\xE7\xE3o iconogr\xE1fica mais espec\xEDfica do\
          \ que `form` ou `function`.\n---------------------------------------------------------------------\n\
          Descriptors for objects that are distinguishable by their topics, themes,\
          \ or other content of the work. If an object is identified by what it is\
          \ of or about, then it is qualified by subject.\nBased on [AAT \"subjects\"\
          ](http://vocab.getty.edu/page/aat/300404126)"
        slot_uri: term:lido00768
        range: ConceptReference
        recommended: true
        multivalued: true
        inlined_as_list: true
      work_type_use:
        name: work_type_use
        description: "Nos Document\xE1rios da Arquitetura Tradicional, designa propriamente\
          \ a(s) classifica\xE7\xE3o(\xF5es) de usos do solo ou atividades predominante(s)\
          \ na edifica\xE7\xE3o atualmente.\n---------------------------------------------------------------------\n\
          Descriptors for objects that are distinguishable by the way they are employed,\
          \ occupied, applied, or function. If an object is identifiable by its particular\
          \ mode of use, it is qualified by use.\nBased on [AAT \"use\"](http://vocab.getty.edu/page/aat/300068844)"
        slot_uri: term:lido00938
        range: ConceptReference
        recommended: true
        multivalued: true
        inlined_as_list: true
      classification_genre:
        name: classification_genre
        description: "\u2753 Ainda n\xE3o implementamos o bloco `objectClassification`\
          \ do LIDO. Talvez ele n\xE3o seja relevante para o document\xE1rio de arquitetura\
          \ dom\xE9stica, e n\xE3o \xE9 obrigat\xF3rio no padr\xE3o LIDO nem no perfil\
          \ de aplica\xE7\xE3o para arquitetura.\n---------------------------------------------------------------------\n\
          A broad category for grouping objects on the basis of shared intrinsic characteristics.\
          \ The relationship between an object/work and the object genre is a generic\
          \ is-a-relation rather than a membership based on ascription to a subject\
          \ group.\nNote that the [AAT Object Genres](http://vocab.getty.edu/page/aat/300185711)\
          \ hierarchy differs in its scope from Object genre here in that the AAT\
          \ includes more specific terms grouped by various aspects. In general, AAT\
          \ descriptors are not intended to be used as indexing terms for classification.\n"
        slot_uri: term:lido00853
        range: ConceptReference
        multivalued: true
        inlined_as_list: true
      classification_subject:
        name: classification_subject
        description: "\u2753 Ainda n\xE3o implementamos o bloco `objectClassification`\
          \ do LIDO. Talvez ele n\xE3o seja relevante para o document\xE1rio de arquitetura\
          \ dom\xE9stica, e n\xE3o \xE9 obrigat\xF3rio no padr\xE3o LIDO nem no perfil\
          \ de aplica\xE7\xE3o para arquitetura.\n---------------------------------------------------------------------\n\
          A broad category for grouping objects or works on the basis of a topical\
          \ association, including thematic or systematic classification, or an assignment\
          \ by discipline. The relationship between an object/work and a subject category\
          \ is a kind of membership based on ascription rather than a generic is-a\
          \ relation."
        slot_uri: term:lido00932
        range: ConceptReference
        multivalued: true
        inlined_as_list: true
      classification_local:
        name: classification_local
        description: "\u2753 Ainda n\xE3o implementamos o bloco `objectClassification`\
          \ do LIDO. Talvez ele n\xE3o seja relevante para o document\xE1rio de arquitetura\
          \ dom\xE9stica, e n\xE3o \xE9 obrigat\xF3rio no padr\xE3o LIDO nem no perfil\
          \ de aplica\xE7\xE3o para arquitetura.\n---------------------------------------------------------------------\n\
          A classification scheme for grouping objects on the basis of locally defined\
          \ criteria, including categories corresponding to the curatorial departments\
          \ of the repository, such as \"prints and drawings\", \"decorative arts\"\
          , \"North America\", \"invertebrates\", \"Bronze Age\" or \"textiles\".\
          \ [Based on CCO \"Class\"](https://vraweb.org/wp-content/uploads/2020/04/CatalogingCulturalObjectsFullv2.pdf)"
        slot_uri: term:lido01135
        range: ConceptReference
        multivalued: true
        inlined_as_list: true
      classification_special:
        name: classification_special
        description: "\u2753 Ainda n\xE3o implementamos o bloco `objectClassification`\
          \ do LIDO. Talvez ele n\xE3o seja relevante para o document\xE1rio de arquitetura\
          \ dom\xE9stica, e n\xE3o \xE9 obrigat\xF3rio no padr\xE3o LIDO nem no perfil\
          \ de aplica\xE7\xE3o para arquitetura.\n---------------------------------------------------------------------\n\
          A classification scheme for grouping objects on the basis of criteria defined\
          \ within specific academic disciplines or cultural domains, such as the\
          \ \"Hornbostel-Sachs Classification of Musical Instruments\", the \"Nickel-Strunz\
          \ classification\", biological taxonomies etc. Refers to classification\
          \ schemes that group objects on the basis of object characteristics, not\
          \ on the basis of themes or topics which the objects or works are related\
          \ to."
        slot_uri: term:lido01144
        range: ConceptReference
        multivalued: true
        inlined_as_list: true
      part_of:
        name: part_of
        description: "Permite identificar um conjunto arquitet\xF4nico, urban\xED\
          stico ou conceitual (por exemplo, uma s\xE9rie de casas) do qual a edifica\xE7\
          \xE3o faz parte.\nNos Document\xE1rios da Arquitetura Tradicional, desdobramos\
          \ o grupo LIDO [`relatedWorksWrap`](https://lido-schema.org/schema/v1.1/lido-v1.1.html#relatedWorksWrap)\
          \ em quatro tipos de relacionamentos\u2009:\n1. `part_of`\u2009: a edifica\xE7\
          \xE3o descrita na ficha \xE9 intrinsecamente parte\n   de um conjunto arquitet\xF4\
          nico ou urban\xEDstico maior, quando se trata\n   de uma parte fisicamente\
          \ vinculada a outra edifica\xE7ao ou um\n   elemento concebido dentro de\
          \ um projeto de conjunto.\n\n2. `related_works`\u2009: a edifica\xE7\xE3\
          o descrita na ficha pode ser\n   relacionada, por meio de interpreta\xE7\
          \xE3o historiogr\xE1fica, a outras\n   edifica\xE7\xF5es ou objetos (fontes\
          \ prim\xE1rias escritas ou visuais,\n   obras de arte em geral, outras edifica\xE7\
          \xF5es, etc.).\n\n3. `media`\u2009: fotografias ou imagens hist\xF3ricas\
          \ (desenhos t\xE9cnicos ou\n   art\xEDsticos, pinturas, estampas, etc.)\
          \ que representem fielmente a\n   apar\xEAncia da edifica\xE7\xE3o descrita\
          \ na ficha.\n\n4. `resources`\u2009: desenhos t\xE9cnicos em formato vetorial\
          \ e,\n   eventualmente, modelos tridimensionais ou outras formas de\n  \
          \ informa\xE7\xE3o t\xE9cnica que n\xE3o cabem no formato da ficha, mas\
          \ que\n   foram produzidas pela equipe e colaboradores do projeto de\n \
          \  pesquisa."
        slot_uri: dcterms:isPartOf
        range: LargerContextReference
        multivalued: true
        inlined_as_list: true
      former_site:
        name: former_site
        description: "Indica que a edifica\xE7\xE3o n\xE3o se encontra mais no local\
          \ indicado, seja porque foi deslocada ou demolida."
        range: Site
        multivalued: true
        inlined_as_list: true
      intended_site:
        name: intended_site
        description: "Sinaliza que a edifica\xE7\xE3o devia ocupar um certo local,\
          \ mas n\xE3o chegou a ser constru\xEDda."
        alias: intended
        range: Site
        multivalued: true
        inlined_as_list: true
      other_site:
        name: other_site
        description: "Para casos de implanta\xE7\xE3o n\xE3o contemplados em nenhuma\
          \ das categorias acima."
        alias: other
        range: Site
        multivalued: true
        inlined_as_list: true
      location_historic:
        name: location_historic
        description: "Antigas jurisdi\xE7\xF5es ou designa\xE7\xF5es para o lugar\
          \ onde o objeto se encontra. Para um s\xEDtio de onde o objeto foi fisicamente\
          \ removido, usar a lista `former_site`."
        range: LocationHistoric
        multivalued: true
        inlined_as_list: true
      inscriptions:
        name: inscriptions
        description: "Marcas, s\xEDmbolos ou textos gravados na edifica\xE7\xE3o,\
          \ especialmente aqueles referentes \xE0 estrutura como um todo e n\xE3o\
          \ espec\xEDficos a alguma de suas partes. N\xE3o usar para iconografia."
        range: Inscription
        multivalued: true
        inlined_as_list: true
      collection:
        name: collection
        description: "Descreve conjuntos conceituais nos quais a edifica\xE7\xE3o\
          \ foi inclu\xEDda, por exemplo cat\xE1logos raisonn\xE9s, obras de refer\xEA\
          ncia, exposi\xE7\xF5es, ou agrupamentos *ad-hoc* para formar cole\xE7\xF5\
          es tem\xE1ticas de acordo com as necessidades do projeto de investiga\xE7\
          \xE3o.\nPara o pertencimento a per\xEDmetros de s\xEDtios hist\xF3ricos\
          \ tombados/classificados, preencher o grupo `identifiers`. Para a identifica\xE7\
          \xE3o de propriet\xE1rios ou respons\xE1veis, preencher o grupo `work_rights`.\n"
        notes:
        - 'A set of identifying and indexing information about the collection the
          object/work in focus is gathered into or is a member of.

          Collection applies to any accumulated group of physical or digital items,
          conceptually or physically brought together on the basis of a focal characteristic.
          Use cases for grouping items into a collection are various and may span
          curated holdings in museums, departmental collections, sets of items to
          be displayed in an exhibition, or aggregations bound informally for cataloging
          and retrieval purposes.'
        slot_uri: lido:collection
        range: Collection
        multivalued: true
        inlined_as_list: true
      related_works:
        name: related_works
        description: "O grupo `related_works` \xE9 destinado unicamente a cadastrar\
          \ rela\xE7\xF5es desta edifica\xE7\xE3o com objetos aut\xF4nomos, tais como\
          \ outras edifica\xE7\xF5es, conjuntos urbanos, obras de artes visuais, refer\xEA\
          ncias bibliogr\xE1ficas ou acervos arquiv\xEDsticos.\n\u26A0\uFE0F  OS DESENHOS\
          \ PRODUZIDOS POR ESTE PROJETO DE PESQUISA DEVEM SER CADASTRADOS NO GRUPO\
          \ `resources`.\nAs formas mais comuns de rela\xE7\xE3o no nosso projeto\
          \ s\xE3o :\n\n  - depicted in: A edifica\xE7\xE3o \xE9 representada numa\
          \ pintura ou desenho\n    art\xEDstico;\n\n  - documented by: Informa\xE7\
          \xF5es sobre a edifica\xE7\xE3o est\xE3o publicadas numa\n    refer\xEA\
          ncia bibliogr\xE1fica, processo administrativo ou outro documento\n    textual\
          \ impresso, manuscrito ou eletr\xF4nico;\n\n  - has plan / has floor plan\
          \ / has section / has elevation / has\n    rendering: Essas rela\xE7\xF5\
          es mostram a exist\xEAncia de desenhos t\xE9cnicos\n    da edifica\xE7\xE3\
          o, sejam eles hist\xF3ricos ou recentes, compilados de\n    fontes externas\
          \ a este projeto de pesquisa.\n\n  - has construction drawing / has design\
          \ / has sketch: Essas rela\xE7\xF5es se\n    referem a desenhos hist\xF3\
          ricos (fontes prim\xE1rias) que atestam o\n    processo de projeto da edifica\xE7\
          \xE3o.\n\nNos Document\xE1rios da Arquitetura Tradicional, desdobramos o\
          \ grupo LIDO [`relatedWorksWrap`](https://lido-schema.org/schema/v1.1/lido-v1.1.html#relatedWorksWrap)\
          \ em quatro tipos de relacionamentos\u2009:\n1. `part_of`\u2009: a edifica\xE7\
          \xE3o descrita na ficha \xE9 intrinsecamente parte\n   de um conjunto arquitet\xF4\
          nico ou urban\xEDstico maior, quando se trata\n   de uma parte fisicamente\
          \ vinculada a outra edifica\xE7ao ou um\n   elemento concebido dentro de\
          \ um projeto de conjunto.\n\n2. `related_works`\u2009: a edifica\xE7\xE3\
          o descrita na ficha pode ser\n   relacionada, por meio de interpreta\xE7\
          \xE3o historiogr\xE1fica, a outras\n   edifica\xE7\xF5es ou objetos (fontes\
          \ prim\xE1rias escritas ou visuais,\n   obras de arte em geral, outras edifica\xE7\
          \xF5es, etc.).\n\n3. `media`\u2009: fotografias ou imagens hist\xF3ricas\
          \ (desenhos t\xE9cnicos ou\n   art\xEDsticos, pinturas, estampas, etc.)\
          \ que representem fielmente a\n   apar\xEAncia da edifica\xE7\xE3o descrita\
          \ na ficha.\n\n4. `resources`\u2009: desenhos t\xE9cnicos em formato vetorial\
          \ e,\n   eventualmente, modelos tridimensionais ou outras formas de\n  \
          \ informa\xE7\xE3o t\xE9cnica que n\xE3o cabem no formato da ficha, mas\
          \ que\n   foram produzidas pela equipe e colaboradores do projeto de\n \
          \  pesquisa.\n"
        notes:
        - A wrapper for identifying information about an object or work, including
          collections, related to the object/work in focus. May include a weblink.
        slot_uri: dcterms:related
        range: RelatedWork
        multivalued: true
        inlined_as_list: true
      subject:
        name: subject
        description: "Recomenda-se articular o tema em tr\xEAs n\xEDveis : descri\xE7\
          \xE3o, identifica\xE7\xE3o e interpreta\xE7\xE3o.\nDESCRI\xC7\xC3O se refere\
          \ a elementos imediatamente reconhec\xEDveis sem necessidade de conhecimento\
          \ especializado : coluna(ta)s, arcadas, bras\xF5es, cunhais, ornamentos\
          \ em geral.\nIDENTIFICA\xC7\xC3O se refere ao reconhecimento das particularidades\
          \ arquitet\xF4nicas ou iconogr\xE1ficas dos elementos : p. ex. as colunas\
          \ s\xE3o da ordem toscana, a ab\xF3bada \xE9 de aresta, o bras\xE3o pertence\
          \ a tal fam\xEDlia...\nINTERPRETA\xC7\xC3O diz respeito ao significado iconol\xF3\
          gico, aleg\xF3rico ou pol\xEDtico dos elementos, incluindo quest\xF5es de\
          \ status e estilo.\n"
        slot_uri: lido:subjectSet
        range: Topic
        multivalued: true
        inlined_as_list: true
    class_uri: schema:LandmarksOrHistoricalBuildings
  Site:
    name: Site
    definition_uri: https://tradicional.arq.br/schema/Site
    description: "O georreferenciamento \xE9 o cerne do projeto dos Document\xE1rios\
      \ da Arquitetura Tradicional. Ele permite investigar a distribui\xE7\xE3o geogr\xE1\
      fica das caracter\xEDsticas construtivas e morfol\xF3gicas das edifica\xE7\xF5\
      es cadastradas.\nAs instru\xE7\xF5es de preenchimento espec\xEDficas se encontram\
      \ na documenta\xE7\xE3o das classes que fornecem os dados para o s\xEDtio. Consulte\
      \ tamb\xE9m o [Tutorial de georreferenciamento](https://github.com/arqtrad/.github/wiki/Tutorial-de-georreferenciamento)\
      \ para saber como localizar edifica\xE7\xF5es n\xE3o cadastradas nas bases de\
      \ dados do patrim\xF4nio cultural (SICG ou SIPA).\n"
    notes:
    - This class comprises 4-dimensional point sets (volumes) in physical spacetime
      (in contrast to mathematical models of it) regardless of their true geometric
      forms. They may derive their identity from being the extent of a material phenomenon
      or from being the interpretation of an expression defining an extent in spacetime.
      Intersections of instances of E92 Spacetime Volume, E53 Place, and E52 Time-Span
      are also regarded as instances of E92 Spacetime Volume. An instance of E92 Spacetime
      Volume is either contiguous or composed of a finite number of contiguous subsets.
      Its boundaries may be fuzzy due to the properties of the phenomena it derives
      from or due to the limited precision up to which defining expression can be
      identified with a real extent in spacetime. The duration of existence of an
      instance of E92 Spacetime Volume is its projection on time.
    comments:
    - "Este bloco corresponde \xE0 terminologia do [DublinCore] `coverage > spatial`.\
      \ Na especifica\xE7\xE3o [LIDO], a localiza\xE7\xE3o f\xEDsica de um bem se\
      \ confunde com a sua inser\xE7\xE3o institucional (reposit\xF3rio). Na formata\xE7\
      \xE3o da nossa ficha, tentamos desfazer essa confus\xE3o separando o georreferenciamento\
      \ e o reposit\xF3rio em blocos diferentes."
    from_schema: https://tradicional.arq.br/schema/work
    exact_mappings:
    - crm:E92_Spacetime_Volume
    - schema:DefinedRegion
    is_a: Thing
    abstract: true
    slots:
    - id
    - record_author
    - record_date
    - description
    - category
    - record_rights
    - bibliographic_citation
    - content
    - thing__title
    - thing__title_source
    - thing__alt_name
    - thing__identifiers
    - thing__tags
    - thing__temporal
    - thing__repositories
    - site__part_of
    - site__site_type
    - site__location
    - site__extent
    - site__event_place_type
    attributes:
      part_of:
        name: part_of
        description: "Permite identificar o contexto geogr\xE1fico ou administrativo\
          \ ao qual a edifica\xE7\xE3o se subordina. Referenciar a localidade por\
          \ meio do c\xF3digo identificador na forma: `geonameid: 1234`\n---------------------------------------------------------------------\n\
          A set of structured information about a place that is the broader context\
          \ for the place in focus, such as the district, state, or nation to which\
          \ a city belongs.\n"
        slot_uri: lido:partOfPlace
        range: GeonamesFeature
        inlined: true
      site_type:
        name: site_type
        description: "Categoriza a natureza do recorte que define o s\xEDtio.\n"
        ifabsent: RepositoryType(geographic)
        alias: type
        range: RepositoryType
      location:
        name: location
        description: "Coordenadas geogr\xE1ficas do ponto que permite situar a edifica\xE7\
          \xE3o no mapa para fins ilustrativos. Usar o sistema de coordenadas geogr\xE1\
          ficas EPSG:4326 (WGS84) sempre que poss\xEDvel.\n---------------------------------------------------------------------\n\
          Representative point location for the place, normally in EPSG:4326 (WGS\
          \ 84)."
        slot_uri: geo:hasDefaultGeometry
        range: GeographicPoint
        required: true
        inlined: true
      extent:
        name: extent
        description: "\xC1rea da implanta\xE7\xE3o da edifica\xE7\xE3o ou s\xEDtio\
          \ cadastrado. Usar o sistema de coordenadas geogr\xE1ficas EPSG:4326 (WGS84)\
          \ sempre que poss\xEDvel.\n---------------------------------------------------------------------\n\
          Polygonal, multipolygonal, or linear geographic extent associated with the\
          \ place."
        slot_uri: geo:hasGeometry
        range: GeographicExtent
        inlined: true
      event_place_type:
        name: event_place_type
        description: "Se relevante para a a\xE7\xE3o, indicar se se trata do local\
          \ de descobrimento do objeto, do local de origem ou destino do seu translado.\
          \ Omitir caso o evento n\xE3o se enquadre nesses casos.\n"
        range: EventPlaceType
    class_uri: crm:E92_Spacetime_Volume
  GeographicPoint:
    name: GeographicPoint
    definition_uri: https://tradicional.arq.br/schema/GeographicPoint
    description: "Coordenadas do ponto que situa o s\xEDtio na visualiza\xE7\xE3o\
      \ do mapa.\nA fonte preferencial de autoridade para o georreferenciamento \xE9\
      \ um \xF3rg\xE3o p\xFAblico, por exemplo o IPHAN no Brasil (usando as coordenadas\
      \ informadas no [SICG]) ou a DGMN em Portugal (usando as coordenadas informadas\
      \ no [SIPA]).\nCaso n\xE3o haja georreferenciamento oficial, usar uma planta\
      \ cadastral municipal georreferenciada ou, na falta desta, o [Global Building\
      \ Atlas]. Nesses casos, para se obter as coordenadas de georreferenciamento,\
      \ \xE9 preciso usar um Sistema de Informa\xE7\xF5es Geogr\xE1ficas da sua prefer\xEA\
      ncia.\nComo exemplo, no [QGIS], isso pode ser feito seguindo as instru\xE7\xF5\
      es abaixo\u2009:\n1. Sempre projetar o mapa usando EPSG:4326 (WGS84)\u2009;\n\
      2. Selecionar o pol\xEDgono da edifica\xE7\xE3o na camada da planta cadastral\
      \ ou\n   do Global Building Atlas\u2009;\n\n3. Rodar o comando do menu `Vector\
      \ > Geometry Tools > Centroids` para\n  obter as coordenadas do ponto (`location`)\
      \ \u2014 ele vai criar uma camada\n  tempor\xE1ria com o ponto no centr\xF3\
      ide do pol\xEDgono selecionado\u2009;\n\n4. Usar novamente a ferramenta `Get\
      \ WKT` para visualizar as coordenadas,\n  copiar os valores e colar na ficha\
      \ com o grau de precis\xE3o (casas\n  decimais) desejado.\n"
    from_schema: https://tradicional.arq.br/schema/work
    slots:
    - srs_name
    - source
    - bibliographic_citation
    - geographicPoint__lat
    - geographicPoint__lon
    - geographicPoint__alt
    - geographicPoint__zoom
    attributes:
      lat:
        name: lat
        description: 'Latitude em graus decimais (separador decimal: ponto).'
        range: Latitude
        required: true
      lon:
        name: lon
        description: 'Longitude em graus decimais (separador decimal: ponto).'
        range: Longitude
        required: true
      alt:
        name: alt
        description: 'Altitude em metros (separador decimal: ponto)'
        range: float
        minimum_value: -1000
        maximum_value: 10000
      zoom:
        name: zoom
        description: "Usado para visualizar o mapa mais de longe se a precis\xE3o\
          \ das coordenadas for baixa.\n"
        ifabsent: integer(13)
        range: integer
        minimum_value: 0
        maximum_value: 18
    class_uri: wasth:GeographicPoint
  GeographicExtent:
    name: GeographicExtent
    definition_uri: https://tradicional.arq.br/schema/GeographicExtent
    description: "Coordenadas do pol\xEDgono que define o s\xEDtio.\n"
    from_schema: https://tradicional.arq.br/schema/work
    slots:
    - srs_name
    - source
    - bibliographic_citation
    - geographicExtent__geometry_type
    - geographicExtent__coordinates
    attributes:
      geometry_type:
        name: geometry_type
        description: Tipo da geometria descrita pelas coordenadas.
        alias: type
        range: GeometryType
        required: true
      coordinates:
        name: coordinates
        description: "No QGIS, usar a ferramenta `Get WKT` para obter as coordenadas\
          \ do pol\xEDgono (`extent`) com a op\xE7\xE3o `Get JSON` \u2014 copiar apenas\
          \ os colchetes `[[[ ]]]` e os valores num\xE9ricos dentro deles.\n"
        range: GeoJSONCoordinateArray
        required: true
    class_uri: wasth:GeographicExtent
  Inscription:
    name: Inscription
    definition_uri: https://tradicional.arq.br/schema/Inscription
    description: "A descri\xE7\xE3o da inscri\xE7\xE3o informa local, dimens\xF5es\
      \ e caracter\xEDsticas. Os tipos de descri\xE7\xE3o podem ser extra\xEDdos da\
      \ hierarquia Getty: <http://vocab.getty.edu/page/aat/300220469>.\nOs itens das\
      \ listas de `material` e `technique` DEVEM usar o nosso [vocabul\xE1rio controlado](https://vocabulario.tradicional.arq.br).\n\
      Essa distin\xE7\xE3o \xE9 especialmente relevante no caso de revestimentos,\
      \ como estuques, azulejos ou pinturas decorativas, por oposi\xE7\xE3o \xE0 base\
      \ sobre a qual eles s\xE3o aplicados."
    from_schema: https://tradicional.arq.br/schema/work
    slots:
    - format_extent
    - description
    - content
    - bibliographic_citation
    - inscription__inscription_type
    attributes:
      inscription_type:
        name: inscription_type
        description: "Determina a natureza da inscri\xE7\xE3o.\n"
        ifabsent: string(text)
        alias: type
        range: InscriptionType
        required: true
    class_uri: wasth:Inscription
  Topic:
    name: Topic
    definition_uri: https://tradicional.arq.br/schema/Topic
    description: Subject or iconographic topic.
    from_schema: https://tradicional.arq.br/schema/work
    slots:
    - description
    - format_extent
    - Topic_concept_name
    - topic__topic_type
    slot_usage:
      concept_name:
        name: concept_name
        required: true
    attributes:
      topic_type:
        name: topic_type
        description: "Categoriza o n\xEDvel descritivo ou interpretativo do tema.\n"
        alias: type
        range: SubjectType
        required: true
    class_uri: wasth:Topic
  LocationHistoric:
    name: LocationHistoric
    definition_uri: https://tradicional.arq.br/schema/LocationHistoric
    description: "Designa\xE7\xF5es alternativas ou jurisdi\xE7\xF5es antigas para\
      \ o mesmo local, N\xC3O a localiza\xE7\xE3o original de uma constru\xE7\xE3\
      o fisicamente deslocada (para tanto, cadastrar outra localiza\xE7\xE3o do tipo\
      \ `former_site`). Preencher apenas caso a nomenclatura seja relevante, por exemplo\
      \ para nomear as antigas prov\xEDncias de Portugal ou o Oeste da Bahia, que\
      \ originalmente pertencia a Pernambuco, ou ainda se for relevante informar uma\
      \ regi\xE3o f\xEDsica."
    from_schema: https://tradicional.arq.br/schema/work
    slots:
    - locationHistoric__location_historic_type
    - locationHistoric__location_historic_name
    attributes:
      location_historic_type:
        name: location_historic_type
        description: "Define se o local hist\xF3rico designa uma jurisdi\xE7\xE3o,\
          \ um top\xF4nimo antigo, ou outro.\n"
        alias: type
        range: RepositoryType
        required: true
      location_historic_name:
        name: location_historic_name
        description: "Identifica\xE7\xE3o do local com refer\xEAncia a um vocabul\xE1\
          rio controlado ou reposit\xF3rio de top\xF4nimos tal como o geonames.\n"
        alias: name
        range: TypedReference
        required: true
        inlined: true
    class_uri: wasth:LocationHistoric
  Collection:
    name: Collection
    definition_uri: https://tradicional.arq.br/schema/Collection
    from_schema: https://tradicional.arq.br/schema/work
    is_a: Thing
    slots:
    - id
    - record_author
    - record_date
    - description
    - category
    - record_rights
    - bibliographic_citation
    - content
    - thing__title
    - thing__title_source
    - thing__alt_name
    - thing__identifiers
    - thing__tags
    - thing__temporal
    - thing__repositories
    - collection__collection_type
    attributes:
      collection_type:
        name: collection_type
        description: "Descreve a natureza da cole\xE7\xE3o."
        alias: type
        range: CollectionType
        required: true
    class_uri: wasth:Collection
  GeonamesFeature:
    name: GeonamesFeature
    definition_uri: https://tradicional.arq.br/schema/geonames/GeonamesFeature
    from_schema: https://tradicional.arq.br/schema/geonames

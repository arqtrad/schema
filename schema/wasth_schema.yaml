    inlined_as_list: true
  thing__alt_name:
    name: thing__alt_name
    description: "O bloco `alt_name` permite cadastrar outros nomes pelos quais o\
      \ objeto ou conceito ser\xE1 eventualmente conhecido. \xC9 uma lista opcional\
      \ de itens, e se existir, os campos de cada item da lista devem ser preenchidos\
      \ como os do t\xEDtulo principal.\nO campo `label` ou `description` de cada\
      \ item cont\xE9m o texto do t\xEDtulo (nome).\nEste bloco pode ser omitido por\
      \ completo se n\xE3o houver t\xEDtulos alternativos.\n"
    from_schema: https://tradicional.arq.br/schema/thing
    slot_uri: wasth:alt_name
    alias: alt_name
    owner: Thing
    domain_of:
    - Thing
    range: Appellation
    multivalued: true
    inlined: true
    inlined_as_list: true
  thing__identifiers:
    name: thing__identifiers
    description: "N\xFAmeros de invent\xE1rio e demais c\xF3digos que identificam\
      \ este objeto em outras bases de dados.\nCaso esta edifica\xE7\xE3o esteja cadastrada\
      \ em outras bases de dados (por exemplo, [SICG], [SIPA], [HPIP], [iPatrimonio],\
      \ etc.), pode preencher a lista `identifiers` como segue.\n:clipboard: O conte\xFA\
      do de cada bloco \xE9 uma lista recuada em dois espa\xE7os com respeito \xE0\
      \ categoria superior. Seus itens s\xE3o\u2009:\n* `type` \xE9 o tipo de refer\xEA\
      ncia\u2009: pode ser `uri` (padr\xE3o), `iri` ou\n  `local` \u2014 se estiver\
      \ em d\xFAvida, omita esta linha\u2009;\n\n* `refid` \xE9 obrigat\xF3rio\u2009\
      : representa o identificador do conceito no\n  vocabul\xE1rio controlado ou\
      \ no reposit\xF3rio de origem \u2014 normalmente\n  ser\xE1 uma URI (um link\
      \ para a p\xE1gina web do cadastro)\u2009;\n\n* `description` deve ser usado\
      \ para representar textualmente\n  o n\xFAmero de invent\xE1rio, c\xF3digo identificador\
      \ ou outra informa\xE7\xE3o\n  que individualize o objeto na base externa (por\
      \ exemplo, livro do\n  tombo e n\xFAmero do processo de tombamento, no Brasil)\u2009\
      ;\n\n* `bibliographic_citation` \xE9 opcional e permite citar uma lista de\n\
      \  refer\xEAncias bibliogr\xE1ficas que validem a inclus\xE3o deste termo.\n\
      \n* `source` tamb\xE9m \xE9 opcional e permite cadastrar os dados da pessoa\n\
      \  jur\xEDdica respons\xE1vel pelo registro.\n\n---------------------------------------------------------------------\n\
      Published or external identifiers for the object.\n"
    from_schema: https://tradicional.arq.br/schema/thing
    slot_uri: wasth:identifiers
    alias: identifiers
    owner: Thing
    domain_of:
    - Thing
    range: TypedReference
    multivalued: true
    inlined: true
    inlined_as_list: true
  thing__tags:
    name: thing__tags
    description: "Lista de palavras-chave que caracterizam o objeto, de modo n\xE3\
      o estruturado. Recomenda-se usar uma palavra-chave de cada um dos recortes abaixo:\n\
      - Geogr\xE1fico\u2009; - Cronol\xF3gico\u2009; - Hist\xF3rico-cultural\u2009\
      ; - T\xE9cnico-construtivo\u2009; - Tem\xE1tico ou tipol\xF3gico\u2009; - Funcional.\n\
      ---------------------------------------------------------------------\nProvisional\
      \ uncontrolled keywords. Prefer `classifications` or `subject` for curated vocabulary\
      \ terms."
    from_schema: https://tradicional.arq.br/schema/thing
    slot_uri: wasth:tags
    alias: tags
    owner: Thing
    domain_of:
    - Thing
    range: string
    multivalued: true
  thing__temporal:
    name: thing__temporal
    description: "Descri\xE7\xE3o dos eventos associados ao ciclo de vida da edifica\xE7\
      \xE3o ou \xE0 exist\xEAncia e/ou uso do objeto ou conceito. Ler a respetiva\
      \ documenta\xE7\xE3o para estruturar este campo.\n"
    from_schema: https://tradicional.arq.br/schema/thing
    slot_uri: wasth:temporal
    alias: temporal
    owner: Thing
    domain_of:
    - Thing
    range: Event
    multivalued: true
    inlined: true
    inlined_as_list: true
  thing__repositories:
    name: thing__repositories
    description: "Nos Document\xE1rios da Arquitetura Tradicional, usamos reposit\xF3\
      rios para indicar a inclus\xE3o da edifica\xE7\xE3o em per\xEDmetros de s\xED\
      tios tombados/classificados do patrim\xF4nio, \xE1reas de interesse hist\xF3\
      rico-cultural, etc.\nO reposit\xF3rio \xE9 cadastrado como uma pessoa jur\xED\
      dica dotada de extens\xE3o geogr\xE1fica.\n---------------------------------------------------------------------\n\
      A set of elements for the identification, name and location of the repository\
      \ that is responsible for the object/work in focus.\nRepeated if there are several\
      \ designations known, or if former repositories or geographic places should\
      \ be listed.\n"
    from_schema: https://tradicional.arq.br/schema/thing
    slot_uri: wasth:repositories
    alias: repositories
    owner: Thing
    domain_of:
    - Thing
    range: Repository
    multivalued: true
    inlined: true
    inlined_as_list: true
  appellation__title_preference:
    name: appellation__title_preference
    description: "Indica se o nome em quest\xE3o deve ser oculto ou n\xE3o, se \xE9\
      \ uma vers\xE3o alternativa ou uma variante de grafia, etc."
    from_schema: https://tradicional.arq.br/schema/thing
    slot_uri: wasth:label_type
    ifabsent: LabelType(alternative)
    alias: label_type
    owner: Appellation
    domain_of:
    - Appellation
    range: LabelType
  appellation__label:
    name: appellation__label
    description: "Nome ou t\xEDtulo (texto sem formata\xE7\xE3o)."
    from_schema: https://tradicional.arq.br/schema/thing
    slot_uri: wasth:label
    alias: label
    owner: Appellation
    domain_of:
    - Appellation
    range: string
  appellation__title_type:
    name: appellation__title_type
    from_schema: https://tradicional.arq.br/schema/thing
    slot_uri: wasth:title_type
    ifabsent: TitleType(descriptive)
    alias: title_type
    owner: Appellation
    domain_of:
    - Appellation
    range: TitleType
  repository__repository_type:

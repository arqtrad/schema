    from_schema: https://tradicional.arq.br/schema/work
    slot_uri: wasth:other
    alias: other
    owner: Work
    domain_of:
    - Work
    range: Site
    multivalued: true
    inlined: true
    inlined_as_list: true
  work__location_historic:
    name: work__location_historic
    description: "Antigas jurisdi\xE7\xF5es ou designa\xE7\xF5es para o lugar onde\
      \ o objeto se encontra. Para um s\xEDtio de onde o objeto foi fisicamente removido,\
      \ usar a lista `former_site`."
    from_schema: https://tradicional.arq.br/schema/work
    slot_uri: wasth:location_historic
    alias: location_historic
    owner: Work
    domain_of:
    - Work
    range: LocationHistoric
    multivalued: true
    inlined: true
    inlined_as_list: true
  work__inscriptions:
    name: work__inscriptions
    description: "Marcas, s\xEDmbolos ou textos gravados na edifica\xE7\xE3o, especialmente\
      \ aqueles referentes \xE0 estrutura como um todo e n\xE3o espec\xEDficos a alguma\
      \ de suas partes. N\xE3o usar para iconografia."
    from_schema: https://tradicional.arq.br/schema/work
    slot_uri: wasth:inscriptions
    alias: inscriptions
    owner: Work
    domain_of:
    - Work
    range: Inscription
    multivalued: true
    inlined: true
    inlined_as_list: true
  work__collection:
    name: work__collection
    description: "Descreve conjuntos conceituais nos quais a edifica\xE7\xE3o foi\
      \ inclu\xEDda, por exemplo cat\xE1logos raisonn\xE9s, obras de refer\xEAncia,\
      \ exposi\xE7\xF5es, ou agrupamentos *ad-hoc* para formar cole\xE7\xF5es tem\xE1\
      ticas de acordo com as necessidades do projeto de investiga\xE7\xE3o.\nPara\
      \ o pertencimento a per\xEDmetros de s\xEDtios hist\xF3ricos tombados/classificados,\
      \ preencher o grupo `identifiers`. Para a identifica\xE7\xE3o de propriet\xE1\
      rios ou respons\xE1veis, preencher o grupo `work_rights`.\n"
    notes:
    - 'A set of identifying and indexing information about the collection the object/work
      in focus is gathered into or is a member of.

      Collection applies to any accumulated group of physical or digital items, conceptually
      or physically brought together on the basis of a focal characteristic. Use cases
      for grouping items into a collection are various and may span curated holdings
      in museums, departmental collections, sets of items to be displayed in an exhibition,
      or aggregations bound informally for cataloging and retrieval purposes.'
    from_schema: https://tradicional.arq.br/schema/work
    mappings:
    - lido:collection
    slot_uri: lido:collection
    alias: collection
    owner: Work
    domain_of:
    - Work
    range: Collection
    multivalued: true
    inlined: true
    inlined_as_list: true
  work__related_works:
    name: work__related_works
    description: "O grupo `related_works` \xE9 destinado unicamente a cadastrar rela\xE7\
      \xF5es desta edifica\xE7\xE3o com objetos aut\xF4nomos, tais como outras edifica\xE7\
      \xF5es, conjuntos urbanos, obras de artes visuais, refer\xEAncias bibliogr\xE1\
      ficas ou acervos arquiv\xEDsticos.\n\u26A0\uFE0F  OS DESENHOS PRODUZIDOS POR\
      \ ESTE PROJETO DE PESQUISA DEVEM SER CADASTRADOS NO GRUPO `resources`.\nAs formas\
      \ mais comuns de rela\xE7\xE3o no nosso projeto s\xE3o :\n\n  - depicted in:\
      \ A edifica\xE7\xE3o \xE9 representada numa pintura ou desenho\n    art\xED\
      stico;\n\n  - documented by: Informa\xE7\xF5es sobre a edifica\xE7\xE3o est\xE3\
      o publicadas numa\n    refer\xEAncia bibliogr\xE1fica, processo administrativo\
      \ ou outro documento\n    textual impresso, manuscrito ou eletr\xF4nico;\n\n\
      \  - has plan / has floor plan / has section / has elevation / has\n    rendering:\
      \ Essas rela\xE7\xF5es mostram a exist\xEAncia de desenhos t\xE9cnicos\n   \
      \ da edifica\xE7\xE3o, sejam eles hist\xF3ricos ou recentes, compilados de\n\
      \    fontes externas a este projeto de pesquisa.\n\n  - has construction drawing\
      \ / has design / has sketch: Essas rela\xE7\xF5es se\n    referem a desenhos\
      \ hist\xF3ricos (fontes prim\xE1rias) que atestam o\n    processo de projeto\
      \ da edifica\xE7\xE3o.\n\nNos Document\xE1rios da Arquitetura Tradicional, desdobramos\
      \ o grupo LIDO [`relatedWorksWrap`](https://lido-schema.org/schema/v1.1/lido-v1.1.html#relatedWorksWrap)\
      \ em quatro tipos de relacionamentos\u2009:\n1. `part_of`\u2009: a edifica\xE7\
      \xE3o descrita na ficha \xE9 intrinsecamente parte\n   de um conjunto arquitet\xF4\
      nico ou urban\xEDstico maior, quando se trata\n   de uma parte fisicamente vinculada\
      \ a outra edifica\xE7ao ou um\n   elemento concebido dentro de um projeto de\
      \ conjunto.\n\n2. `related_works`\u2009: a edifica\xE7\xE3o descrita na ficha\
      \ pode ser\n   relacionada, por meio de interpreta\xE7\xE3o historiogr\xE1fica,\
      \ a outras\n   edifica\xE7\xF5es ou objetos (fontes prim\xE1rias escritas ou\
      \ visuais,\n   obras de arte em geral, outras edifica\xE7\xF5es, etc.).\n\n\
      3. `media`\u2009: fotografias ou imagens hist\xF3ricas (desenhos t\xE9cnicos\
      \ ou\n   art\xEDsticos, pinturas, estampas, etc.) que representem fielmente\
      \ a\n   apar\xEAncia da edifica\xE7\xE3o descrita na ficha.\n\n4. `resources`\u2009\
      : desenhos t\xE9cnicos em formato vetorial e,\n   eventualmente, modelos tridimensionais\
      \ ou outras formas de\n   informa\xE7\xE3o t\xE9cnica que n\xE3o cabem no formato\
      \ da ficha, mas que\n   foram produzidas pela equipe e colaboradores do projeto\
      \ de\n   pesquisa.\n"
    notes:
    - A wrapper for identifying information about an object or work, including collections,
      related to the object/work in focus. May include a weblink.
    from_schema: https://tradicional.arq.br/schema/work
    mappings:
    - dcterms:related
    slot_uri: dcterms:related
    alias: related_works
    owner: Work
    domain_of:
    - Work
    range: RelatedWork
    multivalued: true
    inlined: true
    inlined_as_list: true
  work__subject:
    name: work__subject
    description: "Recomenda-se articular o tema em tr\xEAs n\xEDveis : descri\xE7\xE3\
      o, identifica\xE7\xE3o e interpreta\xE7\xE3o.\nDESCRI\xC7\xC3O se refere a elementos\
      \ imediatamente reconhec\xEDveis sem necessidade de conhecimento especializado\
      \ : coluna(ta)s, arcadas, bras\xF5es, cunhais, ornamentos em geral.\nIDENTIFICA\xC7\
      \xC3O se refere ao reconhecimento das particularidades arquitet\xF4nicas ou\
      \ iconogr\xE1ficas dos elementos : p. ex. as colunas s\xE3o da ordem toscana,\
      \ a ab\xF3bada \xE9 de aresta, o bras\xE3o pertence a tal fam\xEDlia...\nINTERPRETA\xC7\
      \xC3O diz respeito ao significado iconol\xF3gico, aleg\xF3rico ou pol\xEDtico\
      \ dos elementos, incluindo quest\xF5es de status e estilo.\n"

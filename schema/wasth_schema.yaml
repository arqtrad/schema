    description: A named place with optional geographic location, administrative hierarchy,
      classification, and external identifiers. A Place may be referenced as the spatial
      coverage of a Work.
    from_schema: https://tradicional.arq.br/schema/place
    is_a: Thing
    slots:
    - Thing_description
    - record_rights
    - alt_name
    - bibliographic_citation
    - identifiers
    - tags
    - temporal
    - repository
    - collection
    - content
    - thing__author
    - thing__record_date
    - thing__title
    - thing__title_source
    - thing__category
    - place_type
    - place_function
    - spatial
    - Place_id
    - Place_title_type
    slot_usage:
      id:
        name: id
        is_a: thing__id
        range: OlcPlusCode11
      title_type:
        name: title_type
        description: Type of the place name. For a Place record, this will often be
          `geographic` when the name represents an administrative or geographic entity.
        range: RepositoryType
    class_uri: wasth:Place
  BibliographicCitation:
    name: BibliographicCitation
    definition_uri: https://tradicional.arq.br/schema/BibliographicCitation
    description: Bibliographic or documentary citation using a CSL citekey.
    from_schema: https://tradicional.arq.br/schema/resource
    slots:
    - description
    - bibliographicCitation__citation_refid
    - bibliographicCitation__note
    attributes:
      citation_refid:
        name: citation_refid
        alias: refid
        range: CslCitekey
        required: true
      note:
        name: note
        range: string
    class_uri: wasth:BibliographicCitation
  RelatedObject:
    name: RelatedObject
    definition_uri: https://tradicional.arq.br/schema/RelatedObject
    description: "As formas mais comuns de rela\xE7\xE3o no nosso projeto s\xE3o :\n\
      \n  - depicted in: A edifica\xE7\xE3o \xE9 representada numa pintura ou desenho\n\
      \    art\xEDstico;\n\n  - documented by: Informa\xE7\xF5es sobre a edifica\xE7\
      \xE3o est\xE3o publicadas numa\n    refer\xEAncia bibliogr\xE1fica, processo\
      \ administrativo ou outro documento\n    textual impresso, manuscrito ou eletr\xF4\
      nico;\n\n  - has plan / has floor plan / has section / has elevation / has\n\
      \    rendering: Essas rela\xE7\xF5es mostram a exist\xEAncia de desenhos t\xE9\
      cnicos\n    da edifica\xE7\xE3o, sejam eles hist\xF3ricos ou recentes, compilados\
      \ de\n    fontes externas a este projeto de pesquisa.\n\n  - has construction\
      \ drawing / has design / has sketch: Essas rela\xE7\xF5es se\n    referem a\
      \ desenhos hist\xF3ricos (fontes prim\xE1rias) que atestam o\n    processo de\
      \ projeto da edifica\xE7\xE3o.\n\nATEN\xC7\xC3O : OS DESENHOS PRODUZIDOS POR\
      \ ESTE PROJETO DE PESQUISA DEVEM SER\nCADASTRADOS NO GRUPO resource, MAIS ABAIXO.\n\
      \nO grupo relation \xE9 destinado unicamente a cadastrar rela\xE7\xF5es desta\n\
      edifica\xE7\xE3o com objetos aut\xF4nomos, tais como outras edifica\xE7\xF5\
      es, conjuntos\nurbanos, obras de artes visuais, refer\xEAncias bibliogr\xE1\
      ficas ou acervos\narquiv\xEDsticos.\n"
    from_schema: https://tradicional.arq.br/schema/resource
    slots:
    - description
    - relation_type
    - related_object
    - object_type
    - resource
    - media
    - source
    - bibliographic_citation
    class_uri: wasth:RelatedObject
  RelatedWork:
    name: RelatedWork
    definition_uri: https://tradicional.arq.br/schema/RelatedWork
    description: A wrapper for identifying information about an object or work, including
      collections, related to the object/work in focus. May include a weblink.
    from_schema: https://tradicional.arq.br/schema/resource
    is_a: RelatedObject
    slots:
    - description
    - relation_type
    - object_type
    - resource
    - media
    - source
    - bibliographic_citation
    - RelatedWork_related_object
    slot_usage:
      related_object:
        name: related_object
        range: Work
    class_uri: wasth:RelatedWork
  Resource:
    name: Resource
    definition_uri: https://tradicional.arq.br/schema/Resource
    description: Digital or documentary resource associated with a Work.
    from_schema: https://tradicional.arq.br/schema/resource
    slots:
    - resource_id
    - resource_author
    - resource_date
    - relation_type
    - preview_image
    - provided_image
    - provided_3d
    - resource_service
    - perspective
    - resource_unit
    - description
    - source
    - bibliographic_citation
    - credit
    - rights
    class_uri: wasth:Resource
  Media:
    name: Media
    definition_uri: https://tradicional.arq.br/schema/Media
    description: "Descri\xE7\xE3o e refer\xEAncia a um \xFAnico arquivo de m\xEDdia."
    from_schema: https://tradicional.arq.br/schema/resource
    slots:
    - format
    - preview_image
    - provided_image
    - provided_3d
    - resource_service
    - measurements
    - media_alt
    - description
    - source
    - bibliographic_citation
    - credit
    - rights
    class_uri: wasth:Media
  TypedReference:
    name: TypedReference
    definition_uri: https://tradicional.arq.br/schema/TypedReference
    description: Reference to a local record, IRI, URI, or LIDO terminology term.
    from_schema: https://tradicional.arq.br/schema/shared
    slots:
    - reference_type
    - term
    - refid
    - bibliographic_citation
    - source
    class_uri: wasth:TypedReference
  Measurements:
    name: Measurements
    definition_uri: https://tradicional.arq.br/schema/Measurements
    description: "O campo `description` permite uma representa\xE7\xE3o textual das\
      \ medidas da\nedifica\xE7\xE3o, caso n\xE3o seja poss\xEDvel cadastrar medidas\
      \ individuais com\nprecis\xE3o, ou seja preciso maior flexibilidade para explicar\
      \ as dimens\xF5es.\n\nO campo `measurements` admite uma lista de medidas com\
      \ os campos\u2009:\n\n* `type` (obrigat\xF3rio) designa a natureza da medida\u2009\
      : largura, altura,\n  \xE1rea, etc. \u2014 usar um dos [tipos de dimens\xF5\
      es](https://www.getty.edu/vow/AATHierarchy?find=&logic=AND&note=&page=1&subjectid=300226820)\n\
      \  do Art and Architecture Thesaurus do Instituto Getty (AAT)\u2009;\n* `value`\
      \ (obrigat\xF3rio) valor num\xE9rico, usar ponto como separador decimal\u2009\
      ;\n* `unit` (obrigat\xF3rio) uma `uri` remetendo a uma unidade na\n  [hierarquia\
      \ de unidades de medida](https://www.getty.edu/vow/AATHierarchy?find=&logic=AND&note=&page=1&subjectid=300379096)\n\
      \  do AAT, ou do nosso pr\xF3prio [vocabul\xE1rio controlado]\u2009;\n* `extent`\
      \ (opcional) indica a parte do objeto que est\xE1 sendo medida \u2014 por\n\
      \  exemplo, se a altura \xE9 at\xE9 a linha de coroamento ou at\xE9 a cumeeira,\
      \ etc. \u2014\n  usar a `uri` de um vocabul\xE1rio controlado\u2009;\n* `qualifier`\
      \ (opcional) indica que as medidas s\xE3o aproximadas\u2009: usar um\n  [qualificador\
      \ do AAT](https://www.getty.edu/vow/AATHierarchy?find=&logic=&note=&page=1&subjectid=300435720)\u2009\
      ;\n* `shape` (opcional) caso relevante, indicar a forma do elemento medido\n\
      \  usando a [lista de formas do AAT](https://www.getty.edu/vow/AATHierarchy?find=&logic=AND&note=&page=1&subjectid=300056273)\u2009\
      ;\n"
    from_schema: https://tradicional.arq.br/schema/shared
    slots:
    - description
    - format_extent
    - bibliographic_citation
    - measurements__type
    - measurements__value
    - measurements__unit
    - measurements__qualifier
    - measurements__shape
    - measurements__scale
    attributes:
      type:
        name: type
        ifabsent: MeasurementType(proper)
        range: MeasurementType
      value:
        name: value
        alias: value
        range: float
        required: true
        minimum_value: 0
      unit:
        name: unit
        alias: unit
        range: TypedReference
        required: true
        inlined: true
      qualifier:
        name: qualifier
        alias: qualifier
        range: string
      shape:
        name: shape
        alias: shape
        range: string
      scale:
        name: scale
        alias: scale
        range: float
        minimum_value: 0
    class_uri: wasth:Measurements
  MaterialTech:
    name: MaterialTech
    definition_uri: https://tradicional.arq.br/schema/MaterialTech
    description: "Usar discernimento para identificar sistemas, materiais e t\xE9\
      cnicas que\ninteressam ao conhecimento da edifica\xE7\xE3o no seu conjunto,\
      \ n\xE3o a partes\nmenos extensas ou pouco importantes.\n"
    from_schema: https://tradicional.arq.br/schema/shared
    is_a: ConceptReference
    slots:
    - description
    - name
    - bibliographic_citation
    - materialTech__material_tech_type
    attributes:
      material_tech_type:
        name: material_tech_type
        alias: type
        range: MaterialTechType
        required: true
    class_uri: wasth:MaterialTech
  Right:
    name: Right
    definition_uri: https://tradicional.arq.br/schema/Right
    description: Rights statement associated with a record, resource, or note.
    from_schema: https://tradicional.arq.br/schema/shared
    slots:
    - right_concept
    - right_type
    - right_temporal
    - right_holder
    class_uri: wasth:Right
  LegalBody:
    name: LegalBody
    definition_uri: https://tradicional.arq.br/schema/LegalBody
    description: Personal, corporate, family, or other responsible body.
    from_schema: https://tradicional.arq.br/schema/shared
    slots:
    - legal_body_type
    - legal_body_name
    class_uri: wasth:LegalBody
  Header:
    name: Header
    definition_uri: https://tradicional.arq.br/schema/Header
    description: Presentation metadata for the WASTH interface.
    from_schema: https://tradicional.arq.br/schema/shared
    slots:
    - teaser
    - overlay_image
    - caption
    class_uri: wasth:Header
  SpatialCoverage:
    name: SpatialCoverage
    definition_uri: https://tradicional.arq.br/schema/SpatialCoverage
    description: Current, former, intended, and other spatial associations.
    from_schema: https://tradicional.arq.br/schema/spatial
    slots:
    - site
    - former_site
    - intended_site
    - other_site
    class_uri: wasth:SpatialCoverage
  Site:
    name: Site
    definition_uri: https://tradicional.arq.br/schema/Site
    description: A place associated with a Work.
    from_schema: https://tradicional.arq.br/schema/spatial
    slots:
    - description
    - site_name
    - location
    - extent
    - source
    - bibliographic_citation
    - zoom
    class_uri: wasth:Site
  GeographicPoint:
    name: GeographicPoint
    definition_uri: https://tradicional.arq.br/schema/GeographicPoint
    description: WGS84 geographic point.
    from_schema: https://tradicional.arq.br/schema/spatial
    slots:
    - lat
    - lon
    - alt
    - srs_name
    - source
    class_uri: wasth:GeographicPoint
  GeographicExtent:
    name: GeographicExtent
    definition_uri: https://tradicional.arq.br/schema/GeographicExtent
    description: Geographic geometry, normally exported as GeoJSON.
    from_schema: https://tradicional.arq.br/schema/spatial
    slots:
    - geometry_type
    - coordinates
    - srs_name
    - source
    class_uri: wasth:GeographicExtent
  HistoricPlace:
    name: HistoricPlace
    definition_uri: https://tradicional.arq.br/schema/HistoricPlace
    description: Historical geographic or administrative context.
    from_schema: https://tradicional.arq.br/schema/spatial
    slots:
    - historic_place_type
    - historic_place_name
    class_uri: wasth:HistoricPlace
  Event:
    name: Event
    definition_uri: https://tradicional.arq.br/schema/Event
    description: "This class comprises distinct, delimited and coherent processes\
      \ and\ninteractions of a material nature, in cultural, social or physical\n\
      systems, involving and affecting instances of E77 Persistent Item in a\nway\
      \ characteristic of the kind of process. Typical examples are meetings,\nbirths,\
      \ deaths, actions of decision taking, making or inventing things,\nbut also\
      \ more complex and extended ones such as conferences, elections,\nbuilding of\
      \ a castle, or battles.\n\nWhile the continuous growth of a tree lacks the limits\
      \ characteristic of\nan event, its germination from a seed does qualify as an\
      \ event.\nSimilarly, the blowing of the wind lacks the distinctness and limits\
      \ of\nan event, but a hurricane, flood or earthquake would qualify as an event.\n\
      Mental processes are considered as events, in cases where they are\nconnected\
      \ with the material externalization of their results; for\nexample, the creation\
      \ of a poem, a performance or a change of intention\nthat becomes obvious from\
      \ subsequent actions or declarations.\n\nThe effects of an instance of E5 Event\
      \ may not lead to relevant permanent\nchanges of properties or relations of\
      \ the items involved in it, for\nexample an unrecorded performance. Of course,\
      \ in order to be documented,\nsome kind of evidence for an event must exist,\
      \ be it witnesses, traces or\nproducts of the event.\n\nWhile instances of E4\
      \ Period always require some form of coherence\nbetween its constituent phenomena,\
      \ in addition, the essential\nconstituents of instances of E5 Event should contribute\
      \ to an overall\neffect; for example, the statements made during a meeting and\
      \ the\nlistening of the audience.\n\nViewed at a coarse level of detail, an\
      \ instance of E5 Event may appear as\nif it had an \u2018instantaneous\u2019\
      \ overall effect, but any process or\ninteraction of material nature in reality\
      \ have an extent in time and\nspace. At a fine level, instances of E5 Event\
      \ may be analysed into\ncomponent phenomena and phases within a space and timeframe,\
      \ and as such\ncan be seen as a period, regardless of the size of the phenomena.\
      \ The\nreverse is not necessarily the case: not all instances of E4 Period give\n\
      rise to a noteworthy overall effect and are thus not instances of E5\nEvent.\n"
    from_schema: https://tradicional.arq.br/schema/temporal
    is_a: Thing
    slots:
    - Thing_description
    - record_rights
    - alt_name
    - bibliographic_citation
    - identifiers
    - tags
    - temporal
    - repository
    - collection
    - content
    - thing__id
    - thing__author
    - thing__record_date
    - thing__title
    - thing__title_source
    - thing__category
    - measurements
    - material
    - technique
    - media
    - event__type
    - event__actor_role
    - event__event_date
    - event__start_date
    - event__end_date
    - event__style_period
    - event__culture
    - event__place
    - event__method
    - event__things_present
    - event__related_events
    attributes:
      type:
        name: type
        range: EventType
        required: true
      actor_role:
        name: actor_role
        range: Actor
        multivalued: true
        inlined_as_list: true
      event_date:
        name: event_date
        range: EventDate
        required: true
        inlined: true
      start_date:
        name: start_date
        alias: start_date
        range: EventDate
        inlined: true
      end_date:
        name: end_date
        alias: end_date
        range: EventDate
        inlined: true
      style_period:
        name: style_period
        description: 'An index element for the period in which the event happened,

          comprising information about geologic time scale, archaelogical,

          historical, or artistic period, style, or art movement, whose

          characteristics are represented by the object or work.


          Note that "Period/Style" corresponds to "Style" in CDWA as shorthand

          for [Style/Period/Group/Movement/Dynasty](https://www.getty.edu/research/publications/electronic_publications/cdwa/17styles.html).


          Examples may be Neolithic for a period, Impressionist for a style, or

          Cubism for a movement.

          '
        range: StylePeriod
        multivalued: true
        inlined_as_list: true
      culture:
        name: culture
        description: An index element for the cultural context from which the object/work
          in focus originated. Used if the creator or producer is unknown, or if the
          cultural context is of particular interest. Examples may include the name
          of a culture, a nation, or an ethnic group.
        range: TypedReference
        multivalued: true
        inlined_as_list: true
      place:
        name: place
        description: A set of structured information indicating the place or location
          where an object/work was associated with a particular event.
        range: EventPlace
        inlined: true
      method:
        name: method
        description: An index element for the method by which the event is or was
          carried out. Examples may include an acquisition method or a field collection
          method.
        range: ConceptReference
        multivalued: true
        inlined_as_list: true
      things_present:
        name: things_present
        description: A set of structured information for a related object or work
          that is or was present at the event in focus. Repeated if there are multiple
          related objects or works.
        range: RelatedWork
        multivalued: true
      related_events:
        name: related_events
        description: A set of structured information about an event related to the
          event in focus, indicating the type of relationship where applicable.
        range: RelatedEvent
        multivalued: true
    class_uri: wasth:Event
  Actor:
    name: Actor
    definition_uri: https://tradicional.arq.br/schema/Actor
    description: Agent and role in an event.
    from_schema: https://tradicional.arq.br/schema/temporal
    slots:
    - bibliographic_citation
    - actor__actor_type
    - actor__actor_name
    - actor__role_in_event
    - actor__actor_qualifier
    - actor__actor_extent
    attributes:
      actor_type:
        name: actor_type
        ifabsent: AgentType(personal)
        alias: type
        range: AgentType
      actor_name:
        name: actor_name
        alias: name
        range: TypedReference
        inlined: true
      role_in_event:
        name: role_in_event
        range: RoleType
      actor_qualifier:
        name: actor_qualifier
        description: 'For the Attribution Qualifier Actor element choose a concept
          URI from

          the [attribution qualifiers hierarchy](http://vocab.getty.edu/hier/aat/300404264)

          of the Art & Architecture Thesaurus, or another linked open

          vocabulary.

          '
        alias: qualifier
        range: TypedReference
        multivalued: true
        inlined_as_list: true
      actor_extent:
        name: actor_extent
        alias: extent
        range: TypedReference
        multivalued: true
        inlined_as_list: true
    class_uri: wasth:Actor
  EventDate:
    name: EventDate
    definition_uri: https://tradicional.arq.br/schema/EventDate
    description: 'A wrapper for the expression of a date by providing a set of years
      as

      earliest and latest date delimiting the respective span of time, usually

      given in the proleptic Gregorian calendar.


      If it is an exact date, possibly with time, repeat the same date (and

      time) in Earliest Date and Latest Date elements.

      '
    from_schema: https://tradicional.arq.br/schema/temporal
    slots:
    - description
    - eventDate__earliest_date
    - eventDate__latest_date
    attributes:
      earliest_date:
        name: earliest_date
        range: DateRange
      latest_date:
        name: latest_date
        range: DateRange
    class_uri: wasth:EventDate
  DateRange:
    name: DateRange
    definition_uri: https://tradicional.arq.br/schema/DateRange
    from_schema: https://tradicional.arq.br/schema/temporal
    slots:
    - dateRange__date_type
    - dateRange__date_value
    attributes:
      date_type:
        name: date_type
        alias: type
        range: DateQualifier
        required: true
      date_value:
        name: date_value
        range: date
    class_uri: wasth:DateRange
  StylePeriod:
    name: StylePeriod
    definition_uri: https://tradicional.arq.br/schema/StylePeriod
    from_schema: https://tradicional.arq.br/schema/temporal
    is_a: ConceptReference
    slots:
    - description
    - name
    - bibliographic_citation
    - stylePeriod__type
    attributes:
      type:
        name: type
        ifabsent: PeriodNameType(lido:lido00731)
        range: PeriodNameType
    class_uri: wasth:StylePeriod
  EventPlace:
    name: EventPlace
    definition_uri: https://tradicional.arq.br/schema/EventPlace
    from_schema: https://tradicional.arq.br/schema/temporal
    slots:
    - description
    - eventPlace__type
    - eventPlace__places
    attributes:
      type:
        name: type
        range: EventPlaceType
      places:
        name: places
        alias: places
        range: Site
        multivalued: true
        inlined_as_list: true
    class_uri: wasth:EventPlace
  RelatedEvent:
    name: RelatedEvent
    definition_uri: https://tradicional.arq.br/schema/RelatedEvent
    from_schema: https://tradicional.arq.br/schema/temporal
    slots:
    - description
    - relatedEvent__name
    attributes:
      name:
        name: name
        symmetric: true
        range: Event
        required: true
        multivalued: true
        inlined: false
    class_uri: wasth:RelatedEvent
  Thing:
    name: Thing
    definition_uri: https://tradicional.arq.br/schema/Thing
    description: 'This class comprises all things in the universe of discourse of
      the CIDOC

      Conceptual Reference Model.


      It is an abstract concept providing for three general properties:


      - Identification by name or appellation, and in particular by a preferred

      identifier


      - Classification by type, allowing further refinement of the specific

      subclass to which an instance belongs


      - Attachment of free text and other unstructured data for the expression

      of anything not captured by formal properties


      All other classes within the CIDOC CRM are directly or indirectly

      specialisations of E1 CRM Entity.

      '
    from_schema: https://tradicional.arq.br/schema/thing
    abstract: true
    slots:
    - Thing_description
    - record_rights
    - title_type
    - alt_name
    - bibliographic_citation
    - identifiers
    - tags
    - temporal
    - repository
    - collection
    - content
    - thing__id
    - thing__author
    - thing__record_date
    - thing__title
    - thing__title_source
    - thing__category
    slot_usage:
      description:
        name: description
        required: true
    attributes:
      id:
        name: id
        description: Unique identifier for this object.
        slot_uri: dcterms:identifier
        identifier: true
        range: uriorcurie
      author:
        name: author
        description: ORCID iD of the record author or maintainer.
        slot_uri: dcterms:creator
        range: OrcidId
      record_date:
        name: record_date
        description: Date the record was created or last substantively revised.
        slot_uri: dcterms:created
        range: date
      title:
        name: title
        description: The preferred human-readable label for a Thing.
        slot_uri: dcterms:title
        range: string
        required: true
      title_source:
        name: title_source
        description: "\U0001F4DA A fonte do t\xEDtulo title_source \xE9 opcional ;\
          \ um t\xEDtulo pode ser atestado em mais de uma fonte, por isso este campo\
          \ \xE9 uma lista de itens (cada item come\xE7a com um h\xEDfen).\nSe a fonte\
          \ for cadastrada, o campo `refid` deve conter a chave de cita\xE7\xE3o (citation\
          \ key) que consta do registro bibliogr\xE1fico na biblioteca do nosso projeto\
          \ de pesquisa no Zotero. Em geral, a chave de cita\xE7\xE3o \xE9 o DOI ou\
          \ ISBN da publica\xE7\xE3o, mas pode ser diferente.\nSe necess\xE1rio, incluir\
          \ no campo note uma especifica\xE7\xE3o adicional, como o n\xFAmero da p\xE1\
          gina da refer\xEAncia bibliogr\xE1fica de onde a informa\xE7\xE3o foi extra\xED\
          da.\nTodos os campos source no restante da ficha devem ser preenchidos do\
          \ mesmo modo. (Equivalente DublinCore: bibliographiCitation)."
        range: BibliographicCitation
        multivalued: true
        inlined_as_list: true
      category:
        name: category
        description: 'The LIDO Category Vocabulary is a structured controlled list
          of terms recommended to use as values in the LIDO Category element.

          Examples are human-made object or natural object.'
        slot_uri: lido:lidoCategory
        ifabsent: string(lido:lido00096)
        designates_type: true
        range: uriorcurie
    class_uri: wasth:Thing
  Appellation:
    name: Appellation
    definition_uri: https://tradicional.arq.br/schema/Appellation
    from_schema: https://tradicional.arq.br/schema/thing
    slots:
    - description
    - title_type
    - bibliographic_citation
    - appellation__title_preference
    attributes:
      title_preference:
        name: title_preference
        description: "Indica se o nome em quest\xE3o deve ser oculto ou n\xE3o, se\
          \ \xE9 uma vers\xE3o alternativa ou uma variante de grafia, etc."
        ifabsent: string(alternative)
        alias: label_type
        range: LabelType
    class_uri: wasth:Appellation
  Repository:
    name: Repository
    definition_uri: https://tradicional.arq.br/schema/Repository
    description: "Entidade com exist\xEAncia jur\xEDdica e espacial."
    from_schema: https://tradicional.arq.br/schema/thing
    is_a: Thing
    slots:
    - Thing_description
    - record_rights
    - title_type
    - alt_name
    - bibliographic_citation
    - identifiers
    - tags
    - temporal
    - repository
    - collection
    - content
    - thing__id
    - thing__author
    - thing__record_date
    - thing__title
    - thing__title_source
    - thing__category
    - spatial
    - legal_body
    class_uri: wasth:Repository
  Work:
    name: Work
    definition_uri: https://tradicional.arq.br/schema/Work
    description: "CIDOC\u2013CRM E22 HUMAN-MADE OBJECT\n\nThis class comprises all\
      \ persistent physical objects of any size that are\npurposely created by human\
      \ activity and have physical boundaries that\nseparate them completely in an\
      \ objective way from other objects.\n\nThe class also includes all aggregates\
      \ of objects made for functional\npurposes of whatever kind, independent of\
      \ physical coherence, such as a\nset of chessmen.\n\nNos Document\xE1rios da\
      \ Arquitetura Tradicional, esta ficha pode ser usada\npara cadastrar uma edifica\xE7\
      \xE3o, um conjunto arquitet\xF4nico, ou ainda\numa parte significativa de uma\
      \ edifica\xE7\xE3o.\n"
    from_schema: https://tradicional.arq.br/schema/work
    is_a: Thing
    slots:
    - Thing_description
    - record_rights
    - title_type
    - alt_name
    - bibliographic_citation
    - identifiers
    - tags
    - temporal
    - content
    - thing__record_date
    - thing__title
    - thing__title_source
    - spatial
    - location_historic
    - measurements
    - material
    - technique
    - repository
    - subject
    - related_work
    - resource
    - media
    - work__work_type_condition
    - work__work_type_form
    - work__work_type_function
    - work__work_type_context
    - work__work_type_material_tech
    - work__work_type_subject_type
    - work__work_type_use
    - work__class_genre
    - work__class_subject
    - work__class_local
    - work__class_special
    - work__inscriptions
    - work__collection
    - work__work_rights
    - Work_id
    - Work_author
    - Work_category
    - Work_relation
    slot_usage:
      id:
        name: id
        description: "Cada edifica\xE7\xE3o ter\xE1 um identificador gerado a partir\
          \ do seu georreferenciamento usando Open Location Code (\"PlusCode\"). Este\
          \ identificador usa o campo `id`, que ser\xE1 gerado automaticamente pelo\
          \ programa WASTH."
        is_a: thing__id
        range: OlcPlusCode11
      author:
        name: author
        is_a: thing__author
        required: true
      category:
        name: category
        is_a: thing__category
        ifabsent: string(http://terminology.lido-schema.org/lido00096)
      relation:
        name: relation
        from_schema: https://tradicional.arq.br/schema
        mappings: *id001
        slot_uri: lido:relatedWorkSet
        range: RelatedWork
        inlined: true
        inlined_as_list: true
    attributes:
      work_type_condition:
        name: work_type_condition
        description: "Descriptors for objects that are distinguishable by their overall\
          \ state such as appearance, level of damage, completeness, or quality. If\
          \ an object is identified by its prevailing physical state, then it is qualified\
          \ by condition.\nBased on [AAT \"conditions\"](http://vocab.getty.edu/page/aat/300389724)\
          \ and [CIDOC CRM \"E3 Condition State\"](http://cidoc-crm.org/html/cidoc_crm_v7.1.1_with_translations.html#E3)\n\
          Atende aos campos do [SICG](https://sicg.iphan.gov.br/sicg/manual/manual.htmlhttps://sicg.iphan.gov.br/sicg/manual/manual.html)\
          \ \"estado de preserva\xE7\xE3o\" e \"estado de conserva\xE7\xE3o\"."
        slot_uri: lido:lido00937
        range: ConceptReference
        recommended: true
        multivalued: true
        inlined_as_list: false
      work_type_form:
        name: work_type_form
        description: "Descriptors for objects that are distinguishable by their physical\
          \ form or by the manner in which they are presented. If an object is identified\
          \ by sight, then it is qualified by form.\nBased on [AAT Guidelines \"Types\
          \ of Guide Terms\"](https://www.getty.edu/research/tools/vocabularies/guidelines/aat_3_1_hierarchical_rels.html)\n\
          Nos Document\xE1rios da Arquitetura Tradicional, designa uma tipologia formal."
        slot_uri: lido:lido00766
        range: ConceptReference
        recommended: true
        multivalued: true
        inlined_as_list: false
      work_type_function:
        name: work_type_function
        description: "Objects that are distinguishable by the particular purpose for\
          \ which they are designed or used. If an object is identifiable by its intended\
          \ use, then it is qualified by function.\nBased on [AAT Guidelines \"Types\
          \ of Guide Terms\"](https://www.getty.edu/research/tools/vocabularies/guidelines/aat_3_1_hierarchical_rels.html)\n\
          Nos Document\xE1rios da Arquitetura Tradicional, designa um dos sete tipos\
          \ de prop\xF3sitos concebidos por C. William Westfall e Samir Youn\xE9s\
          \ em *Architectural Type and Character*."
        slot_uri: lido:lido00767
        range: ConceptReference
        recommended: true
        multivalued: true
        inlined_as_list: false
      work_type_context:
        name: work_type_context
        description: "Descriptors for objects that are distinguishable by their use\
          \ or application within a particular physical location. If an object is\
          \ identifiable by association with specific surroundings, it is qualified\
          \ by location or context.\nBased on [AAT Guidelines \"Types of Guide Terms\"\
          ](https://www.getty.edu/research/tools/vocabularies/guidelines/aat_3_1_hierarchical_rels.html)\n\
          Nos Document\xE1rios da Arquitetura Tradicional, designa a situa\xE7\xE3\
          o de implanta\xE7\xE3o da edifica\xE7\xE3o, por exemplo se est\xE1 em contexto\
          \ urbano ou rural, isolada ou em correnteza..."
        slot_uri: lido:lido00934
        range: ConceptReference
        recommended: true
        multivalued: true
        inlined_as_list: false
      work_type_material_tech:
        name: work_type_material_tech
        description: "Descriptors for objects that are distinguishable by their materials\
          \ encorporated, or the techniques used to create the object or work. If\
          \ an object is identified by the substances detected and/or the processes\
          \ employed, then it is qualified by material or technique.\nNos Document\xE1\
          rios da Arquitetura Tradicional, refere-se \xE0 caracteriza\xE7\xE3o construtiva\
          \ geral da edifica\xE7\xE3o."
        slot_uri: lido:lido00789
        range: MaterialTech
        recommended: true
        multivalued: true
        inlined_as_list: false
      work_type_subject_type:
        name: work_type_subject_type
        description: "Descriptors for objects that are distinguishable by their topics,\
          \ themes, or other content of the work. If an object is identified by what\
          \ it is of or about, then it is qualified by subject.\nBased on [AAT \"\
          subjects\"](http://vocab.getty.edu/page/aat/300404126)\nNos Document\xE1\
          rios da Arquitetura Tradicional, \xE9 o \xFAnico bloco opcional desta se\xE7\
          \xE3o\u2009: ele indica, se houver, uma classifica\xE7\xE3o iconogr\xE1\
          fica mais espec\xEDfica do que `form` ou `function`."
        slot_uri: lido:lido00768
        range: ConceptReference
        recommended: true
        multivalued: true
        inlined_as_list: false
      work_type_use:
        name: work_type_use
        description: "Descriptors for objects that are distinguishable by the way\
          \ they are employed, occupied, applied, or function. If an object is identifiable\
          \ by its particular mode of use, it is qualified by use.\nBased on [AAT\
          \ \"use\"](http://vocab.getty.edu/page/aat/300068844)\nNos Document\xE1\
          rios da Arquitetura Tradicional, designa propriamente a(s) classifica\xE7\
          \xE3o(\xF5es) de usos do solo ou atividades predominante(s) na edifica\xE7\
          \xE3o atualmente."
        slot_uri: lido:lido00938
        range: ConceptReference
        recommended: true
        multivalued: true
        inlined_as_list: false
      class_genre:
        name: class_genre
        description: "A broad category for grouping objects on the basis of shared\
          \ intrinsic\ncharacteristics. The relationship between an object/work and\
          \ the object\ngenre is a generic is-a-relation rather than a membership\
          \ based on\nascription to a subject group.\n\nNote that the\n[AAT Object\
          \ Genres](http://vocab.getty.edu/page/aat/300185711) hierarchy\ndiffers\
          \ in its scope from Object genre here in that the AAT includes more\nspecific\
          \ terms grouped by various aspects. In general, AAT descriptors\nare not\
          \ intended to be used as indexing terms for classification.\n\n\u2753 Ainda\
          \ n\xE3o implementamos o bloco `objectClassification` do LIDO.\nTalvez ele\
          \ n\xE3o seja relevante para o document\xE1rio de arquitetura\ndom\xE9stica,\
          \ e n\xE3o \xE9 obrigat\xF3rio no padr\xE3o LIDO nem no perfil de aplica\xE7\
          \xE3o\npara arquitetura.\n"
        slot_uri: lido:lido00853
        range: ConceptReference
        multivalued: true
        inlined_as_list: false
      class_subject:
        name: class_subject
        description: "A broad category for grouping objects or works on the basis\
          \ of a topical association, including thematic or systematic classification,\
          \ or an assignment by discipline. The relationship between an object/work\
          \ and a subject category is a kind of membership based on ascription rather\
          \ than a generic is-a relation.\n\u2753 Ainda n\xE3o implementamos o bloco\
          \ `objectClassification` do LIDO. Talvez ele n\xE3o seja relevante para\
          \ o document\xE1rio de arquitetura dom\xE9stica, e n\xE3o \xE9 obrigat\xF3\
          rio no padr\xE3o LIDO nem no perfil de aplica\xE7\xE3o para arquitetura."
        slot_uri: lido:lido00932
        range: ConceptReference
        multivalued: true
        inlined_as_list: false
      class_local:
        name: class_local
        description: "A classification scheme for grouping objects on the basis of\
          \ locally defined criteria, including categories corresponding to the curatorial\
          \ departments of the repository, such as \"prints and drawings\", \"decorative\
          \ arts\", \"North America\", \"invertebrates\", \"Bronze Age\" or \"textiles\"\
          . [Based on CCO \"Class\"](https://vraweb.org/wp-content/uploads/2020/04/CatalogingCulturalObjectsFullv2.pdf)\n\
          \u2753 Ainda n\xE3o implementamos o bloco `objectClassification` do LIDO.\
          \ Talvez ele n\xE3o seja relevante para o document\xE1rio de arquitetura\
          \ dom\xE9stica, e n\xE3o \xE9 obrigat\xF3rio no padr\xE3o LIDO nem no perfil\
          \ de aplica\xE7\xE3o para arquitetura."
        slot_uri: lido:lido01135
        range: ConceptReference
        multivalued: true
        inlined_as_list: false
      class_special:
        name: class_special
        description: "A classification scheme for grouping objects on the basis of\
          \ criteria defined within specific academic disciplines or cultural domains,\
          \ such as the \"Hornbostel-Sachs Classification of Musical Instruments\"\
          , the \"Nickel-Strunz classification\", biological taxonomies etc. Refers\
          \ to classification schemes that group objects on the basis of object characteristics,\
          \ not on the basis of themes or topics which the objects or works are related\
          \ to.\n\u2753 Ainda n\xE3o implementamos o bloco `objectClassification`\
          \ do LIDO. Talvez ele n\xE3o seja relevante para o document\xE1rio de arquitetura\
          \ dom\xE9stica, e n\xE3o \xE9 obrigat\xF3rio no padr\xE3o LIDO nem no perfil\
          \ de aplica\xE7\xE3o para arquitetura."
        slot_uri: lido:lido01144
        range: ConceptReference
        multivalued: true
        inlined_as_list: false
      inscriptions:
        name: inscriptions
        description: "Marcas, s\xEDmbolos ou textos gravados na edifica\xE7\xE3o,\
          \ especialmente aqueles referentes \xE0 estrutura como um todo e n\xE3o\
          \ espec\xEDficos a alguma de suas partes. N\xE3o usar para iconografia."
        range: Inscription
        multivalued: true
        inlined_as_list: true
      collection:
        name: collection
        slot_uri: lido:collection
        range: Thing
        multivalued: true
        inlined_as_list: false
      work_rights:
        name: work_rights
        slot_uri: lido:rightsWorkSet
        range: Right
        multivalued: true
        inlined_as_list: true
    class_uri: wasth:Work
  Inscription:
    name: Inscription
    definition_uri: https://tradicional.arq.br/schema/Inscription
    description: "A descri\xE7\xE3o da inscri\xE7\xE3o informa local, dimens\xF5es\
      \ e caracter\xEDsticas. Os tipos de descri\xE7\xE3o podem ser extra\xEDdos da\
      \ hierarquia Getty: <http://vocab.getty.edu/page/aat/300220469>.\nOs itens das\
      \ listas de `material` e `technique` DEVEM usar o nosso [vocabul\xE1rio controlado](https://vocabulario.tradicional.arq.br).\n\
      Essa distin\xE7\xE3o \xE9 especialmente relevante no caso de revestimentos,\
      \ como estuques, azulejos ou pinturas decorativas, por oposi\xE7\xE3o \xE0 base\
      \ sobre a qual eles s\xE3o aplicados."
    from_schema: https://tradicional.arq.br/schema/work
    slots:
    - format_extent
    - description
    - content
    - bibliographic_citation
    - inscription__type
    attributes:
      type:
        name: type
        ifabsent: string(text)
        range: InscriptionType
        required: true
    class_uri: wasth:Inscription
  Topic:
    name: Topic
    definition_uri: https://tradicional.arq.br/schema/Topic
    description: Subject or iconographic topic.
    from_schema: https://tradicional.arq.br/schema/work
    slots:
    - description
    - format_extent
    - Topic_concept
    - topic__type
    slot_usage:
      concept:
        name: concept
        required: true
    attributes:
      type:
        name: type
        range: SubjectType
        required: true
    class_uri: wasth:Topic

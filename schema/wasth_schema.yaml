  work__title_type:
    name: work__title_type
    from_schema: https://tradicional.arq.br/schema/work
    slot_uri: wasth:title_type
    alias: title_type
    owner: Work
    domain_of:
    - Work
    range: TitleType
    required: true
  work__work_type_condition:
    name: work__work_type_condition
    description: "Descreve o estado f\xEDsico da edifica\xE7\xE3o quanto \xE0 sua\
      \ apar\xEAncia de completude, deteriora\xE7\xE3o ou capacidade de desempenhar\
      \ sua fun\xE7\xE3o.\nAtende aos campos do [SICG](https://sicg.iphan.gov.br/sicg/manual/manual.html)\
      \ \"estado de preserva\xE7\xE3o\" e \"estado de conserva\xE7\xE3o\".\n---------------------------------------------------------------------\n\
      Descriptors for objects that are distinguishable by their overall state such\
      \ as appearance, level of damage, completeness, or quality. If an object is\
      \ identified by its prevailing physical state, then it is qualified by condition.\n\
      Based on [AAT \"conditions\"](http://vocab.getty.edu/page/aat/300389724) and\
      \ [CIDOC CRM \"E3 Condition State\"](http://cidoc-crm.org/html/cidoc_crm_v7.1.1_with_translations.html#E3)"
    from_schema: https://tradicional.arq.br/schema/work
    mappings:
    - term:lido00937
    slot_uri: term:lido00937
    alias: work_type_condition
    owner: Work
    domain_of:
    - Work
    range: ConceptReference
    recommended: true
    multivalued: true
    inlined: true
    inlined_as_list: true
  work__work_type_form:
    name: work__work_type_form
    description: "Nos Document\xE1rios da Arquitetura Tradicional, designa uma tipologia\
      \ formal.\nO vocabul\xE1rio controlado para este item est\xE1 em processo de\
      \ estrutura\xE7\xE3o.\n---------------------------------------------------------------------\n\
      Descriptors for objects that are distinguishable by their physical form or by\
      \ the manner in which they are presented. If an object is identified by sight,\
      \ then it is qualified by form.\nBased on [AAT Guidelines \"Types of Guide Terms\"\
      ](https://www.getty.edu/research/tools/vocabularies/guidelines/aat_3_1_hierarchical_rels.html)"
    from_schema: https://tradicional.arq.br/schema/work
    mappings:
    - term:lido00766
    slot_uri: term:lido00766
    alias: work_type_form
    owner: Work
    domain_of:
    - Work
    range: ConceptReference
    recommended: true
    multivalued: true
    inlined: true
    inlined_as_list: true
  work__work_type_function:
    name: work__work_type_function
    description: "Nos Document\xE1rios de edifica\xE7\xF5es, designa um dos sete tipos\
      \ de prop\xF3sitos concebidos por C. William Westfall e Samir Youn\xE9s em *Architectural\
      \ Type and Character*.\nNo Document\xE1rio de Lugares, designa o papel administrativo\
      \ da localidade, por exemplo freguesia, sede municipal, capital estadual ou\
      \ nacional.\n---------------------------------------------------------------------\n\
      Objects that are distinguishable by the particular purpose for which they are\
      \ designed or used. If an object is identifiable by its intended use, then it\
      \ is qualified by function.\nBased on [AAT Guidelines \"Types of Guide Terms\"\
      ](https://www.getty.edu/research/tools/vocabularies/guidelines/aat_3_1_hierarchical_rels.html)"
    from_schema: https://tradicional.arq.br/schema/work
    mappings:
    - term:lido00767
    slot_uri: term:lido00767
    alias: work_type_function
    owner: Work
    domain_of:
    - Work
    range: ConceptReference
    recommended: true
    multivalued: true
    inlined: true
    inlined_as_list: true
  work__work_type_context:
    name: work__work_type_context
    description: "Nos Document\xE1rios de edifica\xE7\xF5es, designa sobretudo o contexto\
      \ imediato de implanta\xE7\xE3o de uma edifica\xE7\xE3o\u2009: urbana, rural,\
      \ isolada, em correnteza, etc.\nNo Document\xE1rio de Lugares Tradicionais,\
      \ designa o tipo de n\xFAcleo populacional\u2009: s\xEDtio isolado, povoa\xE7\
      \xE3o rural, vila ou cidade, por exemplo.\n---------------------------------------------------------------------\n\
      Descriptors for objects that are distinguishable by their use or application\
      \ within a particular physical location. If an object is identifiable by association\
      \ with specific surroundings, it is qualified by location or context.\nBased\
      \ on [AAT Guidelines \"Types of Guide Terms\"](https://www.getty.edu/research/tools/vocabularies/guidelines/aat_3_1_hierarchical_rels.html)"
    from_schema: https://tradicional.arq.br/schema/work
    mappings:
    - term:lido00934
    slot_uri: term:lido00934
    alias: work_type_context
    owner: Work
    domain_of:
    - Work
    range: ConceptReference
    recommended: true
    multivalued: true
    inlined: true
    inlined_as_list: true
  work__work_type_material_tech:
    name: work__work_type_material_tech
    description: "Nos Document\xE1rios da Arquitetura Tradicional, refere-se \xE0\
      \ caracteriza\xE7\xE3o construtiva geral da edifica\xE7\xE3o.\n---------------------------------------------------------------------\n\
      Descriptors for objects that are distinguishable by their materials encorporated,\
      \ or the techniques used to create the object or work. If an object is identified\
      \ by the substances detected and/or the processes employed, then it is qualified\
      \ by material or technique."
    from_schema: https://tradicional.arq.br/schema/work
    mappings:
    - term:lido00789
    slot_uri: term:lido00789
    alias: work_type_material_tech
    owner: Work
    domain_of:
    - Work
    range: MaterialTech
    recommended: true
    multivalued: true
    inlined: true
    inlined_as_list: true
  work__work_type_subject_type:
    name: work__work_type_subject_type
    description: "Nos Document\xE1rios da Arquitetura Tradicional, indica, se houver,\
      \ uma classifica\xE7\xE3o iconogr\xE1fica mais espec\xEDfica do que `form` ou\
      \ `function`.\n---------------------------------------------------------------------\n\
      Descriptors for objects that are distinguishable by their topics, themes, or\
      \ other content of the work. If an object is identified by what it is of or\
      \ about, then it is qualified by subject.\nBased on [AAT \"subjects\"](http://vocab.getty.edu/page/aat/300404126)"
    from_schema: https://tradicional.arq.br/schema/work
    mappings:
    - term:lido00768
    slot_uri: term:lido00768
    alias: work_type_subject_type
    owner: Work
    domain_of:
    - Work
    range: ConceptReference
    recommended: true
    multivalued: true
    inlined: true
    inlined_as_list: true
  work__work_type_use:
    name: work__work_type_use
    description: "Nos Document\xE1rios da Arquitetura Tradicional, designa propriamente\
      \ a(s) classifica\xE7\xE3o(\xF5es) de usos do solo ou atividades predominante(s)\
      \ na edifica\xE7\xE3o atualmente.\n---------------------------------------------------------------------\n\
      Descriptors for objects that are distinguishable by the way they are employed,\
      \ occupied, applied, or function. If an object is identifiable by its particular\
      \ mode of use, it is qualified by use.\nBased on [AAT \"use\"](http://vocab.getty.edu/page/aat/300068844)"
    from_schema: https://tradicional.arq.br/schema/work
    mappings:
    - term:lido00938
    slot_uri: term:lido00938
    alias: work_type_use
    owner: Work
    domain_of:
    - Work
    range: ConceptReference
    recommended: true
    multivalued: true
    inlined: true
    inlined_as_list: true
  work__classification_genre:
    name: work__classification_genre
    description: "\u2753 Ainda n\xE3o implementamos o bloco `objectClassification`\
      \ do LIDO. Talvez ele n\xE3o seja relevante para o document\xE1rio de arquitetura\
      \ dom\xE9stica, e n\xE3o \xE9 obrigat\xF3rio no padr\xE3o LIDO nem no perfil\
      \ de aplica\xE7\xE3o para arquitetura.\n---------------------------------------------------------------------\n\
      A broad category for grouping objects on the basis of shared intrinsic characteristics.\
      \ The relationship between an object/work and the object genre is a generic\
      \ is-a-relation rather than a membership based on ascription to a subject group.\n\
      Note that the [AAT Object Genres](http://vocab.getty.edu/page/aat/300185711)\
      \ hierarchy differs in its scope from Object genre here in that the AAT includes\
      \ more specific terms grouped by various aspects. In general, AAT descriptors\
      \ are not intended to be used as indexing terms for classification.\n"
    from_schema: https://tradicional.arq.br/schema/work
    mappings:
    - term:lido00853
    slot_uri: term:lido00853
    alias: classification_genre
    owner: Work
    domain_of:
    - Work
    range: ConceptReference
    multivalued: true
    inlined: true
    inlined_as_list: true
  work__classification_subject:
    name: work__classification_subject
    description: "\u2753 Ainda n\xE3o implementamos o bloco `objectClassification`\
      \ do LIDO. Talvez ele n\xE3o seja relevante para o document\xE1rio de arquitetura\
      \ dom\xE9stica, e n\xE3o \xE9 obrigat\xF3rio no padr\xE3o LIDO nem no perfil\
      \ de aplica\xE7\xE3o para arquitetura.\n---------------------------------------------------------------------\n\
      A broad category for grouping objects or works on the basis of a topical association,\
      \ including thematic or systematic classification, or an assignment by discipline.\
      \ The relationship between an object/work and a subject category is a kind of\
      \ membership based on ascription rather than a generic is-a relation."
    from_schema: https://tradicional.arq.br/schema/work
    mappings:
    - term:lido00932
    slot_uri: term:lido00932
    alias: classification_subject
    owner: Work
    domain_of:
    - Work
    range: ConceptReference
    multivalued: true
    inlined: true
    inlined_as_list: true
  work__classification_local:
    name: work__classification_local
    description: "\u2753 Ainda n\xE3o implementamos o bloco `objectClassification`\
      \ do LIDO. Talvez ele n\xE3o seja relevante para o document\xE1rio de arquitetura\
      \ dom\xE9stica, e n\xE3o \xE9 obrigat\xF3rio no padr\xE3o LIDO nem no perfil\
      \ de aplica\xE7\xE3o para arquitetura.\n---------------------------------------------------------------------\n\
      A classification scheme for grouping objects on the basis of locally defined\
      \ criteria, including categories corresponding to the curatorial departments\
      \ of the repository, such as \"prints and drawings\", \"decorative arts\", \"\
      North America\", \"invertebrates\", \"Bronze Age\" or \"textiles\". [Based on\
      \ CCO \"Class\"](https://vraweb.org/wp-content/uploads/2020/04/CatalogingCulturalObjectsFullv2.pdf)"
    from_schema: https://tradicional.arq.br/schema/work
    mappings:
    - term:lido01135
    slot_uri: term:lido01135
    alias: classification_local
    owner: Work
    domain_of:
    - Work
    range: ConceptReference
    multivalued: true
    inlined: true
    inlined_as_list: true
  work__classification_special:
    name: work__classification_special
    description: "\u2753 Ainda n\xE3o implementamos o bloco `objectClassification`\
      \ do LIDO. Talvez ele n\xE3o seja relevante para o document\xE1rio de arquitetura\
      \ dom\xE9stica, e n\xE3o \xE9 obrigat\xF3rio no padr\xE3o LIDO nem no perfil\
      \ de aplica\xE7\xE3o para arquitetura.\n---------------------------------------------------------------------\n\
      A classification scheme for grouping objects on the basis of criteria defined\
      \ within specific academic disciplines or cultural domains, such as the \"Hornbostel-Sachs\
      \ Classification of Musical Instruments\", the \"Nickel-Strunz classification\"\
      , biological taxonomies etc. Refers to classification schemes that group objects\
      \ on the basis of object characteristics, not on the basis of themes or topics\
      \ which the objects or works are related to."
    from_schema: https://tradicional.arq.br/schema/work
    mappings:
    - term:lido01144
    slot_uri: term:lido01144
    alias: classification_special
    owner: Work
    domain_of:
    - Work
    range: ConceptReference
    multivalued: true
    inlined: true
    inlined_as_list: true
  work__part_of:
    name: work__part_of
    description: "Permite identificar o contexto geogr\xE1fico ou administrativo ao\
      \ qual a edifica\xE7\xE3o se subordina, ou ainda um conjunto arquitet\xF4nico,\
      \ urban\xEDstico ou conceitual (por exemplo, uma s\xE9rie de casas) do qual\
      \ ela faz parte.\n---------------------------------------------------------------------\n\
      A set of structured information about a place that is the broader context for\
      \ the place in focus, such as the district, state, or nation to which a city\
      \ belongs."
    from_schema: https://tradicional.arq.br/schema/work
    mappings:
    - dcterms:isPartOf
    slot_uri: dcterms:isPartOf
    alias: part_of
    owner: Work
    domain_of:
    - Work
    range: TypedReference
    multivalued: true
    inlined: true
    inlined_as_list: true
  work__former_site:
    name: work__former_site
    description: "Indica que a edifica\xE7\xE3o n\xE3o se encontra mais no local indicado,\
      \ seja porque foi deslocada ou demolida."
    from_schema: https://tradicional.arq.br/schema/work
    slot_uri: wasth:former_site
    alias: former_site
    owner: Work
    domain_of:
    - Work
    range: Site
    multivalued: true
    inlined: true
    inlined_as_list: true
  work__intended_site:
    name: work__intended_site
    description: "Sinaliza que a edifica\xE7\xE3o devia ocupar um certo local, mas\
      \ n\xE3o chegou a ser constru\xEDda."
    from_schema: https://tradicional.arq.br/schema/work
    slot_uri: wasth:intended
    alias: intended
    owner: Work
    domain_of:
    - Work
    range: Site
    multivalued: true
    inlined: true
    inlined_as_list: true
  work__other_site:
    name: work__other_site
    description: "Para casos de implanta\xE7\xE3o n\xE3o contemplados em nenhuma das\
      \ categorias acima."
    from_schema: https://tradicional.arq.br/schema/work
    slot_uri: wasth:other
    alias: other
    owner: Work
    domain_of:
    - Work
    range: Site
    multivalued: true
    inlined: true
    inlined_as_list: true
  work__location_historic:
    name: work__location_historic
    description: "Antigas jurisdi\xE7\xF5es ou designa\xE7\xF5es para o lugar onde\
      \ o objeto se encontra. Para um s\xEDtio de onde o objeto foi fisicamente removido,\
      \ usar a lista `former_site`."
    from_schema: https://tradicional.arq.br/schema/work
    slot_uri: wasth:location_historic
    alias: location_historic
    owner: Work
    domain_of:
    - Work
    range: LocationHistoric
    multivalued: true
    inlined: true
    inlined_as_list: true
  work__inscriptions:
    name: work__inscriptions
    description: "Marcas, s\xEDmbolos ou textos gravados na edifica\xE7\xE3o, especialmente\
      \ aqueles referentes \xE0 estrutura como um todo e n\xE3o espec\xEDficos a alguma\
      \ de suas partes. N\xE3o usar para iconografia."
    from_schema: https://tradicional.arq.br/schema/work
    slot_uri: wasth:inscriptions
    alias: inscriptions
    owner: Work
    domain_of:
    - Work
    range: Inscription
    multivalued: true
    inlined: true
    inlined_as_list: true
  work__collection:
    name: work__collection
    description: "Descreve conjuntos conceituais nos quais a edifica\xE7\xE3o foi\
      \ inclu\xEDda, por exemplo cat\xE1logos raisonn\xE9s, obras de refer\xEAncia,\
      \ exposi\xE7\xF5es, ou agrupamentos *ad-hoc* para formar cole\xE7\xF5es tem\xE1\
      ticas de acordo com as necessidades do projeto de investiga\xE7\xE3o.\nPara\
      \ o pertencimento a per\xEDmetros de s\xEDtios hist\xF3ricos tombados/classificados,\
      \ preencher o grupo `identifiers`. Para a identifica\xE7\xE3o de propriet\xE1\
      rios ou respons\xE1veis, preencher o grupo `work_rights`.\n"
    notes:
    - 'A set of identifying and indexing information about the collection the object/work
      in focus is gathered into or is a member of.

      Collection applies to any accumulated group of physical or digital items, conceptually
      or physically brought together on the basis of a focal characteristic. Use cases
      for grouping items into a collection are various and may span curated holdings
      in museums, departmental collections, sets of items to be displayed in an exhibition,
      or aggregations bound informally for cataloging and retrieval purposes.'
    from_schema: https://tradicional.arq.br/schema/work
    mappings:
    - lido:collection
    slot_uri: lido:collection
    alias: collection
    owner: Work
    domain_of:
    - Work
    range: Thing
    multivalued: true
    inlined: true
    inlined_as_list: true
  work__work_rights:
    name: work__work_rights
    description: "\u26A0\uFE0F  Este bloco se refere a eventuais direitos autorais\
      \ ou de propriedade sobre A EDIFICA\xC7\xC3O E O SEU PROJETO, n\xE3o sobre o\
      \ conte\xFAdo da ficha, nem sobre a iconografia relacionada.\n"
    from_schema: https://tradicional.arq.br/schema/work
    mappings:
    - lido:rightsWorkSet
    slot_uri: lido:rightsWorkSet
    alias: work_rights
    owner: Work
    domain_of:

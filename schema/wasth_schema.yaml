title: wasth_schema
see_also:
- https://tradicional.arq.br/schema
id: https://tradicional.arq.br/schema
imports:
- linkml:types
- classes/concept
- classes/place
- classes/resource
- classes/shared
- classes/spatial
- classes/temporal
- classes/thing
- classes/work
license: MIT

types:
  CslCitekey:
    name: CslCitekey
    definition_uri: https://tradicional.arq.br/schema/CslCitekey
    description: "Chave de cita\xE7\xE3o compat\xEDvel com o Citation Style Language,\
      \ come\xE7ando com '@'. Obter as chaves de cita\xE7\xE3o das refer\xEAncias\
      \ bibliogr\xE1ficas consultando a nossa biblioteca compartilhada no Zotero.\n"
    from_schema: https://tradicional.arq.br/schema
    base: str
    uri: xsd:string
    pattern: ^@[a-zA-Z0-9_][\w:.#$%&\-+?<>~/]*$
  GeoJSONCoordinateArray:
    name: GeoJSONCoordinateArray
    definition_uri: https://tradicional.arq.br/schema/GeoJSONCoordinateArray
    description: JSON array of GeoJSON positions. The valid nesting depends on the
      associated geometry type.
    from_schema: https://tradicional.arq.br/schema
    base: str
    uri: xsd:string
  Latitude:
    name: Latitude
    definition_uri: https://tradicional.arq.br/schema/Latitude
    description: 'Latitude em graus decimais (separador: ponto).'
    from_schema: https://tradicional.arq.br/schema
    base: float
    uri: xsd:double
    minimum_value: -90
    maximum_value: 90
  Longitude:
    name: Longitude
    definition_uri: https://tradicional.arq.br/schema/Longitude
    description: 'Longitude em graus decimais (separador: ponto).'
    from_schema: https://tradicional.arq.br/schema
    base: float
    uri: xsd:double
    minimum_value: -180
    maximum_value: 180
  OrcidId:
    name: OrcidId
    definition_uri: https://tradicional.arq.br/schema/OrcidId
    description: ORCID iD, sem o prefixo https://orcid.org/.
    from_schema: https://tradicional.arq.br/schema
    base: str
    uri: xsd:string
    pattern: ^[0-9]{4}-[0-9]{4}-[0-9]{4}-[0-9]{3}[0-9X]$
  OlcPlusCode11:
    name: OlcPlusCode11
    definition_uri: https://tradicional.arq.br/schema/OlcPlusCode11
    description: "Open Location Code (Plus Code) com resolu\xE7\xE3o de 11 d\xEDgitos."
    from_schema: https://tradicional.arq.br/schema
    base: str
    uri: xsd:string
    pattern: ^([2-9CFGHJMPQRVWX]{8})\+([2-9CFGHJMPQRVWX]{3})$
  GeonamesId:
    name: GeonamesId
    definition_uri: https://tradicional.arq.br/schema/GeonamesId
    description: Identificador de lugar no GeoNames, na forma de um CURIE `geonames:1234`.
    from_schema: https://tradicional.arq.br/schema
    base: str
    uri: xsd:anyURI
    repr: str
    pattern: ^geonames:[0-9]+$
  string:
    name: string
    definition_uri: https://w3id.org/linkml/String
    description: A character string
    notes:
    - In RDF serializations, a slot with range of string is treated as a literal or
      type xsd:string. If you are authoring schemas in LinkML YAML, the type is referenced
      with the lower case "string".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Text
    base: str
    uri: xsd:string
  integer:
    name: integer
    definition_uri: https://w3id.org/linkml/Integer
    description: An integer
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "integer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Integer
    base: int
    uri: xsd:integer
  boolean:
    name: boolean
    definition_uri: https://w3id.org/linkml/Boolean
    description: A binary (true or false) value
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "boolean".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Boolean
    base: Bool
    uri: xsd:boolean
    repr: bool
  float:
    name: float
    definition_uri: https://w3id.org/linkml/Float
    description: A real number that conforms to the xsd:float specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "float".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Float
    base: float
    uri: xsd:float
  double:
    name: double
    definition_uri: https://w3id.org/linkml/Double
    description: A real number that conforms to the xsd:double specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "double".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:Float
    base: float
    uri: xsd:double
  decimal:
    name: decimal
    definition_uri: https://w3id.org/linkml/Decimal
    description: A real number with arbitrary precision that conforms to the xsd:decimal
      specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "decimal".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    broad_mappings:
    - schema:Number
    base: Decimal
    uri: xsd:decimal
  time:
    name: time
    definition_uri: https://w3id.org/linkml/Time
    description: A time object represents a (local) time of day, independent of any
      particular day
    notes:
    - URI is dateTime because OWL reasoners do not work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "time".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Time
    base: XSDTime
    uri: xsd:time
    repr: str
  date:
    name: date
    definition_uri: https://w3id.org/linkml/Date
    description: a date (year, month and day) in an idealized calendar
    notes:
    - URI is dateTime because OWL reasoners don't work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Date
    base: XSDDate
    uri: xsd:date
    repr: str
  datetime:
    name: datetime
    definition_uri: https://w3id.org/linkml/Datetime
    description: The combination of a date and time
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:DateTime
    base: XSDDateTime
    uri: xsd:dateTime
    repr: str
  date_or_datetime:
    name: date_or_datetime
    definition_uri: https://w3id.org/linkml/DateOrDatetime
    description: Either a date or a datetime
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date_or_datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: linkml:DateOrDatetime
    repr: str
  uriorcurie:
    name: uriorcurie
    definition_uri: https://w3id.org/linkml/Uriorcurie
    description: a URI or a CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uriorcurie".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: URIorCURIE
    uri: xsd:anyURI
    repr: str
  curie:
    name: curie
    definition_uri: https://w3id.org/linkml/Curie
    conforms_to: https://www.w3.org/TR/curie/
    description: a compact URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "curie".
    comments:
    - in RDF serializations this MUST be expanded to a URI
    - in non-RDF serializations MAY be serialized as the compact representation
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: Curie
    uri: xsd:string
    repr: str
  uri:
    name: uri
    definition_uri: https://w3id.org/linkml/Uri
    conforms_to: https://www.ietf.org/rfc/rfc3987.txt
    description: a complete URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uri".
    comments:
    - in RDF serializations a slot with range of uri is treated as a literal or type
      xsd:anyURI unless it is an identifier or a reference to an identifier, in which
      case it is translated directly to a node
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:URL
    base: URI
    uri: xsd:anyURI
    repr: str
  ncname:
    name: ncname
    definition_uri: https://w3id.org/linkml/Ncname
    description: Prefix part of CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "ncname".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NCName
    uri: xsd:string
    repr: str
  objectidentifier:
    name: objectidentifier
    definition_uri: https://w3id.org/linkml/Objectidentifier
    description: A URI or CURIE that represents an object in the model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "objectidentifier".
    comments:
    - Used for inheritance and type checking
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: ElementIdentifier
    uri: shex:iri
    repr: str
  nodeidentifier:
    name: nodeidentifier
    definition_uri: https://w3id.org/linkml/Nodeidentifier
    description: A URI, CURIE or BNODE that represents a node in a model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "nodeidentifier".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NodeIdentifier
    uri: shex:nonLiteral
    repr: str
  jsonpointer:
    name: jsonpointer
    definition_uri: https://w3id.org/linkml/Jsonpointer
    conforms_to: https://datatracker.ietf.org/doc/html/rfc6901
    description: A string encoding a JSON Pointer. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to a valid object within the current
      instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpointer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  jsonpath:
    name: jsonpath
    definition_uri: https://w3id.org/linkml/Jsonpath
    conforms_to: https://www.ietf.org/archive/id/draft-goessner-dispatch-jsonpath-00.html
    description: A string encoding a JSON Path. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to zero or more valid objects within
      the current instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  sparqlpath:
    name: sparqlpath
    definition_uri: https://w3id.org/linkml/Sparqlpath
    conforms_to: https://www.w3.org/TR/sparql11-query/#propertypaths
    description: A string encoding a SPARQL Property Path. The value of the string
      MUST conform to SPARQL syntax and SHOULD dereference to zero or more valid objects
      within the current instance document when encoded as RDF.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "sparqlpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
enums:
  AgentType:
    name: AgentType
    definition_uri: https://tradicional.arq.br/schema/AgentType
    description: Tipo de agente na terminologia LIDO.
    from_schema: https://tradicional.arq.br/schema
    permissible_values:
      personal:
        text: personal
        meaning: term:lido00163
        title: individual
      corporate:
        text: corporate
        description: "Uma entidade coletiva tal como uma oficina, escola (no sentido\
          \ de um grupo de artistas que partilham um estilo semelhante), empresa,\
          \ corpora\xE7\xE3o de of\xEDcio, grupo \xE9tnico-cultural, ou outra agremia\xE7\
          \xE3o na qual \xE9 imposs\xEDvel ou irrelevante delimitar as contribui\xE7\
          \xF5es individuais.\n"
        meaning: term:lido00413
        title: coletivo
      family:
        text: family
        description: "Coletivo de agentes caracterizado por la\xE7os familiares, incluindo\
          \ parentesco consangu\xEDneo, por matrim\xF4nio, adotivo ou outras rela\xE7\
          \xF5es familiares socialmente sancionadas no seu contexto de origem.\n"
        meaning: term:lido00166
        title: familiar
      other:
        text: other
        meaning: term:lido00165
        title: outro
  CollectionType:
    name: CollectionType
    definition_uri: https://tradicional.arq.br/schema/CollectionType
    description: The LIDO Object Type Vocabulary is a structured controlled list of
      terms recommended to use as values in the LIDO Object Type element, specifying
      the particular kind of object being in some way associated with the object/work
      that is the focus of the record.
    from_schema: https://tradicional.arq.br/schema
    reachable_from:
      source_ontology: http://terminology.lido-schema.org/objectType
      include_self: false
  ConceptType:
    name: ConceptType
    definition_uri: https://tradicional.arq.br/schema/ConceptType
    description: "Tipos de termos de vocabul\xE1rio baseados no Getty AAT.\n"
    from_schema: https://tradicional.arq.br/schema
    permissible_values:
      concept:
        text: concept
        title: conceitos
      hierarchy_name:
        text: hierarchy_name
        title: (nome de hierarquia)
      guide_term:
        text: guide_term
        title: <termo guia>
      facet:
        text: facet
        title: Faceta
  DateType:
    name: DateType
    definition_uri: https://tradicional.arq.br/schema/DateType
    description: "Exatid\xE3o da data conhecida."
    from_schema: https://tradicional.arq.br/schema
    permissible_values:
      exact:
        text: exact
        description: 'Designates a date that is definitely known, based on credible,
          documented fact.

          Note that *exact* does not preclude the granularity of the date expression.

          '
        meaning: term:lido00528
        title: conhecida
      estimated:
        text: estimated
        description: 'Designates a date that is uncertain, estimated broadly using
          available information about the work or the artist. For example, you could
          estimate that the earliest possible date for any work by a given artist
          is eighteen or twenty years after the artist''s birth.

          Included are also dates that are inferred from known dates associated with
          the object. For instance, if the date of production is unknown, but the
          date when the object was found is known, there is evidence that the production
          must have taken place before the finding of the object.

          '
        meaning: term:lido00529
        title: "prov\xE1vel"
  EventType:
    name: EventType
    definition_uri: https://tradicional.arq.br/schema/EventType
    description: "O tipo de incid\xEAncia sobre a edifica\xE7\xE3o que o evento descreve.\
      \ Usa a terminologia do LIDO em <http://terminology.lido-schema.org/eventType>.\n"
    from_schema: https://tradicional.arq.br/schema
    permissible_values:
      creation:
        text: creation
        description: "Designa um acontecimento que leva \xE0 conce\xE7\xE3o de itens\
          \ ou produtos de natureza imaterial, como obras liter\xE1rias ou imagens.\
          \ N\xE3o usar para a produ\xE7\xE3o de bens materiais. Quando a conce\xE7\
          \xE3o desses bens, como uma edifica\xE7\xE3o, passa por um processo de cria\xE7\
          \xE3o intelectual atestada, usar para tanto o termo `designing` (\"projeto\"\
          ).\n"
        meaning: term:lido0001
        title: "cria\xE7\xE3o"
        source: crm:E65_Creation
        exact_mappings:
        - vra:wasCreated
      designing:
        text: designing
        description: "O projeto, na classifica\xE7\xE3o de tipos de eventos do LIDO,\
          \ designa a cria\xE7\xE3o de um arcabou\xE7o conceitual para a organiza\xE7\
          \xE3o da apar\xEAncia de objetos tridimensionais, obras visuais, obras de\
          \ arquitetura, ou sistemas t\xE9cnicos.\n"
        meaning: term:lido00224
        title: projeto
        comments:
        - "Em contraste com \"Cria\xE7\xE3o\", que descreve a cria\xE7\xE3o de um\
          \ objeto ou obra em n\xEDvel conceitual, recomenda-se usar \"Projeto\" para\
          \ todos os eventos em que \xE9 criado um objeto f\xEDsico que prepara a\
          \ produ\xE7\xE3o de um objeto mais acabado ou serve como modelo direto para\
          \ ele. Frequentemente, trata-se de desenhos usados como esbo\xE7os na produ\xE7\
          \xE3o de pinturas, esculturas ou edifica\xE7\xF5es. Pode tamb\xE9m ser um\
          \ modelo tridimensional do qual se produz um molde; objetos preparat\xF3\
          rios podem igualmente ser gerados digitalmente.\nRecomenda-se usar este\
          \ termo quando ele for parte de diversos acontecimentos na hist\xF3ria da\
          \ produ\xE7\xE3o da edifica\xE7\xE3o que precisam ser distinguidos entre\
          \ si, cada qual tendo ocorrido em diferentes momentos e envolvento agentes\
          \ distintos.\nSe o objeto que est\xE1 sendo descrito na ficha \xE9 ele pr\xF3\
          prio um projeto ou outra forma de elemento preparat\xF3rio para a constru\xE7\
          \xE3o, o termo mais indicado para o eventType \xE9 `production` (\"produ\xE7\
          \xE3o\")."
        source: aat:300102051
        exact_mappings:
        - vra:wasDesigned
      production:
        text: production
        description: "Designa a\xE7\xF5es que levam \xE0 exist\xEAncia de novos objetos,\
          \ compreendendo a\xE7\xF5es como projeto e execu\xE7\xE3o.\n"
        meaning: term:lido00007
        title: "produ\xE7\xE3o"
        notes:
        - "Detalhar os processos e t\xE9cnicas que levaram \xE0 produ\xE7\xE3o do\
          \ objeto na se\xE7\xE3o materiais e t\xE9cnicas do evento, por exemplo indicando\
          \ os sistemas construtivos empregados."
        source: crm:E12_Production
        exact_mappings:
        - vra:wasProduced
      item_production:
        text: item_production
        description: "No caso de constru\xE7\xF5es seriadas (por exemplo, casas id\xEA\
          nticas numa vila oper\xE1ria), designa a produ\xE7\xE3o de um exemplar singular\
          \ dentro do conjunto. Usar quando for relevante individualizar a produ\xE7\
          \xE3o desses exemplares no \xE2mbito da descri\xE7\xE3o do seu conjunto,\
          \ mas n\xE3o quando cada exemplar for indexado separadamente.\n"
        meaning: term:lido01096
        title: "produ\xE7\xE3o de um exemplar"
        comments:
        - "Este tipo de evento n\xE3o deve ser usado para designar a produ\xE7\xE3\
          o de partes do processo produtivo, tais como projetos, maquetes, prot\xF3\
          tipos ou moldes. Quando for relevante informar a produ\xE7\xE3o de um exemplar,\
          \ deve-se precisar quais caracter\xEDsticas permitem identific\xE1-lo dentro\
          \ do conjunto (endere\xE7o, varia\xE7\xF5es, etc.)."
        source: crm:E22_Human-Made_Object
        close_mappings:
        - aat:300404024
      completion:
        text: completion
        description: 'Processo que completa um objeto ou uma campanha de obras.

          '
        meaning: term:lido00025
        title: "conclus\xE3o"
        source: aat:300053844
        close_mappings:
        - aat:300390560
      execution:
        text: execution
        description: "A\xE7\xE3o de produzir um objeto com base num projeto, por oposi\xE7\
          \xE3o ao processo de projeto.\n"
        meaning: term:lido00031
        title: "execu\xE7\xE3o do projeto"
        source: aat:300069715
        close_mappings:
        - aat:300069715
        - http://d-nb.info/gnd/4456788-1
      transformation:
        text: transformation
        description: "A\xE7\xE3o que destr\xF3i um objeto e, usando substancialmente\
          \ a mesma mat\xE9ria, produz outro que mant\xE9m caracter\xEDsticas reconhec\xED\
          veis do objeto anterior mas \xE9 essencialmente distinto deste por sua natureza\
          \ e identidade. Esta categoria pode ser usada tanto para designar a destrui\xE7\
          \xE3o do objeto antigo quanto a produ\xE7\xE3o do objeto novo.\nExemplos\
          \ de transforma\xE7\xE3o incluem o uso de esp\xF3lios ou ru\xEDnas para\
          \ produzir uma nova constru\xE7\xE3o. N\xE3o deve ser confundido com `reconstruction`\
          \ (\"reconstru\xE7\xE3o\"), que implica seja uma mudan\xE7a de lugar, seja\
          \ a reprodu\xE7\xE3o da identidade visual e espacial da edifica\xE7\xE3\
          o anterior.\n"
        meaning: term:lido00029
        title: "transforma\xE7\xE3o"
        source: crm:E81_Transformation
      reconstruction:
        text: reconstruction
        description: "Ato de construir uma nova estrutura que substitui e se parece\
          \ com uma constru\xE7\xE3o anterior que j\xE1 n\xE3o subsiste, baseada em\
          \ evid\xEAncias hist\xF3ricas, arqueol\xF3gicas, gr\xE1ficas, liter\xE1\
          rias ou outras. A semelhan\xE7a visual e, eventualmente, funcional \xE9\
          \ a caracter\xEDstica principal de uma reconstru\xE7\xE3o, e ela pode ou\
          \ n\xE3o usar materiais sobrestantes da edifica\xE7\xE3o anterior.\nA edifica\xE7\
          \xE3o destru\xEDda e a edifica\xE7\xE3o reconstru\xEDda devem ser cadastradas\
          \ em fichas distintas e relacionadas entre si.\n"
        meaning: lido:lido00723
        title: "reconstru\xE7\xE3o"
        source: aat:300081531
        exact_mappings:
        - wd:Q2478058
        close_mappings:
        - https://d-nb.info/gnd/4065958-6
        broad_mappings:
        - aat:300053744
      translocation:
        text: translocation
        description: "A remo\xE7\xE3o designa o ato de se desmantelar uma edifica\xE7\
          \xE3o no seu local de origem para reconstru\xED-la em outro s\xEDtio. Para\
          \ constru\xE7\xF5es deslocadas sem serem desmanteladas, usar o tipo de evento\
          \ `move` (\"desloca\xE7\xE3o\").\nExemplos de remo\xE7\xE3o s\xE3o aquela\
          \ do templo de Abu Simbel, no Egito, ou ainda aquela da casa Erbo Stenzel\
          \ em Curitiba do seu lote original para o parque S\xE3o Louren\xE7o (onde\
          \ foi posteriormente destru\xEDda num inc\xEAndio).\n"
        meaning: lido:lido01159
        title: "remo\xE7\xE3o"
        source: https://www.vdl-denkmalpflege.de/fileadmin/dateien/Brosch%C3%BCren/VdL_Leitbild_Final_160527__1_.pdf
        exact_mappings:
        - https://d-nb.info/gnd/4258556-9
        broad_mappings:
        - aat:300149370
      modification_activity:
        text: modification_activity
        description: "A\xE7\xE3o intencional que cria, altera ou modifica um objeto\
          \ ou obra em um ou mais dos seus aspectos mas n\xE3o em outros. Usar para\
          \ a\xE7\xF5es que n\xE3o possam ser definidas como tipos mais espec\xED\
          ficos de altera\xE7\xE3o.\n"
        meaning: term:lido00006
        title: "modifica\xE7\xE3o"
        source: crm:E11_Modification
        exact_mappings:
        - vra:wasAlteration
        close_mappings:
        - aat:300105442
      conservation:
        text: conservation
        description: "A\xE7\xE3o ou processo realizado visando \xE0 estabilidade e\
          \ salvaguarda do objeto no longo prazo, incluindo a sua prote\xE7\xE3o contra\
          \ danos ou deteriora\xE7\xE3o e a preven\xE7\xE3o da deteriora\xE7\xE3o\
          \ natural da sua mat\xE9ria. No nosso vocabul\xE1rio, a conserva\xE7\xE3\
          o \xE9 diferente da preserva\xE7\xE3o e da restaura\xE7\xE3o.\n"
        meaning: term:lido00402
        title: "conserva\xE7\xE3o"
        source: aat:300404519
        close_mappings:
        - vra:wasRestored
        - aat:300404519
        - http://d-nb.info/gnd/4114279-2
        broad_mappings:
        - term:lido00006
      conversion:
        text: conversion
        description: "Interven\xE7\xE3o significativa na materialidade e espacialidade\
          \ de uma edifica\xE7\xE3o, usando materiais e t\xE9cnicas construtivas.\
          \ Frequentemente resulta na altera\xE7\xE3o de uso ou de apar\xEAncia da\
          \ edifica\xE7\xE3o, mas sem comprometer a sua identidade anterior.\nSempre\
          \ que poss\xEDvel, preferir designa\xE7\xF5es mais espec\xEDficas, tais\
          \ como `addition`, `removal`, `adaptive_reuse`, `renewal`.\n"
        meaning: term:lido01178
        title: reforma
        source: https://www.duden.de/rechtschreibung/umbauen_umgebaut
        exact_mappings:
        - https://d-nb.info/gnd/4061577-7
        close_mappings:
        - https://www.designingbuildings.co.uk/wiki/Conversion
        broad_mappings:
        - term:lido00006
      dismantling:
        text: dismantling
        description: "Ato de desmontar ou remover partes significativas de um objeto,\
          \ especialmente com a inten\xE7\xE3o de reduzir ou desbilitar o seu uso.\
          \ Particularmente, refere-se \xE0 desmontagem cuidadosa de modo a evitar\
          \ danos ao material removido, visando \xE0 sua reutiliza\xE7\xE3o, reciclagem\
          \ ou gest\xE3o de res\xEDduos.\n"
        meaning: term:lido01179
        title: desmantelamento
        source: aat:300061163
        exact_mappings:
        - wd:Q52161698
        - https://d-nb.info/gnd/4149065-4
        close_mappings:
        - https://en.wikipedia.org/wiki/Deconstruction_(building)
        - https://www.designingbuildings.co.uk/wiki/Deconstruction
        broad_mappings:
        - wd:Q52161698
        - aat:300404064
      part_addition:
        text: part_addition
        description: "Acr\xE9scimo a uma edifica\xE7\xE3o existente, sem lhe alterar\
          \ fundamentalmente a identidade, por meio da amplia\xE7\xE3o ou do acr\xE9\
          scimo de elementos. O conjunto resultante continuar\xE1 a ser identificado\
          \ como a mesma obra anterior ao acr\xE9scimo.\n"
        meaning: term:lido00008
        title: "acr\xE9scimo"
        source: crm:E79_Part_Addition
        broad_mappings:
        - term:lido00006
      part_removal:
        text: part_removal
        description: "Envolve a redu\xE7\xE3o de uma edifica\xE7\xE3o devida \xE0\
          \ elimina\xE7\xE3o de parte(s). Pode incluir a elimina\xE7\xE3o de anexos,\
          \ de elementos construtivos, ou a exclus\xE3o de uma obra de um conjunto\
          \ designado.\n"
        meaning: term:lido00021
        title: "elimina\xE7\xE3o parcial"
        source: crm:E80_Part_Removal
        narrow_mappings:
        - term:lido01187
        broad_mappings:
        - aat:300224146
        - term:lido00006
      partial_destruction_activity:
        text: partial_destruction_activity
        description: "A\xE7\xE3o intencional de destruir ou danificar partes de uma\
          \ obra, sem lhe comprometer a identatidade enquanto objeto de documenta\xE7\
          \xE3o.\n"
        meaning: term:lido01187
        title: "destrui\xE7\xE3o parcial"
        source: crm:E6_Destruction
        narrow_mappings:
        - term:lido01180
        broad_mappings:
        - term:lido00021
        - term:lido00022
      remediation:
        text: remediation
        description: "Atividades construtivas ou de gest\xE3o que t\xEAm por objetivo\
          \ restituir uma obra a um estado anterior conhecido ou presumido, sobretudo\
          \ ap\xF3s perdas catastr\xF3ficas de materialidade ou integridade.\n"
        meaning: term:lido01180
        title: "reconstitui\xE7\xE3o"
        source: https://www.duden.de/rechtschreibung/rueckbauen
        exact_mappings:
        - https://d-nb.info/gnd/4410380-3
        related_mappings:
        - https://historicengland.org.uk/advice/hpg/uwandhc/unlawfulworks/
        broad_mappings:
        - term:lido00034
        - term:lido01187
      renewal:
        text: renewal
        description: "A\xE7\xE3o que altera uma edifica\xE7\xE3o de modo a recuperar\
          \ a sua estrutura, atualizar a sua apar\xEAncia, permitir a adequa\xE7\xE3\
          o a novos usos, aprimorar a sua efici\xEAncia energ\xE9tica, ou outras finalidades\
          \ n\xE3o relacionadas \xE0 preserva\xE7\xE3o do patrim\xF4nio cultural ou\
          \ que n\xE3o tenham considera\xE7\xF5es patrimoniais como prioridade.\n"
        meaning: term:lido01183
        title: "renova\xE7\xE3o"
        source: aat:300389648
        close_mappings:
        - aat:300260783
        - aat:300077781
        narrow_mappings:
        - wd:Q2144402
        broad_mappings:
        - https://d-nb.info/gnd/4152832-3
        - term:lido00006
      restoration:
        text: restoration
        description: "Altera\xE7\xF5es a um objeto que t\xEAm por objetivo restabelecer\
          \ um estado original ou anterior conhecido ou presumido (usar em vez de\
          \ `part_removal` --- \"elimina\xE7\xE3o parcial\" se a inten\xE7\xE3o dominante\
          \ da elimina\xE7\xE3o tiver sido a restaura\xE7\xE3o a um estado anterior).\n"
        meaning: term:lido00034
        title: "restaura\xE7\xE3o"
        source: aat:300053742
        exact_mappings:
        - vra:wasRestored
        close_mappings:
        - wd:Q217102
        - aat:300053742
        - http://d-nb.info/gnd/4049600-4
      modification_process:
        text: modification_process
        description: "Processo n\xE3o deliberado de altera\xE7\xE3o nas caracter\xED\
          sticas, apar\xEAncia ou desempenho dos materiais que constituem um objeto.\
          \ Por exemplo, corros\xE3o, forma\xE7\xE3o de cristais salinos, etc.\n"
        meaning: term:lido01155
        title: "altera\xE7\xE3o"
        source: aat:300105442
        close_mappings:
        - crm:E11_Modification
        narrow_mappings:
        - term:lido01157
        broad_mappings:
        - term:lido01154
      partial_destruction_process:
        text: partial_destruction_process
        description: "Processo n\xE3o intencional de degrada\xE7\xE3o material, destruindo\
          \ ou danificando partes de um objeto sem descaracterizar a sua identidade\
          \ (por exemplo, sem convert\xEA-lo numa ru\xEDna). Pode ser causado por\
          \ condi\xE7\xF5es ambientais continuadas ou por desastres naturais.\n"
        meaning: term:lido01157
        title: perda parcial
        close_mappings:
        - crm:E6_Destruction
        narrow_mappings:
        - term:lido01160
        broad_mappings:
        - term:lido01155
        - term:lido00022
      deterioration:
        text: deterioration
        description: "Processo de perda parcial de mat\xE9ria, desempenho, ou funcionalidade\
          \ de um objeto sem interven\xE7\xE3o ou atua\xE7\xE3o deliberada. Geralmente\
          \ causado por condi\xE7\xF5es ambientais continuadas, mas pode ser agravado\
          \ por desastres naturais. A deteriora\xE7\xE3o pode levar ao `destruction_process`\
          \ (\"arruinamento\") da edifica\xE7\xE3o.\n"
        meaning: term:lido01160
        title: "deteriora\xE7\xE3o"
        source: aat:300054106
        close_mappings:
        - https://d-nb.info/gnd/4745718-1
        - wd:Q94643648
        broad_mappings:
        - term:lido01157
      adaptive_reuse:
        text: adaptive_reuse
        description: "A\xE7\xE3o de converter ou adaptar uma edifica\xE7\xE3o, em\
          \ geral com valor hist\xF3rico-cultural reconhecido, para novos usos ou\
          \ aplica\xE7\xE3o em contexto distinto do original. Distinguir eventos de\
          \ reutiliza\xE7\xE3o adaptativa de eventos que envolvem as interven\xE7\xF5\
          es f\xEDsicas necess\xE1rias ou preparat\xF3rias a essa reutiliza\xE7\xE3\
          o, usando o termo `conversion` (\"reforma\").\n"
        meaning: term:lido01161
        title: "reutiliza\xE7\xE3o adaptada"
        source: aat:300056392
        exact_mappings:
        - wd:Q111749149
        close_mappings:
        - https://d-nb.info/gnd/4042840-0
        - aat:300417716
        - wd:Q21021151
        narrow_mappings:
        - term:lido01170
        - term:lido01169
        broad_mappings:
        - term:lido00004
      opening:
        text: opening
        description: "Ato pelo qual um objeto \xE9 declarado operacional, geralmente\
          \ por meio de uma cerim\xF4nia, mas n\xE3o necessariamente.\n"
        meaning: term:lido01169
        title: "inaugura\xE7\xE3o"
        source: aat:300054769
        close_mappings:
        - wd:Q3010369
        - https://d-nb.info/gnd/4338947-8
        narrow_mappings:
        - aat:300404068
        broad_mappings:
        - wd:Q29933838
        - term:lido01161
      decommissioning:
        text: decommissioning
        description: "A\xE7\xE3o que acompanha ou sinaliza o encerramento da utiliza\xE7\
          \xE3o de um objeto, geralmente associado \xE0 interdi\xE7\xE3o f\xEDsica\
          \ da edifica\xE7\xE3o.\n"
        meaning: term:lido01170
        title: "desafeta\xE7\xE3o"
        source: https://www.designingbuildings.co.uk/wiki/Decommissioning_buildings
        close_mappings:
        - https://en.wikipedia.org/wiki/Decommissioning
        - https://d-nb.info/gnd/4125246-9
        narrow_mappings:
        - https://d-nb.info/gnd/4513722-5
        broad_mappings:
        - wd:Q29933838
        - term:lido01161

        meaning: term:lido00998
        title: representado em
  LargerContextType:
    name: LargerContextType
    definition_uri: https://tradicional.arq.br/schema/LargerContextType
    description: "Tipos de rela\xE7\xF5es entre partes e todo previstas no vocabul\xE1\
      rio controlado do LIDO. Inclui as categorias de rela\xE7\xF5es hier\xE1rquicas\
      \ e de rela\xE7\xF5es associativas de parte ao todo.\nVer <http://terminology.lido-schema.org/relatedWorkRelType>"
    from_schema: https://tradicional.arq.br/schema
    permissible_values:
      physical_part_of:
        text: physical_part_of
        description: "Usar quando um objeto f\xEDsico fizer parte integrante de um\
          \ objeto ou complexo f\xEDsico maior. Se o conjunto mais amplo for um construto\
          \ interpretativo, usar a rela\xE7\xE3o `has_borader_conceptual_context`.\n"
        meaning: term:lido00255
        title: fisicamente contido em
      conceptual_part_of:
        text: conceptual_part_of
        description: 'Usar quando um objeto intelectual for parte de uma entidade
          conceitual maior ou mais ampla.

          '
        meaning: term:lido00572
        title: parte conceitual de
      has_borader_conceptual_context:
        text: has_borader_conceptual_context
        description: "Usar quando um objeto f\xEDsico for inclu\xEDdo segundo crit\xE9\
          rios interpretativos num conjunto conceitual mais amplo. Se o conjunto mais\
          \ amplo for uma extens\xE3o f\xEDsica que compreende inequivocamente o objeto,\
          \ usar a rela\xE7\xE3o `physical_part_of`.\n"
        meaning: term:lido00575
        title: tem contexto conceitual mais amplo
      example_of:
        text: example_of
        description: "Usar quando o objeto constru\xEDdo \xE9 a manifesta\xE7\xE3\
          o f\xEDsica de um conte\xFAdo intelectual, podendo abarcar desde inst\xE2\
          ncias espec\xEDficas de um projeto seriado (por exemplo, um exemplar das\
          \ casas da SHIS \u2014 Sociedade de Habita\xE7\xF5es de Interesse Social\
          \ \u2014 produzidas em Bras\xEDlia a partir de 1969) at\xE9 a realiza\xE7\
          \xE3o edificada de um programa te\xF3rico espec\xEDfico (por exemplo, a\
          \ Cit\xE9 Radieuse de Marselha como exemplo da unit\xE9 d'habitation de\
          \ Le Corbusier).\nVincula\xE7\xF5es te\xF3ricas ou conceituais com maior\
          \ dist\xE2ncia interpretativa (por exemplo, o Jardim Am\xE9rica como exemplar\
          \ de cidade\u2013jardim) devem ser cadastradas no grupo `subject`.\n"
        meaning: term:lido00627
        title: exemplar de
      has_arch_context:
        text: has_arch_context
        description: "O objeto em causa foi concebido para integrar ou est\xE1 situado\
          \ no referido conjunto edificado, ou integra o contexto funcional deste.\n"
        meaning: term:lido00616
        title: "tem como contexto arquitet\xF4nico"
      had_arch_context:
        text: had_arch_context
        description: "O objeto em causa foi concebido para integrar ou esteve situado\
          \ no referido conjunto edificado, mas n\xE3o tem mais esse contexto por\
          \ ter sido trasladado ou removido, ou porque o contexto foi destru\xEDdo\
          \ ou descaracterizado.\n"
        meaning: term:lido01051
        title: "tinha como contexto arquitet\xF4nico"
      in_conceptual_whole_with:
        text: in_conceptual_whole_with
        description: "Rela\xE7\xE3o sim\xE9trica entre dois objetos que pertencem\
          \ ao mesmo contexto conceitual. Usar apenas nos casos em que o conjunto\
          \ conceitual maior n\xE3o for cadastrado no document\xE1rio, por motivos\
          \ t\xE9cnicos ou decis\xE3o cient\xEDfica.\n"
        meaning: term:lido00578
        title: pertence ao mesmo contexto conceitual que
      in_physical_whole_with:
        text: in_physical_whole_with
        description: "Rela\xE7\xE3o sim\xE9trica entre dois objetos que pertencem\
          \ ao mesmo contexto material ou espacial. Usar apenas nos casos em que o\
          \ conjunto arquitet\xF4nico maior n\xE3o for cadastrado no document\xE1\
          rio, por motivos t\xE9cnicos ou decis\xE3o cient\xEDfica.\n"
        meaning: term:lido00577
        title: pertence ao mesmo contexto material que
      was_part_of_whole_with:
        text: was_part_of_whole_with
        description: "Rela\xE7\xE3o sim\xE9trica entre dois objetos que pertenceram\
          \ ao mesmo contexto conceitual, material ou espacial, mas j\xE1 n\xE3o pertencem\
          \ devido a remo\xE7\xE3o, traslado, destrui\xE7\xE3o ou reclassifica\xE7\
          \xE3o. Usar apenas nos casos em que o conjunto maior n\xE3o for cadastrado\
          \ no document\xE1rio, por motivos t\xE9cnicos ou decis\xE3o cient\xEDfica.\n"
        meaning: term:lido01059
        title: pertenceu ao mesmo contexto que
      was_antedated:
        text: was_antedated
        meaning: term:lido01189
        title: "foi precedido no mesmo s\xEDtio por"
      is_part_of:
        text: is_part_of
        description: "Rela\xE7\xE3o gen\xE9rica entre parte e todo. Sempre que poss\xED\
          vel, usar os tipos de rela\xE7\xE3o mais espec\xEDficos.\n"
        meaning: term:lido00574
        title: faz parte de
      formerly_part_of:
        text: formerly_part_of
        description: "O objeto f\xEDsico em quest\xE3o era anteriormente compreendido\
          \ num conjunto edificado maior que n\xE3o mais existe, seja porque o conjunto\
          \ foi parcialmente demolido ou descaracterizado, ou porque suas outras partes\
          \ foram trasladadas ou removidas.\n"
        meaning: term:lido01085
        title: anteriormente parte de
      is_was_part_of:
        text: is_was_part_of
        description: "O objeto faz ou fazia parte de um conjunto f\xEDsico maior,\
          \ mas n\xE3o \xE9 poss\xEDvel determinar se esse conjunto ainda existe ou\
          \ n\xE3o.\n"
        meaning: term:lido01088
        title: parte de

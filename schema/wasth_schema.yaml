classes:
  Concept:
    name: Concept
    definition_uri: https://tradicional.arq.br/schema/Concept
    description: A WASTH controlled-vocabulary concept, compatible with SKOS and SKOS-THES.
    from_schema: https://tradicional.arq.br/schema/concept
    exact_mappings:
    - skos:Concept
    is_a: Thing
    slots:
    - Thing_description
    - record_rights
    - title_type
    - alt_name
    - bibliographic_citation
    - identifiers
    - tags
    - temporal
    - repository
    - collection
    - content
    - thing__id
    - thing__author
    - thing__record_date
    - thing__title
    - thing__title_source
    - concept__broader
    - concept__narrower
    - concept__relation
    - Concept_category
    slot_usage:
      category:
        name: category
        is_a: thing__category
        ifabsent: string(lido:lido01193)
    attributes:
      broader:
        name: broader
        slot_uri: skos:broader
        range: BroaderConceptReference
        multivalued: true
        inlined_as_list: true
      narrower:
        name: narrower
        slot_uri: skos:narrower
        range: ConceptReference
        multivalued: true
        inlined_as_list: true
      relation:
        name: relation
        slot_uri: skos:relation
        range: RelatedConceptReference
        multivalued: true
        inlined_as_list: true
    class_uri: skos:Concept
  ConceptReference:
    name: ConceptReference
    definition_uri: https://tradicional.arq.br/schema/ConceptReference
    description: "Atribui\xE7\xE3o de vocabul\xE1rio controlado com cita\xE7\xE3o\
      \ de apoio."
    from_schema: https://tradicional.arq.br/schema/concept
    slots:
    - description
    - name
    - bibliographic_citation
    class_uri: wasth:ConceptReference
  BroaderConceptReference:
    name: BroaderConceptReference
    definition_uri: https://tradicional.arq.br/schema/BroaderConceptReference
    description: "Rela\xE7\xF5es hier\xE1rquicas."
    from_schema: https://tradicional.arq.br/schema/concept

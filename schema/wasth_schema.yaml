  style_period:
    name: style_period
    definition_uri: https://tradicional.arq.br/schema/style_period
    description: "Denomina o(s) per\xEDodo(s) em que o evento decorreu, em qualquer\
      \ escala relevante para o conhecimento\u2009: geol\xF3gica, arqueol\xF3gica,\
      \ hist\xF3rica ou art\xEDstica. A identifica\xE7\xE3o do per\xEDodo ou estilo\
      \ deve ser relevante para as caracter\xEDsticas que o objeto adquiriu devido\
      \ a esse evento, n\xE3o somente uma coincid\xEAncia cronol\xF3gica.\n---------------------------------------------------------------------\n\
      An index element for the period in which the event happened, comprising information\
      \ about geologic time scale, archaelogical, historical, or artistic period,\
      \ style, or art movement, whose characteristics are represented by the object\
      \ or work.\nNote that \"Period/Style\" corresponds to \"Style\" in CDWA as shorthand\
      \ for [Style/Period/Group/Movement/Dynasty](https://www.getty.edu/research/publications/electronic_publications/cdwa/17styles.html).\n\
      Examples may be Neolithic for a period, Impressionist for a style, or Cubism\
      \ for a movement.\n"
    from_schema: https://tradicional.arq.br/schema/shared
    slot_uri: wasth:style_period
    owner: Work
    domain_of:
    - Event
    - Work
    range: StylePeriod
    multivalued: true
    inlined: true
    inlined_as_list: true
  culture:
    name: culture
    definition_uri: https://tradicional.arq.br/schema/culture
    description: "Designa o contexto cultural ou \xE9tnico no qual o objeto foi afetado\
      \ pelo evento em quest\xE3o, desde que as caracter\xEDsticas de tal contexto\
      \ estejam refletidas no objeto. O preenchimento do contexto cultural \xE9 especialmente\
      \ relevante quando os agentes envolvidos na produ\xE7\xE3o ou altera\xE7\xE3\
      o do objeto s\xE3o desconhecidos.\n---------------------------------------------------------------------\n\
      An index element for the cultural context from which the object/work in focus\
      \ originated. Used if the creator or producer is unknown, or if the cultural\
      \ context is of particular interest. Examples may include the name of a culture,\
      \ a nation, or an ethnic group."
    from_schema: https://tradicional.arq.br/schema/shared
    slot_uri: wasth:culture
    owner: Work
    domain_of:

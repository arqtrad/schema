    multivalued: true
    inlined: true
    inlined_as_list: true
  bibliographic_citation:
    name: bibliographic_citation
    definition_uri: https://tradicional.arq.br/schema/bibliographic_citation
    description: "\U0001F4DA  Cadastro de uma refer\xEAncia bibliogr\xE1fica.\nO campo\
      \ `refid` deve conter a chave de cita\xE7\xE3o (citation key) que consta do\
      \ registro bibliogr\xE1fico na biblioteca do nosso projeto de pesquisa no Zotero,\
      \ come\xE7ando com arroba @. Em geral, a chave de cita\xE7\xE3o \xE9 o DOI ou\
      \ ISBN da publica\xE7\xE3o, mas pode ser diferente.\nSe necess\xE1rio, incluir\
      \ no campo `note` uma especifica\xE7\xE3o adicional, como o n\xFAmero da p\xE1\
      gina da refer\xEAncia bibliogr\xE1fica de onde a informa\xE7\xE3o foi extra\xED\
      da.\nUsar o campo `description` para formatar a refer\xEAncia, caso a formata\xE7\
      \xE3o autom\xE1tica do Zotero n\xE3o for satisfat\xF3ria.\n"
    from_schema: https://tradicional.arq.br/schema/resource
    mappings:
    - dcterms:bibliographicCitation
    slot_uri: dcterms:bibliographicCitation
    owner: Inscription
    domain_of:
    - ConceptReference
    - RelatedObject
    - MediaObject
    - TypedReference
    - Measurement
    - Actor
    - Thing
    - Appellation
    - GeographicPoint
    - GeographicExtent
    - Inscription
    range: BibliographicCitation
    recommended: true
    multivalued: true
    inlined: true
    inlined_as_list: true
  relation_type:
    name: relation_type
    definition_uri: https://tradicional.arq.br/schema/relation_type
    description: "Usamos os tipos de rela\xE7\xE3o previstos pelo [VRA Core]. Provavelmente\
      \ necessitamos apenas de\u2009:\n- `planFor`\u2009: desenho t\xE9cnico bidimensional\
      \ de levantamento\n  (padr\xE3o, pode ser omitido)\u2009;\n\n- `modelFor`\u2009\
      : modelo tridimensional, com ou sem informa\xE7\xF5es construtivas\n  associadas\
      \ (BIM)\u2009;\n\n- `imageOf`\u2009: outras representa\xE7\xF5es em duas dimens\xF5\

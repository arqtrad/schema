slots:
  concept_name:
    name: concept_name
    definition_uri: https://tradicional.arq.br/schema/concept_name
    from_schema: https://tradicional.arq.br/schema/concept
    slot_uri: wasth:concept_name
    owner: Topic
    domain_of:
    - ConceptReference
    - Topic
    range: Concept
    inlined: true
    inlined_as_list: true
  broader:
    name: broader
    definition_uri: https://tradicional.arq.br/schema/broader
    description: "Um conceito de significa\xE7\xE3o mais gen\xE9rica. Conceitos gen\xE9\
      ricos s\xE3o tipicamente representados como pais em uma hierarquia de conceitos\
      \ (\xE1rvore).\nPreenchimento manual."
    from_schema: https://tradicional.arq.br/schema/concept
    mappings:
    - skos:broader
    slot_uri: skos:broader
    owner: Concept
    domain_of:
    - Concept
    range: BroaderConceptReference
    multivalued: true
    inlined: true
    inlined_as_list: true
  narrower:
    name: narrower
    definition_uri: https://tradicional.arq.br/schema/narrower
    description: "Um conceito de significa\xE7\xE3o mais espec\xEDfica. Conceitos\
      \ espec\xEDficos s\xE3o tipicamente representados como descendentes em uma hierarquia\
      \ de conceitos (\xE1rvore).\nDerivado automaticamente das rela\xE7\xF5es `broader`\
      \ em outras fichas. N\xC3O preencher manualmente."
    from_schema: https://tradicional.arq.br/schema/concept
    mappings:
    - skos:narrower
    slot_uri: skos:narrower
    owner: Concept
    domain_of:
    - Concept
    range: NarrowerConceptReference
    multivalued: true
    inlined: true
    inlined_as_list: true
  bibliographic_citation:
    name: bibliographic_citation
    definition_uri: https://tradicional.arq.br/schema/bibliographic_citation
    description: "\U0001F4DA  Cadastro de uma refer\xEAncia bibliogr\xE1fica.\nO campo\
      \ `refid` deve conter a chave de cita\xE7\xE3o (citation key) que consta do\
      \ registro bibliogr\xE1fico na biblioteca do nosso projeto de pesquisa no Zotero,\
      \ come\xE7ando com arroba @. Em geral, a chave de cita\xE7\xE3o \xE9 o DOI ou\
      \ ISBN da publica\xE7\xE3o, mas pode ser diferente.\nSe necess\xE1rio, incluir\
      \ no campo `note` uma especifica\xE7\xE3o adicional, como o n\xFAmero da p\xE1\
      gina da refer\xEAncia bibliogr\xE1fica de onde a informa\xE7\xE3o foi extra\xED\
      da.\nUsar o campo `description` para formatar a refer\xEAncia, caso a formata\xE7\
      \xE3o autom\xE1tica do Zotero n\xE3o for satisfat\xF3ria.\n"
    from_schema: https://tradicional.arq.br/schema/resource
    mappings:
    - dcterms:bibliographicCitation
    slot_uri: dcterms:bibliographicCitation
    owner: Inscription
    domain_of:
    - ConceptReference
    - TypedReference
    - Measurement
    - Actor
    - Thing
    - Appellation
    - GeographicPoint
    - GeographicExtent
    - Inscription
    range: BibliographicCitation
    recommended: true
    multivalued: true
    inlined: true
    inlined_as_list: true
  collection_type:
    name: collection_type
    definition_uri: https://tradicional.arq.br/schema/collection_type
    description: "Usar um vocabul\xE1rio controlado para identificar o tipo de representa\xE7\
      \xE3o, por exemplo as hierarquias do Getty AAT [obras visuais](http://vocab.getty.edu/hier/aat/300191086).\
      \ ou [formatos de informa\xE7\xE3o](http://vocab.getty.edu/hier/aat/300220751)\n"
    from_schema: https://tradicional.arq.br/schema/resource
    slot_uri: wasth:collection_type
    range: CollectionType
  resources:
    name: resources
    definition_uri: https://tradicional.arq.br/schema/resources
    description: "Os desenhos ou modelos da edifica\xE7\xE3o s\xE3o apresentados online\
      \ por meio de imagens vetoriais ou bitmap.\nCada desenho ou modelo pode ser\
      \ apresentado sob v\xE1rias representa\xE7\xF5es, como pr\xE9-visualiza\xE7\xE3\
      o, imagem original, ou servi\xE7o [IIIF]. Essas imagens devem ser identificadas\
      \ como segue\u2009:\nAs categorias de representa\xE7\xE3o previstas no [LIDO]\
      \ podem ser consultadas em <http://terminology.lido-schema.org/resourceRepresentation_type>\
      \ e s\xE3o inseridas na ficha como um mapa.\n"
    from_schema: https://tradicional.arq.br/schema/resource
    slot_uri: wasth:resources
    owner: Work
    domain_of:
    - Work
    range: Resource
    multivalued: true
    inlined: true
    inlined_as_list: false
  media:
    name: media
    definition_uri: https://tradicional.arq.br/schema/media
    description: "Representa\xE7\xF5es iconogr\xE1ficas deste objeto.\n"
    from_schema: https://tradicional.arq.br/schema/resource
    slot_uri: wasth:media
    owner: Work
    domain_of:
    - RelatedWork
    - LargerContextReference
    - Event
    - Work
    range: MediaObject
    multivalued: true
    inlined: true
    inlined_as_list: true
  preview_image:
    name: preview_image
    definition_uri: https://tradicional.arq.br/schema/preview_image
    description: "Uma \xFAnica miniatura da imagem original.\nObs.: n\xE3o usamos\
      \ a op\xE7\xE3o `placeholder`, ela ser\xE1 preenchida automaticamente em caso\
      \ de aus\xEAncia da miniatura, nem outros tipos de miniaturas que n\xE3o imagens.\
      \ A especifica\xE7\xE3o LIDO admite listar mais de uma miniatura, mas tampouco\
      \ prevemos essa hip\xF3tese.\n"
    from_schema: https://tradicional.arq.br/schema/resource
    slot_uri: wasth:preview_image
    owner: MediaObject
    domain_of:
    - Resource
    - MediaObject
    range: uriorcurie
  provided_image:
    name: provided_image
    definition_uri: https://tradicional.arq.br/schema/provided_image
    description: "Lista de vers\xF5es ampliadas ou originais da imagem, vetorial ou\
      \ bitmap."
    from_schema: https://tradicional.arq.br/schema/resource
    slot_uri: wasth:provided_image
    owner: MediaObject
    domain_of:
    - Resource
    - MediaObject
    range: uriorcurie
    multivalued: true
    inlined_as_list: true
  provided_3d:
    name: provided_3d
    definition_uri: https://tradicional.arq.br/schema/provided_3d
    description: "Modelo tridimensional ou IFC da edifica\xE7\xE3o."
    from_schema: https://tradicional.arq.br/schema/resource
    slot_uri: wasth:provided_3d
    owner: MediaObject
    domain_of:
    - Resource
    - MediaObject
    range: uriorcurie
    multivalued: true
    inlined_as_list: true
  resource_service:
    name: resource_service
    definition_uri: https://tradicional.arq.br/schema/resource_service
    description: "Apenas no caso de a imagem ser fornecida como um servi\xE7o din\xE2\
      mico online, tal como a especifica\xE7\xE3o [IIIF].\nNo caso de `preview_image`\
      \ ou `provided_image`, o link deve referenciar diretamente o arquivo (ficheiro)\
      \ da imagem. Em se tratando de `provided_3d` ou `service`, o link deve remeter\
      \ a uma p\xE1gina web que forne\xE7a a respetiva API ou as informa\xE7\xF5es\
      \ acerca do modelo."
    from_schema: https://tradicional.arq.br/schema/resource
    slot_uri: wasth:service
    alias: service
    owner: MediaObject
    domain_of:
    - Resource
    - MediaObject
    range: uriorcurie
    multivalued: true
    inlined_as_list: true
  format:
    name: format
    definition_uri: https://tradicional.arq.br/schema/format
    description: "Campo disciplinado pela especifica\xE7\xE3o [DublinCore] no campo\
      \ [format](https://www.dublincore.org/specifications/dublin-core/dcmi-terms/elements11/format/).\
      \ Esta especifica\xE7\xE3o sugere a lista de tipos de m\xEDdia IANA\u2009: <https://www.iana.org/assignments/media-types>.\n"
    from_schema: https://tradicional.arq.br/schema/resource
    mappings:
    - dcterms:format
    slot_uri: dcterms:format
    owner: MediaObject
    domain_of:
    - Resource
    - MediaObject
    range: TypedReference
    required: true
    inlined: true
    inlined_as_list: false
  scale:
    name: scale
    definition_uri: https://tradicional.arq.br/schema/scale
    description: "N\xFAmero inverso da escala da imagem ou desenho, se tiver uma resolu\xE7\
      \xE3o ou tamanho de p\xE1gina definidos. Por exemplo, para um desenho na escala\
      \ 1\u2009:\u2009100, `scale: 100`."
    from_schema: https://tradicional.arq.br/schema/resource
    slot_uri: wasth:scale
    owner: MediaObject
    domain_of:
    - Resource
    - MediaObject
    range: float
    minimum_value: 0
  work_rights:
    name: work_rights
    definition_uri: https://tradicional.arq.br/schema/work_rights
    description: "\u26A0\uFE0F  Este bloco se refere a eventuais direitos autorais\
      \ ou de propriedade sobre O OBJETO OU RECURSO QUE EST\xC1 SENDO DESCRITO, n\xE3\
      o sobre o preenchimento da ficha.\n"
    from_schema: https://tradicional.arq.br/schema/resource
    mappings:
    - lido:rightsWorkSet
    slot_uri: lido:rightsWorkSet
    owner: Resource
    domain_of:
    - RelatedObject
    - Resource
    range: Right
    multivalued: true
    inlined: true
    inlined_as_list: true
  credit:
    name: credit
    definition_uri: https://tradicional.arq.br/schema/credit
    description: "Informa\xE7\xE3o sobre autoria ou responsabilidade."
    from_schema: https://tradicional.arq.br/schema/resource
    slot_uri: wasth:credit
    owner: MediaObject
    domain_of:
    - Resource
    - MediaObject

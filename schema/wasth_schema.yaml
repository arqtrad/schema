  measurements:
    name: measurements
    definition_uri: https://tradicional.arq.br/schema/measurements
    description: 'A wrapper for information about the dimensions, or other measurements,
      of the object/work in focus. May also include extents of the parts of a complex
      object or work.

      '
    from_schema: https://tradicional.arq.br/schema/shared
    slot_uri: wasth:measurements
    owner: Work
    domain_of:
    - MediaObject
    - Event
    - Work
    range: Measurement
    multivalued: true
    inlined: true
    inlined_as_list: true
  material:
    name: material
    definition_uri: https://tradicional.arq.br/schema/material
    description: "Descreve a natureza do material empregado na edifica\xE7\xE3o, no\
      \ elemento ou no evento descritos. Conforme necess\xE1rio e segundo o discernimento\
      \ de quem preenche a ficha, pode se referir a mat\xE9rias-primas ou a produtos\
      \ prontos para uso.\nEsp\xF3lios ou partes de outras edifica\xE7\xF5es reutilizadas\
      \ podem ser descritos segundo os materiais de que s\xE3o constitu\xEDdos, mas\
      \ a proced\xEAncia n\xE3o deve ser cadastrada neste item. Para tanto, devem\
      \ ser utilizados os eventos no grupo `temporal`.\n-------------------------------------------------------------------------\n\
      This class is a specialization of E55 Type and comprises the concepts of materials.\n\
      Instances of E57 Material may denote properties of matter before its use, during\
      \ its use, and as incorporated in an object, such as ultramarine powder, tempera\
      \ paste, reinforced concrete. Discrete pieces of raw-materials kept in museums,\
      \ such as bricks, sheets of fabric, pieces of metal, should be modelled individually\
      \ in the same way as other objects. Discrete used or processed pieces, such\
      \ as the stones from Nefer Titi's temple, should be modelled as parts (cf. P46\
      \ is composed of (forms part of): E18 Physical Thing).\nThis type is used categorically\
      \ in the model without reference to instances of it, i.e. the Model does not\
      \ foresee the description of instances of instances of E57 Material, e.g. \u201C\
      instances of gold\u201D.\nIt is recommended that internationally or nationally\
      \ agreed codes and terminology should be used.\n"
    from_schema: https://tradicional.arq.br/schema/shared
    mappings:
    - crm:E57_Material
    exact_mappings:
    - vra:Material
    slot_uri: crm:E57_Material
    owner: Work
    domain_of:
    - Event
    - Work
    range: MaterialTech
    multivalued: true
    inlined: true
    inlined_as_list: true
  technique:
    name: technique
    definition_uri: https://tradicional.arq.br/schema/technique
    description: "Processos, t\xE9cnicas, m\xE9todos e saberes postos em pr\xE1tica\
      \ no conjunto da edifica\xE7\xE3o e nas suas partes mais significativas, considerando\
      \ a sua produ\xE7\xE3o e altera\xE7\xF5es substanciais, bem como a sua eventual\
      \ destrui\xE7\xE3o.\n-------------------------------------------------------------------------\n\
      The production or manufacturing processes, techniques, and methods incorporated\
      \ in the fabrication or alteration of the work or image.\n"
    from_schema: https://tradicional.arq.br/schema/shared
    mappings:
    - vra:Technique
    close_mappings:
    - crm:E55_Type
    slot_uri: vra:Technique
    owner: Work
    domain_of:
    - Event
    - Work
    range: MaterialTech
    multivalued: true
    inlined: true
    inlined_as_list: true
  format_extent:
    name: format_extent
    definition_uri: https://tradicional.arq.br/schema/format_extent
    description: "Indica a parte do objeto que est\xE1 sendo medida \u2014 por exemplo,\
      \ se a altura \xE9 at\xE9 a linha de coroamento ou at\xE9 a cumeeira, etc. \u2014\
      \ usar a `uri` de um vocabul\xE1rio controlado.\n"
    from_schema: https://tradicional.arq.br/schema/shared
    slot_uri: wasth:extent
    alias: extent
    owner: Topic
    domain_of:
    - Measurement

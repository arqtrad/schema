        meaning: term:lido00580
        title: complementa
      complemented:
        text: complemented
        description: "Rela\xE7\xE3o entre obras criadas independentemente uma da outra,\
          \ mas que mais tarde passaram a ser consideradas ou usadas conjuntamente,\
          \ sendo essa associa\xE7\xE3o posteriormente desfeita.\n"
        meaning: term:lido01095
        title: complementava
      derivedFrom:
        text: derivedFrom
        description: "A obra descrita \xE9 derivada ou sensivelmente influenciada\
          \ pelo objeto relacionado.\nPreferir outras express\xF5es de rela\xE7\xE3\
          o mais espec\xEDficas sempre que poss\xEDvel. A rela\xE7\xE3o `derivedFrom`\
          \ deve ser reservada para casos em que a rela\xE7\xE3o seja de varia\xE7\
          \xF5es e influ\xEAncias. Essas rela\xE7\xF5es devem ser fundamentadas em\
          \ interpreta\xE7\xE3o bibliogr\xE1fica.\n"
        meaning: term:lido00603
        title: derivado de
      positionedNear:
        text: positionedNear
        description: "Rela\xE7\xE3o sim\xE9trica entre dois objetos situados em proximidade\
          \ espacial, quando esta proximidade for significativa por raz\xF5es compositivas,\
          \ hist\xF3ricas ou funcionais.\n"
        meaning: term:lido01136
        title: "pr\xF3ximo a"
  ResourceType:

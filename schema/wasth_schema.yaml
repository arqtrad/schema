      ).\nNos recursos gr\xE1ficos de uma obra, preencher este campo OBRIGATORIAMENTE\
      \ com `term:lido01193` (\"Objeto conceitual\").\n"
    notes:
    - 'The LIDO Category Vocabulary is a structured controlled list of terms recommended

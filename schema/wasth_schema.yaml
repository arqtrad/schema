  category:
    name: category
    definition_uri: https://tradicional.arq.br/schema/category
    description: "Uma classifica\xE7\xE3o ampla para o objeto descrito na ficha, usando\
      \ o vocabul\xE1rio controlado do LIDO.\nNos document\xE1rios de edifica\xE7\xF5\
      es, preencher este campo OBRIGATORIAMENTE com `term:lido00096` (\"Objeto manufaturado\"\
      ).\nNo vocabul\xE1rio controlado, preencher este campo OBRIGATORIAMENTE com\
      \ `term:lido01193` (\"Objeto conceitual\").\n---------------------------------------------------------------------\n\
      The LIDO Category Vocabulary is a structured controlled list of terms recommended\
      \ to use as values in the LIDO Category element.\nExamples are human-made object\
      \ or natural object."
    from_schema: https://tradicional.arq.br/schema/thing
    mappings:
    - term:lidoCategory
    slot_uri: term:lidoCategory
    designates_type: true
    owner: Thing
    domain_of:
    - Thing
    range: uriorcurie
    required: true
  record_rights:
    name: record_rights
    definition_uri: https://tradicional.arq.br/schema/record_rights
    description: "Informa\xE7\xF5es estruturadas sobre os direitos que incidem sobre\
      \ o conte\xFAdo textual desta ficha.\n\u26A0\uFE0F  Este grupo se refere aos\
      \ direitos sobre o CONTE\xDADO da ficha, n\xE3o sobre os direitos incidentes\
      \ sobre o objeto descrito.\n---------------------------------------------------------------------\n\
      A set of structured information about rights regarding the content provided\
      \ in this LIDO record.\n"
    from_schema: https://tradicional.arq.br/schema/thing
    slot_uri: wasth:record_rights
    owner: Thing
    domain_of:
    - Thing
    range: Right
    multivalued: true

    slot_uri: dcterms:creator
    alias: author
    owner: Thing
    domain_of:
    - Thing
    range: OrcidId
  thing__record_date:
    name: thing__record_date
    description: Date the record was created or last substantively revised.
    from_schema: https://tradicional.arq.br/schema/thing
    mappings:
    - dcterms:created
    slot_uri: dcterms:created
    alias: record_date
    owner: Thing
    domain_of:
    - Thing
    range: date
  thing__title:
    name: thing__title
    description: The preferred human-readable label for a Thing.
    from_schema: https://tradicional.arq.br/schema/thing
    mappings:
    - dcterms:title
    slot_uri: dcterms:title
    alias: title
    owner: Thing
    domain_of:
    - Thing
    range: string
    required: true
  thing__title_source:
    name: thing__title_source
    description: "\U0001F4DA A fonte do t\xEDtulo title_source \xE9 opcional ; um\
      \ t\xEDtulo pode ser atestado em mais de uma fonte, por isso este campo \xE9\
      \ uma lista de itens (cada item come\xE7a com um h\xEDfen).\nSe a fonte for\
      \ cadastrada, o campo `refid` deve conter a chave de cita\xE7\xE3o (citation\
      \ key) que consta do registro bibliogr\xE1fico na biblioteca do nosso projeto\
      \ de pesquisa no Zotero. Em geral, a chave de cita\xE7\xE3o \xE9 o DOI ou ISBN\
      \ da publica\xE7\xE3o, mas pode ser diferente.\nSe necess\xE1rio, incluir no\
      \ campo note uma especifica\xE7\xE3o adicional, como o n\xFAmero da p\xE1gina\
      \ da refer\xEAncia bibliogr\xE1fica de onde a informa\xE7\xE3o foi extra\xED\
      da.\nTodos os campos source no restante da ficha devem ser preenchidos do mesmo\
      \ modo. (Equivalente DublinCore: bibliographiCitation)."
    from_schema: https://tradicional.arq.br/schema/thing
    slot_uri: wasth:title_source
    alias: title_source
    owner: Thing
    domain_of:
    - Thing
    range: BibliographicCitation
    multivalued: true
    inlined: true
    inlined_as_list: true
  thing__category:
    name: thing__category
    description: 'The LIDO Category Vocabulary is a structured controlled list of
      terms recommended to use as values in the LIDO Category element.

      Examples are human-made object or natural object.'
    from_schema: https://tradicional.arq.br/schema/thing
    mappings:
    - lido:lidoCategory
    slot_uri: lido:lidoCategory
    ifabsent: string(lido:lido00096)
    designates_type: true
    alias: category
    owner: Thing
    domain_of:
    - Thing
    range: uriorcurie
  appellation__title_preference:
    name: appellation__title_preference
    description: "Indica se o nome em quest\xE3o deve ser oculto ou n\xE3o, se \xE9\
      \ uma vers\xE3o alternativa ou uma variante de grafia, etc."
    from_schema: https://tradicional.arq.br/schema/thing
    slot_uri: wasth:label_type
    ifabsent: string(alternative)
    alias: label_type
    owner: Appellation
    domain_of:
    - Appellation
    range: LabelType
  work__work_type_condition:
    name: work__work_type_condition
    description: "Descriptors for objects that are distinguishable by their overall\
      \ state such as appearance, level of damage, completeness, or quality. If an\
      \ object is identified by its prevailing physical state, then it is qualified\
      \ by condition.\nBased on [AAT \"conditions\"](http://vocab.getty.edu/page/aat/300389724)\
      \ and [CIDOC CRM \"E3 Condition State\"](http://cidoc-crm.org/html/cidoc_crm_v7.1.1_with_translations.html#E3)\n\
      Atende aos campos do [SICG](https://sicg.iphan.gov.br/sicg/manual/manual.htmlhttps://sicg.iphan.gov.br/sicg/manual/manual.html)\
      \ \"estado de preserva\xE7\xE3o\" e \"estado de conserva\xE7\xE3o\"."
    from_schema: https://tradicional.arq.br/schema/work
    mappings:
    - lido:lido00937
    slot_uri: lido:lido00937
    alias: work_type_condition
    owner: Work
    domain_of:
    - Work
    range: ConceptReference
    recommended: true
    multivalued: true
    inlined: true
    inlined_as_list: false
  work__work_type_form:
    name: work__work_type_form
    description: "Descriptors for objects that are distinguishable by their physical\
      \ form or by the manner in which they are presented. If an object is identified\
      \ by sight, then it is qualified by form.\nBased on [AAT Guidelines \"Types\
      \ of Guide Terms\"](https://www.getty.edu/research/tools/vocabularies/guidelines/aat_3_1_hierarchical_rels.html)\n\
      Nos Document\xE1rios da Arquitetura Tradicional, designa uma tipologia formal."
    from_schema: https://tradicional.arq.br/schema/work
    mappings:
    - lido:lido00766
    slot_uri: lido:lido00766
    alias: work_type_form
    owner: Work
    domain_of:
    - Work
    range: ConceptReference
    recommended: true
    multivalued: true
    inlined: true
    inlined_as_list: false
  work__work_type_function:
    name: work__work_type_function
    description: "Objects that are distinguishable by the particular purpose for which\
      \ they are designed or used. If an object is identifiable by its intended use,\
      \ then it is qualified by function.\nBased on [AAT Guidelines \"Types of Guide\
      \ Terms\"](https://www.getty.edu/research/tools/vocabularies/guidelines/aat_3_1_hierarchical_rels.html)\n\
      Nos Document\xE1rios da Arquitetura Tradicional, designa um dos sete tipos de\
      \ prop\xF3sitos concebidos por C. William Westfall e Samir Youn\xE9s em *Architectural\
      \ Type and Character*."
    from_schema: https://tradicional.arq.br/schema/work
    mappings:
    - lido:lido00767
    slot_uri: lido:lido00767
    alias: work_type_function
    owner: Work
    domain_of:
    - Work
    range: ConceptReference
    recommended: true
    multivalued: true
    inlined: true
    inlined_as_list: false
  work__work_type_context:
    name: work__work_type_context
    description: "Descriptors for objects that are distinguishable by their use or\
      \ application within a particular physical location. If an object is identifiable\
      \ by association with specific surroundings, it is qualified by location or\
      \ context.\nBased on [AAT Guidelines \"Types of Guide Terms\"](https://www.getty.edu/research/tools/vocabularies/guidelines/aat_3_1_hierarchical_rels.html)\n\
      Nos Document\xE1rios da Arquitetura Tradicional, designa a situa\xE7\xE3o de\
      \ implanta\xE7\xE3o da edifica\xE7\xE3o, por exemplo se est\xE1 em contexto\
      \ urbano ou rural, isolada ou em correnteza..."
    from_schema: https://tradicional.arq.br/schema/work
    mappings:
    - lido:lido00934
    slot_uri: lido:lido00934
    alias: work_type_context
    owner: Work
    domain_of:
    - Work
    range: ConceptReference
    recommended: true
    multivalued: true
    inlined: true
    inlined_as_list: false
  work__work_type_material_tech:
    name: work__work_type_material_tech
    description: "Descriptors for objects that are distinguishable by their materials\
      \ encorporated, or the techniques used to create the object or work. If an object\
      \ is identified by the substances detected and/or the processes employed, then\
      \ it is qualified by material or technique.\nNos Document\xE1rios da Arquitetura\
      \ Tradicional, refere-se \xE0 caracteriza\xE7\xE3o construtiva geral da edifica\xE7\
      \xE3o."
    from_schema: https://tradicional.arq.br/schema/work
    mappings:
    - lido:lido00789
    slot_uri: lido:lido00789
    alias: work_type_material_tech
    owner: Work
    domain_of:
    - Work
    range: MaterialTech
    recommended: true
    multivalued: true
    inlined: true
    inlined_as_list: false
  work__work_type_subject_type:
    name: work__work_type_subject_type
    description: "Descriptors for objects that are distinguishable by their topics,\
      \ themes, or other content of the work. If an object is identified by what it\
      \ is of or about, then it is qualified by subject.\nBased on [AAT \"subjects\"\
      ](http://vocab.getty.edu/page/aat/300404126)\nNos Document\xE1rios da Arquitetura\
      \ Tradicional, \xE9 o \xFAnico bloco opcional desta se\xE7\xE3o\u2009: ele indica,\
      \ se houver, uma classifica\xE7\xE3o iconogr\xE1fica mais espec\xEDfica do que\
      \ `form` ou `function`."
    from_schema: https://tradicional.arq.br/schema/work
    mappings:
    - lido:lido00768
    slot_uri: lido:lido00768
    alias: work_type_subject_type
    owner: Work
    domain_of:
    - Work
    range: ConceptReference
    recommended: true
    multivalued: true
    inlined: true
    inlined_as_list: false
  work__work_type_use:
    name: work__work_type_use
    description: "Descriptors for objects that are distinguishable by the way they\
      \ are employed, occupied, applied, or function. If an object is identifiable\
      \ by its particular mode of use, it is qualified by use.\nBased on [AAT \"use\"\
      ](http://vocab.getty.edu/page/aat/300068844)\nNos Document\xE1rios da Arquitetura\
      \ Tradicional, designa propriamente a(s) classifica\xE7\xE3o(\xF5es) de usos\
      \ do solo ou atividades predominante(s) na edifica\xE7\xE3o atualmente."
    from_schema: https://tradicional.arq.br/schema/work
    mappings:
    - lido:lido00938
    slot_uri: lido:lido00938
    alias: work_type_use
    owner: Work
    domain_of:
    - Work
    range: ConceptReference
    recommended: true
    multivalued: true
    inlined: true
    inlined_as_list: false
  work__class_genre:
    name: work__class_genre
    description: "A broad category for grouping objects on the basis of shared intrinsic\n\
      characteristics. The relationship between an object/work and the object\ngenre\
      \ is a generic is-a-relation rather than a membership based on\nascription to\
      \ a subject group.\n\nNote that the\n[AAT Object Genres](http://vocab.getty.edu/page/aat/300185711)\
      \ hierarchy\ndiffers in its scope from Object genre here in that the AAT includes\
      \ more\nspecific terms grouped by various aspects. In general, AAT descriptors\n\
      are not intended to be used as indexing terms for classification.\n\n\u2753\
      \ Ainda n\xE3o implementamos o bloco `objectClassification` do LIDO.\nTalvez\
      \ ele n\xE3o seja relevante para o document\xE1rio de arquitetura\ndom\xE9stica,\
      \ e n\xE3o \xE9 obrigat\xF3rio no padr\xE3o LIDO nem no perfil de aplica\xE7\
      \xE3o\npara arquitetura.\n"
    from_schema: https://tradicional.arq.br/schema/work
    mappings:
    - lido:lido00853
    slot_uri: lido:lido00853
    alias: class_genre
    owner: Work
    domain_of:
    - Work
    range: ConceptReference
    multivalued: true
    inlined: true
    inlined_as_list: false
  work__class_subject:
    name: work__class_subject
    description: "A broad category for grouping objects or works on the basis of a\
      \ topical association, including thematic or systematic classification, or an\
      \ assignment by discipline. The relationship between an object/work and a subject\
      \ category is a kind of membership based on ascription rather than a generic\
      \ is-a relation.\n\u2753 Ainda n\xE3o implementamos o bloco `objectClassification`\
      \ do LIDO. Talvez ele n\xE3o seja relevante para o document\xE1rio de arquitetura\
      \ dom\xE9stica, e n\xE3o \xE9 obrigat\xF3rio no padr\xE3o LIDO nem no perfil\
      \ de aplica\xE7\xE3o para arquitetura."
    from_schema: https://tradicional.arq.br/schema/work
    mappings:
    - lido:lido00932
    slot_uri: lido:lido00932
    alias: class_subject
    owner: Work
    domain_of:
    - Work
    range: ConceptReference
    multivalued: true
    inlined: true
    inlined_as_list: false
  work__class_local:
    name: work__class_local
    description: "A classification scheme for grouping objects on the basis of locally\
      \ defined criteria, including categories corresponding to the curatorial departments\
      \ of the repository, such as \"prints and drawings\", \"decorative arts\", \"\
      North America\", \"invertebrates\", \"Bronze Age\" or \"textiles\". [Based on\
      \ CCO \"Class\"](https://vraweb.org/wp-content/uploads/2020/04/CatalogingCulturalObjectsFullv2.pdf)\n\
      \u2753 Ainda n\xE3o implementamos o bloco `objectClassification` do LIDO. Talvez\
      \ ele n\xE3o seja relevante para o document\xE1rio de arquitetura dom\xE9stica,\
      \ e n\xE3o \xE9 obrigat\xF3rio no padr\xE3o LIDO nem no perfil de aplica\xE7\
      \xE3o para arquitetura."
    from_schema: https://tradicional.arq.br/schema/work
    mappings:
    - lido:lido01135
    slot_uri: lido:lido01135
    alias: class_local
    owner: Work
    domain_of:
    - Work
    range: ConceptReference
    multivalued: true
    inlined: true
    inlined_as_list: false
  work__class_special:
    name: work__class_special
    description: "A classification scheme for grouping objects on the basis of criteria\
      \ defined within specific academic disciplines or cultural domains, such as\
      \ the \"Hornbostel-Sachs Classification of Musical Instruments\", the \"Nickel-Strunz\
      \ classification\", biological taxonomies etc. Refers to classification schemes\
      \ that group objects on the basis of object characteristics, not on the basis\
      \ of themes or topics which the objects or works are related to.\n\u2753 Ainda\
      \ n\xE3o implementamos o bloco `objectClassification` do LIDO. Talvez ele n\xE3\
      o seja relevante para o document\xE1rio de arquitetura dom\xE9stica, e n\xE3\
      o \xE9 obrigat\xF3rio no padr\xE3o LIDO nem no perfil de aplica\xE7\xE3o para\
      \ arquitetura."
    from_schema: https://tradicional.arq.br/schema/work
    mappings:
    - lido:lido01144
    slot_uri: lido:lido01144
    alias: class_special
    owner: Work
    domain_of:
    - Work
    range: ConceptReference
    multivalued: true
    inlined: true
    inlined_as_list: false
  work__inscriptions:
    name: work__inscriptions
    description: "Marcas, s\xEDmbolos ou textos gravados na edifica\xE7\xE3o, especialmente\

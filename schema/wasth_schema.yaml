  EventPlaceType:
    name: EventPlaceType
    definition_uri: https://tradicional.arq.br/schema/EventPlaceType
    description: "Para eventos que implicam a desloca\xE7\xE3o do bem, indica se o\
      \ local se refere ao descobrimento, \xE0 origem ou ao destino da obra."
    from_schema: https://tradicional.arq.br/schema
    permissible_values:
      discovery:
        text: discovery
        meaning: term:lido01037
      origin:
        text: origin
        meaning: term:lido00220
      destination:
        text: destination
        meaning: term:lido00221
  PeriodNameType:
    name: PeriodNameType
    definition_uri: https://tradicional.arq.br/schema/PeriodNameType
    description: "O vocabul\xE1rio de tipos de per\xEDodo/estilo do LIDO \xE9 uma\
      \ lista controlada estruturada de termos recomendada para uso como valores do\
      \ atributo de tipo do elemento Per\xEDodo/Estilo.\nO atributo de tipo qualifica\
      \ o tipo particular de informa\xE7\xE3o de per\xEDodo/estilo, como estilo, per\xED\
      odo ou movimento. Exemplos podem ser \u201Cneol\xEDtico\u201D para um per\xED\
      odo, \u201Cimpressionista\u201D para um estilo ou \u201Ccubismo\u201D para um\
      \ movimento.\nBaseado na categoria do [CDWA \"Styles/Periods/Groups/Movements\"\
      ](http://www.getty.edu/research/publications/electronic_publications/cdwa/17styles.html)\n"
    from_schema: https://tradicional.arq.br/schema
    permissible_values:
      period:
        text: period
        description: 'A distinct named historical or cultural portion or division
          of time during which something runs its course, characterized by some prevalent
          or distinguishing condition, circumstance, or occurrence, or by the rule
          of a particular government.

          '
        meaning: term:lido00731
      style:
        text: style
        description: 'A distinct configuration of artistic elements that together
          constitute a named manner of expression peculiar to a certain epoch, people,
          or to a visual appearance, technique, or visual language adopted by particular
          adherents of that language.

          '
        meaning: term:lido00732
      group:
        text: group
        description: 'A cultural group, which includes societies or groups of people
          characterized by common ideas, customs, social behavior, products, or way
          of life within a particular nation, people, or period.

          '
        meaning: term:lido00735
      movement:
        text: movement
        description: 'The state or process in which events or conditions transpire,
          a tendency, or a trend evident at a particular time or in a particular sphere,
          particularly a course or series of actions and endeavours on the part of
          a group of people working towards a shared goal or to advance a shared political,
          social, or artistic objective.

          '
        meaning: term:lido00733
      dynasty:
        text: dynasty
        description: 'The succession of rulers from the same family, line, stock,
          or group, during a particular period of time; extended to include all the
          people and culture surrounding this succession of rulers.

          '
        meaning: term:lido00734

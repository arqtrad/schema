  LabelType:
    name: LabelType
    definition_uri: https://tradicional.arq.br/schema/LabelType
    description: "No SKOS, caracteriza se cada termo deve ser considerado preferencial\
      \ ou alternativo, usado para indexa\xE7\xE3o, oculto da visualiza\xE7\xE3o (usado\
      \ apenas para buscas), etc.\n"
    from_schema: https://tradicional.arq.br/schema
    permissible_values:
      alternative:
        text: alternative
        description: "Abrevia\xE7\xF5es, abreviaturas, variantes lexicais e formas\
          \ irregulares de singular ou plural podem ser inclu\xEDdas como termos ou\
          \ t\xEDtulos alternativos para um conceito ou objeto. No caso de edifica\xE7\
          \xF5es ou conjuntos que s\xE3o conhecidos por mais de um nome (por exemplo,\
          \ pela sua fun\xE7\xE3o atual ou antiga, ou pelo endere\xE7o), selecionar\
          \ `alternative` e indicar o tipo de t\xEDtulo."
        meaning: skos:altLabel
      display:
        text: display
        description: "Nome a ser apresentado na interfaz p\xFAblica, incluindo artigos\
          \ se for o caso."
        meaning: term:lido00526
      hidden:
        text: hidden
        description: "Uma variante do nome com erros comuns de grafia ou imprecis\xF5\
          es lexicais, mas que seja relevante para buscas dos usu\xE1rios. Deve ficar\
          \ oculto da interfaz p\xFAblica."
        meaning: skos:hiddenLabel
      indexing:
        text: indexing
        description: "Nome, termo ou identificador a ser usado em indexa\xE7\xE3o,\
          \ por exemplo removendo artigos ou part\xEDculas iniciais, invertendo a\
          \ ordem do nome e do sobrenome, etc."
        meaning: term:lido00961
      preferred:
        text: preferred
        description: "O nome, termo ou t\xEDtulo preferencial. Normalmente n\xE3o\
          \ usaremos esta op\xE7\xE3o pois o campo `title` j\xE1 contempla a op\xE7\
          \xE3o preferencial."
        meaning: skos:prefLabel
  MaterialTechType:
    name: MaterialTechType
    definition_uri: https://tradicional.arq.br/schema/MaterialTechType
    description: "A materialidade e as t\xE9cnicas de produ\xE7\xE3o ou interven\xE7\
      \xE3o na edifica\xE7\xE3o devem ser categorizadas segundo esta classifica\xE7\
      \xE3o.\n"
    notes:
    - 'The physical matter or substance from which an object is made, including any
      tangible substances, either naturally or synthetically derived, ranging from
      specific materials to types of material designated by their function. The term
      comprises both the media that are incorporated in an object and any support
      to which the media are applied.

      Based on [AAT "materials (matter)"](http://vocab.getty.edu/page/aat/300010358);
      [CDWA "Materials/Techniques"](http://www.getty.edu/research/publications/electronic_publications/cdwa/8materials.html#RTFToC2)

      Use the most specific term for the material that is appropriate. It is strongly
      recommended to take the indexing term from a published controlled vocabulary,
      preferably a Linked Open Vocabulary, for example the Art & Architecture Thesaurus,
      specifically its [Materials hierarchy](http://www.getty.edu/vow/AATFullDisplay?find=materials&amp;logic=AND&amp;note=&amp;page=1&amp;subjectid=300010357).'
    - 'Medium, as a value for the type attribute of the LIDO Term Materials/Techniques
      element, designates the material that is applied to a support in the making
      of an object or a work of art, such as ink on paper or oil paint on canvas;
      often a particular technique or techniques are closely associated with the media.
      Based on [AAT "media (artists'' materials)"](http://vocab.getty.edu/page/aat/300163343);
      [CDWA Materials/Techniques](https://www.getty.edu/research/publications/electronic_publications/cdwa/8materials.html#implement).

      In many forms of art, a distinction is made between materials used as the media,
      and materials used as the support. Medium is the material applied to the support.
      For example, for a drawing described as pen and brown ink and black chalk on
      paper, pen is the instrument, ink and black chalk are the media, and paper is
      the support. [Cited from Categories for the Description of Works of Art (CDWA)
      "Materials/Techniques"]'
    - 'Support, as a value for the type attribute of the LIDO Term Materials/Techniques
      element, designates the surface material to which media are applied or a work
      is mounted, for example canvas, oak panel, laid paper, wood, copper, glass,
      or marble. For example, with paintings, drawings, prints, or photographs, the
      media would be applied to the surface of a support such as paper, wood panel,
      canvas, or glass in order to create the image. Used typically for two-dimensional
      works, although the concept may apply to any work.

      Based on [AAT "supports"](http://vocab.getty.edu/page/aat/300014844); [CDWA
      "Materials/Techniques"](https://www.getty.edu/research/publications/electronic_publications/cdwa/8materials.html#implement)'
    - 'Record a term specifying the color, tint, or hue of the material, particularly
      if color is an unusual or important characteristic of the object. [All colored
      impressions of materials of an object are meant, not just parts treated with
      dyestuff. The information refers to the overall effect of color, not only as
      cause of, e.g., dyeing or painting.]

      It is recommended to use internationally approved standard color charts, codes
      and terminology such as the Universal Color Language (UCL). Use preferably [color
      names as specified by the Art & Architecture Thesaurus](http://vocab.getty.edu/aat/300080438)
      (AAT). Centroid color numbers, which refer to the appropriate color-blocks on
      the [Inter-Society Color Council and National Bureau of Standards (ISCC-NBS)
      color name charts](https://en.wikipedia.org/wiki/ISCC%E2%80%93NBS_system), are
      also provided by the AAT.'
    - 'Implement, as a value for the type attribute of the LIDO Term Materials/Techniques
      element, designates any object used to carry out the technique in order to create
      or modify an object, including equipment, tools, apparatus, utensils, instruments,
      and other things employed in any trade or used in executing a task or work.

      Based on [CDWA "Materials/Techniques"](http://www.getty.edu/research/publications/electronic_publications/cdwa/8materials.html#RTFToC2);
      [AAT "implements"](http://vocab.getty.edu/page/aat/300404585)'
    - 'Technique, as a value for the type attribute of the LIDO Term Materials/Techniques
      element, designates the manner, method, or process applied in the creation,
      design, or modification of an object.

      Based on [CDWA "Materials/Techniques"](http://www.getty.edu/research/publications/electronic_publications/cdwa/8materials.html#RTFToC2).

      Use the most specific term for indexing that is appropriate. It is strongly
      recommended to take the indexing term from a published controlled vocabulary,
      preferably a [Linked Open Vocabulary](http://lov.okfn.org/dataset/lov/), for
      example the Art & Architecture Thesaurus, specifically its [Processes and Techniques
      hierarchy](http://www.getty.edu/vow/AATHierarchy?find=techniques&amp;logic=AND&amp;note=&amp;page=1&amp;subjectid=300053001).

      For information about scientific methods by which an object was found or collected,
      such as field collection methods in archaeology, use the LIDO Event Method element.'
    - 'Watermark, as a value for the type attribute of the LIDO Term Materials/Techniques
      element, designates an identification of the watermark type or name. A watermark
      is a design incorporated into paper as it is made, typically a sign of the manufacturer,
      or a proof of authenticity for documents and banknotes. The mark is visible
      through transmitted light, appearing as translucent or shaded area.

      Based on [CDWA "Materials/Techniques"](http://www.getty.edu/research/publications/electronic_publications/cdwa/8materials.html#WatermarkIdentification);
      [AAT "watermarks"](http://vocab.getty.edu/aat/300028749)

      It is recommended to use as indexing terms descriptors of internationally or
      nationally approved classifications, such as the [Watermark Information System](http://www.wasserzeichen-online.de/wzis/index.php),
      the [Index of watermark classes and subclasses](http://www.paperhistory.org/Standards/IPHN2.1.1_en.pdf),
      provided as a [Registration Standard](http://www.paperhistory.org/Standards/)
      of the [International Association of Paper Historians (IPH)](http://www.paperhistory.org/index.php),
      or the [Watermark Descriptor Tables](http://www.gravell.org/descriptors.php?&amp;&amp;offset=&amp;rectotal=&amp;query=),
      provided by the [Thomas L. Gravell Watermark Archive](http://www.gravell.org/).'
    from_schema: https://tradicional.arq.br/schema
    permissible_values:
      material:
        text: material
        meaning: term:lido00132
      medium:
        text: medium
        meaning: term:lido00513
      support:
        text: support
        meaning: term:lido00514
      color_name:
        text: color_name
        meaning: term:lido00479
      implement:
        text: implement
        meaning: term:lido00248
      technique:
        text: technique
        meaning: term:lido00131
      watermark:
        text: watermark
        meaning: term:lido00427
      other:
        text: other

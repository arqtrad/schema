  Work_category:
    name: Work_category
    definition_uri: https://tradicional.arq.br/schema/category
    description: "Uma classifica\xE7\xE3o ampla para o objeto descrito na ficha, usando\
      \ o vocabul\xE1rio controlado do LIDO.\nNos document\xE1rios de edifica\xE7\xF5\
      es, preencher este campo OBRIGATORIAMENTE com `term:lido00096` (\"Objeto manufaturado\"\
      ).\nNo vocabul\xE1rio controlado, preencher este campo OBRIGATORIAMENTE com\
      \ `term:lido01193` (\"Objeto conceitual\").\n---------------------------------------------------------------------\n\
      The LIDO Category Vocabulary is a structured controlled list of terms recommended\
      \ to use as values in the LIDO Category element.\nExamples are human-made object\
      \ or natural object."
    from_schema: https://tradicional.arq.br/schema/thing
    mappings:
    - term:lidoCategory

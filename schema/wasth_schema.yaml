    inlined_as_list: false
  broader:
    name: broader
    definition_uri: https://tradicional.arq.br/schema/broader
    description: "Um conceito de significa\xE7\xE3o mais gen\xE9rica. Conceitos gen\xE9\
      ricos s\xE3o tipicamente representados como pais em uma hierarquia de conceitos\
      \ (\xE1rvore).\nPreenchimento manual."
    from_schema: https://tradicional.arq.br/schema/concept

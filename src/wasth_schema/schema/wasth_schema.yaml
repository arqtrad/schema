types:

  CslCitekey:
    description: >
      Chave de citação compatível com o Citation Style Language,
      começando com '@'.
      Obter as chaves de citação das referências bibliográficas consultando
      a nossa biblioteca compartilhada no Zotero.
    uri: xsd:string
    base: str
    pattern: '^@[a-zA-Z0-9_][\w:.#$%&\-+?<>~/]*$'

  GeoJSONCoordinateArray:
    description: >-
      JSON array of GeoJSON positions. The valid nesting depends on the
      associated geometry type.
    uri: xsd:string
    base: str

  Latitude:
    description: "Latitude em graus decimais (separador: ponto)."
    uri: xsd:double
    base: float
    minimum_value: -90
    maximum_value: 90

  Longitude:
    description: "Longitude em graus decimais (separador: ponto)."
    uri: xsd:double
    base: float
    minimum_value: -180
    maximum_value: 180

  OrcidId:
    description: >-
      ORCID iD, sem o prefixo https://orcid.org/.
    uri: xsd:string
    base: str
    pattern: '^[0-9]{4}-[0-9]{4}-[0-9]{4}-[0-9]{3}[0-9X]$'

  OlcPlusCode11:
    description: Open Location Code (Plus Code) com resolução de 11 dígitos.
    uri: xsd:string
    base: str
    pattern: '^([2-9CFGHJMPQRVWX]{8})\+([2-9CFGHJMPQRVWX]{3})$'

  GeonamesId:
    description: >-
      Identificador de lugar no GeoNames, na forma de um CURIE
      `geonames:1234`.
    uri: xsd:anyURI
    base: str
    pattern: '^geonames:[0-9]+$'
    repr: str

      is, for instance, a description of a generic subject, an identification
      of a named individual, or an interpretation of the theme.

      Note that "Iconclass notations" are distinguished from other index terms
      for subject type in order to consider the impact of the type of indexing
      vocabulary with respect to information retrieval facilities.
    reachable_from:

id: https://tradicional.arq.br/schema/work
name: wasth-work
title: WASTH Work

prefixes:
  linkml: https://w3id.org/linkml/
  wasth: https://tradicional.arq.br/schema/
  schema: http://schema.org/
  lido: http://www.lido-schema.org/
  term: http://terminology.lido-schema.org/
  dcterms: http://purl.org/dc/terms/
  unit: http://qudt.org/vocab/unit/
  skos: http://www.w3.org/2004/02/skos/core#

default_prefix: wasth
default_range: string

classes:

  Work:
    is_a: Thing
    class_uri: schema:LandmarksOrHistoricalBuildings
    close_mappings:
      - crm:E22_Human-Made_Object

    description: >
      Nos Documentários da Arquitetura Tradicional, esta ficha é usada
      para cadastrar uma edificação, um conjunto arquitetônico, ou ainda
      uma parte significativa de uma edificação.

      <h3>Especificação e modelo de preenchimento</h3>

      As instruções de preeenchimento para cada elemento da ficha se encontram
      na seção [Slots](#slots).

      Observe como exemplo de ficha (quase) completamente preenchida a
      [Casa dos Sete
      Candeeiros](https://github.com/arqtrad/casa/blob/main/br-ba-salvador-casa_7_candeeiros.md?plain=1).

      Em caso de dúvidas quanto à formatação da ficha, observe as informações
      acerca da especificação [YAML](https://www.yaml.info/learn/index.html).

      Todos os grupos que começam com um hífen `-` são listas que podem
      conter qualquer número de linhas ou blocos.

      A ordem dos blocos não é importante, mas a hierarquia dentro de cada
      bloco e a indentação de dois espaços por nível hierárquico, sim.

      O caractere `#` indica o início de um comentário, que prossegue
      até o final da linha.
      Os comentários e as linhas que contêm apenas comentários
      devem ser apagados das fichas preenchidas.

      Campos não preenchidos também devem ser apagadas das fichas.

      -------------------------------------------------------------------------

      An historical landmark or building.

    # This class comprises all persistent physical objects of any size that are
    # purposely created by human activity and have physical boundaries that
    # separate them completely in an objective way from other objects.

    # The class also includes all aggregates of objects made for functional
    # purposes of whatever kind, independent of physical coherence, such as a
    # set of chessmen.

    attributes:

      title_type:
        range: TitleType
        required: true


      work_type_condition:
        slot_uri: term:lido00937
        recommended: true
        range: ConceptReference
        multivalued: true
        inlined_as_list: true
        description: >-
          Descreve o estado físico da edificação quanto à sua aparência de
          completude, deterioração ou capacidade de desempenhar sua função.

          Atende aos campos do
          [SICG](https://sicg.iphan.gov.br/sicg/manual/manual.html)
          "estado de preservação" e "estado de conservação".

          ---------------------------------------------------------------------

          Descriptors for objects that are distinguishable by their overall state
          such as appearance, level of damage, completeness, or quality. If an
          object is identified by its prevailing physical state, then it is
          qualified by condition.

          Based on [AAT "conditions"](http://vocab.getty.edu/page/aat/300389724)
          and [CIDOC CRM "E3 Condition
          State"](http://cidoc-crm.org/html/cidoc_crm_v7.1.1_with_translations.html#E3)

      work_type_form:
        slot_uri: term:lido00766
        recommended: true
        range: ConceptReference
        multivalued: true
        inlined_as_list: true
        description: >-
          Nos Documentários da Arquitetura Tradicional,
          designa uma tipologia formal.

          O vocabulário controlado para este item está em processo de
          estruturação.

          ---------------------------------------------------------------------

          Descriptors for objects that are distinguishable by their physical
          form or by the manner in which they are presented. If an object is
          identified by sight, then it is qualified by form.

          Based on [AAT Guidelines "Types of Guide
          Terms"](https://www.getty.edu/research/tools/vocabularies/guidelines/aat_3_1_hierarchical_rels.html)

      work_type_function:
        slot_uri: term:lido00767
        recommended: true
        range: ConceptReference
        multivalued: true
        inlined_as_list: true
        description: >-
          Nos Documentários de edificações, designa um dos sete
          tipos de propósitos concebidos por C. William Westfall e Samir Younés
          em *Architectural Type and Character*.

          No Documentário de Lugares, designa o papel administrativo da
          localidade, por exemplo freguesia, sede municipal, capital estadual
          ou nacional.

          ---------------------------------------------------------------------

          Objects that are distinguishable by the particular purpose for which
          they are designed or used. If an object is identifiable by its
          intended use, then it is qualified by function.

          Based on [AAT Guidelines "Types of Guide
          Terms"](https://www.getty.edu/research/tools/vocabularies/guidelines/aat_3_1_hierarchical_rels.html)

      work_type_context:
        slot_uri: term:lido00934
        recommended: true
        range: ConceptReference
        multivalued: true
        inlined_as_list: true
        description: >-
          Nos Documentários de edificações, designa sobretudo o contexto
          imediato de implantação de uma edificação : urbana, rural, isolada,
          em correnteza, etc.

          No Documentário de Lugares Tradicionais, designa o tipo de núcleo
          populacional : sítio isolado, povoação rural, vila ou cidade,
          por exemplo.

          ---------------------------------------------------------------------

          Descriptors for objects that are distinguishable by their use or
          application within a particular physical location. If an object is
          identifiable by association with specific surroundings, it is
          qualified by location or context.

          Based on [AAT Guidelines "Types of Guide
          Terms"](https://www.getty.edu/research/tools/vocabularies/guidelines/aat_3_1_hierarchical_rels.html)

      work_type_material_tech:
        slot_uri: term:lido00789
        recommended: true
        range: MaterialTech
        multivalued: true
        inlined_as_list: true
        description: >-
          Nos Documentários da Arquitetura Tradicional, refere-se à
          caracterização construtiva geral da edificação.

          ---------------------------------------------------------------------

          Descriptors for objects that are distinguishable by their materials
          encorporated, or the techniques used to create the object or work.
          If an object is identified by the substances detected and/or the
          processes employed, then it is qualified by material or technique.

      work_type_subject_type:
        slot_uri: term:lido00768
        recommended: true
        range: ConceptReference
        multivalued: true
        inlined_as_list: true
        description: >-
          Nos Documentários da Arquitetura Tradicional, indica, se houver, uma
          classificação iconográfica mais específica do que `form` ou
          `function`.

          ---------------------------------------------------------------------

          Descriptors for objects that are distinguishable by their topics,
          themes, or other content of the work. If an object is identified by
          what it is of or about, then it is qualified by subject.

          Based on [AAT "subjects"](http://vocab.getty.edu/page/aat/300404126)

      work_type_use:
        slot_uri: term:lido00938
        recommended: true
        range: ConceptReference
        multivalued: true
        inlined_as_list: true
        description: >-
          Nos Documentários da Arquitetura Tradicional, designa propriamente
          a(s) classificação(ões) de usos do solo ou atividades predominante(s)
          na edificação atualmente.

          ---------------------------------------------------------------------

          Descriptors for objects that are distinguishable by the way they are
          employed, occupied, applied, or function. If an object is
          identifiable by its particular mode of use, it is qualified by use.

          Based on [AAT "use"](http://vocab.getty.edu/page/aat/300068844)

      classification_genre:
        slot_uri: term:lido00853
        range: ConceptReference
        multivalued: true
        inlined_as_list: true
        description: >
          ❓ Ainda não implementamos o bloco `objectClassification` do LIDO.
          Talvez ele não seja relevante para o documentário de arquitetura
          doméstica, e não é obrigatório no padrão LIDO nem no perfil de
          aplicação para arquitetura.

          ---------------------------------------------------------------------

          A broad category for grouping objects on the basis of shared
          intrinsic characteristics. The relationship between an object/work
          and the object genre is a generic is-a-relation rather than a
          membership based on ascription to a subject group.

          Note that the
          [AAT Object Genres](http://vocab.getty.edu/page/aat/300185711)
          hierarchy differs in its scope from Object genre here in that the AAT
          includes more specific terms grouped by various aspects. In general,
          AAT descriptors are not intended to be used as indexing terms for
          classification.

      classification_subject:
        slot_uri: term:lido00932
        range: ConceptReference
        multivalued: true
        inlined_as_list: true
        description: >-
          ❓ Ainda não implementamos o bloco `objectClassification` do LIDO.
          Talvez ele não seja relevante para o documentário de arquitetura
          doméstica, e não é obrigatório no padrão LIDO nem no perfil de
          aplicação para arquitetura.

          ---------------------------------------------------------------------

          A broad category for grouping objects or works on the basis of a
          topical association, including thematic or systematic classification,
          or an assignment by discipline. The relationship between an
          object/work and a subject category is a kind of membership based on
          ascription rather than a generic is-a relation.

      classification_local:
        slot_uri: term:lido01135
        range: ConceptReference
        multivalued: true
        inlined_as_list: true
        description: >-
          ❓ Ainda não implementamos o bloco `objectClassification` do LIDO.
          Talvez ele não seja relevante para o documentário de arquitetura
          doméstica, e não é obrigatório no padrão LIDO nem no perfil de
          aplicação para arquitetura.

          ---------------------------------------------------------------------

          A classification scheme for grouping objects on the basis of locally
          defined criteria, including categories corresponding to the
          curatorial departments of the repository, such as "prints and
          drawings", "decorative arts", "North America", "invertebrates",
          "Bronze Age" or "textiles". [Based on CCO
          "Class"](https://vraweb.org/wp-content/uploads/2020/04/CatalogingCulturalObjectsFullv2.pdf)

      classification_special:
        slot_uri: term:lido01144
        range: ConceptReference
        multivalued: true
        inlined_as_list: true
        description: >-
          ❓ Ainda não implementamos o bloco `objectClassification` do LIDO.
          Talvez ele não seja relevante para o documentário de arquitetura
          doméstica, e não é obrigatório no padrão LIDO nem no perfil de
          aplicação para arquitetura.

          ---------------------------------------------------------------------

          A classification scheme for grouping objects on the basis of criteria
          defined within specific academic disciplines or cultural domains,
          such as the "Hornbostel-Sachs Classification of Musical Instruments",
          the "Nickel-Strunz classification", biological taxonomies etc. Refers
          to classification schemes that group objects on the basis of object
          characteristics, not on the basis of themes or topics which the
          objects or works are related to.


      part_of:
        slot_uri: dcterms:isPartOf  # lido:partOfPlace
        range: TypedReference
        multivalued: true
        inlined_as_list: true
        description: >-
          Permite identificar o contexto geográfico ou administrativo ao qual
          a edificação se subordina, ou ainda um conjunto arquitetônico,
          urbanístico ou conceitual (por exemplo, uma série de casas) do qual
          ela faz parte.

          ---------------------------------------------------------------------

          A set of structured information about a place that is the broader
          context for the place in focus, such as the district, state, or
          nation to which a city belongs.

      former_site:
        range: Site
        multivalued: true
        inlined_as_list: true
        description: >-
          Indica que a edificação não se encontra mais no local indicado,
          seja porque foi deslocada ou demolida.

      intended_site:
        alias: intended
        range: Site
        multivalued: true
        inlined_as_list: true
        description: >-
          Sinaliza que a edificação devia ocupar um certo local, mas não
          chegou a ser construída.

      other_site:
        alias: other
        range: Site
        multivalued: true
        inlined_as_list: true
        description: >-
          Para casos de implantação não contemplados em nenhuma das categorias
          acima.

      location_historic:
        range: LocationHistoric
        multivalued: true
        inlined_as_list: true
        description: >-
          Antigas jurisdições ou designações para o lugar onde o objeto se
          encontra. Para um sítio de onde o objeto foi fisicamente removido,
          usar a lista `former_site`.


      inscriptions:
        range: Inscription
        multivalued: true
        inlined_as_list: true
        description: >-
          Marcas, símbolos ou textos gravados na edificação, especialmente
          aqueles referentes à estrutura como um todo e não específicos a
          alguma de suas partes. Não usar para iconografia.

      collection:
        slot_uri: lido:collection
        range: Thing
        multivalued: true
        inlined_as_list: true
        description: >
          Descreve conjuntos conceituais nos quais a edificação foi incluída,
          por exemplo catálogos raisonnés, obras de referência, exposições,
          ou agrupamentos *ad-hoc* para formar coleções temáticas de acordo com
          as necessidades do projeto de investigação.

          Para o pertencimento a perímetros de sítios históricos
          tombados/classificados, preencher o grupo `identifiers`.
          Para a identificação de proprietários ou responsáveis,
          preencher o grupo `work_rights`.

        notes:

          - A set of identifying and indexing information about the collection
            the object/work in focus is gathered into or is a member of.

            Collection applies to any accumulated group of physical or digital
            items, conceptually or physically brought together on the basis of a
            focal characteristic. Use cases for grouping items into a collection
            are various and may span curated holdings in museums, departmental
            collections, sets of items to be displayed in an exhibition, or
            aggregations bound informally for cataloging and retrieval purposes.

      work_rights:
        required: true
        range: Right
        multivalued: true
        inlined_as_list: true
        slot_uri: lido:rightsWorkSet
        description: >
          ⚠️  Este bloco se refere a eventuais direitos autorais ou de
          propriedade sobre A EDIFICAÇÃO E O SEU PROJETO, não sobre o conteúdo
          da ficha, nem sobre a iconografia relacionada.


    slot_usage:

      id:
        description: >-
          Cada edificação terá um identificador gerado a partir do seu
          georreferenciamento usando Open Location Code ("PlusCode"). Este
          identificador usa o campo `id`, que será gerado automaticamente pelo
          programa WASTH.
        range: OlcPlusCode11

      record_author:
        required: true

      record_date:
        required: true

      category:
        ifabsent: string(http://terminology.lido-schema.org/lido00096)

      record_rights:
        required: true

      content:
        description: >
          Deixe uma linha em branco após o fechamento dos metadados e inclua
          aqui uma descrição morfológica e histórica da edificação com texto
          livre, usando formatação Markdown.

          Poderá incluir um segundo bloco de metadados para indicar as
          referências bibliográficas da descrição textual, no campo `nocite`.
          O formato é uma lista de chaves de citação do Zotero
          (cada uma começando com `@`) separadas por vírgulas:

          ```yaml
          Conteúdo textual em formato *Markdown* com citações [@citekey].

          ---
          nocite: "@*"
          ---
          ```

    slots:
      - site
      - measurements
      - material
      - technique
      - style_period
      - culture
      - subject
      - related_works
      - resources
      - media


  Site:
    abstract: true
    is_a: Thing
    class_uri: crm:E92_Spacetime_Volume
    exact_mappings:
      - schema:DefinedRegion

    description: >
      O georreferenciamento é o cerne do projeto dos Documentários da
      Arquitetura Tradicional.
      Ele permite investigar a distribuição geográfica das características
      construtivas e morfológicas das edificações cadastradas.

      Este bloco corresponde à terminologia do [DublinCore] `coverage >
      spatial`. Na especificação [LIDO], a localização física de um bem se
      confunde com a sua inserção institucional (repositório).
      Na formatação da nossa ficha, tentamos desfazer essa confusão separando o
      georreferenciamento e o repositório em blocos diferentes.

      As instruções de preenchimento específicas se encontram na documentação
      das classes que fornecem os dados para o sítio.
      Consulte também o [Tutorial de
      georreferenciamento](https://github.com/arqtrad/.github/wiki/Tutorial-de-georreferenciamento)
      para saber como localizar edificações não cadastradas nas bases de dados
      do patrimônio cultural (SICG ou SIPA).

    notes:

      - This class comprises 4-dimensional point sets (volumes) in physical
        spacetime (in contrast to mathematical models of it) regardless of
        their true geometric forms. They may derive their identity from being
        the extent of a material phenomenon or from being the interpretation of
        an expression defining an extent in spacetime. Intersections of
        instances of E92 Spacetime Volume, E53 Place, and E52 Time-Span are
        also regarded as instances of E92 Spacetime Volume. An instance of E92
        Spacetime Volume is either contiguous or composed of a finite number of
        contiguous subsets. Its boundaries may be fuzzy due to the properties
        of the phenomena it derives from or due to the limited precision up to
        which defining expression can be identified with a real extent in
        spacetime. The duration of existence of an instance of E92 Spacetime
        Volume is its projection on time.

    attributes:

      site_type:
        alias: type
        range: RepositoryType
        ifabsent: RepositoryType(geographic)

      location:
        required: true
        description: >-
          Coordenadas geográficas do ponto que permite situar a edificação no
          mapa para fins ilustrativos.
          Usar o sistema de coordenadas geográficas EPSG:4326 (WGS84) sempre
          que possível.

          ---------------------------------------------------------------------

          Representative point location for the place, normally in EPSG:4326
          (WGS 84).
        slot_uri: geo:hasDefaultGeometry
        range: GeographicPoint
        inlined: true

      extent:
        description: >-
          Área da implantação da edificação ou sítio cadastrado.
          Usar o sistema de coordenadas geográficas EPSG:4326 (WGS84) sempre
          que possível.

          ---------------------------------------------------------------------

          Polygonal, multipolygonal, or linear geographic extent associated
          with the place.
        slot_uri: geo:hasGeometry
        range: GeographicExtent
        inlined: true

      event_place_type:
        range: EventPlaceType
        description: >
          Se relevante para a ação, indicar se se trata do local de
          descobrimento do objeto, do local de origem ou destino do seu
          translado. Omitir caso o evento não se enquadre nesses casos.

    slot_usage:
      id:
        range: GeonamesId
        description: >
          Incluir aqui um identificador da base geonames na forma
          `geonames:1234`.


  GeographicPoint:
    description: >
      Coordenadas do ponto que situa o sítio na visualização do mapa.

      A fonte preferencial de autoridade para o georreferenciamento é um órgão
      público, por exemplo o IPHAN no Brasil (usando as coordenadas informadas
      no [SICG]) ou a DGMN em Portugal (usando as coordenadas informadas no
      [SIPA]).

      Caso não haja georreferenciamento oficial, usar uma planta cadastral
      municipal georreferenciada ou, na falta desta, o [Global Building Atlas].
      Nesses casos, para se obter as coordenadas de georreferenciamento,
      é preciso usar um Sistema de Informações Geográficas da sua preferência.

      Como exemplo, no [QGIS], isso pode ser feito seguindo as instruções
      abaixo :

      1. Sempre projetar o mapa usando EPSG:4326 (WGS84) ;

      2. Selecionar o polígono da edificação na camada da planta cadastral ou
         do Global Building Atlas ;

      3. Rodar o comando do menu `Vector > Geometry Tools > Centroids` para
        obter as coordenadas do ponto (`location`) — ele vai criar uma camada
        temporária com o ponto no centróide do polígono selecionado ;

      4. Usar novamente a ferramenta `Get WKT` para visualizar as coordenadas,
        copiar os valores e colar na ficha com o grau de precisão (casas
        decimais) desejado.

    attributes:

      lat:
        description: "Latitude em graus decimais (separador decimal: ponto)."
        required: true
        range: Latitude

      lon:
        description: "Longitude em graus decimais (separador decimal: ponto)."
        required: true
        range: Longitude

      alt:
        description: "Altitude em metros (separador decimal: ponto)"
        range: float
        minimum_value: -1000  # Existem pontos emersos abaixo do nível do mar.
        maximum_value: 10000

      zoom:
        range: integer
        ifabsent: integer(13)
        minimum_value: 0
        maximum_value: 18
        description: >
          Usado para visualizar o mapa mais de longe se a precisão das
          coordenadas for baixa.

    slots:
      - srs_name
      - source
      - bibliographic_citation

  GeographicExtent:
    description: >
      Coordenadas do polígono que define o sítio.

    attributes:

      geometry_type:
        description: Tipo da geometria descrita pelas coordenadas.
        alias: type
        required: true
        range: GeometryType

      coordinates:
        description: >
          No QGIS, usar a ferramenta `Get WKT` para obter as coordenadas do
          polígono (`extent`) com a opção `Get JSON` — copiar apenas os
          colchetes `[[[ ]]]` e os valores numéricos dentro deles.
        required: true
        range: GeoJSONCoordinateArray

    slots:
      - srs_name
      - source
      - bibliographic_citation


  Inscription:
    description: >-
      A descrição da inscrição informa local, dimensões e características. Os
      tipos de descrição podem ser extraídos da hierarquia Getty:
      <http://vocab.getty.edu/page/aat/300220469>.

      Os itens das listas de `material` e `technique` DEVEM usar o nosso
      [vocabulário controlado](https://vocabulario.tradicional.arq.br).

      Essa distinção é especialmente relevante no caso de revestimentos, como
      estuques, azulejos ou pinturas decorativas, por oposição à base sobre a
      qual eles são aplicados.

    attributes:
      # category:
      #   alias: type
      #   (The above requires a uriorcurie, not a string)
      inscription_type:
        alias: type
        required: true
        range: InscriptionType
        ifabsent: string(text)
        description: >
          Determina a natureza da inscrição.

    slots:
      - format_extent
      - description
      - content
      - bibliographic_citation

  Topic:
    description: Subject or iconographic topic.

    attributes:

      topic_type:
        alias: type
        required: true
        range: SubjectType
        description: >
          Categoriza o nível descritivo ou interpretativo do tema.

    slot_usage:
      concept_name:
        required: true

    slots:
      - description
      - format_extent
      - concept_name

  LocationHistoric:
    description: >-
      Designações alternativas ou jurisdições antigas para o mesmo local, NÃO a
      localização original de uma construção fisicamente deslocada (para tanto,
      cadastrar outra localização do tipo `former_site`). Preencher apenas caso
      a nomenclatura seja relevante, por exemplo para nomear as antigas
      províncias de Portugal ou o Oeste da Bahia, que originalmente pertencia a
      Pernambuco, ou ainda se for relevante informar uma região física.

    attributes:

      location_historic_type:
        alias: type
        range: RepositoryType
        required: true
        description: >
          Define se o local histórico designa uma jurisdição, um topônimo
          antigo, ou outro.

      location_historic_name:
        alias: name
        range: TypedReference
        required: true
        inlined: true
        description: >
          Identificação do local com referência a um vocabulário controlado ou
          repositório de topônimos tal como o geonames.


slots:

  site:
    required: true
    range: Site
    inlined: true
    description: >-
      A localização real, atual da edificação — é o que será usado em quase
      todos os casos.

  srs_name:
    recommended: true
    range: uriorcurie
    # ifabsent: string('EPSG:4326')
    description: >-
      Names the coordinate reference system (CRS) that defines the semantics of
      the lat/long pair according to the ISO6709 standard.
      Sempre que possível, usar EPSG:4326, senão os sistemas de referência
      nacionais.

  subject:
    range: Topic
    multivalued: true
    inlined_as_list: true
    slot_uri: lido:subjectSet
    description: >
      Recomenda-se articular o tema em três níveis : descrição, identificação e
      interpretação.

      DESCRIÇÃO se refere a elementos imediatamente reconhecíveis sem
      necessidade de conhecimento especializado : coluna(ta)s, arcadas,
      brasões, cunhais, ornamentos em geral.

      IDENTIFICAÇÃO se refere ao reconhecimento das particularidades
      arquitetônicas ou iconográficas dos elementos : p. ex. as colunas são da
      ordem toscana, a abóbada é de aresta, o brasão pertence a tal família...

      INTERPRETAÇÃO diz respeito ao significado iconológico, alegórico ou
      político dos elementos, incluindo questões de status e estilo.

  related_works:
    range: RelatedWork
    multivalued: true
    inlined_as_list: true
    slot_uri: dcterms:related
    description: >-
      A wrapper for identifying information about an object or work, including
      collections, related to the object/work in focus. May include a weblink.

      As formas mais comuns de relação no nosso projeto são :

        - depicted in: A edificação é representada numa pintura ou desenho
          artístico;

        - documented by: Informações sobre a edificação estão publicadas numa
          referência bibliográfica, processo administrativo ou outro documento
          textual impresso, manuscrito ou eletrônico;

        - has plan / has floor plan / has section / has elevation / has
          rendering: Essas relações mostram a existência de desenhos técnicos
          da edificação, sejam eles históricos ou recentes, compilados de
          fontes externas a este projeto de pesquisa.

        - has construction drawing / has design / has sketch: Essas relações se
          referem a desenhos históricos (fontes primárias) que atestam o
          processo de projeto da edificação.

      ATENÇÃO : OS DESENHOS PRODUZIDOS POR ESTE PROJETO DE PESQUISA DEVEM SER
      CADASTRADOS NO GRUPO resource, MAIS ABAIXO.

      O grupo relation é destinado unicamente a cadastrar relações desta
      edificação com objetos autônomos, tais como outras edificações, conjuntos
      urbanos, obras de artes visuais, referências bibliográficas ou acervos
      arquivísticos.

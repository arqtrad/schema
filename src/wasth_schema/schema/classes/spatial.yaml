id: https://tradicional.arq.br/schema/spatial
name: wasth-spatial
title: WASTH spatial coverage

prefixes:
  linkml: https://w3id.org/linkml/
  wasth: https://tradicional.arq.br/schema/
  geo: http://www.opengis.net/ont/geosparql#
  geonames: http://www.geonames.org/ontology#
  lido: http://www.lido-schema.org/
  schema: http://schema.org/
  tgn: http://vocab.getty.edu/tgn/
  wd: http://www.wikidata.org/entity/

default_prefix: wasth
default_range: string

imports:
  - linkml:types
  - shared
  - place

classes:
  SpatialCoverage:
    description: Current, former, intended, and other spatial associations.
    slots:
      - site
      - former_site
      - intended_site
      - other_site

  Site:
    description: A place associated with a Work.
    slots:
      - display
      - site_name
      - location
      - extent
      - source
      - bibliographic_citation
      - zoom

  GeographicPoint:
    description: WGS84 geographic point.
    slots:
      - lat
      - lon
      - alt
      - srs_name
      - source

  GeographicExtent:
    description: Geographic geometry, normally exported as GeoJSON.
    slots:
      - geometry_type
      - coordinates
      - srs_name
      - source

  HistoricPlace:
    description: Historical geographic or administrative context.
    slots:
      - historic_place_type
      - historic_place_name

slots:

  spatial:
    required: true
    range: SpatialCoverage
    inlined: true

  site:
    required: true
    range: Site
    inlined: true

  former_site:
    alias: former
    range: Site
    multivalued: true
    inlined_as_list: true

  intended_site:
    alias: intended
    range: Site
    multivalued: true
    inlined_as_list: true

  other_site:
    alias: other
    range: Site
    multivalued: true
    inlined_as_list: true

  site_name:
    alias: name
    range: Place
    inlined: false
    slot_uri: schema:location

  location:
    required: true
    description: >-
      Representative point location for the place, normally in EPSG:4326
      (WGS 84).
    slot_uri: geo:hasGeometry
    range: GeographicPoint
    inlined: true

  extent:
    description: >-
      Polygonal, multipolygonal, or linear geographic extent associated with
      the place.
    slot_uri: geo:hasGeometry
    range: GeographicExtent
    inlined: true

  srs_name:
    recommended: true
    alias: srsName
    range: uriorcurie
    inlined: true

  site_source:
    recommended: true
    alias: source
    range: SourceReference
    inlined: true

  zoom:
    range: integer
    ifabsent: integer(13)
    minimum_value: 1
    maximum_value: 19

  lat:
    required: true
    range: Latitude

  lon:
    required: true
    range: Longitude

  alt:
    range: float
    minimum_value: -1000 # Existem pontos emersos abaixo do nível do mar.
    maximum_value: 10000

  geometry_type:
    alias: type
    required: true
    range: GeometryType

  coordinates:
    required: true
    range: GeoJSONCoordinateArray

  historic_place_type:
    alias: type
    required: true
    range: RepositoryType
    ifabsent: string(geographic)

  historic_place_name:
    alias: name
    range: TypedReference
    inlined: true

id: https://tradicional.arq.br/schema/thing
name: wasth-thing
title: WASTH common object model

prefixes:
  linkml: https://w3id.org/linkml/
  wasth: https://tradicional.arq.br/schema/
  dcterms: http://purl.org/dc/terms/
  schema: http://schema.org/
  lido: http://www.lido-schema.org/
  term: http://terminology.lido-schema.org/
  skos: http://www.w3.org/2004/02/skos/core#

default_prefix: wasth
default_range: string

classes:

  Thing:
    abstract: true
    class_uri: crm:E1_CRM_Entity
    exact_mappings:
      - schema:Thing
    description: >
      This class comprises all things in the universe of discourse of the CIDOC
      Conceptual Reference Model.

      It is an abstract concept providing for three general properties:

      - Identification by name or appellation, and in particular by a preferred
        identifier.

      - Classification by type, allowing further refinement of the specific
        subclass to which an instance belongs.

      - Attachment of free text and other unstructured data for the expression
        of anything not captured by formal properties.

      All other classes within the CIDOC CRM are directly or indirectly
      specialisations of E1 CRM Entity.
#     The most generic type of item.

    attributes:

      id:
        identifier: true
        range: uriorcurie
        slot_uri: dcterms:identifier
        description: Unique identifier for this object.

      author:
        range: OrcidId
        slot_uri: dcterms:creator
        description: ORCID iD of the record author or maintainer.

      record_date:
        range: date
        slot_uri: dcterms:created
        description: Date the record was created or last substantively revised.

      title:
        description: The preferred human-readable label for a Thing.
        required: true
        range: string
        slot_uri: dcterms:title
        exact_mappings:
          - schema:name

      title_source:
        description: >-
          📚 A fonte do título title_source é opcional ; um título pode ser
          atestado em mais de uma fonte, por isso este campo é uma lista de
          itens (cada item começa com um hífen).

          Se a fonte for cadastrada, o campo `refid` deve conter a chave de
          citação (citation key) que consta do registro bibliográfico na
          biblioteca do nosso projeto de pesquisa no Zotero. Em geral, a chave
          de citação é o DOI ou ISBN da publicação, mas pode ser diferente.

          Se necessário, incluir no campo note uma especificação adicional,
          como o número da página da referência bibliográfica de onde a
          informação foi extraída.

          Todos os campos source no restante da ficha devem ser preenchidos do
          mesmo modo. (Equivalente DublinCore: bibliographiCitation).
        range: BibliographicCitation
        multivalued: true
        inlined_as_list: true

      alt_name:
        description: >
          O bloco `alt_name` permite cadastrar outros nomes pelos quais a edificação
          será eventualmente conhecida. É uma lista opcional de itens, e se
          existir, os campos de cada item da lista devem ser preenchidos como os do
          título principal.

          O campo `description` de cada item contém o texto do título (nome).

          Este bloco pode ser omitido por completo se não houver títulos
          alternativos.
        range: Appellation
        multivalued: true
        inlined_as_list: true

      category:
        slot_uri: term:lidoCategory
        designates_type: true
        range: uriorcurie
        required: true
        description: >-
          The LIDO Category Vocabulary is a structured controlled list of terms
          recommended to use as values in the LIDO Category element.

          Examples are human-made object or natural object.

          Nos documentários de edificações, preencher este campo
          obrigatoriamente com `term:lido00096`
        # ifabsent: string(term:lido00096)

      identifiers:
        range: TypedReference
        multivalued: true
        inlined_as_list: true
        description: Published or external identifiers for the object.

      tags:
        range: string
        multivalued: true
        description: >-
          Provisional uncontrolled keywords. Prefer `classifications` or
          `subject` for curated vocabulary terms.

      temporal:
        description: Temporalidade do objeto.
        range: Event
        multivalued: true
        inlined_as_list: true

      collection:
        range: TypedReference
        multivalued: true
        inlined_as_list: true
        description: Collections or aggregations to which the object belongs.

      repositories:
        range: Repository
        multivalued: true
        inlined_as_list: true
        description: >
          A set of elements for the identification, name and location of the
          repository that is responsible for the object/work in focus.

          Repeated if there are several designations known, or if former
          repositories or geographic places should be listed.

          ---------------------------------------------------------------------

          Nos Documentários da Arquitetura Tradicional, usamos repositórios
          para indicar a inclusão da edificação em perímetros de sítios do
          patrimônio cultural, etc.

          Os repositórios devem ser cadastrados de modo semelhante às
          informações de georreferenciamento, usando o tipo `other`.

      record_rights:
        required: true
        range: Right
        multivalued: true
        inlined_as_list: true
        description: >
          A set of structured information about rights regarding the content
          provided in this LIDO record.

          ---------------------------------------------------------------------

          :warning: Este grupo se refere aos direitos sobre o CONTEÚDO da
          ficha, não sobre os direitos incidentes sobre o objeto descrito.

    slot_usage:
      description:
        required: true

    slots:
      - description
      # Os campos abaixo são opcionais
      - title_type
      - bibliographic_citation
      - content


  Appellation:
    attributes:

      title_preference:
        description: >-
          Indica se o nome em questão deve ser oculto ou não, se é uma versão
          alternativa ou uma variante de grafia, etc.
        alias: label_type
        range: LabelType
        required: true
        # ifabsent: string(alternative)

    slots:
      - description
      - title_type
      - bibliographic_citation

  Repository:
    is_a: Thing
    class_uri: schema:Organization
    description: Entidade com existência jurídica e espacial.
    slots:
      - site
      - legal_body


slots:

  title_type:
    description: Indica se o título é um nome próprio, descritivo, etc.
    alias: type
    range: TitleType
    required: true
    # ifabsent: TitleType(descriptive)

  legal_body:
    range: LegalBody
    required: true

  content:
    recommended: true
    range: string
    slot_uri: skos:scopeNote
    description: >
      Deixe uma linha em branco após o fechamento dos metadados e inclua
      aqui uma descrição morfológica e histórica da edificação com texto
      livre, usando formatação Markdown.

      Poderá incluir um segundo bloco de metadados para indicar as
      referências bibliográficas da descrição textual, no campo `nocite`.
      O formato é uma lista de chaves de citação do Zotero
      (cada uma começando com `@`) separadas por vírgulas:

      ```yaml
      Conteúdo textual em formato *Markdown* com citações [@citekey].

      ---
      nocite: "@*"
      ---
      ```

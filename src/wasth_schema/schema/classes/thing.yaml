id: https://tradicional.arq.br/schema/thing
name: wasth-thing
title: WASTH common object model

prefixes:
  linkml: https://w3id.org/linkml/
  wasth: https://tradicional.arq.br/schema/
  dcterms: http://purl.org/dc/terms/
  schema: http://schema.org/
  lido: http://www.lido-schema.org/
  term: http://terminology.lido-schema.org/
  skos: http://www.w3.org/2004/02/skos/core#

default_prefix: wasth
default_range: string

classes:

  Thing:
    rank: 0
    abstract: true
    class_uri: crm:E1_CRM_Entity
    exact_mappings:
      - schema:Thing
    description: >
      Esta classe compreende todas as coisas no universo do CIDOC CRM.
      É um conceito abstrato que prevê três propriedades gerais:

      - Identificação por nome ou título, em particular por um identificador
        preferencial.
      - Classificação por tipo, permitindo o refinamento da subclasse
        específica à qual a instância pertence.
      - Atribuição de texto livre e de outros dados não estruturados, para
        expressar informações não capturadas por propriedades formais.

      Todas as demais classes do CIDOC CRM são especializações diretas ou
      indiretas de E1 CRM Entity.

      -------------------------------------------------------------------------

      This class comprises all things in the universe of discourse of the CIDOC
      Conceptual Reference Model.

      It is an abstract concept providing for three general properties:

      - Identification by name or appellation, and in particular by a preferred
        identifier.

      - Classification by type, allowing further refinement of the specific
        subclass to which an instance belongs.

      - Attachment of free text and other unstructured data for the expression
        of anything not captured by formal properties.

      All other classes within the CIDOC CRM are directly or indirectly
      specialisations of E1 CRM Entity.
#     The most generic type of item.

    attributes:

      id:
        identifier: true
        range: uriorcurie
        slot_uri: dcterms:identifier
        description: >
          Identificador globalmente único para este objeto ou recurso.

      record_author:
        alias: author
        range: OrcidId
        slot_uri: dcterms:contributor
        description: >
          ORCID iD da pessoa que escreveu a versão original da ficha.
          Alterar apenas no caso de a ficha ter sido substancialmente
          reescrita.

      record_date:
        alias: date
        range: date
        slot_uri: dcterms:created
        description: Data de inclusão da ficha.

      title:
        description: >
          Nome pelo qual este item é mais comumente conhecido.
          Outros nomes podem ser cadastrados em `alt_name`.
        required: true
        range: string
        slot_uri: dcterms:title
        exact_mappings:
          - schema:name

      title_source:
        description: >-
          A fonte do título title_source é opcional ; um título pode ser
          atestado em mais de uma fonte, por isso este campo é uma lista de
          itens (cada item começa com um hífen).
        range: BibliographicCitation
        multivalued: true
        inlined_as_list: true

      alt_name:
        description: >
          O bloco `alt_name` permite cadastrar outros nomes pelos quais o
          objeto ou conceito será eventualmente conhecido. É uma lista opcional
          de itens, e se existir, os campos de cada item da lista devem ser
          preenchidos como os do título principal.

          O campo `label` ou `description` de cada item contém o texto do
          título (nome).

          Este bloco pode ser omitido por completo se não houver títulos
          alternativos.
        range: Appellation
        multivalued: true
        inlined_as_list: true

      category:
        slot_uri: term:lidoCategory
        designates_type: true
        range: uriorcurie
        required: true
        description: >-
          Uma classificação ampla para o objeto descrito na ficha, usando o
          vocabulário controlado do LIDO.

          Nos documentários de edificações, preencher este campo
          OBRIGATORIAMENTE com `term:lido00096` ("Objeto manufaturado").

          No vocabulário controlado, preencher este campo OBRIGATORIAMENTE com
          `term:lido01193` ("Objeto conceitual").

          ---------------------------------------------------------------------

          The LIDO Category Vocabulary is a structured controlled list of terms
          recommended to use as values in the LIDO Category element.

          Examples are human-made object or natural object.
        # ifabsent: string(term:lido00096)

      identifiers:
        range: TypedReference
        multivalued: true
        inlined_as_list: true
        description: >
          Números de inventário e demais códigos que identificam este objeto
          em outras bases de dados.

          Caso esta edificação esteja cadastrada em outras bases de dados (por
          exemplo, [SICG], [SIPA], [HPIP], [iPatrimonio], etc.), pode preencher
          a lista `identifiers` como segue.

          :clipboard:
          O conteúdo de cada bloco é uma lista recuada em dois espaços com
          respeito à categoria superior.
          Seus itens são :

          * `type` é o tipo de referência : pode ser `uri` (padrão), `iri` ou
            `local` — se estiver em dúvida, omita esta linha ;

          * `refid` é obrigatório : representa o identificador do conceito no
            vocabulário controlado ou no repositório de origem — normalmente
            será uma URI (um link para a página web do cadastro) ;

          * `description` deve ser usado para representar textualmente
            o número de inventário, código identificador ou outra informação
            que individualize o objeto na base externa (por exemplo, livro do
            tombo e número do processo de tombamento, no Brasil) ;

          * `bibliographic_citation` é opcional e permite citar uma lista de
            referências bibliográficas que validem a inclusão deste termo.

          * `source` também é opcional e permite cadastrar os dados da pessoa
            jurídica responsável pelo registro.

          ---------------------------------------------------------------------

          Published or external identifiers for the object.

      tags:
        range: string
        multivalued: true
        description: >-
          Lista de palavras-chave que caracterizam o objeto, de modo não
          estruturado. Recomenda-se usar uma palavra-chave de cada um dos
          recortes abaixo:

          - Geográfico ;
          - Cronológico ;
          - Histórico-cultural ;
          - Técnico-construtivo ;
          - Temático ou tipológico ;
          - Funcional.

          ---------------------------------------------------------------------

          Provisional uncontrolled keywords. Prefer `classifications` or
          `subject` for curated vocabulary terms.

      temporal:
        range: Event
        multivalued: true
        inlined_as_list: true
        description: >
          Descrição dos eventos associados ao ciclo de vida da edificação ou
          à existência e/ou uso do objeto ou conceito.
          Ler a respetiva documentação para estruturar este campo.

      repositories:
        range: Repository
        multivalued: true
        inlined_as_list: true
        description: >
          Nos Documentários da Arquitetura Tradicional, usamos repositórios
          para indicar a inclusão da edificação em perímetros de sítios
          tombados/classificados do patrimônio, áreas de interesse
          histórico-cultural, etc.

          O repositório é cadastrado como uma pessoa jurídica dotada de
          extensão geográfica.

          ---------------------------------------------------------------------

          A set of elements for the identification, name and location of the
          repository that is responsible for the object/work in focus.

          Repeated if there are several designations known, or if former
          repositories or geographic places should be listed.

      record_rights:
        range: Right
        multivalued: true
        inlined_as_list: true
        description: >
          Informações estruturadas sobre os direitos que incidem sobre o
          conteúdo textual desta ficha.

          ⚠️  Este grupo se refere aos direitos sobre o CONTEÚDO da
          ficha, não sobre os direitos incidentes sobre o objeto descrito.

          ---------------------------------------------------------------------

          A set of structured information about rights regarding the content
          provided in this LIDO record.

    slot_usage:
      description:
        required: true

    slots:
      - description
      # Os campos abaixo são opcionais
      - title_type
      - bibliographic_citation
      - content


  Appellation:
    attributes:

      title_preference:
        description: >-
          Indica se o nome em questão deve ser oculto ou não, se é uma versão
          alternativa ou uma variante de grafia, etc.
        alias: label_type
        range: LabelType
        required: true
        # ifabsent: string(alternative)

    slot_usage:
      description:
        alias: label

    slots:
      - description
      - title_type
      - bibliographic_citation

  Repository:
    is_a: Thing
    class_uri: schema:Organization

    description: Entidade com existência jurídica e espacial.

    slot_usage:
      title_type:
        range: RepositoryType

    slots:
      - site
      - legal_body


slots:

  title_type:
    description: Indica se o título é um nome próprio, descritivo, etc.
    required: true
    # range: Any
    # ifabsent: TitleType(descriptive)

  legal_body:
    range: LegalBody
    required: true
    description: Informações estruturadas sobre a pessoa jurídica.

  content:
    recommended: true
    range: string
    slot_uri: skos:scopeNote
    description: Conteúdo textual descritivo ou explicativo.

id: https://tradicional.arq.br/schema/thing
name: wasth-thing
title: WASTH common object model

prefixes:
  linkml: https://w3id.org/linkml/
  wasth: https://tradicional.arq.br/schema/
  dcterms: http://purl.org/dc/terms/
  schema: http://schema.org/
  lido: http://www.lido-schema.org/
  skos: http://www.w3.org/2004/02/skos/core#

default_prefix: wasth
default_range: string

imports:
  - linkml:types
  - resource
  - shared

classes:

  Thing:
    abstract: true
    description: >-
      Common data and methods for WASTH objects: architectural works,
      places, and vocabulary concepts.
    attributes:

      id:
        identifier: true
        range: uriorcurie
        slot_uri: dcterms:identifier
        description: Unique identifier for this object.

      author:
        range: OrcidId
        slot_uri: dcterms:creator
        description: ORCID iD of the record author or maintainer.

      date:
        range: date
        slot_uri: dcterms:created
        description: Date the record was created or last substantively revised.

      title:
        description: The preferred human-readable label for a Thing.
        required: true
        range: string
        slot_uri: dcterms:title # schema:name

      title_source:
        description: >-
          📚 A fonte do título title_source é opcional ; um título pode ser
          atestado em mais de uma fonte, por isso este campo é uma lista de
          itens (cada item começa com um hífen).

          Se a fonte for cadastrada, o campo `refid` deve conter a chave de
          citação (citation key) que consta do registro bibliográfico na
          biblioteca do nosso projeto de pesquisa no Zotero. Em geral, a chave
          de citação é o DOI ou ISBN da publicação, mas pode ser diferente.

          Se necessário, incluir no campo note uma especificação adicional,
          como o número da página da referência bibliográfica de onde a
          informação foi extraída.

          Todos os campos source no restante da ficha devem ser preenchidos do
          mesmo modo. (Equivalente DublinCore: bibliographiCitation).
        range: BibliographicCitation
        multivalued: true
        inlined_as_list: true

      category:
        description: >-
          An index element for the broad category the object/work in focus
          belongs to. Examples may include human-made object or natural object.
        range: uriorcurie
        designates_type: true
        slot_uri: lido:lidoCategory

    slots:
      - description
      - record_rights
      # Os campos abaixo são opcionais
      - title_type
      - title_source
      - alt_name
      - bibliographic_citation
      - identifiers
      - temporal
      - repository
      - collection
      - relation
      - content

  Appellation:
    attributes:

      title_preference:
        description: >-
          Indica se o nome em questão deve ser oculto ou não, se é uma versão
          alternativa ou uma variante de grafia, etc.
        alias: label_type
        range: LabelType
        ifabsent: string(alternative)

    slots:
      - display
      - title_type
      - bibliographic_citation

  RelatedObject:
    description: Relation to another object or work.
    attributes:
    slots:
      - display
      - relation_type
      - related_object
      - resource
      - related_object_type
      - related_object_note
      - bibliographic_citation

  Repository:
    is_a: Thing
    description: Entidade com existência jurídica e espacial.
    slots:
      - spatial
      - legal_body

slots:

  alt_name:
    description: >-
      O bloco titles permite cadastrar outros nomes pelos quais a edificação
      será eventualmente conhecida. É uma lista opcional de itens, e se
      existir, os campos de cada item da lista devem ser preenchidos como os do
      título principal.

      O campo display de cada item contém o texto do título (nome).

      Este bloco pode ser omitido por completo se não houver títulos
      alternativos.
    range: Appellation
    multivalued: true
    inlined_as_list: true

  title_type:
    description: Indica se o título é um nome próprio, descritivo, etc.
    alias: type
    slot_uri: lido:Appellation
    range: TitleType
    ifabsent: string(descriptive)

  identifiers:
    range: TypedReference
    multivalued: true
    inlined_as_list: true
    description: Published or external identifiers for the object.

  temporal:
    description: Temporalidade do objeto.
    range: Event
    multivalued: true
    inlined_as_list: true

  collection:
    range: TypedReference
    multivalued: true
    inlined_as_list: true
    description: Collections or aggregations to which the object belongs.

  repository:
    range: Repository
    multivalued: true
    inlined_as_list: true

  legal_body:
    range: LegalBody
    required: true

  relation:
    range: RelatedObject
    multivalued: true
    inlined_as_list: true
    slot_uri: skos:related

  record_rights:
    required: true
    range: Right
    multivalued: true
    inlined_as_list: true

  content:
    recommended: true
    range: string
    description: >-
      Narrative body content. In the Markdown adapter this corresponds to
      the document body after YAML frontmatter.

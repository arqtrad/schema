id: https://tradicional.arq.br/schema/temporal
name: wasth-temporal
title: WASTH events, subjects, and related objects

prefixes:
  linkml: https://w3id.org/linkml/
  wasth: https://tradicional.arq.br/schema/
  crm: http://www.cidoc-crm.org/cidoc-crm/
  dcterms: http://purl.org/dc/terms/
  lido: http://www.lido-schema.org/
  schema: http://schema.org/
  ulan: http://vocab.getty.edu/ulan/
  wd: http://www.wikidata.org/entity/

default_prefix: wasth
default_range: string

classes:
  Event:
    is_a: Thing
    class_uri: crm:E5_Event
    exact_mappings:
      - schema:Event
    description: >
      Um evento é um processo específico e coerente, delimitável, de
      interações entre fatores materiais, humanos e físico-ambientais,
      que afetam objetos de modo característico ao tipo de processo em jogo.
      Pode tratar-se de uma ação ou um conjunto articulado de ações
      intencionais, de consequências imprevistas de ações intencionais, ou de
      processos naturais sem intervenção humana.

      -------------------------------------------------------------------------

      This class comprises distinct, delimited and coherent processes and
      interactions of a material nature, in cultural, social or physical
      systems, involving and affecting instances of E77 Persistent Item in a
      way characteristic of the kind of process. Typical examples are meetings,
      births, deaths, actions of decision taking, making or inventing things,
      but also more complex and extended ones such as conferences, elections,
      building of a castle, or battles.

      While the continuous growth of a tree lacks the limits characteristic of
      an event, its germination from a seed does qualify as an event.
      Similarly, the blowing of the wind lacks the distinctness and limits of
      an event, but a hurricane, flood or earthquake would qualify as an event.
      Mental processes are considered as events, in cases where they are
      connected with the material externalization of their results; for
      example, the creation of a poem, a performance or a change of intention
      that becomes obvious from subsequent actions or declarations.

      The effects of an instance of E5 Event may not lead to relevant permanent
      changes of properties or relations of the items involved in it, for
      example an unrecorded performance. Of course, in order to be documented,
      some kind of evidence for an event must exist, be it witnesses, traces or
      products of the event.

      While instances of E4 Period always require some form of coherence
      between its constituent phenomena, in addition, the essential
      constituents of instances of E5 Event should contribute to an overall
      effect; for example, the statements made during a meeting and the
      listening of the audience.

      Viewed at a coarse level of detail, an instance of E5 Event may appear as
      if it had an ‘instantaneous’ overall effect, but any process or
      interaction of material nature in reality have an extent in time and
      space. At a fine level, instances of E5 Event may be analysed into
      component phenomena and phases within a space and timeframe, and as such
      can be seen as a period, regardless of the size of the phenomena. The
      reverse is not necessarily the case: not all instances of E4 Period give
      rise to a noteworthy overall effect and are thus not instances of E5
      Event.

    attributes:

      event_type:
        alias: type
        range: EventType
        required: true

      actor_role:
        description: Identificação de um agente e do seu papel no evento.
        range: Actor
        multivalued: true
        inlined_as_list: true

      display_date:
        range: string
        description: >
          Permite a expressão descritiva das datas de início e fim do evento,
          para contemplar variados graus de incerteza, ou de modo a representar
          a data em calendários diferentes do gregoriano. Omitir apenas se os
          valores numéricos das datas forem exatos.

      start_date:
        description: >
          Data inicial do evento ou mais antiga data presumida para o seu
          decurso. Omitir se desconhecida.

          Por ora, é responsabilidade de quem preenche a ficha assegurar que
          `start_date` e `end_date` ocorram em ordem cronológica. Não dispomos
          de validação automática para tanto.
        range: EventDate
        multivalued: true
        inlined_as_list: true
        minimum_cardinality: 0
        maximum_cardinality: 2

      end_date:
        description: >
          Data final do evento ou mais tardia data presumida para o seu
          decurso. Omitir se desconhecida.

          Por ora, é responsabilidade de quem preenche a ficha assegurar que
          `start_date` e `end_date` ocorram em ordem cronológica. Não dispomos
          de validação automática para tanto.
        range: EventDate
        multivalued: true
        inlined_as_list: true
        minimum_cardinality: 0
        maximum_cardinality: 2

      event_place:
        alias: place
        range: Site
        multivalued: true
        inlined_as_list: true
        description: >
          Lugares associados ao evento, sem incluir o próprio local no qual
          se situa a edificação.

      method:
        description: >-
          An index element for the method by which the event is or was carried
          out. Examples may include an acquisition method or a field collection
          method.
        range: ConceptReference
        multivalued: true
        inlined_as_list: true

      things_present:
        description: >-
          A set of structured information for a related object or work that is
          or was present at the event in focus. Repeated if there are multiple
          related objects or works.
        range: RelatedWork
        multivalued: true
        inlined_as_list: true

      related_events:
        description: >-
          A set of structured information about an event related to the event
          in focus, indicating the type of relationship where applicable.
        range: RelatedEvent
        multivalued: true
        inlined_as_list: true

    slots:
      - style_period
      - culture
      - measurements
      - material
      - technique
      - media


  Actor:
    description: Agent and role in an event.

    attributes:

      actor_type:
        description: >
          Define se o agente é uma pessoa, uma organização ou corporação,
          uma oficina, uma família, etc.
        alias: type
        range: AgentType
        ifabsent: AgentType(personal)

      actor_name:
        description: Nome do agente extraído de um vocabulário controlado.
        alias: name
        range: TypedReference
        inlined: true

      role_in_event:
        description: Ação desempenhada pelo agente no evento.
        range: RoleType

      actor_qualifier:
        description: >
          For the Attribution Qualifier Actor element choose a concept URI from
          the [attribution qualifiers
          hierarchy](http://vocab.getty.edu/hier/aat/300404264) of the Art &
          Architecture Thesaurus, or another linked open vocabulary.
        alias: qualifier
        range: TypedReference
        multivalued: true
        inlined_as_list: true

      actor_extent:
        description: Parte da obra sobre a qual o agente interveio.
        alias: extent
        range: TypedReference
        multivalued: true
        inlined_as_list: true

    slots:
      - bibliographic_citation

  EventDate:
    description: >
      Expressão complexa de uma data que pode se referir ao começo ou ao
      término de um evento pontual ou de uma decorrência prolongada.
      Permite expressar as datas de corte inicial e final, cada uma com seus
      respetivos graus de confiabilidade e de precisão.

    comments:

      - ⚠️  Não temos padrão estabelecido para datas anteriores ao calendário
        gregoriano (1583), antes de Cristo, ou convertidas de outros
        calendários. Datas no calendário juliano podem ser expressadas
        nominalmente.
        Datas da era ibérica podem usar o valor nominal do dia e do mês, tendo
        o ano convertido para o gregoriano.
        Datas de calendários não cristãos podem ser convertidas para a data
        gregoriana correspondente, mesmo as anteriores a 1583.

        Ver <https://en.wikipedia.org/wiki/ISO_8601#Dates> para a discussão
        dessa dificuldade, cuja solução depende do estabelecimento de um padrão
        específico para cada caso.

    notes:

      - A wrapper for the expression of a date by providing a set of years as
        earliest and latest date delimiting the respective span of time,
        usually given in the proleptic Gregorian calendar.

        If it is an exact date, possibly with time, repeat the same date (and
        time) in Earliest Date and Latest Date elements.

    attributes:

      date_type:
        alias: type
        required: true
        range: DateType
        description: >
          Qualifica a confiabilidade da data como sendo conhecida ou estimada.
          A confiabilidade independe do grau de precisão da data.

      date_value:
        range: date
        description: >
          Usar o formato ISO-8601 (AAAA-MM-DD).
          Para datas imprecisas, usar o PRIMEIRO ou o ÚLTIMO dia, mês ou ano do
          período delimitado, conforme se tratar de uma data de corte inicial
          ou final para o evento, e descrever verbalmente o período no campo
          `display_date`.

  StylePeriod:
    is_a: ConceptReference
    attributes:

      period_name_type:
        alias: type
        range: PeriodNameType
        required: true
        # ifabsent: PeriodNameType(term:lido00731)
        description: >
          Designa a natureza ou origem do nome do período ou estilo indicado.

  RelatedEvent:
    attributes:

      name:
        range: Event
        multivalued: true
        required: true
        symmetric: true
        inlined: false

    slots:
      - description

id: https://tradicional.arq.br/schema/resource
name: wasth-resource
title: WASTH resources, media, and physical description

prefixes:
  linkml: https://w3id.org/linkml/
  wasth: https://tradicional.arq.br/schema/
  schema: http://schema.org/
  crm: http://www.cidoc-crm.org/cidoc-crm/
  dcterms: http://purl.org/dc/terms/
  dctypes: http://purl.org/dc/dcmitype/
  lido: http://www.lido-schema.org/

default_prefix: wasth
default_range: string

classes:

  BibliographicCitation:
    class_uri: dcterms:BibliographicCitation
    close_mappings:
      - crm:E31_Document
      - schema:CreativeWork

    description: >
      Cadastro de uma referência bibliográfica.

      Usar o campo `description` para formatar a referência, caso a formatação
      automática do Zotero não for satisfatória.

    attributes:

      citation_refid:
        alias: refid
        identifier: true
        range: CslCitekey
        description: >
          Se a fonte for cadastrada, o campo `refid` deve conter a chave de
          citação (`citation key`) que consta do registro bibliográfico na
          biblioteca do nosso projeto de pesquisa no [Zotero].
          Em geral, a chave de citação é o DOI ou ISBN da publicação, mas pode
          ser diferente.

          Se a referência que necessita citar não constar da biblioteca do
          Zotero, deve cadastrá-la primeiro nessa biblioteca para então extrair
          a chave de citação.

      note:
        range: string
        description: >
          Se necessário, incluir no campo `note` uma especificação adicional,
          como o número da página da referência bibliográfica de onde a
          informação foi extraída.

    slots:
      - description

  RelatedObject:
    is_a: Thing
    abstract: true
    description: >
      A set of structured information about an object or work, or a group of
      objects or works related to the object/work in focus, including the kind
      of relationship between them. May include bibliographic objects in which
      the object/work is documented or mentioned.

    slots:
      - work_rights

  RelatedWork:
    is_a: RelatedObject
    description: >-
      As formas mais comuns de relação no nosso projeto são :

        - depicted in: A edificação é representada numa pintura ou desenho
          artístico;

        - documented by: Informações sobre a edificação estão publicadas numa
          referência bibliográfica, processo administrativo ou outro documento
          textual impresso, manuscrito ou eletrônico;

        - has plan / has floor plan / has section / has elevation / has
          rendering: Essas relações mostram a existência de desenhos técnicos
          da edificação, sejam eles históricos ou recentes, compilados de
          fontes externas a este projeto de pesquisa.

        - has construction drawing / has design / has sketch: Essas relações se
          referem a desenhos históricos (fontes primárias) que atestam o
          processo de projeto da edificação.

      ATENÇÃO : OS DESENHOS PRODUZIDOS POR ESTE PROJETO DE PESQUISA DEVEM SER
      CADASTRADOS NO GRUPO resource, MAIS ABAIXO.

      O grupo relation é destinado unicamente a cadastrar relações desta
      edificação com objetos autônomos, tais como outras edificações, conjuntos
      urbanos, obras de artes visuais, referências bibliográficas ou acervos
      arquivísticos.

    attributes:
      relation_type:
        slot_uri: lido:relatedWorkRelType
        range: RelatedWorkRelType
        required: true
        # ifabsent: RelationType(planFor)
        description: >
          Indica o tipo de relação entre a edificação descrita na ficha e o
          objeto relacionado. O sujeito do tipo é sempre a obra titular da
          ficha.

    slots:
      - media

  LargerContextReference:
    is_a: RelatedObject
    description: >
      Tipo de relação específica entre obras a ser usado quando o objeto
      descrito na ficha é ou era parte integrante de outro objeto, físico ou
      intelectual.

    attributes:
      context_type:
        slot_uri: lido:relatedWorkRelType
        range: LargerContextType
        required: true
        description: O tipo de relação entre os objetos.

    slots:
      - media

  Resource:
    is_a: Thing
    class_uri: crm:E31_Document
    close_mappings:
      - schema:ArchiveComponent
    description: >
      Este grupo identifica um recurso visual ou documental que fornece
      informações técnicas ou uma representação ilustrativa da obra à qual ele
      se relaciona.

      Recursos produzidos pela equipe dos Documentários da Arquitetura
      Tradicional são descritos na ficha de cada edificação, no grupo
      `resources`.
      Representações e documentos externos são referidos nos grupos `media` e
      `related_works`, respetivamente.

    notes:

      - This class comprises identifiable immaterial items that make
        propositions about reality.

        These propositions may be expressed in text, graphics, images,
        audiograms, videograms, or by other similar means. Documentation
        databases are regarded as instances of E31 Document. This class should
        not be confused with the concept “document” in Information Technology,
        which is compatible with E73 Information Object.

    attributes:

      resource_type:
        slot_uri: lido:relatedWorkRelType
        range: ResourceType
        required: true
        description: >
          Usamos os tipos de relação previstos pelo LIDO em
          `relatedWorkRelType > Associative relationships > Derivative relationships`.
          Provavelmente necessitamos apenas de :

          - `planFor` : desenho técnico bidimensional de levantamento
            (padrão, pode ser omitido) ;

          - `modelFor` : modelo tridimensional, com ou sem informações construtivas
            associadas (BIM) ;

          - `imageOf` : outras representações em duas dimensões da edificação ;

          - `preparatoryFor` : representação técnica de projeto para intervenções a
            serem realizadas (ou já realizadas) na edificação.

      perspective:
        required: true
        range: integer
        minimum_value: 0
        maximum_value: 9
        description: >
          Tipo de vista do desenho. Usar a numeração da ISO 19650–2 :

            - 0 = sem projeção ou representação não visual
            - 1 = planta baixa
            - 2 = elevação
            - 3 = corte
            - 4 = mapa de elementos
            - 5 = detalhe
            - 6 = mapa de revestimentos
            - 7 = planta de forro
            - 8 = vista ou modelo 3D
            - 9 = definido pelo agente

    slot_usage:

      id:
        identifier: true

      category:
        ifabsent: string(http://terminology.lido-schema.org/lido01193)

    slots:
      - format
      - scale
      - unit
      - preview_image
      - provided_image
      - provided_3d
      - resource_service
      - credit
      - work_rights

  MediaObject:
    is_a: RelatedObject
    class_uri: schema:MediaObject
    close_mappings:
      - dctypes:Image
    description: >
      Descrição e referência a um único arquivo de mídia.

      O `id` deve ser uma URI apontando para a localização permanente da mídia,
      não diretamente para um arquivo de imagem.

      Obrigatoriamente deve conter um link para o recurso online, seja na forma
      de `provided_image`, `provided_3d` ou `resource_service`.
      É importante, também, fornecer o link para uma miniatura que será usada
      como pré-visualização, em `preview_image`.

      No caso de `preview_image` ou `provided_image`, o link deve referenciar
      diretamente o arquivo (ficheiro) da imagem.
      Em se tratando de `provided_3d` ou `service`, o link deve remeter a uma
      página web que forneça a respetiva API ou as informações acerca do modelo.

      Por exemplo, no caso de uma imagem hospedada no Wikimedia Commons:

      ```
      id: https://commons.wikimedia.org/wiki/File:BR-DF-Planaltina-Casarao_azul-PP-090421-3018.jpg
      preview_image: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/86/BR-DF-Planaltina-Casarao_azul-PP-090421-3018.jpg/330px-BR-DF-Planaltina-Casarao_azul-PP-090421-3018.jpg
      provided_image:
        - https://upload.wikimedia.org/wikipedia/commons/8/86/BR-DF-Planaltina-Casarao_azul-PP-090421-3018.jpg
      resource_service:
        - https://commons.wikimedia.org/w/api.php?action=query&prop=imageinfo&iiprop=extmetadata&format=json&titles=File:BR-DF-Planaltina-Casarao_azul-PP-090421-3018.jpg
      ```

      Não armazenamos imagens ou outros arquivos de mídia nos sites dos
      Documentários da Arquitetura Tradicional.

    attributes:
      depiction_type:
        slot_uri: lido:relatedWorkRelType
        alias: type
        range: DepictionType
        required: true
        description: >
          O tipo de representação que a mídia contém. A edificação descrita na
          ficha é sempre o sujeito da relação.

    slot_usage:
      title:
        required: true
        description: >
          Título breve para identificar este recurso visual na listagem.

      description:
        required: true
        description: >
          Texto alternativo para leitores de tela ou outras formas de
          acessibilidade. Apenas texto sem formatação.

      content:
        description: >
          Opcional, para descrever com mais detalhe a representação.

      work_rights:
        required: true

    slots:
      - format
      - scale
      - unit
      - preview_image
      - provided_image
      - provided_3d
      - resource_service
      - measurements
      - credit


slots:

  bibliographic_citation:
    slot_uri: dcterms:bibliographicCitation
    range: BibliographicCitation
    recommended: true
    multivalued: true
    inlined_as_list: true
    description: >
      📚  Cadastro de uma referência bibliográfica.

      O campo `refid` deve conter a chave de citação (citation key) que consta
      do registro bibliográfico na biblioteca do nosso projeto de pesquisa no
      Zotero, começando com arroba @. Em geral, a chave de citação é o DOI ou
      ISBN da publicação, mas pode ser diferente.

      Se necessário, incluir no campo `note` uma especificação adicional,
      como o número da página da referência bibliográfica de onde a
      informação foi extraída.

      Usar o campo `description` para formatar a referência, caso a formatação
      automática do Zotero não for satisfatória.

  collection_type:
    range: CollectionType
    description: >
      Usar um vocabulário controlado para identificar o tipo de representação,
      por exemplo as hierarquias do Getty AAT
      [obras visuais](http://vocab.getty.edu/hier/aat/300191086).
      ou [formatos de informação](http://vocab.getty.edu/hier/aat/300220751)

  resources:
    range: Resource
    multivalued: true
    inlined_as_list: true
    description: >
      Os desenhos ou modelos da edificação são apresentados online por meio de
      imagens vetoriais ou bitmap.

      Cada desenho ou modelo pode ser apresentado sob várias representações,
      como pré-visualização, imagem original, ou serviço [IIIF].
      Essas imagens devem ser identificadas como segue :

      As categorias de representação previstas no [LIDO] podem ser consultadas
      em <http://terminology.lido-schema.org/resourceRepresentation_type>
      e são inseridas na ficha como um mapa.

  media:
    range: MediaObject
    multivalued: true
    description: >
      Representações iconográficas deste objeto.

  preview_image:
    range: uriorcurie
    description: >
      Uma única miniatura da imagem original.

      Obs.: não usamos a opção `placeholder`, ela será preenchida
      automaticamente em caso de ausência da miniatura, nem outros tipos de
      miniaturas que não imagens.
      A especificação LIDO admite listar mais de uma miniatura, mas tampouco
      prevemos essa hipótese.

  provided_image:
    range: uriorcurie
    multivalued: true
    inlined_as_list: true
    description: >-
      Lista de versões ampliadas ou originais da imagem, vetorial ou bitmap.

  provided_3d:
    range: uriorcurie
    multivalued: true
    inlined_as_list: true
    description: Modelo tridimensional ou IFC da edificação.

  resource_service:
    range: uriorcurie
    multivalued: true
    inlined_as_list: true
    description: >-
      Apenas no caso de a imagem ser fornecida como um serviço dinâmico
      online, tal como a especificação [IIIF].

      No caso de `preview_image` ou `provided_image`, o link deve referenciar
      diretamente o arquivo (ficheiro) da imagem.
      Em se tratando de `provided_3d` ou `service`, o link deve remeter a uma
      página web que forneça a respetiva API ou as informações acerca do modelo.

  format:
    slot_uri: dcterms:format
    required: true
    range: string
    inlined: true
    description: >
      Campo disciplinado pela especificação [DublinCore] no campo
      [format](https://www.dublincore.org/specifications/dublin-core/dcmi-terms/elements11/format/).
      Esta especificação sugere a lista de tipos de mídia IANA :
      <https://www.iana.org/assignments/media-types>.

  scale:
    range: float
    minimum_value: 0
    description: >-
      Número inverso da escala da imagem ou desenho, se tiver uma resolução ou
      tamanho de página definidos.
      Por exemplo, para um desenho na escala 1 : 100, `scale: 100`.

  work_rights:
    range: Right
    multivalued: true
    inlined_as_list: true
    slot_uri: lido:rightsWorkSet
    description: >
      ⚠️  Este bloco se refere a eventuais direitos autorais ou de
      propriedade sobre O OBJETO OU RECURSO QUE ESTÁ SENDO DESCRITO, não sobre
      o preenchimento da ficha.

  credit:
    description: Informação sobre autoria ou responsabilidade.
    range: string

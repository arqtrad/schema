id: https://tradicional.arq.br/schema/resource
name: wasth-resource
title: WASTH resources, media, and physical description

prefixes:
  linkml: https://w3id.org/linkml/
  wasth: https://tradicional.arq.br/schema/
  lido: http://www.lido-schema.org/

default_prefix: wasth
default_range: string

classes:

  BibliographicCitation:
    description: Bibliographic or documentary citation using a CSL citekey.

    attributes:

      citation_refid:
        alias: refid
        required: true
        range: CslCitekey

      note:
        range: string

    slots:
      - description

  RelatedObject:
    description: |
      As formas mais comuns de relação no nosso projeto são :

        - depicted in: A edificação é representada numa pintura ou desenho
          artístico;

        - documented by: Informações sobre a edificação estão publicadas numa
          referência bibliográfica, processo administrativo ou outro documento
          textual impresso, manuscrito ou eletrônico;

        - has plan / has floor plan / has section / has elevation / has
          rendering: Essas relações mostram a existência de desenhos técnicos
          da edificação, sejam eles históricos ou recentes, compilados de
          fontes externas a este projeto de pesquisa.

        - has construction drawing / has design / has sketch: Essas relações se
          referem a desenhos históricos (fontes primárias) que atestam o
          processo de projeto da edificação.

      ATENÇÃO : OS DESENHOS PRODUZIDOS POR ESTE PROJETO DE PESQUISA DEVEM SER
      CADASTRADOS NO GRUPO resource, MAIS ABAIXO.

      O grupo relation é destinado unicamente a cadastrar relações desta
      edificação com objetos autônomos, tais como outras edificações, conjuntos
      urbanos, obras de artes visuais, referências bibliográficas ou acervos
      arquivísticos.
    attributes:
    slots:
      - description
      - relation_type
      - related_object
      - object_type
      - resource
      - media
      - source
      - bibliographic_citation

  RelatedWork:
    is_a: RelatedObject
    description: >-
      A wrapper for identifying information about an object or work, including
      collections, related to the object/work in focus. May include a weblink.
    slot_usage:
      related_object:
        range: Work

  Resource:
    description: Digital or documentary resource associated with a Work.
    slots:
      - resource_id
      - resource_author
      - resource_date
      - relation_type
      - preview_image
      - provided_image
      - provided_3d
      - resource_service
      - perspective
      - resource_unit
      - description
      - source
      - bibliographic_citation
      - credit
      - rights

  Media:
    description: Descrição e referência a um único arquivo de mídia.
    slots:
      - format
      - preview_image
      - provided_image
      - provided_3d
      - resource_service
      - measurements
      - media_alt
      - description
      - source
      - bibliographic_citation
      - credit
      - rights

slots:

  relation_type:
    alias: rel_type
    range: RelationType
    required: true
    #ifabsent: RelationType(planFor)

  related_object:
    range: Thing
    required: true

  object_type:
    description: >-
      An index element for the particular kind of object or work in focus.
    range: ObjectType

  resource:
    range: Resource
    multivalued: true
    inlined: true
    inlined_as_list: false

  resource_id:
    key: true
    alias: id
    range: TypedReference
    inlined: true

  preview_image:
    range: uriorcurie
    inlined: true

  provided_image:
    range: uriorcurie
    multivalued: true
    inlined_as_list: true

  provided_3d:
    range: uriorcurie
    multivalued: true
    inlined_as_list: true

  resource_service:
    alias: service
    range: TypedReference
    multivalued: true
    inlined_as_list: true

  perspective:
    required: true
    range: integer
    minimum_value: 0
    maximum_value: 9

  resource_unit:
    alias: unit
    range: TypedReference
    inlined: true

  resource_author:
    alias: author
    range: OrcidId

  resource_date:
    alias: date
    required: true
    range: EventDate
    inlined: true

  media:
    range: Media
    multivalued: true
    inlined_as_list: true

  format:
    required: true
    range: TypedReference
    inlined: true

  media_alt:
    description: >-
      Texto alternativo para leitores de tela ou outras formas de
      acessibilidade. Apenas texto sem formatação.
    alias: alt
    range: string

  credit:
    description: Informação sobre autoria ou responsabilidade.
    range: string

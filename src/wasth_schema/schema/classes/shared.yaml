id: https://tradicional.arq.br/schema/shared
name: wasth-shared
title: WASTH shared structures

prefixes:
  linkml: https://w3id.org/linkml/
  crm: http://www.cidoc-crm.org/cidoc-crm/
  dcterms: http://purl.org/dc/terms/
  lido: http://www.lido-schema.org/
  schema: http://schema.org/
  vra: http://purl.org/vra/
  wasth: https://tradicional.arq.br/schema/

default_prefix: wasth
default_range: string

classes:

  TypedReference:
    description: >-
      Permite referenciar um registro local ou externo por meio da sua URI
      (localizador universal, como um link da internet, por padrão), IRI ou
      código na base local (não recomendado).

      -------------------------------------------------------------------------

      Reference to a local record, IRI, URI, or LIDO terminology term.

    slot_usage:
      refid:
        key: true

    slots:
      - reference_type
      - lido_term
      - refid
      - description
      - bibliographic_citation
      - source

  Measurement:
    class_uri: crm:E16_Measurement
    related_mappings:
      - dcterms:format

    description: >
      Informações estruturadas sobre as dimensões do objeto ou requisitos de
      condicionamento ambiental no espaço que ele ocupa.
      Para edificações, é recomendável cadastrar ao menos a área útil, testada
      e a altura de coroamento.

      Se a modulação original for conhecida ou puder ser deduzida por um estudo
      metrológico, é interessante cadastrar também as medidas históricas
      utilizadas (por exemplo, dimensões em palmos).

      O campo `description` permite uma representação textual das medidas da
      edificação, caso não seja viável cadastrar medidas individuais com
      precisão, ou seja preciso maior flexibilidade para explicar as dimensões.

    notes:

      - This class comprises actions measuring physical properties and other
        values that can be determined by a systematic, objective procedure of
        direct observation of particular states of physical reality.

      - 'An instance of E16 Measurement may use simple counting or tools, such
        as yardsticks or radiation detection devices. The interest is in the
        method and care applied, so that the reliability of the result may be
        judged at a later stage, or research continued on the associated
        documents. The date of the event is important for dimensions, which may
        change value over time, such as the length of an object subject to
        shrinkage. Methods and devices employed should be associated with
        instances of E16 Measurement by properties such as:
        *P33 used specific technique*: E29 Design or Procedure,
        *P125 used object of type*: E55 Type,
        *P16 used specific object (was used for)*: E70 Thing,
        whereas basic techniques such as "carbon-14 dating" should be encoded
        using *P2 has type (is type of)*: E55 Type.
        Details of methods and devices reused or reusable in other instances of
        E16 Measurement should be documented for these entities rather than the
        measurements themselves, whereas details of particular execution may be
        documented by free text or by instantiating adequate sub-activities, if
        the detail may be of interest for an overarching query.'

      - Regardless whether a measurement is made by an instrument or by human
        senses, it represents the initial transition from physical reality to
        information without any other documented information object in between
        within the reasoning chain that would represent the result of the
        interaction of the observer or device with reality. Therefore,
        determining properties of an instance of E90 Symbolic Object is
        regarded as an instance of E13 Attribute Assignment, which may be
        inferred from observing and measuring representative carriers. In the
        case that the carrier can be named, the property
        *P16 used specific object (was used for)*
        should be used to indicate the instance(s) of E18 Physical Thing
        that was used as the empirical basis for the attribute assignment. For
        instance, inferring properties of depicted items using image material,
        such as satellite images, is not regarded as an instance of E16
        Measurement, but as a subsequent instance of E13 Attribute Assignment.
        Rather, only the production of the images, understood as arrays of
        radiation intensities, is regarded as an instance of E16 Measurement.
        The same reasoning holds for other sensor data.

    slot_usage:
      unit:
        required: true

    slots:
      - unit
      - description
      - format_extent
      - bibliographic_citation

    attributes:

      measurement_type:
        alias: type
        range: MeasurementType
        ifabsent: MeasurementType(proper)
        description: >
          designa a natureza da medida : largura, altura,
          área, etc. — usar um dos [tipos de dimensões
          ](https://www.getty.edu/vow/AATHierarchy?find=&logic=AND&note=&page=1&subjectid=300226820)
          do Art and Architecture Thesaurus do Instituto Getty (AAT), enquanto
          não tivermos um vocabulário controlado próprio.

      measurement_value:
        alias: value
        required: true
        range: float
        minimum_value: 0
        description: Valor numérico, usar ponto como separador decimal.

      measurement_qualifier:
        alias: qualifier
        range: MeasurementQualifier
        ifabsent: MeasurementQualifier(2)
        description: >
          Indica que as medidas são aproximadas.

      measurement_shape:
        alias: shape
        range: TypedReference
        description: >
          caso relevante, indicar a forma do elemento medido
          usando a [lista de formas do
          AAT](https://www.getty.edu/vow/AATHierarchy?find=&logic=AND&note=&page=1&subjectid=300056273),
          enquanto não tivermos um vocabulário controlado próprio.

      measurement_event:
        alias: event
        range: Event
        inlined: false
        description: >
          Descreve a ocasião em que as medidas foram aferidas, caso essa
          informação seja relevante (por exemplo, no âmbito de um
          levantamento prévio a intervenções que alteraram as dimensões da
          edificação).

          Referencia um evento cadastrado em `temporal` pelo seu `id`.

  MaterialTech:
    is_a: ConceptReference
    description: >
      Usar discernimento para identificar sistemas, materiais e técnicas que
      interessam ao conhecimento da edificação no seu conjunto, não a partes
      menos extensas ou pouco importantes.

    attributes:

      material_tech_type:
        description: >
          Tipo da referência a um material ou técnica usado na obra:
          material de construção (support), revestimento (medium), técnica,
          instrumento, cor, etc.
        alias: type
        range: MaterialTechType
        required: true

  Right:
    class_uri: crm:E30_Right  # dcterms:rights
    description: >
      * Preencher `earliest_date` com a data de início da vigência dos
        direitos ou a data do preenchimento da ficha.

      * `latest_date` pode ser omitido se não houver fim da vigência.

      * `holder` pode ser omitido se a obra estiver no domínio público.

    attributes:

      rights_type:
        description: >
          Determina se os direitos ora descritos são uma licença específica
          (padrão) ou expressão genérica de copyright.

          ---------------------------------------------------------------------

          Qualifies the kind of rights type, whether it refers to a generic
          kind of right, like copyright or performance rights, or is a specific
          rights or license statement, for instance, Rights Statements or
          Creative Commons Licenses.
        required: true
        range: RightsType

      rights_statement:
        description: >
          Referencia, preferencialmente por meio de uma URI, as informações
          específicas dos direitos autorais incidentes sobre o item descrito.

          Por padrão, as casas tradicionais pertencem ao domínio público até
          prova em contrário.
          Essa informação e a declaração de direitos NKC (Sem direito autoral
          conhecido) NÃO PODE ser omitida da ficha.
          Para o domínio público, portanto, indicar a referência :
          <https://rightsstatements.org/vocab/NKC/1.0/>.

          ---------------------------------------------------------------------

          An index element for rights information being recorded. This can
          refer to a generic kind of right, such as copyright or a related
          right, but also be a specific rights or license statement like a
          standardized statement on copyright, usage, or access rights.
        required: true
        range: TypedReference
        inlined: true

      temporal:
        description: Date on which a right is or was current.
        alias: temporal
        range: EventDate
        inlined: true

      holder:
        description: >
          A set of elements identifying the person or the group of persons
          holding the rights referenced in Rights Type. Often refers to
          copyright and related rights, such as the right to reproduce,
          distribute, exhibit or use the entity in focus, for example, the
          object/work, resource or metadata record.
        alias: holder
        range: LegalBody
        inlined: true

  LegalBody:
    description: >
      Referência a uma pessoa jurídica (pode ser um indivíduo detentor de
      direitos jurídicos específicos que se queira referenciar) ou entidade
      coletiva histórica.
    attributes:

      legal_body_type:
        alias: type
        range: RepositoryType
        ifabsent: RepositoryType(corporate)
        description: >
          Define a natureza do ente legal : pessoa jurídica, perímetro
          geográfico de tutela, etc.

      legal_body_name:
        alias: name
        range: TypedReference
        inlined: true
        description: >
          Referencia a identidade do ente legal num vocabulário controlado ou
          repositório de identidades, tal como o ISNI.


slots:

  refid:
    range: uriorcurie
    slot_uri: dcterms:identifier
    exact_mappings:
      - schema:identifier
    description: Local or external identifier.

  description:
    alias: display
    range: string
    slot_uri: dcterms:description
    exact_mappings:
      - schema:description
    description: A human-readable description for a thing

  reference_type:
    alias: type
    range: ReferenceType
    ifabsent: ReferenceType(uri)

  lido_term:
    alias: term
    range: uriorcurie
    pattern: '^http://terminology\.lido-schema\.org/lido[0-9]{5}$'
    description: LIDO terminology term.


  measurements:
    range: Measurement
    multivalued: true
    inlined_as_list: true
    description: >
      A wrapper for information about the dimensions, or other measurements, of
      the object/work in focus. May also include extents of the parts of a
      complex object or work.

  material:
    slot_uri: crm:E57_Material
    exact_mappings:
      - vra:Material
    range: MaterialTech
    multivalued: true
    inlined_as_list: true
    description: >
      Descreve a natureza do material empregado na edificação, no elemento ou
      no evento descritos.
      Conforme necessário e segundo o discernimento de quem preenche a ficha,
      pode se referir a matérias-primas ou a produtos prontos para uso.

      Espólios ou partes de outras edificações reutilizadas podem ser descritos
      segundo os materiais de que são constituídos, mas a procedência não deve
      ser cadastrada neste item. Para tanto, devem ser utilizados os eventos
      no grupo `temporal`.

      -------------------------------------------------------------------------

      This class is a specialization of E55 Type and comprises the concepts of
      materials.

      Instances of E57 Material may denote properties of matter before its use,
      during its use, and as incorporated in an object, such as ultramarine
      powder, tempera paste, reinforced concrete. Discrete pieces of
      raw-materials kept in museums, such as bricks, sheets of fabric, pieces
      of metal, should be modelled individually in the same way as other
      objects. Discrete used or processed pieces, such as the stones from Nefer
      Titi's temple, should be modelled as parts (cf. P46 is composed of (forms
      part of): E18 Physical Thing).

      This type is used categorically in the model without reference to
      instances of it, i.e. the Model does not foresee the description of
      instances of instances of E57 Material, e.g. “instances of gold”.

      It is recommended that internationally or nationally agreed codes and
      terminology should be used.

  technique:
    slot_uri: vra:Technique
    close_mappings:
      - crm:E55_Type
    range: MaterialTech
    multivalued: true
    inlined_as_list: true
    description: >
      Processos, técnicas, métodos e saberes postos em prática no conjunto da
      edificação e nas suas partes mais significativas, considerando a sua
      produção e alterações substanciais, bem como a sua eventual destruição.

      -------------------------------------------------------------------------

      The production or manufacturing processes, techniques, and methods
      incorporated in the fabrication or alteration of the work or image.

  format_extent:
    alias: extent
    range: TypedReference
    inlined: true
    description: >
      Indica a parte do objeto que está sendo medida — por exemplo, se a altura
      é até a linha de coroamento ou até a cumeeira, etc. — usar a `uri` de um
      vocabulário controlado.

  unit:
    range: TypedReference
    inlined: true
    description: >
      Unidade de medida usada no dimensionamento do objeto ou da representação,
      por exemplo metros, milímetros ou palmos.
      Usar a [hierarquia de unidades de
      medida](https://www.getty.edu/vow/AATHierarchy?find=&logic=AND&note=&page=1&subjectid=300379096)
      do AAT, ou do nosso próprio [vocabulário controlado].


  style_period:
    range: StylePeriod
    multivalued: true
    inlined_as_list: true
    description: >
      Denomina o(s) período(s) em que o evento decorreu, em qualquer escala
      relevante para o conhecimento : geológica, arqueológica, histórica ou
      artística.
      A identificação do período ou estilo deve ser relevante para as
      características que o objeto adquiriu devido a esse evento,
      não somente uma coincidência cronológica.

      ---------------------------------------------------------------------

      An index element for the period in which the event happened,
      comprising information about geologic time scale, archaelogical,
      historical, or artistic period, style, or art movement, whose
      characteristics are represented by the object or work.

      Note that "Period/Style" corresponds to "Style" in CDWA as shorthand for
      [Style/Period/Group/Movement/Dynasty](https://www.getty.edu/research/publications/electronic_publications/cdwa/17styles.html).

      Examples may be Neolithic for a period, Impressionist for a style, or
      Cubism for a movement.

  culture:
    range: TypedReference
    multivalued: true
    inlined_as_list: true
    description: >-
      Designa o contexto cultural ou étnico no qual o objeto foi
      afetado pelo evento em questão, desde que as características de tal
      contexto estejam refletidas no objeto.
      O preenchimento do contexto cultural é especialmente relevante quando
      os agentes envolvidos na produção ou alteração do objeto são
      desconhecidos.

      ---------------------------------------------------------------------

      An index element for the cultural context from which the object/work
      in focus originated.
      Used if the creator or producer is unknown, or if the cultural
      context is of particular interest.
      Examples may include the name of a culture, a nation, or an ethnic
      group.


  source:
    range: LegalBody
    multivalued: true
    inlined_as_list: true

  rights:
    range: Right
    multivalued: true
    inlined_as_list: true

id: https://tradicional.arq.br/schema/shared
name: wasth-shared
title: WASTH shared structures

prefixes:
  linkml: https://w3id.org/linkml/
  wasth: https://tradicional.arq.br/schema/
  lido: http://www.lido-schema.org/

default_prefix: wasth
default_range: string

classes:

  TypedReference:
    description: >-
      Reference to a local record, IRI, URI, or LIDO terminology term.
    slots:
      - reference_type
      - term
      - refid
      - bibliographic_citation
      - source

  Measurements:
    description: |
      O campo `description` permite uma representação textual das medidas da
      edificação, caso não seja possível cadastrar medidas individuais com
      precisão, ou seja preciso maior flexibilidade para explicar as dimensões.

    slots:
      - description
      - format_extent
      - bibliographic_citation
      - unit

    attributes:

      type:
        range: MeasurementType
        ifabsent: MeasurementType(proper)
        description: |
          designa a natureza da medida : largura, altura,
          área, etc. — usar um dos [tipos de dimensões](https://www.getty.edu/vow/AATHierarchy?find=&logic=AND&note=&page=1&subjectid=300226820)
          do Art and Architecture Thesaurus do Instituto Getty (AAT).

      value:
        alias: value
        required: true
        range: float
        minimum_value: 0
        description: Valor numérico, usar ponto como separador decimal.

      qualifier:
        alias: qualifier
        range: string
        description: |
          Indica que as medidas são aproximadas : usar um
          [qualificador do AAT](https://www.getty.edu/vow/AATHierarchy?find=&logic=&note=&page=1&subjectid=300435720) ;

      shape:
        alias: shape
        range: string
        description: |
          caso relevante, indicar a forma do elemento medido
          usando a [lista de formas do AAT](https://www.getty.edu/vow/AATHierarchy?find=&logic=AND&note=&page=1&subjectid=300056273).

  MaterialTech:
    is_a: ConceptReference
    description: |
      Usar discernimento para identificar sistemas, materiais e técnicas que
      interessam ao conhecimento da edificação no seu conjunto, não a partes
      menos extensas ou pouco importantes.

    attributes:

      material_tech_type:
        alias: type
        range: MaterialTechType
        required: true

  Right:
    description: Rights statement associated with a record, resource, or note.
    slots:
      - right_concept
      - right_type
      - right_temporal
      - right_holder

  LegalBody:
    description: Personal, corporate, family, or other responsible body.
    slots:
      - legal_body_type
      - legal_body_name

  Header:
    description: Presentation metadata for the WASTH interface.
    slots:
      - teaser
      - overlay_image
      - caption


slots:

  href:
    description: Um hyperlink simples.
    range: uriorcurie

  refid:
    key: true
    range: uriorcurie
    slot_uri: schema:identifier # dcterms:identifier
    description: Local or external identifier.

  description:
    alias: display
    range: string
    slot_uri: dcterms:description # schema:description
    description: A human-readable description for a thing

  bibliographic_citation:
    recommended: true
    range: BibliographicCitation
    multivalued: true
    inlined_as_list: true
    slot_uri: dcterms:bibliographicCitation

  concept:
    alias: name
    range: Concept
    required: true

  reference_type:
    alias: type
    range: ReferenceType
    ifabsent: string(uri)

  term:
    range: uriorcurie
    pattern: '^http://terminology\.lido-schema\.org/lido[0-9]{5}$'
    description: LIDO terminology term.


  measurements:
    range: Measurements
    multivalued: true
    inlined_as_list: true

  material:
    range: MaterialTech
    multivalued: true
    inlined_as_list: true

  technique:
    range: MaterialTech
    multivalued: true
    inlined_as_list: true

  format_extent:
    alias: extent
    range: TypedReference
    inlined: true
    description: |
      Indica a parte do objeto que está sendo medida — por
      exemplo, se a altura é até a linha de coroamento ou até a cumeeira, etc.
      — usar a `uri` de um vocabulário controlado.

  unit:
    alias: unit
    required: true
    range: TypedReference
    inlined: true
    description: |
      Unidade de medida usada no dimensionamento da representação,
      por exemplo metros ou milímetros.
      Usar a
      [hierarquia de unidades de medida](https://www.getty.edu/vow/AATHierarchy?find=&logic=AND&note=&page=1&subjectid=300379096)
      do AAT, ou do nosso próprio [vocabulário controlado].


  source:
    range: LegalBody
    multivalued: true
    inlined_as_list: true

  rights:
    range: Right
    inlined: true

  right_concept:
    alias: concept
    range: TypedReference
    inlined: true

  right_type:
    alias: type
    range: RightsType
    ifabsent: string(generic)

  right_temporal:
    alias: temporal
    range: EventDate
    inlined: true

  right_holder:
    alias: holder
    range: LegalBody
    inlined: true

  legal_body_type:
    alias: type
    range: RepositoryType
    ifabsent: string(corporate)

  legal_body_name:
    alias: name
    range: TypedReference
    inlined: true

  caption:
    description: Legenda descritiva ou explicativa.
    alias: caption
    range: string

  teaser:
    range: uriorcurie

  overlay_image:
    range: uriorcurie

---
id: https://tradicional.arq.br/schema
name: arqtrad_schema
title: Esquema de dados dos Documentários da Arquitetura Tradicional
description: >
  O elemento central dos Documentários da Arquitetura Tradicional é a ficha
  **[Work](elements/Work/)**, que descreve uma edificação usando elementos dos padrões
  [LIDO] e [DublinCore].

  A especificação deste esquema permite validar bancos de dados de edificações
  constituídos em diversos sistemas, incluindo bases de dados relacionais
  (como aquelas que alimentam diversos sistemas de produção de sites, incluindo
  o WordPress, Tainacan, Arches, etc.) e fichas em formato de texto.
  Atualmente, contudo, os Documentários da Arquitetura Tradicional usam
  unicamente fichas em formato de texto sem formatação, combinando
  metadados estruturados segundo a especificação YAML
  ([explicação introdutória aqui][1] e [tutorial técnico aqui][2]) e conteúdo
  descritivo podendo usar as convenções de formatação do Markdown
  (inclusive especificidades do [Pandoc]).

  Além de um editor de texto, recomendamos também que use um programa de
  geoprocessamento como o [QGIS] para incluir os dados georreferenciados nas
  fichas.

  Os metadados das fichas dependem do vocabulário controlado que está em
  contrução no nosso [Thesaurus da arquitetura tradicional][4] e de outros
  vocabulários controlados, tais como o Getty Art and Architecture Thesaurus
  ou a lista de unidades de medida do UCUM.


  ## Por onde começo ?

  > Leia a especificação da ficha **[Work](elements/Work/)** para saber como preencher
  > as fichas de edificações dos Documentários da Arquitetura Tradicional.

  Se não estiver à vontade para manipular diretamente os repositórios do GitHub,
  sempre pode contribuir informações, sugestões ou desejos no
  [Fórum de discussão] deste projeto de pesquisa.
  Se tiver contribuições pontuais sobre fichas específicas, formatos ou lacunas,
  pode também abrir uma [*issue* no repositório da Casa].

  [LIDO]: https://lido-schema.org/

  [DublinCore]: https://www.dublincore.org/resources/userguide/creating_metadata/

  [1]: https://www.linkedin.com/pulse/xml-json-markdown-e-yaml-explicação-simples-vitor-martins-ufv5e

  [2]: https://www.yaml.info/learn/index.html

  [3]: https://dublincore.org

  [Pandoc]: https://pandoc.org

  [QGIS]: https://qgis.org

  [4]: https://vocabulario.tradicional.arq.br

  [Fórum de discussão]: https://github.com/orgs/arqtrad/discussions

  [*issue* no repositório da Casa]: https://github.com/arqtrad/casa/issues


license: MIT
see_also:
  - https://tradicional.arq.br/schema

prefixes:
  linkml: https://w3id.org/linkml/
  arqtrad: https://tradicional.arq.br/schema/
  vascon: https://vocabulario.tradicional.arq.br/w/
  crm: http://www.cidoc-crm.org/cidoc-crm/
  dcterms: http://purl.org/dc/terms/
  dctypes: http://purl.org/dc/dcmitype/
  doi: https://doi.org/
  schema: http://schema.org/
  lido: http://www.lido-schema.org/
  term: http://terminology.lido-schema.org/
  skos: http://www.w3.org/2004/02/skos/core#
  iso: http://purl.org/iso25964/skos-thes#
  isni: https://isni.org/isni/
  rdfs: http://www.w3.org/2000/01/rdf-schema#
  geo: http://www.opengis.net/ont/geosparql#
  geonames: https://www.geonames.org/ontology#
  la: https://linked.art/ns/terms/
  aat: http://vocab.getty.edu/aat/
  tgn: http://vocab.getty.edu/tgn/
  ulan: http://vocab.getty.edu/ulan/
  ucum: http://purl.oclc.org/NET/muo/ucum/
  unesco: http://vocabularies.unesco.org/thesaurus/
  vra: http://purl.org/vra/
  wd: http://www.wikidata.org/entity/
  EPSG: http://www.opengis.net/def/crs/EPSG/0/

default_prefix: arqtrad
default_range: string

imports:
  - linkml:types
  - classes/concept
  - classes/resource
  - classes/shared
  - classes/temporal
  - classes/thing
  - classes/work
  - classes/geonames


classes:

  Container:

    description: Todos os elementos do documentário.

    tree_root: true

    attributes:

      works:
        description: Todas as edificações documentadas.
        multivalued: true
        inlined_as_list: true
        range: Work

      concepts:
        description: Todos os termos de vocabulário controlado.
        multivalued: true
        inlined_as_list: true
        range: Concept

      places:
        description: Lugares indexados pelo Geonames
        multivalued: true
        inlined_as_list: true
        range: GeonamesFeature


enums:

  AgentType:
    description: Tipo de agente na terminologia LIDO.
    permissible_values:
      personal:
        title: individual
        meaning: term:lido00163
      corporate:
        title: coletivo
        meaning: term:lido00413
        description: >
          Uma entidade coletiva tal como uma oficina, escola (no sentido de
          um grupo de artistas que partilham um estilo semelhante), empresa,
          corporação de ofício, grupo étnico-cultural, ou outra agremiação na
          qual é impossível ou irrelevante delimitar as contribuições
          individuais.
      family:
        title: familiar
        meaning: term:lido00166
        description: >
          Coletivo de agentes caracterizado por laços familiares, incluindo
          parentesco consanguíneo, por matrimônio, adotivo ou outras relações
          familiares socialmente sancionadas no seu contexto de origem.
      other:
        title: outro
        meaning: term:lido00165

  CollectionType:
    description: >-
      The LIDO Object Type Vocabulary is a structured controlled list of terms
      recommended to use as values in the LIDO Object Type element, specifying
      the particular kind of object being in some way associated with the
      object/work that is the focus of the record.
    reachable_from:
      source_ontology: http://terminology.lido-schema.org/objectType
      include_self: false

  ConceptType:
    description: >
      Tipos de termos de vocabulário baseados no Getty AAT.
    permissible_values:
      concept:
        title: conceitos
      hierarchy_name:
        title: (nome de hierarquia)
      guide_term:
        title: <termo guia>
      facet:
        title: Faceta

  DateType:
    description: Exatidão da data conhecida.
    permissible_values:
      exact:
        title: conhecida
        meaning: term:lido00528
        description: >
          Designates a date that is definitely known, based on credible,
          documented fact.

          Note that *exact* does not preclude the granularity of the date
          expression.

      estimated:
        title: provável
        meaning: term:lido00529
        description: >
          Designates a date that is uncertain, estimated broadly using
          available information about the work or the artist. For example, you
          could estimate that the earliest possible date for any work by a
          given artist is eighteen or twenty years after the artist's birth.

          Included are also dates that are inferred from known dates associated
          with the object. For instance, if the date of production is unknown,
          but the date when the object was found is known, there is evidence
          that the production must have taken place before the finding of the
          object.

  EventType:
    description: >
      O tipo de incidência sobre a edificação que o evento descreve. Usa a
      terminologia do LIDO em <http://terminology.lido-schema.org/eventType>.
    permissible_values:
      # Creation
      creation:
        title: criação
        meaning: term:lido0001
        source: crm:E65_Creation
        exact_mappings:
          - vra:wasCreated
        description: >
          Designa um acontecimento que leva à conceção de itens ou produtos de
          natureza imaterial, como obras literárias ou imagens.
          Não usar para a produção de bens materiais. Quando a conceção desses
          bens, como uma edificação, passa por um processo de criação
          intelectual atestada, usar para tanto o termo `designing` ("projeto").
      # Production
      commissioning:
        title: encomenda
        meaning: term:lido00226
        source: aat:300393199
        exact_mappings:
          - vra:wasCommission
        close_mappings:
          - https://d-nb.info/gnd/4003557-8
          - wd:Q566889
          - aat:300393199
        broad_mappings:
          - term:lido00004
        description: >
          Atividade associada à encomenda ou autorização, frequentemente
          formalizada por contrato, para a produção de uma coisa, performance,
          obra escrita ou outra atividade.
      designing:
        title: projeto
        meaning: term:lido00224
        source: aat:300102051
        exact_mappings:
          - vra:wasDesigned
        description: >
          O projeto, na classificação de tipos de eventos do LIDO, designa a
          criação de um arcabouço conceitual para a organização da aparência de
          objetos tridimensionais, obras visuais, obras de arquitetura,
          ou sistemas técnicos.
        comments:
          - Em contraste com "Criação", que descreve a criação de um objeto ou
            obra em nível conceitual, recomenda-se usar "Projeto" para todos os
            eventos em que é criado um objeto físico que prepara a produção de
            um objeto mais acabado ou serve como modelo direto para ele.
            Frequentemente, trata-se de desenhos usados como esboços na
            produção de pinturas, esculturas ou edificações. Pode também ser um
            modelo tridimensional do qual se produz um molde; objetos
            preparatórios podem igualmente ser gerados digitalmente.

            Recomenda-se usar este termo quando ele for parte de diversos
            acontecimentos na história da produção da edificação que precisam
            ser distinguidos entre si, cada qual tendo ocorrido em diferentes
            momentos e envolvento agentes distintos.

            Se o objeto que está sendo descrito na ficha é ele próprio um
            projeto ou outra forma de elemento preparatório para a construção,
            o termo mais indicado para o eventType é `production` ("produção").
      production:
        title: produção
        meaning: term:lido00007
        source: crm:E12_Production
        exact_mappings:
          - vra:wasProduced
        description: >
          Designa ações que levam à existência de novos objetos, compreendendo
          ações como projeto e execução.
        notes:
          - Detalhar os processos e técnicas que levaram à produção do objeto
            na seção materiais e técnicas do evento, por exemplo indicando os
            sistemas construtivos empregados.
      item_production:
        title: produção de um exemplar
        meaning: term:lido01096
        source: crm:E22_Human-Made_Object
        close_mappings:
          - aat:300404024
        description: >
          No caso de construções seriadas (por exemplo, casas idênticas numa
          vila operária), designa a produção de um exemplar singular dentro do
          conjunto. Usar quando for relevante individualizar a produção desses
          exemplares no âmbito da descrição do seu conjunto, mas não quando
          cada exemplar for indexado separadamente.
        comments:
          - Este tipo de evento não deve ser usado para designar a produção de
            partes do processo produtivo, tais como projetos, maquetes,
            protótipos ou moldes. Quando for relevante informar a produção de
            um exemplar, deve-se precisar quais características permitem
            identificá-lo dentro do conjunto (endereço, variações, etc.).
      completion:
        title: conclusão
        meaning: term:lido00025
        source: aat:300053844
        close_mappings:
          - aat:300390560
        description: >
          Processo que completa um objeto ou uma campanha de obras.
      execution:
        title: execução do projeto
        meaning: term:lido00031
        source: aat:300069715
        close_mappings:
          - aat:300069715
          - http://d-nb.info/gnd/4456788-1
        description: >
          Ação de produzir um objeto com base num projeto, por oposição ao
          processo de projeto.
      # Transformation
      transformation:
        title: transformação
        meaning: term:lido00029
        source: crm:E81_Transformation
        description: >
          Ação que destrói um objeto e, usando substancialmente a mesma
          matéria, produz outro que mantém características reconhecíveis do
          objeto anterior mas é essencialmente distinto deste por sua natureza
          e identidade.
          Esta categoria pode ser usada tanto para designar a destruição do
          objeto antigo quanto a produção do objeto novo.

          Exemplos de transformação incluem o uso de espólios ou ruínas para
          produzir uma nova construção.
          Não deve ser confundido com `reconstruction` ("reconstrução"), que
          implica seja uma mudança de lugar, seja a reprodução da identidade
          visual e espacial da edificação anterior.
      reconstruction:
        title: reconstrução
        meaning: lido:lido00723
        source: aat:300081531
        exact_mappings:
          - wd:Q2478058
        close_mappings:
          - https://d-nb.info/gnd/4065958-6
        broad_mappings:
          - aat:300053744
        description: >
          Ato de construir uma nova estrutura que substitui e se parece com uma
          construção anterior que já não subsiste, baseada em evidências
          históricas, arqueológicas, gráficas, literárias ou outras.
          A semelhança visual e, eventualmente, funcional é a característica
          principal de uma reconstrução, e ela pode ou não usar materiais
          sobrestantes da edificação anterior.

          A edificação destruída e a edificação reconstruída devem ser
          cadastradas em fichas distintas e relacionadas entre si.
      translocation:
        title: remoção
        meaning: lido:lido01159
        source: https://www.vdl-denkmalpflege.de/fileadmin/dateien/Brosch%C3%BCren/VdL_Leitbild_Final_160527__1_.pdf
        exact_mappings:
          - https://d-nb.info/gnd/4258556-9
        broad_mappings:
          - aat:300149370
        description: >
          A remoção designa o ato de se desmantelar uma edificação no seu local
          de origem para reconstruí-la em outro sítio.
          Para construções deslocadas sem serem desmanteladas, usar o tipo de
          evento `move` ("deslocação").

          Exemplos de remoção são aquela do templo de Abu Simbel, no
          Egito, ou ainda aquela da casa Erbo Stenzel em Curitiba do seu
          lote original para o parque São Lourenço (onde foi posteriormente
          destruída num incêndio).
      modification_activity:
        title: alteração (ação)
        meaning: term:lido00006
        source: crm:E11_Modification
        exact_mappings:
          - vra:wasAlteration
        close_mappings:
          - aat:300105442
        description: >
          Ação intencional que cria, altera ou modifica um objeto ou obra em
          um ou mais dos seus aspectos mas não em outros. Usar para ações que
          não possam ser definidas como tipos mais específicos de alteração.
      conservation:
        title: conservação
        meaning: term:lido00402
        source: aat:300404519
        close_mappings:
          - vra:wasRestored
          - aat:300404519
          - http://d-nb.info/gnd/4114279-2
        broad_mappings:
          - term:lido00006
        description: >
          Ação ou processo realizado visando à estabilidade e salvaguarda do
          objeto no longo prazo, incluindo a sua proteção contra danos ou
          deterioração e a prevenção da deterioração natural da sua matéria.
          No nosso vocabulário, a conservação é diferente da preservação e da
          restauração.
      conversion:
        title: reforma
        meaning: term:lido01178
        source: https://www.duden.de/rechtschreibung/umbauen_umgebaut
        exact_mappings:
          - https://d-nb.info/gnd/4061577-7
        close_mappings:
          - https://www.designingbuildings.co.uk/wiki/Conversion
        broad_mappings:
          - term:lido00006
        description: >
          Intervenção significativa na materialidade e espacialidade de uma
          edificação, usando materiais e técnicas construtivas.
          Frequentemente resulta na alteração de uso ou de aparência da
          edificação, mas sem comprometer a sua identidade anterior.

          Sempre que possível, preferir designações mais específicas, tais como
          `addition`, `removal`, `adaptive_reuse`, `renewal`.
      dismantling:
        title: desmantelamento
        meaning: term:lido01179
        source: aat:300061163
        exact_mappings:
          - wd:Q52161698
          - https://d-nb.info/gnd/4149065-4
        close_mappings:
          - https://en.wikipedia.org/wiki/Deconstruction_(building)
          - https://www.designingbuildings.co.uk/wiki/Deconstruction
        broad_mappings:
          - wd:Q52161698
          - aat:300404064
        description: >
          Ato de desmontar ou remover partes significativas de um objeto,
          especialmente com a intenção de reduzir ou desbilitar o seu uso.
          Particularmente, refere-se à desmontagem cuidadosa de modo a evitar
          danos ao material removido, visando à sua reutilização, reciclagem
          ou gestão de resíduos.
      addition:
        title: acréscimo
        meaning: term:lido00008
        source: crm:E79_Part_Addition
        broad_mappings:
          - term:lido00006
        description: >
          Acréscimo a uma edificação existente, sem lhe alterar
          fundamentalmente a identidade, por meio da ampliação ou do acréscimo
          de elementos. O conjunto resultante continuará a ser identificado
          como a mesma obra anterior ao acréscimo.
      removal:
        title: eliminação parcial
        meaning: term:lido00021
        source: crm:E80_Part_Removal
        broad_mappings:
          - aat:300224146
          - term:lido00006
        narrow_mappings:
          - term:lido01187
        description: >
          Envolve a redução de uma edificação devida à eliminação de parte(s).
          Pode incluir a eliminação de anexos, de elementos construtivos, ou
          a exclusão de uma obra de um conjunto designado.
      partial_destruction_activity:
        title: destruição parcial
        meaning: term:lido01187
        source: crm:E6_Destruction
        broad_mappings:
          - term:lido00021
          - term:lido00022
        narrow_mappings:
          - term:lido01180
        description: >
          Ação intencional de destruir ou danificar partes de uma obra, sem lhe
          comprometer a identatidade enquanto objeto de documentação.
      remediation:
        title: reconstituição
        meaning: term:lido01180
        source: https://www.duden.de/rechtschreibung/rueckbauen
        exact_mappings:
          - https://d-nb.info/gnd/4410380-3
        related_mappings:
          - https://historicengland.org.uk/advice/hpg/uwandhc/unlawfulworks/
        broad_mappings:
          - term:lido00034
          - term:lido01187
        description: >
          Atividades construtivas ou de gestão que têm por objetivo restituir
          uma obra a um estado anterior conhecido ou presumido, sobretudo após
          perdas catastróficas de materialidade ou integridade.
      renewal:
        title: renovação
        meaning: term:lido01183
        source: aat:300389648
        close_mappings:
          - aat:300260783
          - aat:300077781
        broad_mappings:
          - https://d-nb.info/gnd/4152832-3
          - term:lido00006
        narrow_mappings:
          - wd:Q2144402
        description: >
          Ação que altera uma edificação de modo a recuperar a sua estrutura,
          atualizar a sua aparência, permitir a adequação a novos usos,
          aprimorar a sua eficiência energética, ou outras finalidades não
          relacionadas à preservação do patrimônio cultural ou que não tenham
          considerações patrimoniais como prioridade.
      restoration:
        title: restauração
        meaning: term:lido00034
        source: aat:300053742
        exact_mappings:
          - vra:wasRestored
        close_mappings:
          - wd:Q217102
          - aat:300053742
          - http://d-nb.info/gnd/4049600-4
        description: >
          Alterações a um objeto que têm por objetivo restabelecer um estado
          original ou anterior conhecido ou presumido (usar em vez de
          `part_removal` --- "eliminação parcial" se a intenção dominante da
          eliminação tiver sido a restauração a um estado anterior).
      modification_process:
        title: alteração (processo)
        meaning: term:lido01155
        source: aat:300105442
        broad_mappings:
          - term:lido01154
        close_mappings:
          - crm:E11_Modification
        narrow_mappings:
          - term:lido01157
        description: >
          Processo não deliberado de alteração nas características, aparência
          ou desempenho dos materiais que constituem um objeto.
          Por exemplo, corrosão, formação de cristais salinos, etc.
      partial_destruction_process:
        title: perda parcial
        meaning: term:lido01157
        broad_mappings:
          - term:lido01155
          - term:lido00022
        narrow_mappings:
          - term:lido01160
        close_mappings:
          - crm:E6_Destruction
        description: >
          Processo não intencional de degradação material, destruindo ou
          danificando partes de um objeto sem descaracterizar a sua identidade
          (por exemplo, sem convertê-lo numa ruína). Pode ser causado por
          condições ambientais continuadas ou por desastres naturais.
      deterioration:
        title: deterioração
        meaning: term:lido01160
        source: aat:300054106
        close_mappings:
          - https://d-nb.info/gnd/4745718-1
          - wd:Q94643648
        broad_mappings:
          - term:lido01157
        description: >
          Processo de perda parcial de matéria, desempenho, ou funcionalidade
          de um objeto sem intervenção ou atuação deliberada. Geralmente
          causado por condições ambientais continuadas, mas pode ser agravado
          por desastres naturais. A deterioração pode levar ao
          `destruction_process` ("arruinamento") da edificação.
      # Activity
      adaptive_reuse:
        title: reutilização adaptada
        meaning: term:lido01161
        source: aat:300056392
        exact_mappings:
          - wd:Q111749149
        close_mappings:
          - https://d-nb.info/gnd/4042840-0
          - aat:300417716
          - wd:Q21021151
        broad_mappings:
          - term:lido00004
        narrow_mappings:
          - term:lido01170
          - term:lido01169
        description: >
          Ação de converter ou adaptar uma edificação, em geral com valor
          histórico-cultural reconhecido, para novos usos ou aplicação em
          contexto distinto do original. Distinguir eventos de reutilização
          adaptativa de eventos que envolvem as intervenções físicas
          necessárias ou preparatórias a essa reutilização, usando o termo
          `conversion` ("reforma").
      opening:
        title: inauguração
        meaning: term:lido01169
        source: aat:300054769
        close_mappings:
          - wd:Q3010369
          - https://d-nb.info/gnd/4338947-8
        broad_mappings:
          - wd:Q29933838
          - term:lido01161
        narrow_mappings:
          - aat:300404068
        description: >
          Ato pelo qual um objeto é declarado operacional, geralmente por meio
          de uma cerimônia, mas não necessariamente.
      decommissioning:
        title: desafetação
        meaning: term:lido01170
        source: https://www.designingbuildings.co.uk/wiki/Decommissioning_buildings
        close_mappings:
          - https://en.wikipedia.org/wiki/Decommissioning
          - https://d-nb.info/gnd/4125246-9
        broad_mappings:
          - wd:Q29933838
          - term:lido01161
        narrow_mappings:
          - https://d-nb.info/gnd/4513722-5
        description: >
          Ação que acompanha ou sinaliza o encerramento da utilização de um
          objeto, geralmente associado à interdição física da edificação.
      # Attribute Assignment
      attribute_assignment:
        title: atribuição de atributo
        meaning: term:lido00024
        source: crm:E13_Attribute_Assignment
        description: >
          Ação de formular afirmações sobre uma propriedade de um objeto ou
          sobre uma relação entre dois itens, por exemplo, ao registrar uma
          condição, atribuir um identificador ou medir o objeto.
      assignment_to_curated_holding:
        title: atribuição a acervo curado
        meaning: term:lido01146
        broad_mappings:
          - aat:300443858
        description: >
          Atividade de atribuir conceitualmente objetos a uma coleção com base
          em características comuns, referências regionais ou de grupo, ou na
          atribuição a um colecionador.
      condition_assessment:
        title: levantamento e avaliação do estado de conservação
        meaning: term:lido00931
        description: >
          Ação que analisa as características físicas do objeto, seu estado de
          conservação e integridade formal.
      cultural_context_assignment:
        title: atribuição de contexto cultural
        meaning: term:lido01145
        description: >
          Atividade de atribuir diretamente um objeto a um contexto cultural ou
          de reconstruir cientificamente o contexto cultural em que foi
          produzido ou utilizado. O contexto pode ser definido pelo próprio
          grupo ou por terceiros, com base em categorias como língua, região ou
          religião.
      designation:
        title: proteção legal
        meaning: term:lido01181
        description: >
          Atividade pela qual um objeto recebe um status jurídico específico em
          razão de seu valor cultural, histórico, ambiental ou natural.
          No contexto de edificações, corresponde em geral ao tombamento,
          ao registro ou a outra forma de proteção patrimonial.
      deciphering:
        title: decifração de inscrição
        meaning: term:lido01150
        narrow_mappings:
          - https://d-nb.info/gnd/4297957-2
        description: >
          Atividade de transcrever e transliterar para o alfabeto latino
          caracteres presentes no próprio objeto e de traduzi-los para uma
          língua moderna com base em análise linguística.
      meaning_assignment:
        title: atribuição de significado no contexto de origem
        meaning: term:lido01147
        description: >
          Atividade de atribuir ou reconstruir cientificamente o significado
          que um objeto teve nas comunidades associadas à sua produção ou uso.
      name_assignment:
        title: atribuição de nome
        meaning: term:lido01149
        broad_mappings:
          - https://d-nb.info/gnd/4226500-9
          - https://d-nb.info/gnd/4261654-2
          - wd:Q83478504
        narrow_mappings:
          - aat:300411672
        description: >
          Atividade que resulta na atribuição de um nome a um objeto. O nome é
          uma sequência de signos que identifica individualmente o objeto em um
          determinado contexto, por convenção, tradição ou acordo.
      type_assignment:
        title: atribuição de tipo
        meaning: term:lido00023
        source: crm:E17_Type_Assignment
        description: >
          Atividade de classificar itens de qualquer natureza, podendo também
          ser aplicada a pessoas, ações e conceitos. No contexto de edificações,
          refere-se à tipificação ou classificação da obra com base em
          características convergentes.
      # Ceremony
      ceremony:
        title: cerimônia
        meaning: term:lido01182
        source: aat:300054754
        exact_mappings:
          - https://d-nb.info/gnd/4190741-3
          - aat:300054754
          - wd:Q2627975
        description: >
          Ato formal, especialmente quando conduzido de modo solene e conforme
          a rituais ou protocolos religiosos, estatais, cortesãos ou sociais.
      cornerstone:
        title: cerimônia de colocação da pedra fundamental
        meaning: term:lido01168
        source: https://pt.wikipedia.org/wiki/Pedra_fundamental
        exact_mappings:
          - https://d-nb.info/gnd/4158410-7
        broad_mappings:
          - term:lido01182
        description: >
          Ato cerimonial de colocação da pedra fundamental ou de uma pedra
          simbólica sobre a qual a nova edificação será construída.
          A colocação da pedra fundamental não coincide necessariamente com o
          início efetivo das obras.
      groundbreaking:
        title: cerimônia de lançamento da primeira pedra
        meaning: term:lido01167
        source: aat:300251861
        exact_mappings:
          - aat:300251861
        broad_mappings:
          - term:lido01182
        description: >
          Ato cerimonial que marca o início da movimentação de terra no local
          onde a edificação será construída. Distinguir da cerimônia de
          colocação da pedra fundamental, que pode ocorrer em momento diverso.
      consecration:
        title: consagração
        meaning: term:lido00728
        source: aat:300069272
        exact_mappings:
          - wd:Q1762010
          - aat:300069272
        close_mappings:
          - https://d-nb.info/gnd/4126445-9
        broad_mappings:
          - term:lido01182
        description: >
          Atividade pela qual uma autoridade religiosa consagra e dedica
          formalmente edificações, terrenos ou objetos a fins cerimoniais ou
          religiosos.
      deconsecration:
        title: desconsagração
        meaning: term:lido01158
        source: aat:300069276
        exact_mappings:
          - aat:300069276
          - wd:Q16635429
        close_mappings:
          - https://d-nb.info/gnd/4275750-2
        broad_mappings:
          - term:lido01182
        description: >
          Ato formal pelo qual uma edificação, terreno ou objeto deixa de ser
          consagrado ou destinado a fins religiosos.
      # Change of physical control or legal title
      change_control_or_title:
        title: alteração de posse ou título
        meaning: term:lido01151
        description: >
          Atividade que envolve alteração do status de um objeto quanto à
          posse física ou ao título jurídico, quando não é possível ou não é
          relevante distinguir qual dos aspectos ocorreu.
          Usar quando houver alteração de posse, de propriedade ou de ambos,
          sem especificação mais precisa.
      change_control_and_title:
        title: alteração de posse e título
        meaning: term:lido01184
        broad_mappings:
          - term:lido01151
        description: >
          Atividade que envolve alteração simultânea da posse física e do
          título jurídico de um objeto, como na conclusão de uma compra seguida
          da entrega da coisa.
      change_legal_title:
        title: alteração de título jurídico
        meaning: term:lido00001
        source: crm:E10_Transfer_of_Custody
        broad_mappings:
          - term:lido01151
        narrow_mappings:
          - https://d-nb.info/gnd/4015451-8
          - aat:300157782
          - https://d-nb.info/gnd/4212536-4
          - wd:Q3604747
        description: >
          Atividade que resulta em alteração do status jurídico de um objeto
          quanto ao seu título de propriedade, incluindo transferências de
          propriedade consensuais ou não consensuais.
      restitution:
        title: restituição
        meaning: term:lido01152
        close_mappings:
          - aat:300417843
        broad_mappings:
          - https://d-nb.info/gnd/4322105-1
          - term:lido00001
        description: >
          Atividade de restituir um objeto a seu anterior proprietário legítimo
          ou a seus sucessores diretos ou indiretos. Aplica-se, por exemplo, à
          devolução de bens culturais subtraídos ilicitamente ou retornados em
          razão de sua relevância cultural.
      change_physical_control:
        title: alteração de posse
        meaning: term:lido00005
        source: crm:E10_Transfer_of_Custody
        broad_mappings:
          - term:lido01151
        description: >
          Atividade que resulta em alteração do status de um objeto quanto à
          sua posse física ou controle material, sem alteração necessária do
          título jurídico.
      collecting:
        title: coleta
        meaning: term:lido00010
        source: aat:300077121
        exact_mappings:
          - aat:300077121
          - https://d-nb.info/gnd/4051494-8
          - wd:Q208165
        broad_mappings:
          - term:lido00005
        description: >
          Atividade de reunir objetos com o objetivo de retê-los, incluindo
          coleta de campo. Em contextos coloniais, explicitar as circunstâncias
          da coleta na descrição do evento.
      loss:
        title: perda
        meaning: term:lido00009
        source: crm:E10_Transfer_of_Custody
        close_mappings:
          - https://d-nb.info/gnd/4187879-6
          - https://d-nb.info/gnd/4327498-5
        broad_mappings:
          - term:lido00005
        description: >
          Declaração de alteração da posse física de um objeto, afastando-o de
          seu atual detentor sem indicação de destinatário. Inclui furto,
          roubo e a perda de rastreabilidade do objeto, mas não implica
          alteração do título de propriedade.
      # repatriation:
      # Commissioning
      excavation:
        title: escavação
        meaning: term:lido00033
        source: aat:300053702
        close_mappings:
          - https://d-nb.info/gnd/4129464-6
          - aat:300053702
          - wd:Q959782
        broad_mappings:
          - term:lido00004
        description: >
          Ação ou processo de escavar uma cavidade no solo; especificamente, a
          escavação e documentação sistemática de um sítio arqueológico.
      exhibition:
        title: exposição
        meaning: term:lido00225
        source: aat:300054766
        exact_mappings:
          - aat:300054766
          - wd:Q464980
        close_mappings:
          - https://d-nb.info/gnd/4129601-1
          - vra:wasPresented
        broad_mappings:
          - term:lido00004
        description: >
          Exibição pública temporária, geralmente nomeada e organizada, de
          obras de arte, artesanato, história natural, ciência ou outros itens
          de interesse cultural.
      finding:
        title: descoberta
        meaning: term:lido00002
        source: crm:S19_Encounter_Event
        exact_mappings:
          - vra:wasDiscovered
        broad_mappings:
          - term:lido00004
        description: >
          Atividade de encontrar ou tomar consciência de um objeto considerado
          potencialmente relevante no contexto de uma observação ou pesquisa,
          incluindo objetos perdidos, esquecidos ou previamente desconhecidos.
          Aplica-se, por exemplo, ao encontro de vestígios arqueológicos, de
          edificações perdidas ou de sítios.
      marketing:
        title: comercialização
        meaning: term:lido00401
        source: aat:300054673
        close_mappings:
          - aat:300054673
          - https://d-nb.info/gnd/4127117-8
        broad_mappings:
          - term:lido00004
        description: >
          Atividade pela qual se efetiva a transferência do título ou da posse
          de bens, ou o fornecimento de serviços, do vendedor ao comprador,
          incluindo publicidade, expedição, armazenagem e venda.
      move:
        title: deslocação
        meaning: term:lido00223
        source: crm:E9_Move
        close_mappings:
          - aat:300149370
        broad_mappings:
          - term:lido00004
        description: >
          Alteração da localização física de um objeto ou obra de uma
          residência a outra. Usar para deslocamentos que não envolvam o
          desmantelamento da edificação; para este último caso, usar
          `translocation` ("remoção").
      # Object requirement assessment
      req_assess:
        title: avaliação de requisitos do objeto
        meaning: term:lido00792
        broad_mappings:
          - term:lido00004
        description: >
          Ato de examinar um objeto para determinar as condições e requisitos
          necessários ao seu armazenamento, exibição, empréstimo, deslocamento
          ou outra forma de manuseio.
      display_assess:
        title: avaliação para exibição
        meaning: term:lido00794
        broad_mappings:
          - term:lido00792
        description: >
          Ato de examinar um objeto para determinar sua adequação à exibição
          e as condições necessárias para garantir sua preservação, segurança e
          a responsabilização do local de exibição.
      # loan_assess:
      move_assess:
        title: avaliação para deslocação
        meaning: term:lido00793
        broad_mappings:
          - term:lido00792
        description: >
          Ato de examinar um objeto para determinar sua adequação ao
          deslocamento e as condições necessárias para garantir sua preservação
          e segurança, bem como a responsabilização dos responsáveis pelo
          manuseio ou transporte.
      performance:
        title: performance
        meaning: term:lido00030
        source: aat:300069200
        exact_mappings:
          - vra:wasPerformed
        close_mappings:
          - https://d-nb.info/gnd/4143388-9
          - aat:300069200
          - wd:Q35140
        broad_mappings:
          - term:lido00004
        description: >
          Instância individual da execução de uma ação, operação ou processo
          na realização de uma obra literária, artística, musical, teatral ou
          outra obra criativa, destinada a comunicar direta ou indiretamente a
          um público.
      planning:
        title: planejamento
        meaning: term:lido00032
        source: aat:300054425
        close_mappings:
          - wd:Q309100
          - https://d-nb.info/gnd/4046235-3
          - aat:300054425
        broad_mappings:
          - term:lido00004
        description: >
          Atividade de determinar objetivos e delinear ou organizar os
          procedimentos e recursos necessários para alcançá-los, especialmente
          em uma proposta ou programa formal de projeto.
      protection:
        title: proteção
        meaning: term:lido01175
        source: aat:300164923
        close_mappings:
          - aat:300164923
          - aat:300105444
        broad_mappings:
          - term:lido00004
        description: >
          Atividade de manter um objeto a salvo de danos, alterações adicionais
          ou deterioração. Em edificações, pode incluir medidas emergenciais
          como impermeabilização provisória, escoramento, vedação, proteção
          contra vandalismo e contenção de elementos em risco.
      publishing:
        title: publicação
        meaning: term:lido00228
        source: aat:300054686
        exact_mappings:
          - vra:wasPublished
        close_mappings:
          - https://d-nb.info/gnd/4187925-9
          - aat:300054686
        broad_mappings:
          - term:lido00004
        description: >
          Ações, funções ou evento de emitir registros de conhecimento ou obras
          visuais reproduzidos em suporte impresso, gravado ou outro meio, para
          venda ou distribuição ao público.
      use:
        title: uso
        meaning: term:lido00011
        source: crm:P16_used_specific_object
        close_mappings:
          - https://d-nb.info/gnd/4275659-5
          - aat:300068844
          - https://d-nb.info/gnd/4120814-6
        broad_mappings:
          - term:lido00004
        description: >
          Atividade baseada na capacidade ou permissão de empregar, ocupar,
          aplicar ou explorar o valor de algo, ou no modo como isso é feito.
          Ocorre em um período determinado em relação a um objeto criado pelo
          ser humano, cuja presença é condição necessária para a ação.
      # End of Existence
      end_existence:
        title: fim da existência
        meaning: term:lido00027
        source: crm:E64_End_of_Existence
        broad_mappings:
          - term:lido00222
        description: >
          Evento que encerra a existência de qualquer tipo de entidade, como um
          objeto físico, um produto intelectual ou um ser vivo.
      destruction:
        title: destruição
        meaning: term:lido00026
        source: crm:E6_Destruction
        close_mappings:
          - aat:300053087
          - https://d-nb.info/gnd/4222882-7
        broad_mappings:
          - term:lido00027
        description: >
          Evento que destrói um objeto a ponto de ele perder sua identidade
          como sujeito de documentação. Pode decorrer de atividade humana
          intencional ou de processos independentes dela, e pode também se
          referir à destruição de uma entidade imaterial.
          Usar `destruction_activity` ou `destruction_process` quando for
          relevante distinguir a natureza intencional ou não intencional do
          evento.
      destruction_activity:
        title: destruição (ação)
        meaning: term:lido01186
        source: crm:E6_Destruction
        broad_mappings:
          - term:lido00026
        description: >
          Evento causado por atividade humana intencional que destrói um objeto
          a ponto de ele perder sua identidade como sujeito de documentação.
          Inclui arruinar, demolir, desmontar, reduzir a fragmentos, inutilizar
          ou otherwise por fim a um objeto, estrutura ou outra coisa material.
      destruction_process:
        title: arruinamento
        meaning: term:lido01156
        source: crm:E6_Destruction
        broad_mappings:
          - term:lido00026
        description: >
          Processo não intencional que destrói um objeto a ponto de ele perder
          sua identidade como sujeito de documentação. Pode ser causado por
          deterioração, apodrecimento, ação de animais, desastres naturais ou
          outra exposição aos elementos.
      unknown:
        title: evento desconhecido
        meaning: term:lido00003
        source: crm:E7_Activity
        broad_mappings:
          - term:lido00222
        description: >
          Evento ou atividade para o qual há evidência de que ocorreu, mas que
          não pode ser mais especificado.

  EventPlaceType:
    description: >-
      Para eventos que implicam a deslocação do bem, indica se o local se
      refere ao descobrimento, à origem ou ao destino da obra.
    # http://terminology.lido-schema.org/eventPlace_type
    permissible_values:
      discovery:
        meaning: term:lido01037
      origin:
        meaning: term:lido00220
      destination:
        meaning: term:lido00221

  PeriodNameType:
    description: >
      O vocabulário de tipos de período/estilo do LIDO é uma lista controlada
      estruturada de termos recomendada para uso como valores do atributo de
      tipo do elemento Período/Estilo.

      O atributo de tipo qualifica o tipo particular de informação de
      período/estilo, como estilo, período ou movimento. Exemplos podem ser
      “neolítico” para um período, “impressionista” para um estilo ou
      “cubismo” para um movimento.

      Baseado na categoria do [CDWA
      "Styles/Periods/Groups/Movements"](http://www.getty.edu/research/publications/electronic_publications/cdwa/17styles.html)
    permissible_values:
      period:
        meaning: term:lido00731
        description: >
          A distinct named historical or cultural portion or division of time
          during which something runs its course, characterized by some
          prevalent or distinguishing condition, circumstance, or occurrence,
          or by the rule of a particular government.
      style:
        meaning: term:lido00732
        description: >
          A distinct configuration of artistic elements that together
          constitute a named manner of expression peculiar to a certain epoch,
          people, or to a visual appearance, technique, or visual language
          adopted by particular adherents of that language.
      group:
        meaning: term:lido00735
        description: >
          A cultural group, which includes societies or groups of people
          characterized by common ideas, customs, social behavior, products, or
          way of life within a particular nation, people, or period.
      movement:
        meaning: term:lido00733
        description: >
          The state or process in which events or conditions transpire, a
          tendency, or a trend evident at a particular time or in a particular
          sphere, particularly a course or series of actions and endeavours on
          the part of a group of people working towards a shared goal or to
          advance a shared political, social, or artistic objective.
      dynasty:
        meaning: term:lido00734
        description: >
          The succession of rulers from the same family, line, stock, or group,
          during a particular period of time; extended to include all the
          people and culture surrounding this succession of rulers.
#   reachable_from:
#     source_ontology: term
#     source_nodes:
#       - term:periodName_type
#     relationship_types:
#       - skos:inScheme
#     include_self: false

  GeometryType:
    description: Tipos de geometria do objeto geoJSON
    permissible_values:
      Polygon:
      MultiPolygon:

  InscriptionType:
    description: Tipos de inscrições previstos no VRA Core.
    permissible_values:
      signature:
      mark:
      caption:
      date:
      text:
      translation:
      other:

  LabelType:
    description: >
      No SKOS, caracteriza se cada termo deve ser considerado preferencial ou
      alternativo, usado para indexação, oculto da visualização (usado apenas
      para buscas), etc.
    permissible_values:
      alternative:
        meaning: skos:altLabel  # term:lido00170
        description: >-
          Abreviações, abreviaturas, variantes lexicais e formas irregulares de
          singular ou plural podem ser incluídas como termos ou títulos
          alternativos para um conceito ou objeto.
          No caso de edificações ou conjuntos que são conhecidos por mais de
          um nome (por exemplo, pela sua função atual ou antiga, ou pelo
          endereço), selecionar `alternative` e indicar o tipo de título.
      display:
        meaning: term:lido00526
        description: >-
          Nome a ser apresentado na interfaz pública, incluindo artigos se for
          o caso.
      hidden:
        meaning: skos:hiddenLabel  # term:lido00426
        description: >-
          Uma variante do nome com erros comuns de grafia ou imprecisões
          lexicais, mas que seja relevante para buscas dos usuários.
          Deve ficar oculto da interfaz pública.
      indexing:
        meaning: term:lido00961
        description: >-
          Nome, termo ou identificador a ser usado em indexação, por exemplo
          removendo artigos ou partículas iniciais, invertendo a ordem do nome
          e do sobrenome, etc.
      preferred:
        meaning: skos:prefLabel  # term:lido00169
        description: >-
          O nome, termo ou título preferencial. Normalmente não usaremos esta
          opção pois o campo `title` já contempla a opção preferencial.

  LargerContextType:
    description: |
      Tipos de relações entre partes e todo previstas no vocabulário controlado
      do LIDO. Inclui as categorias de relações hierárquicas e de relações
      associativas de parte ao todo.

      Ver <http://terminology.lido-schema.org/relatedWorkRelType>
    permissible_values:
      physical_part_of:
        title: fisicamente contido em
        meaning: term:lido00255
        description: >
          Usar quando um objeto físico fizer parte integrante de um objeto ou
          complexo físico maior. Se o conjunto mais amplo for um construto
          interpretativo, usar a relação `has_borader_conceptual_context`.
      conceptual_part_of:
        title: parte conceitual de
        meaning: term:lido00572
        description: >
          Usar quando um objeto intelectual for parte de uma entidade
          conceitual maior ou mais ampla.
      has_borader_conceptual_context:
        title: tem contexto conceitual mais amplo
        meaning: term:lido00575
        description: >
          Usar quando um objeto físico for incluído segundo critérios
          interpretativos num conjunto conceitual mais amplo. Se o conjunto
          mais amplo for uma extensão física que compreende inequivocamente o
          objeto, usar a relação `physical_part_of`.
      example_of:
        title: exemplar de
        meaning: term:lido00627
        description: >
          Usar quando o objeto construído é a manifestação física de um
          conteúdo intelectual, podendo abarcar desde instâncias específicas de
          um projeto seriado (por exemplo, um exemplar das casas da SHIS —
          Sociedade de Habitações de Interesse Social — produzidas em Brasília
          a partir de 1969) até a realização edificada de um programa teórico
          específico (por exemplo, a Cité Radieuse de Marselha como
          exemplo da unité d'habitation de Le Corbusier).

          Vinculações teóricas ou conceituais com maior distância
          interpretativa (por exemplo, o Jardim América como exemplar de
          cidade–jardim) devem ser cadastradas no grupo `subject`.
      has_arch_context:
        title: tem como contexto arquitetônico
        meaning: term:lido00616
        description: >
          O objeto em causa foi concebido para integrar ou está situado no
          referido conjunto edificado, ou integra o contexto funcional deste.
      had_arch_context:
        title: tinha como contexto arquitetônico
        meaning: term:lido01051
        description: >
          O objeto em causa foi concebido para integrar ou esteve situado no
          referido conjunto edificado, mas não tem mais esse contexto por ter
          sido trasladado ou removido, ou porque o contexto foi destruído ou
          descaracterizado.
      in_conceptual_whole_with:
        title: pertence ao mesmo contexto conceitual que
        meaning: term:lido00578
        description: >
          Relação simétrica entre dois objetos que pertencem ao mesmo contexto
          conceitual. Usar apenas nos casos em que o conjunto conceitual
          maior não for cadastrado no documentário, por motivos técnicos ou
          decisão científica.
      in_physical_whole_with:
        title: pertence ao mesmo contexto material que
        meaning: term:lido00577
        description: >
          Relação simétrica entre dois objetos que pertencem ao mesmo contexto
          material ou espacial. Usar apenas nos casos em que o conjunto
          arquitetônico maior não for cadastrado no documentário, por motivos
          técnicos ou decisão científica.
      was_part_of_whole_with:
        title: pertenceu ao mesmo contexto que
        meaning: term:lido01059
        description: >
          Relação simétrica entre dois objetos que pertenceram ao mesmo
          contexto conceitual, material ou espacial, mas já não pertencem
          devido a remoção, traslado, destruição ou reclassificação. Usar
          apenas nos casos em que o conjunto maior não for cadastrado no
          documentário, por motivos técnicos ou decisão científica.
      is_part_of:
        title: faz parte de
        meaning: term:lido00574
        description: >
          Relação genérica entre parte e todo. Sempre que possível, usar os
          tipos de relação mais específicos.
      formerly_part_of:
        title: anteriormente parte de
        meaning: term:lido01085
        description: >
          O objeto físico em questão era anteriormente compreendido num
          conjunto edificado maior que não mais existe, seja porque o conjunto
          foi parcialmente demolido ou descaracterizado, ou porque suas outras
          partes foram trasladadas ou removidas.
      is_was_part_of:
        title: parte de
        meaning: term:lido01088
        description: >
          O objeto faz ou fazia parte de um conjunto físico maior, mas não é
          possível determinar se esse conjunto ainda existe ou não.

  MaterialTechType:
    description: >
      A materialidade e as técnicas de produção ou intervenção na edificação
      devem ser categorizadas segundo esta classificação.

    notes:

      - The physical matter or substance from which an object is made, including
        any tangible substances, either naturally or synthetically derived,
        ranging from specific materials to types of material designated by their
        function. The term comprises both the media that are incorporated in an
        object and any support to which the media are applied.

        Based on [AAT "materials (matter)"](http://vocab.getty.edu/page/aat/300010358);
        [CDWA
        "Materials/Techniques"](http://www.getty.edu/research/publications/electronic_publications/cdwa/8materials.html#RTFToC2)

        Use the most specific term for the material that is appropriate. It is
        strongly recommended to take the indexing term from a published
        controlled vocabulary, preferably a Linked Open Vocabulary, for example
        the Art & Architecture Thesaurus, specifically its [Materials
        hierarchy](http://www.getty.edu/vow/AATFullDisplay?find=materials&amp;logic=AND&amp;note=&amp;page=1&amp;subjectid=300010357).

      - Medium, as a value for the type attribute of the LIDO Term
        Materials/Techniques element, designates the material that is applied to
        a support in the making of an object or a work of art, such as ink on
        paper or oil paint on canvas; often a particular technique or techniques
        are closely associated with the media. Based on [AAT "media (artists'
        materials)"](http://vocab.getty.edu/page/aat/300163343); [CDWA
        Materials/Techniques](https://www.getty.edu/research/publications/electronic_publications/cdwa/8materials.html#implement).

        In many forms of art, a distinction is made between materials used as the
        media, and materials used as the support. Medium is the material applied
        to the support. For example, for a drawing described as pen and brown ink
        and black chalk on paper, pen is the instrument, ink and black chalk are
        the media, and paper is the support. [Cited from Categories for the
        Description of Works of Art (CDWA) "Materials/Techniques"]

      - Support, as a value for the type attribute of the LIDO Term
        Materials/Techniques element, designates the surface material to which
        media are applied or a work is mounted, for example canvas, oak panel,
        laid paper, wood, copper, glass, or marble. For example, with paintings,
        drawings, prints, or photographs, the media would be applied to the
        surface of a support such as paper, wood panel, canvas, or glass in order
        to create the image. Used typically for two-dimensional works, although
        the concept may apply to any work.

        Based on [AAT "supports"](http://vocab.getty.edu/page/aat/300014844);
        [CDWA
        "Materials/Techniques"](https://www.getty.edu/research/publications/electronic_publications/cdwa/8materials.html#implement)

      - Record a term specifying the color, tint, or hue of the material,
        particularly if color is an unusual or important characteristic of the
        object. [All colored impressions of materials of an object are meant, not
        just parts treated with dyestuff. The information refers to the overall
        effect of color, not only as cause of, e.g., dyeing or painting.]

        It is recommended to use internationally approved standard color charts,
        codes and terminology such as the Universal Color Language (UCL). Use
        preferably [color names as specified by the Art & Architecture
        Thesaurus](http://vocab.getty.edu/aat/300080438) (AAT).
        Centroid color numbers, which refer to the appropriate color-blocks on
        the [Inter-Society Color Council and National Bureau of Standards
        (ISCC-NBS) color name
        charts](https://en.wikipedia.org/wiki/ISCC%E2%80%93NBS_system),
        are also provided by the AAT.

      - Implement, as a value for the type attribute of the LIDO Term
        Materials/Techniques element, designates any object used to carry out the
        technique in order to create or modify an object, including equipment,
        tools, apparatus, utensils, instruments, and other things employed in any
        trade or used in executing a task or work.

        Based on
        [CDWA
        "Materials/Techniques"](http://www.getty.edu/research/publications/electronic_publications/cdwa/8materials.html#RTFToC2);
        [AAT "implements"](http://vocab.getty.edu/page/aat/300404585)

      - Technique, as a value for the type attribute of the LIDO Term
        Materials/Techniques element, designates the manner, method, or process
        applied in the creation, design, or modification of an object.

        Based on [CDWA
        "Materials/Techniques"](http://www.getty.edu/research/publications/electronic_publications/cdwa/8materials.html#RTFToC2).

        Use the most specific term for indexing that is appropriate. It is
        strongly recommended to take the indexing term from a published
        controlled vocabulary, preferably a
        [Linked Open Vocabulary](http://lov.okfn.org/dataset/lov/), for example
        the Art & Architecture Thesaurus, specifically its
        [Processes and Techniques
        hierarchy](http://www.getty.edu/vow/AATHierarchy?find=techniques&amp;logic=AND&amp;note=&amp;page=1&amp;subjectid=300053001).

        For information about scientific methods by which an object was found or
        collected, such as field collection methods in archaeology, use the LIDO
        Event Method element.

      - Watermark, as a value for the type attribute of the LIDO Term
        Materials/Techniques element, designates an identification of the
        watermark type or name. A watermark is a design incorporated into paper
        as it is made, typically a sign of the manufacturer, or a proof of
        authenticity for documents and banknotes. The mark is visible through
        transmitted light, appearing as translucent or shaded area.

        Based on [CDWA
        "Materials/Techniques"](http://www.getty.edu/research/publications/electronic_publications/cdwa/8materials.html#WatermarkIdentification);
        [AAT "watermarks"](http://vocab.getty.edu/aat/300028749)

        It is recommended to use as indexing terms descriptors of internationally
        or nationally approved classifications, such as the [Watermark
        Information System](http://www.wasserzeichen-online.de/wzis/index.php),
        the [Index of watermark classes and
        subclasses](http://www.paperhistory.org/Standards/IPHN2.1.1_en.pdf),
        provided as a [Registration
        Standard](http://www.paperhistory.org/Standards/) of the [International
        Association of Paper Historians
        (IPH)](http://www.paperhistory.org/index.php),
        or the [Watermark Descriptor
        Tables](http://www.gravell.org/descriptors.php?&amp;&amp;offset=&amp;rectotal=&amp;query=),
        provided by the [Thomas L. Gravell Watermark
        Archive](http://www.gravell.org/).

    permissible_values:
      material:
        meaning: term:lido00132
      medium:
        meaning: term:lido00513
      support:
        meaning: term:lido00514
      color_name:
        meaning: term:lido00479
      implement:
        meaning: term:lido00248
      technique:
        meaning: term:lido00131
      watermark:
        meaning: term:lido00427
      other:

  MeasurementQualifier:
    description: >
      Qualifica a confiabilidade das medidas aferidas.
    permissible_values:
      interpreted:
        title: interpretativa
        description: Metrologia interpretativa ou citação textual.
      estimated:
        title: estimativa visual
        description: >
          Estimativa obtida por comparação com uma escala gráfica, com medidas
          adjacentes conhecidas, ou por caminhamento, partes do corpo, etc.
      derived:
        title: extrapolada
        description: Extrapolado de um desenho ou modelo.
      measured:
        title: medida no local
        description: >
          Medida obtida no local por meio de instrumentos manuais ou
          eletrônicos (trena, teodolito, etc.).
      scanned:
        title: escaneada digitalmente
        description: >
          Medida extraída de um escaneamento a laser de alta precisão ou de uma
          estação topográfica digital.

  MeasurementType:
    description: >-
      The type attribute qualifies whether the measurements given are features
      of the object proper or object requirements for handling the object, for
      instance, the maximum temperature variation.
    permissible_values:
      proper:
        meaning: term:lido00927
      requirement:
        meaning: term:lido00923

  ReferenceType:
    description: >
      Tipos de referências a objetos externos previstos no LIDO.
    permissible_values:
      uri:
        title: URI
        meaning: term:lido00099
      iri:
        title: IRI
        meaning: term:lido00510
      local:
        title: Identificador local
        meaning: term:lido00100

  RelatedWorkRelType:
    description: |
      Relações associativas entre objetos físicos ou criações intelectuais,
      definidas segundo o vocabulário do LIDO.
      Compreende as relações associativas, exceto aquelas de partes com o todo
      (grupo `lido01074`, tratado em `LargerContextType`).

      Ver <http://terminology.lido-schema.org/relatedWorkRelType>
    permissible_values:  # http://terminology.lido-schema.org/lido00583
      # Relações gerais, de representação e de documentação
      relatedTo:
        title: relacionado a
        meaning: term:lido00263
        description: >
          Relação geral e simétrica, usada quando não se conhece ou não cabe
          uma relação mais específica. Sempre que possível, preferir um dos
          tipos mais específicos.
      planOf:
        title: planta de
        meaning: term:lido00592
        description: >
          A obra descrita na ficha é uma concepção formal da disposição dos
          espaços e elementos do objeto relacionado. Pode ser preparatória ou
          um registro feito após a construção. Para a planta de um pavimento,
          usar `floorPlanOf`.
      floorPlanOf:
        title: planta baixa de
        meaning: term:lido00694
        broad_mappings:
          - term:lido00592
        description: >
          A obra descrita na ficha, um desenho ou outra projeção ortográfica
          bidimensional, representa um corte horizontal da edificação
          relacionada, tomado próximo ao nível do solo ou acima de um
          pavimento.
      elevationOf:
        title: alçado de
        meaning: term:lido00692
        description: >
          A obra descrita na ficha, um desenho ou outra projeção ortográfica,
          mostra a disposição dos elementos verticais de um objeto espacial
          (por exemplo, uma edificação), exterior ou interior, em vista direta
          e frontal.
      sectionOf:
        title: corte de
        meaning: term:lido00696
        description: >
          A obra descrita na ficha, um desenho ortográfico ou objeto em outra
          mídia, mostra uma edificação, objeto ou sítio como se estivesse
          seccionado e exposto num plano específico.
      architecturalSurveyOf:
        title: levantamento arquitetônico de
        meaning: term:lido00702
        broad_mappings:
          - term:lido00603
        description: >
          A obra descrita na ficha é um levantamento que avalia o estado de
          conservação de uma edificação histórica e fundamenta a priorização de
          ações de preservação e reparo.
      renderingOf:
        title: visualização de
        meaning: term:lido00261
        description: >
          A obra descrita na ficha é uma visualização (perspectiva,
          renderização) ou um registro fiel da concepção do objeto relacionado,
          em geral em contexto arquitetônico.
      depicts:
        title: representa
        meaning: term:lido00645
        description: >
          A obra descrita na ficha é uma obra de arte que representa outra
          obra, em geral num contexto histórico relevante. Reservar para as
          representações mais importantes; para a simples presença da
          edificação como assunto de outra obra, usar o grupo `subject`.
      documents:
        title: documenta
        meaning: term:lido00618
        description: >
          A obra descrita na ficha, em geral um texto, documenta, discute ou
          descreve o objeto relacionado em sentido acadêmico ou científico. A
          relação é feita com a entidade conceitual do documento, não com um
          exemplar físico específico.
      reconstructionOf:
        title: reconstituição hipotética de
        meaning: term:lido00698
        broad_mappings:
          - term:lido00603
        description: >
          A obra descrita na ficha é um desenho, modelo digital ou objeto em
          outra mídia que propõe como outro objeto pode ter sido em um momento
          anterior, ou que o reconstitui a partir de evidências. Não confundir
          com o evento `reconstruction` (reconstrução física da edificação).
      illustrationOf:
        title: ilustração de
        meaning: term:lido00619
        broad_mappings:
          - term:lido00579
        description: >
          A obra descrita na ficha, em geral uma imagem ou diagrama que
          esclarece, exemplifica ou visualiza, acompanha o objeto relacionado,
          em geral um texto.
      hasRendering:
        title: tem visualização
        meaning: term:lido00681
        description: >
          O objeto relacionado é uma visualização (perspectiva, renderização)
          ou um registro fiel da concepção da obra descrita na ficha, em geral
          em contexto arquitetônico.
      depictedIn:
        title: representado em
        meaning: term:lido00998
        description: >
          A obra descrita na ficha está representada na mídia relacionada, que
          será geralmente uma obra de arte ou fotografia depositada num
          repositório externo (catálogo de museu, Wikimedia Commons, etc.).
      documentedIn:
        title: documentado em
        meaning: term:lido00617
        description: >
          A obra descrita na ficha está documentada, discutida ou descrita na
          mídia relacionada, que em geral será um texto. A relação é feita com
          a entidade conceitual do documento, não com um exemplar físico
          específico que o contenha.
      hasSpeciesDescriptionIn:
        title: tem descrição de espécie em
        meaning: term:lido00674
        broad_mappings:
          - term:lido00617
        description: >
          Aplica-se a objetos naturais, em geral uma espécie recém-descoberta,
          que recebem descrição formal detalhada em artigo científico ou outra
          publicação reconhecida. Raramente relevante para edificações.
      isSpeciesDescriptionOf:
        title: é descrição de espécie de
        meaning: term:lido00673
        broad_mappings:
          - term:lido00618
        description: >
          A obra descrita na ficha, em geral um artigo científico, apresenta a
          descrição formal detalhada de uma espécie recém-descoberta. Raramente
          relevante para edificações.
      # Relações entre etapas de produção
      preparatoryFor:
        title: preparatório para
        meaning: term:lido00586
        description: >
          A obra descrita na ficha foi criada para preparar outro objeto; por
          exemplo, um desenho de projeto ou de execução é preparatório para a
          obra construída. Preferir os tipos mais específicos abaixo.
      modelFor:
        title: modelo para
        meaning: term:lido00258
        broad_mappings:
          - term:lido00586
        description: >
          A obra descrita na ficha é uma representação em escala, em geral
          tridimensional (maquete), preparatória para outro objeto mais
          acabado.
      preparatoryStudyFor:
        title: estudo preparatório para
        meaning: term:lido00260
        broad_mappings:
          - term:lido00586
        description: >
          A obra descrita na ficha é um estudo preliminar de aspectos
          específicos de outro objeto mais acabado. Não é apropriado para
          arquitetura: para objetos das fases preparatórias de projetos
          arquitetônicos, usar `sketchFor`, `designFor` ou
          `constructionDrawingFor`; para o estudo detalhado de aspectos de uma
          edificação existente, usar `studyAfter`.
      sketchFor:
        title: esboço para
        meaning: term:lido00588
        broad_mappings:
          - term:lido00586
        description: >
          A obra descrita na ficha é um esboço (croqui) que visualiza de modo
          inicial e aproximado o projeto de outro objeto. Os esboços são menos
          acabados que os projetos e os estudos.
      cartoonFor:
        title: é cartão para
        meaning: term:lido00590
        broad_mappings:
          - term:lido00586
        description: >
          A obra descrita na ficha é um desenho preparatório, em geral em
          tamanho real, destinado a transferir um projeto para a superfície de
          trabalho do outro objeto (por exemplo, um mural ou uma tapeçaria).
      designFor:
        title: é projeto para
        meaning: term:lido00594
        broad_mappings:
          - term:lido00586
        description: >
          A obra descrita na ficha desenvolve o esquema de um projeto
          (artístico ou arquitetônico) e é preliminar a outro objeto mais
          acabado. Em geral é um desenho, mas não necessariamente. Os projetos
          são mais acabados que os esboços.
      bozzettoFor:
        title: é bozzetto para
        meaning: term:lido00704
        broad_mappings:
          - term:lido00594
        description: >
          A obra descrita na ficha é um bozzetto: modelo preliminar, em geral
          escultórico, de outro objeto mais acabado.
      printingSurfaceFor:
        title: é matriz de impressão para
        meaning: term:lido00596
        broad_mappings:
          - term:lido00586
        description: >
          A obra descrita na ficha é uma superfície plana (placa, bloco, chapa)
          usada para imprimir textos ou imagens que constituem o objeto
          relacionado.
      negativeFor:
        title: é negativo para
        meaning: term:lido00598
        broad_mappings:
          - term:lido00586
        description: >
          A obra descrita na ficha é um negativo fotográfico utilizado para
          produzir uma ou mais cópias fotográficas.
      constructionDrawingFor:
        title: é desenho executivo para
        meaning: term:lido00690
        broad_mappings:
          - term:lido00586
        description: >
          A obra descrita na ficha é um desenho que comunica as informações
          necessárias à construção do objeto relacionado (edificação ou
          similar), em especial a mecânica da sua execução, e é usado pelos
          responsáveis pela obra.
      moldFor:
        title: é molde para
        meaning: term:lido01133
        broad_mappings:
          - term:lido00586
        description: >
          A obra descrita na ficha é um molde usado para produzir o objeto
          relacionado, por fundição ou conformação.
      basedOn:
        title: baseado em
        meaning: term:lido00587
        description: >
          A criação ou produção da obra descrita na ficha baseou-se em outro
          objeto preparatório. Preferir os tipos mais específicos abaixo.
      hasModel:
        title: tem modelo
        meaning: term:lido00257
        broad_mappings:
          - term:lido00587
        description: >
          A obra descrita na ficha foi preparada por um modelo em escala, em
          geral tridimensional (maquete), que é o objeto relacionado.
      hasPreparatoryStudy:
        title: tem estudo preparatório
        meaning: term:lido00259
        broad_mappings:
          - term:lido00587
        description: >
          A obra descrita na ficha é a versão mais acabada de outro objeto
          preliminar, que explora aspectos específicos dela. Não é apropriado
          para arquitetura: para as fases preparatórias de projetos
          arquitetônicos, usar `hasSketch`, `hasDesign` ou
          `hasConstructionDrawing`; para o estudo detalhado de uma edificação
          existente, usar `hasStudy`.
      hasSketch:
        title: tem esboço
        meaning: term:lido00589
        broad_mappings:
          - term:lido00587
        description: >
          A obra descrita na ficha é a versão mais acabada de outro objeto
          preliminar, que visualizou de modo inicial e aproximado o seu projeto
          (croqui).
      hasCartoon:
        title: tem cartão
        meaning: term:lido00591
        broad_mappings:
          - term:lido00587
        description: >
          A obra descrita na ficha, em geral uma obra bidimensional de grande
          escala como um mural ou uma tapeçaria, é a versão mais acabada de um
          desenho preparatório em tamanho real (cartão).
      hasDesign:
        title: tem projeto
        meaning: term:lido00595
        broad_mappings:
          - term:lido00587
        description: >
          A obra descrita na ficha é a versão mais acabada de outro objeto
          preliminar que desenvolveu o esquema do seu projeto. Em geral o
          projeto é um desenho, mas não necessariamente.
      hasBozzetto:
        title: tem bozzetto
        meaning: term:lido00705
        broad_mappings:
          - term:lido00595
        description: >
          A obra descrita na ficha, em geral escultórica, é a versão mais
          acabada de um modelo preliminar (bozzetto).
      printedFromPrintingSurface:
        title: foi impresso a partir da matriz
        meaning: term:lido00597
        broad_mappings:
          - term:lido00587
        description: >
          A obra descrita na ficha é uma impressão produzida a partir de uma
          matriz específica (placa, bloco, chapa), que é o objeto relacionado.
      printedFromNegative:
        title: foi copiado do negativo
        meaning: term:lido00599
        broad_mappings:
          - term:lido00587
        description: >
          A obra descrita na ficha é uma cópia fotográfica produzida a partir
          de um negativo específico, que é o objeto relacionado.
      hasConstructionDrawing:
        title: tem desenho executivo
        meaning: term:lido00691
        broad_mappings:
          - term:lido00587
        description: >
          A obra descrita na ficha, em geral uma edificação, possui um desenho
          executivo que comunica as informações necessárias à sua construção. O
          desenho é o objeto relacionado.
      castOrFormedFromMold:
        title: foi moldado a partir do molde
        meaning: term:lido01132
        broad_mappings:
          - term:lido00587
        description: >
          A obra descrita na ficha foi fundida ou conformada a partir de um
          molde específico, que é o objeto relacionado.
      # Relações de derivação
      derivedFrom:
        title: derivado de
        meaning: term:lido00603
        description: >
          A obra descrita é derivada ou sensivelmente influenciada pelo objeto
          relacionado.

          Preferir outras expressões de relação mais específicas sempre que
          possível. A relação `derivedFrom` deve ser reservada para casos em
          que a relação seja de variações e influências. Essas relações devem
          ser fundamentadas em interpretação bibliográfica.
      copyAfter:
        title: é cópia de
        meaning: term:lido00262
        broad_mappings:
          - term:lido00603
        description: >
          A obra descrita na ficha copia outro objeto, assemelhando-se
          fortemente a ele ou reproduzindo a sua aparência ou o seu conteúdo.
          Implica imitação menos precisa e fiel que `reproductionOf`.
      tracingOf:
        title: é decalque de
        meaning: term:lido00862
        broad_mappings:
          - term:lido00262
        description: >
          A obra descrita na ficha foi copiada de outro objeto por decalque, em
          geral pelo mesmo artista, artífice ou ateliê que produziu o original.
      forgeryOf:
        title: é falsificação de
        meaning: term:lido00601
        broad_mappings:
          - term:lido00603
        description: >
          A obra descrita na ficha imita outro objeto com intenção de enganar.
      replicaOf:
        title: é réplica de
        meaning: term:lido00605
        broad_mappings:
          - term:lido00603
        description: >
          A obra descrita na ficha é uma reprodução precisa de outro objeto
          valorizado, em geral nas mesmas dimensões do original. Usar também
          quando mais de uma réplica semelhante é produzida de um mesmo
          original.
      reproductionOf:
        title: é reprodução de
        meaning: term:lido00607
        broad_mappings:
          - term:lido00603
        description: >
          A obra descrita na ficha é uma cópia de outro objeto feita de modo
          mais ou menos mecânico e sem intenção de enganar. Implica imitação
          mais precisa e fiel que `copyAfter`.
      facsimileOf:
        title: é fac-símile de
        meaning: term:lido00623
        broad_mappings:
          - term:lido00607
        description: >
          A obra descrita na ficha é uma cópia exata de um objeto físico, em
          geral nas mesmas dimensões do original, especialmente de livros,
          documentos, gravuras e desenhos.
      counterproofFrom:
        title: é contraprova de
        meaning: term:lido00609
        broad_mappings:
          - term:lido00603
        description: >
          A obra descrita na ficha é uma impressão tirada de uma obra original,
          em geral uma gravura ou um desenho, mas às vezes um texto.
      versionOf:
        title: é versão de
        meaning: term:lido00700
        broad_mappings:
          - term:lido00603
        description: >
          A obra descrita na ficha foi feita pelo mesmo artista, artífice ou
          ateliê que criou outro objeto no qual aquela se baseia de perto, mas
          resultando numa obra com características próprias.
      studyAfter:
        title: é estudo a partir de
        meaning: term:lido00706
        broad_mappings:
          - term:lido00603
        description: >
          A obra descrita na ficha explora em detalhe certos aspectos
          específicos de outro objeto (por exemplo, uma edificação existente).
      pasticheCopyAfter:
        title: é cópia em pastiche de
        meaning: term:lido00611
        description: >
          A obra descrita na ficha copia parcialmente outro objeto, mas contém
          características ou partes copiadas de uma segunda obra ou
          acrescentadas como originais.
      sourceFor:
        title: é fonte para
        meaning: term:lido00604
        description: >
          A obra descrita na ficha influenciou fortemente ou é a fonte da
          criação ou produção do objeto relacionado. Preferir os tipos mais
          específicos abaixo sempre que o objeto relacionado puder ser
          designado como cópia, réplica, reprodução, falsificação, versão, etc.
      hasCopy:
        title: tem cópia
        meaning: term:lido00600
        broad_mappings:
          - term:lido00604
        description: >
          A obra descrita na ficha foi copiada pelo objeto relacionado, que se
          assemelha fortemente a ela ou reproduz a sua aparência ou o seu
          conteúdo.
      hasTracing:
        title: tem decalque
        meaning: term:lido00863
        broad_mappings:
          - term:lido00600
        description: >
          A obra descrita na ficha foi copiada pelo objeto relacionado por
          decalque, em geral pelo mesmo artista, artífice ou ateliê que a
          produziu.
      hasForgery:
        title: tem falsificação
        meaning: term:lido00602
        broad_mappings:
          - term:lido00604
        description: >
          A obra descrita na ficha foi imitada pelo objeto relacionado, feito
          com intenção de enganar.
      hasReplica:
        title: tem réplica
        meaning: term:lido00606
        broad_mappings:
          - term:lido00604
        description: >
          A obra descrita na ficha é um objeto valorizado que foi reproduzido
          com precisão pelo objeto relacionado, em geral nas mesmas dimensões.
      hasReproduction:
        title: tem reprodução
        meaning: term:lido00608
        broad_mappings:
          - term:lido00604
        description: >
          A obra descrita na ficha foi copiada pelo objeto relacionado de modo
          mais ou menos mecânico e sem intenção de enganar.
      hasFacsimile:
        title: tem fac-símile
        meaning: term:lido00624
        broad_mappings:
          - term:lido00608
        description: >
          A obra descrita na ficha, objeto físico, foi reproduzida por uma
          cópia exata, em geral nas mesmas dimensões do original, especialmente
          no caso de livros, documentos, gravuras e desenhos.
      hasCounterproof:
        title: tem contraprova
        meaning: term:lido00610
        broad_mappings:
          - term:lido00604
        description: >
          A obra descrita na ficha é o original do qual se tirou uma impressão
          (contraprova), em geral uma gravura ou um desenho, mas às vezes um
          texto.
      hasReconstruction:
        title: tem reconstituição hipotética
        meaning: term:lido00699
        broad_mappings:
          - term:lido00604
        description: >
          A aparência anterior da obra descrita na ficha é proposta por um
          desenho, modelo digital ou objeto em outra mídia, que é o objeto
          relacionado. Não confundir com o evento `reconstruction`
          (reconstrução física da edificação).
      hasVersion:
        title: tem versão
        meaning: term:lido00729
        broad_mappings:
          - term:lido00604
        description: >
          O objeto relacionado foi feito pelo mesmo artista, artífice ou ateliê
          que criou a obra descrita na ficha, baseando-se nela de perto, mas
          resultando numa obra com características próprias.
      hasArchitecturalSurvey:
        title: tem levantamento arquitetônico
        meaning: term:lido00703
        broad_mappings:
          - term:lido00604
        description: >
          A obra descrita na ficha é uma edificação histórica cujo estado de
          conservação é avaliado por um levantamento arquitetônico (o objeto
          relacionado), que fundamenta a priorização de ações de preservação e
          reparo.
      hasStudy:
        title: tem estudo
        meaning: term:lido00707
        broad_mappings:
          - term:lido00604
        description: >
          Certos aspectos específicos da obra descrita na ficha são explorados
          em detalhe pelo objeto relacionado.
      hasPasticheCopy:
        title: tem cópia em pastiche
        meaning: term:lido00612
        description: >
          A obra descrita na ficha foi parcialmente copiada pelo objeto
          relacionado, que contém características ou partes copiadas de uma
          segunda obra ou acrescentadas como originais.
      # Plantas e projeções ortográficas
      hasPlan:
        title: tem planta
        meaning: term:lido00593
        description: >
          A obra descrita na ficha possui uma planta (objeto relacionado), que
          é uma concepção formal da disposição dos seus espaços e elementos.
          Pode ser preparatória ou um registro feito após a construção.
      hasFloorPlan:
        title: tem planta baixa
        meaning: term:lido00695
        broad_mappings:
          - term:lido00593
        description: >
          A obra descrita na ficha, em geral uma edificação, é representada por
          um desenho ou outra projeção ortográfica bidimensional que mostra um
          corte horizontal tomado próximo ao nível do solo ou acima de um
          pavimento.
      hasElevation:
        title: tem alçado
        meaning: term:lido00693
        description: >
          A obra descrita na ficha, um objeto espacial como uma edificação, é
          representada por um desenho ou outra projeção ortográfica que mostra
          a disposição dos seus elementos verticais, exterior ou interior.
      hasSection:
        title: tem corte
        meaning: term:lido00697
        description: >
          A obra descrita na ficha, uma edificação, sítio ou objeto semelhante,
          é mostrada por um desenho ortográfico ou objeto em outra mídia como
          se estivesse seccionada e exposta num plano específico.
      # Faces, duplicatas e reproduções
      versoOf:
        title: é verso de
        meaning: term:lido00613
        description: >
          A obra descrita na ficha ocupa o lado reverso ou secundário de uma
          folha cujo lado principal (recto) contém outro(s) objeto(s).
      rectoOf:
        title: é recto de
        meaning: term:lido00614
        description: >
          A obra descrita na ficha ocupa o lado principal ou frontal de uma
          folha cujo lado reverso (verso) contém outro(s) objeto(s).
      obverseOf:
        title: é anverso de
        meaning: term:lido00928
        description: >
          A obra descrita na ficha ocupa a face frontal, superior ou principal
          de moedas, medalhas, selos ou outros objetos de duas faces.
      reverseOf:
        title: é reverso de
        meaning: term:lido00929
        description: >
          A obra descrita na ficha ocupa a face posterior, inferior ou
          secundária de moedas, medalhas, selos ou cédulas.
      duplicateOf:
        title: é duplicata de
        meaning: term:lido00622
        description: >
          Relação simétrica entre exemplares adicionais de um mesmo objeto, no
          mesmo formato e na mesma mídia, no contexto de uma coleção específica
          (cópias fotográficas, livros, fundições, etc.).
      distinguishedFrom:
        title: é distinto de
        meaning: term:lido00621
        description: >
          Relação simétrica entre dois objetos que costumam ser confundidos
          entre si, em geral em contexto histórico ou em trabalhos acadêmicos
          antigos, para evitar a confusão.
      containsReproductionOf:
        title: contém reprodução de
        meaning: term:lido00625
        description: >
          A obra descrita na ficha, em geral um livro, revista ou jornal,
          contém uma reprodução impressa ou fotográfica do objeto relacionado.
      reproducedIn:
        title: é reproduzido em
        meaning: term:lido00626
        description: >
          A obra descrita na ficha é reproduzida, por impressão ou fotografia,
          no objeto relacionado, em geral um livro, revista ou jornal. A
          reprodução numa edição impressa pode ser prova essencial da
          existência ou do estado anterior da obra.
      fromSameModel:
        title: é do mesmo modelo que
        meaning: term:lido01036
        description: >
          Relação simétrica entre obras fundidas ou criadas a partir do mesmo
          modelo, como as casas de um projeto seriado. Usar quando a relação
          hierárquica de parte e todo não for possível.
      castFromSameMold:
        title: foi moldado a partir do mesmo molde que
        meaning: term:lido01078
        description: >
          Relação simétrica entre obras fundidas ou criadas a partir do mesmo
          molde. Usar quando a relação hierárquica de parte e todo não for
          possível.
      # Peças companheiras e complementos
      isOrWasCompanionPieceOf:
        title: é ou foi peça companheira de
        meaning: term:lido01090
        description: >
          Relação simétrica entre a obra descrita e outro objeto concebido para
          ser exibido ou usado com ela, em qualquer momento, atual ou passado.
          Os objetos não correspondem necessariamente entre si, nem são apenas
          dois.
      companionPieceOf:
        title: é peça companheira de
        meaning: term:lido00579
        broad_mappings:
          - term:lido01090
        description: >
          Relação simétrica entre a obra descrita e outro objeto concebido para
          ser exibido ou usado com ela. Os objetos não correspondem
          necessariamente entre si, nem são apenas dois. Usar apenas se os
          objetos não forem partes de um todo maior que possa ser designado por
          um termo apropriado.
      hasIllustration:
        title: tem ilustração
        meaning: term:lido00620
        broad_mappings:
          - term:lido00579
        description: >
          A obra descrita na ficha, em geral um texto, é acompanhada pelo
          objeto relacionado, uma imagem ou diagrama que a esclarece,
          exemplifica ou visualiza.
      pendantOf:
        title: é pendant de
        meaning: term:lido00628
        broad_mappings:
          - term:lido00579
        description: >
          Relação simétrica entre pares de objetos concebidos, ou escolhidos
          propositalmente, para serem exibidos juntos, em geral lado a lado.
      wasFormerlyCompanionPieceOf:
        title: foi peça companheira de
        meaning: term:lido01091
        broad_mappings:
          - term:lido01090
        description: >
          Relação simétrica e já extinta entre a obra descrita e outro objeto
          concebido para ser exibido ou usado com ela. Os objetos não
          correspondem necessariamente entre si, nem são apenas dois.
      isOrWasComplementedBy:
        title: é ou foi complementado por
        meaning: term:lido01092
        description: >
          A obra descrita na ficha foi criada independentemente do objeto
          relacionado, mas posteriormente foi associada a ele, para serem
          usados em conjunto ou para agregar valor a ambos. Cobre qualquer
          momento, atual ou passado.
      complementedBy:
        title: é complementado por
        meaning: term:lido00581
        broad_mappings:
          - term:lido01092
        description: >
          A obra descrita na ficha foi criada independentemente do objeto
          relacionado, mas posteriormente foi associada a ele, para serem
          usados em conjunto ou para agregar valor a ambos.
      wasFormerlyComplementedBy:
        title: foi complementado por
        meaning: term:lido01093
        broad_mappings:
          - term:lido01092
        description: >
          A obra descrita na ficha foi criada independentemente do objeto
          relacionado e posteriormente foi associada a ele, mas essa associação
          foi desfeita.
      complementsOrFormerlyComplemented:
        title: complementa ou complementava
        meaning: term:lido01094
        description: >
          O objeto relacionado foi criado independentemente da obra descrita na
          ficha, mas posteriormente foi associado a ela, para serem usados em
          conjunto ou para agregar valor a ambos. Cobre qualquer momento, atual
          ou passado.
      complements:
        title: complementa
        meaning: term:lido00580
        broad_mappings:
          - term:lido01094
        description: >
          Relação entre obras criadas independentemente uma da outra, mas que
          mais tarde passaram a ser consideradas ou usadas conjuntamente.
      formerlyComplemented:
        title: complementava
        meaning: term:lido01095
        broad_mappings:
          - term:lido01094
        description: >
          Relação entre obras criadas independentemente uma da outra, mas que
          mais tarde passaram a ser consideradas ou usadas conjuntamente, sendo
          essa associação posteriormente desfeita.
      # Sucessão, citação e localização
      predecessorOf:
        title: é predecessor de
        meaning: term:lido01098
        description: >
          A obra descrita na ficha foi substituída pelo objeto relacionado no
          uso, não necessariamente na posição. Uso reservado sobretudo à
          arquitetura.
      hasReplaced:
        title: substituiu
        meaning: term:lido01099
        description: >
          A obra descrita na ficha substituiu o objeto relacionado no uso, não
          necessariamente na posição. Uso reservado sobretudo à arquitetura.
      visualQuotationOf:
        title: é citação visual de
        meaning: term:lido01102
        description: >
          A obra descrita na ficha é ou contém uma citação visual de outra
          obra, isto é, a adoção de um único elemento formal de outra obra como
          referência consciente a ela.
      hasVisualQuotation:
        title: tem citação visual
        meaning: term:lido01103
        description: >
          A obra descrita na ficha é citada visualmente no objeto relacionado,
          isto é, um único elemento formal dela é adotado como referência
          consciente a ela.
      positionedNear:
        title: próximo a
        meaning: term:lido01136
        description: >
          Relação simétrica entre dois objetos situados em proximidade
          espacial, quando esta proximidade for significativa por razões
          compositivas, históricas ou funcionais.

          Se o objeto foi concebido para, ou colocado dentro de, ou está em
          contexto funcional diretamente relacionado com uma edificação ou
          outro objeto monumental, usar `has_arch_context` (grupo
          `larger_context`).
      builtOnSiteOf:
        title: foi construído no sítio de
        meaning: term:lido01188
        description: >
          A obra descrita na ficha foi construída no sítio onde esteve outra
          obra. Usar apenas quando as duas obras têm funções diferentes; se a
          nova obra foi feita para substituir a antiga, com função igual ou
          semelhante (por exemplo, uma nova catedral no sítio de uma catedral
          anterior), usar `hasReplaced`.
      wasAntedatedOnSameSiteAs:
        title: foi precedido no mesmo sítio por
        meaning: term:lido01189
        description: >
          A obra descrita na ficha foi precedida, no mesmo sítio, por outra
          obra. Usar apenas quando as duas obras têm funções diferentes; se a
          obra anterior foi substituída por outra de função igual ou semelhante
          (por exemplo, uma catedral demolida e substituída por outra), usar
          `predecessorOf`.


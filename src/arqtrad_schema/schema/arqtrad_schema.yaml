  SubjectType:
    description: >
      The type attribute indicates the kind of subject information, whether it
      is, for instance, a description of a generic subject, an identification
      of a named individual, or an interpretation of the theme.

      Note that "Iconclass notations" are distinguished from other index terms
      for subject type in order to consider the impact of the type of indexing
      vocabulary with respect to information retrieval facilities.
    #  http://terminology.lido-schema.org/subject_type
    permissible_values:
      descriptive:
        meaning: term:lido00525
      iconographic:
        meaning: term:lido00745
      concept:
        meaning: term:lido00524
      other:
        meaning: term:lido00136


types:

  CslCitekey:
    description: >
      Chave de citação compatível com o Citation Style Language,
      começando com '@'.
      Obter as chaves de citação das referências bibliográficas consultando
      a nossa biblioteca compartilhada no Zotero.
    typeof: string
    pattern: '^@[a-zA-Z0-9_][\w:.#$%&\-+?<>~/]*$'

  GeoJSONCoordinateArray:
    description: >-
      JSON array of GeoJSON positions. The valid nesting depends on the
      associated geometry type.
    typeof: string
    structured_pattern:
      syntax: '^\[[\s\[\]\d.,eE+-]+\]$'
      interpolated: true
      partial_match: false

  Latitude:
    description: "Latitude em graus decimais (separador: ponto)."
    typeof: double
    minimum_value: -90
    maximum_value: 90

  Longitude:
    description: "Longitude em graus decimais (separador: ponto)."
    typeof: double
    minimum_value: -180
    maximum_value: 180

  OrcidId:
    description: |
      ORCID iD, no formato `orcid:1234-5678-9012-345X` ou
      `https://orcid.org/1234-5678-9012-345X`.
    typeof: string
    pattern: '^(?:https?://orcid\.org/|orcid:)?\d{4}-\d{4}-\d{4}-\d{3}[\dX]$'

  OlcPlusCode11:
    description: Open Location Code (Plus Code) com resolução de 11 dígitos.
    typeof: string
    pattern: '^([2-9CFGHJMPQRVWX]{8})\+([2-9CFGHJMPQRVWX]{3})$'

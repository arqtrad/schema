id: https://tradicional.arq.br/schema/place
name: wasth-place
title: WASTH Place

imports:
  - linkml:types

prefixes:
  linkml: https://w3id.org/linkml/
  wasth: https://tradicional.arq.br/schema/
  crm: http://www.cidoc-crm.org/cidoc-crm/
  schema: http://schema.org/

default_prefix: wasth
default_range: string

classes:

  Place:
    is_a: Work
    class_uri: schema:Place
    exact_mappings:
      - crm:E18_Physical_Thing

    description: >
      Entities that have a somewhat fixed, physical extension.

      This class comprises all persistent physical items with a relatively
      stable form, human-made or natural.

      Nos Documentários da Arquitetura Tradicional, um lugar é um sítio
      físico com localização fixa que se caracteriza por conter uma ou mais
      construções.

      Veja o [Tutorial de georreferenciamento] para maiores detalhes sobre como
      obter e usar dados de georreferenciamento.

      A edificação DEVE ser georreferenciada segundo um ponto e, opcionalmente,
      PODE ser georreferenciada segundo o polígono da sua projeção.

      `former_site`, `intended` e `other` recebem uma lista de lugares
      formatados do mesmo modo que o grupo `site`.

      :mailbox_with_no_mail:
      O campo `description` deve ser usado para cadastrar o endereço postal
      completo da edificação. Para quebra de linha, deixe uma linha em
      branco.

      :link:
      O campo `part_of` contém uma única referência ao nosso [vocabulário
      de lugares]. As instruções de preenchimento são as mesmas que para os
      [tipos de obra](#work_types) mas, em geral, não precisa de
      bibliografia.

      id:
        range: OlcPlusCode11

    slot_usage:

      title_type:
        range: RepositoryType
        required: true

      work_rights:
        required: false

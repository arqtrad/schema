    name: work__classification_subject
    description: "A broad category for grouping objects or works on the basis of a\
      \ topical association, including thematic or systematic classification, or an\
      \ assignment by discipline. The relationship between an object/work and a subject\
      \ category is a kind of membership based on ascription rather than a generic\
      \ is-a relation.\n\u2753 Ainda n\xE3o implementamos o bloco `objectClassification`\
      \ do LIDO. Talvez ele n\xE3o seja relevante para o document\xE1rio de arquitetura\
      \ dom\xE9stica, e n\xE3o \xE9 obrigat\xF3rio no padr\xE3o LIDO nem no perfil\
      \ de aplica\xE7\xE3o para arquitetura."
    from_schema: https://tradicional.arq.br/schema/work
    mappings:
    - term:lido00932
    slot_uri: term:lido00932
    alias: classification_subject
    owner: Work
    domain_of:
    - Work
    range: ConceptReference
    multivalued: true
    inlined: true
    inlined_as_list: false
  work__classification_local:
    name: work__classification_local
    description: "A classification scheme for grouping objects on the basis of locally\
      \ defined criteria, including categories corresponding to the curatorial departments\
      \ of the repository, such as \"prints and drawings\", \"decorative arts\", \"\
      North America\", \"invertebrates\", \"Bronze Age\" or \"textiles\". [Based on\
      \ CCO \"Class\"](https://vraweb.org/wp-content/uploads/2020/04/CatalogingCulturalObjectsFullv2.pdf)\n\
      \u2753 Ainda n\xE3o implementamos o bloco `objectClassification` do LIDO. Talvez\
      \ ele n\xE3o seja relevante para o document\xE1rio de arquitetura dom\xE9stica,\
      \ e n\xE3o \xE9 obrigat\xF3rio no padr\xE3o LIDO nem no perfil de aplica\xE7\
      \xE3o para arquitetura."
    from_schema: https://tradicional.arq.br/schema/work
    mappings:
    - term:lido01135
    slot_uri: term:lido01135
    alias: classification_local
    owner: Work
    domain_of:
    - Work
    range: ConceptReference
    multivalued: true
    inlined: true
    inlined_as_list: false
  work__classification_special:
    name: work__classification_special
    description: "A classification scheme for grouping objects on the basis of criteria\
      \ defined within specific academic disciplines or cultural domains, such as\
      \ the \"Hornbostel-Sachs Classification of Musical Instruments\", the \"Nickel-Strunz\
      \ classification\", biological taxonomies etc. Refers to classification schemes\
      \ that group objects on the basis of object characteristics, not on the basis\
      \ of themes or topics which the objects or works are related to.\n\u2753 Ainda\
      \ n\xE3o implementamos o bloco `objectClassification` do LIDO. Talvez ele n\xE3\
      o seja relevante para o document\xE1rio de arquitetura dom\xE9stica, e n\xE3\
      o \xE9 obrigat\xF3rio no padr\xE3o LIDO nem no perfil de aplica\xE7\xE3o para\
      \ arquitetura."
    from_schema: https://tradicional.arq.br/schema/work
    mappings:

classes:
  Container:
    name: Container
    definition_uri: https://tradicional.arq.br/schema/Container
    description: "Todos os elementos do document\xE1rio."
    from_schema: https://tradicional.arq.br/schema
    slots:
    - container__works
    - container__places
    - container__concepts
    attributes:
      works:
        name: works
        description: "Todas as edifica\xE7\xF5es documentadas."
        range: Work
        multivalued: true
        inlined_as_list: true
      places:
        name: places
        description: Todos os lugares cadastrados.
        range: Place
        multivalued: true
        inlined_as_list: true
      concepts:
        name: concepts
        description: "Todos os termos de vocabul\xE1rio controlado."
        range: Concept
        multivalued: true
        inlined_as_list: true
    class_uri: wasth:Container
    tree_root: true
  Concept:
    name: Concept
    definition_uri: https://tradicional.arq.br/schema/Concept
    description: 'A SKOS concept can be viewed as an idea or notion; a unit of thought.
      However, what constitutes a unit of thought is subjective, and this definition
      is meant to be suggestive, rather than restrictive.

      The notion of a SKOS concept is useful when describing the conceptual or intellectual
      structure of a knowledge organization system, and when referring to specific
      ideas or meanings established within a KOS.

      Note that, because SKOS is designed to be a vehicle for representing semi-formal
      KOS, such as thesauri and classification schemes, a certain amount of flexibility
      has been built in to the formal definition of this class.

      '
    from_schema: https://tradicional.arq.br/schema/concept
    exact_mappings:
    - skos:Concept
    - schema:DefinedTerm
    is_a: Thing
    slots:
    - Thing_description
    - title_type
    - bibliographic_citation
    - content
    - thing__id
    - thing__author
    - thing__record_date
    - thing__title
    - thing__title_source
    - thing__alt_name
    - thing__category
    - thing__identifiers
    - thing__tags
    - thing__temporal
    - thing__collection
    - thing__repositories
    - thing__record_rights
    - concept__broader
    - concept__narrower
    - concept__relation
    attributes:
      broader:
        name: broader
        description: "Um conceito de significa\xE7\xE3o mais gen\xE9rica. Conceitos\
          \ gen\xE9ricos s\xE3o tipicamente representados como pais em uma hierarquia\
          \ de conceitos (\xE1rvore)."
        slot_uri: skos:broader
        range: BroaderConceptReference
        multivalued: true
        inlined_as_list: true
      narrower:
        name: narrower
        description: "Um conceito de significa\xE7\xE3o mais espec\xEDfica. Conceitos\
          \ espec\xEDficos s\xE3o tipicamente representados como descendentes em uma\
          \ hierarquia de conceitos (\xE1rvore)."
        slot_uri: skos:narrower
        range: ConceptReference
        multivalued: true
        inlined_as_list: true
      relation:
        name: relation
        description: "Um conceito com o qual existe um relacionamento sem\xE2ntico\
          \ associativo. Usar principalmente em refer\xEAncia a vocabul\xE1rios externos,\
          \ como o Getty Art and Architecture Thesaurus."
        slot_uri: skos:relation
        range: RelatedConceptReference
        multivalued: true
        inlined_as_list: true
    class_uri: skos:Concept
  ConceptReference:
    name: ConceptReference
    definition_uri: https://tradicional.arq.br/schema/ConceptReference
    description: "Atribui\xE7\xE3o de vocabul\xE1rio controlado com cita\xE7\xE3o\
      \ de apoio."
    from_schema: https://tradicional.arq.br/schema/concept
    slots:
    - description
    - bibliographic_citation
    - conceptReference__name
    attributes:
      name:
        name: name
        description: Identificador do termo referido.
        range: Concept
    class_uri: wasth:ConceptReference
  BroaderConceptReference:
    name: BroaderConceptReference
    definition_uri: https://tradicional.arq.br/schema/BroaderConceptReference
    description: "Rela\xE7\xF5es hier\xE1rquicas."
    from_schema: https://tradicional.arq.br/schema/concept
    slots:
    - broaderConceptReference__match
    attributes:
      match:
        name: match
        description: "Tipo da rela\xE7\xE3o."
        range: SkosHierarchicalRelation
    class_uri: wasth:BroaderConceptReference
  RelatedConceptReference:
    name: RelatedConceptReference
    definition_uri: https://tradicional.arq.br/schema/RelatedConceptReference
    description: "Rela\xE7\xF5es hier\xE1rquicas."
    from_schema: https://tradicional.arq.br/schema/concept
    slots:
    - relatedConceptReference__match
    attributes:
      match:
        name: match
        description: "Tipo da rela\xE7\xE3o."
        range: SkosMappingRelation
    class_uri: wasth:RelatedConceptReference
  Place:
    name: Place
    definition_uri: https://tradicional.arq.br/schema/Place
    description: "Entities that have a somewhat fixed, physical extension.\nThis class\
      \ comprises all persistent physical items with a relatively stable form, human-made\
      \ or natural.\nNos Document\xE1rios da Arquitetura Tradicional, um lugar \xE9\
      \ um s\xEDtio f\xEDsico com localiza\xE7\xE3o fixa que se caracteriza por conter\
      \ uma ou mais constru\xE7\xF5es.\nVeja o [Tutorial de georreferenciamento] para\
      \ maiores detalhes sobre como obter e usar dados de georreferenciamento.\nA\
      \ edifica\xE7\xE3o DEVE ser georreferenciada segundo um ponto e, opcionalmente,\
      \ PODE ser georreferenciada segundo o pol\xEDgono da sua proje\xE7\xE3o.\n`former_site`,\
      \ `intended` e `other` recebem uma lista de lugares formatados do mesmo modo\
      \ que o grupo `site`.\n:mailbox_with_no_mail: O campo `description` deve ser\
      \ usado para cadastrar o endere\xE7o postal completo da edifica\xE7\xE3o. Para\
      \ quebra de linha, deixe uma linha em branco.\n:link: O campo `part_of` cont\xE9\
      m uma \xFAnica refer\xEAncia ao nosso [vocabul\xE1rio de lugares]. As instru\xE7\
      \xF5es de preenchimento s\xE3o as mesmas que para os [tipos de obra](#work_types)\
      \ mas, em geral, n\xE3o precisa de bibliografia.\n"
    from_schema: https://tradicional.arq.br/schema/place
    exact_mappings:
    - schema:Place
    - crm:E18_Physical_Thing
    is_a: Thing
    slots:
    - Thing_description
    - bibliographic_citation
    - content
    - thing__author
    - thing__record_date
    - thing__title
    - thing__title_source
    - thing__alt_name
    - thing__category
    - thing__identifiers
    - thing__tags
    - thing__temporal
    - thing__collection
    - thing__repositories
    - thing__record_rights
    - site
    - place__work_type_function
    - place__work_type_context
    - place__part_of
    - place__former_site
    - place__intended_site
    - place__other_site
    - Place_id
    - Place_title_type
    slot_usage:
      id:
        name: id
        is_a: thing__id
        range: OlcPlusCode11
      title_type:
        name: title_type
        range: RepositoryType
    attributes:
      work_type_function:
        name: work_type_function
        description: "Objects that are distinguishable by the particular purpose for\
          \ which they are designed or used. If an object is identifiable by its intended\
          \ use, then it is qualified by function.\nBased on [AAT Guidelines \"Types\
          \ of Guide Terms\"](https://www.getty.edu/research/tools/vocabularies/guidelines/aat_3_1_hierarchical_rels.html)\n\
          Nos Document\xE1rios de edifica\xE7\xF5es, designa um dos sete tipos de\
          \ prop\xF3sitos concebidos por C. William Westfall e Samir Youn\xE9s em\
          \ *Architectural Type and Character*.\nNo Document\xE1rio de Lugares, designa\
          \ o papel administrativo da localidade, por exemplo freguesia, sede municipal,\
          \ capital estadual ou nacional."
        slot_uri: term:lido00767
        range: ConceptReference
        recommended: true
        multivalued: true
        inlined_as_list: false
      work_type_context:
        name: work_type_context
        description: "Descriptors for objects that are distinguishable by their use\
          \ or application within a particular physical location. If an object is\
          \ identifiable by association with specific surroundings, it is qualified\
          \ by location or context.\nBased on [AAT Guidelines \"Types of Guide Terms\"\
          ](https://www.getty.edu/research/tools/vocabularies/guidelines/aat_3_1_hierarchical_rels.html)\n\
          No Document\xE1rio de Lugares Tradicionais, designa o tipo de n\xFAcleo\
          \ populacional\u2009: s\xEDtio isolado, povoa\xE7\xE3o rural, vila ou cidade,\
          \ por exemplo.\nNos Document\xE1rios de edifica\xE7\xF5es, designa sobretudo\
          \ o contexto imediato de implanta\xE7\xE3o de uma edifica\xE7\xE3o\u2009\
          : urbana, rural, isolada, em correnteza, etc."
        slot_uri: term:lido00934
        range: ConceptReference
        recommended: true
        multivalued: true
        inlined_as_list: false
      part_of:
        name: part_of
        description: A set of structured information about a place that is the broader
          context for the place in focus, such as the district, state, or nation to
          which a city belongs.
        slot_uri: lido:partOfPlace
        range: GeonamesId
        inlined: true
      former_site:
        name: former_site
        description: "Indica que a edifica\xE7\xE3o n\xE3o se encontra mais no local\
          \ indicado, seja porque foi deslocada ou demolida."
        alias: former
        range: Site
        multivalued: true
        inlined_as_list: true
      intended_site:
        name: intended_site
        description: "Sinaliza que a edifica\xE7\xE3o devia ocupar um certo local,\
          \ mas n\xE3o chegou a ser constru\xEDda."
        alias: intended
        range: Site
        multivalued: true
        inlined_as_list: true
      other_site:
        name: other_site
        description: "Para casos n\xE3o contemplados em nenhuma das categorias acima."
        alias: other
        range: Site
        multivalued: true
        inlined_as_list: true
    class_uri: schema:Place
  Site:
    name: Site
    definition_uri: https://tradicional.arq.br/schema/Site
    description: "This class comprises 4-dimensional point sets (volumes) in physical\
      \ spacetime (in contrast to mathematical models of it) regardless of their true\
      \ geometric forms. They may derive their identity from being the extent of a\
      \ material phenomenon or from being the interpretation of an expression defining\
      \ an extent in spacetime. Intersections of instances of E92 Spacetime Volume,\
      \ E53 Place, and E52 Time-Span are also regarded as instances of E92 Spacetime\
      \ Volume. An instance of E92 Spacetime Volume is either contiguous or composed\
      \ of a finite number of contiguous subsets. Its boundaries may be fuzzy due\
      \ to the properties of the phenomena it derives from or due to the limited precision\
      \ up to which defining expression can be identified with a real extent in spacetime.\
      \ The duration of existence of an instance of E92 Spacetime Volume is its projection\
      \ on time.\nEste bloco corresponde \xE0 terminologia do [DublinCore] `coverage\
      \ > spatial`. Na especifica\xE7\xE3o [LIDO], a localiza\xE7\xE3o f\xEDsica de\
      \ um bem se confunde com a sua inser\xE7\xE3o institucional (reposit\xF3rio).\
      \ Na formata\xE7\xE3o da nossa ficha, tentamos desfazer essa confus\xE3o separando\
      \ o georreferenciamento e o reposit\xF3rio em blocos diferentes.\nEle inclui\
      \ informa\xE7\xF5es de georreferenciamento, nomes hist\xF3ricos de lugares e\
      \ reposit\xF3rios ou conjuntos aos quais pertence a edifica\xE7\xE3o (por exemplo,\
      \ um conjunto urbano tombado / classificado).\nAs informa\xE7\xF5es de localiza\xE7\
      \xE3o, especialmente o georreferenciamento, s\xE3o indispens\xE1veis para espacializar\
      \ todos os demais atributos da ficha.\n"
    from_schema: https://tradicional.arq.br/schema/place
    exact_mappings:
    - crm:E92_Spacetime_Volume
    - schema:DefinedRegion
    is_a: Thing
    abstract: true
    slots:
    - Thing_description
    - title_type
    - bibliographic_citation
    - content
    - thing__author
    - thing__record_date
    - thing__title
    - thing__title_source
    - thing__alt_name
    - thing__category
    - thing__identifiers
    - thing__tags
    - thing__temporal
    - thing__collection
    - thing__repositories
    - thing__record_rights
    - site__location
    - site__extent
    - Site_id
    slot_usage:
      id:
        name: id
        description: 'Incluir aqui um identificador da base geonames na forma `geonames:1234`.

          '
        is_a: thing__id
        range: GeonamesId
    attributes:
      location:
        name: location
        description: Representative point location for the place, normally in EPSG:4326
          (WGS 84).
        slot_uri: geo:hasGeometry
        range: GeographicPoint
        required: true
        inlined: true
      extent:
        name: extent
        description: Polygonal, multipolygonal, or linear geographic extent associated
          with the place.
        slot_uri: geo:hasGeometry
        range: GeographicExtent
        inlined: true
    class_uri: crm:E92_Spacetime_Volume
  GeographicPoint:
    name: GeographicPoint
    definition_uri: https://tradicional.arq.br/schema/GeographicPoint
    description: "Coordenadas do ponto que situa o s\xEDtio na visualiza\xE7\xE3o\
      \ do mapa.\nA fonte preferencial de autoridade para o georreferenciamento \xE9\
      \ um \xF3rg\xE3o p\xFAblico, por exemplo o IPHAN no Brasil (usando as coordenadas\
      \ informadas no [SICG]) ou a DGMN em Portugal (usando as coordenadas informadas\
      \ no [SIPA]).\nCaso n\xE3o haja georreferenciamento oficial, usar uma planta\
      \ cadastral municipal georreferenciada ou, na falta desta, o [Global Building\
      \ Atlas]. Nesses casos, para se obter as coordenadas de georreferenciamento,\
      \ \xE9 preciso usar um Sistema de Informa\xE7\xF5es Geogr\xE1ficas da sua prefer\xEA\
      ncia.\nComo exemplo, no [QGIS], isso pode ser feito seguindo as instru\xE7\xF5\
      es abaixo\u2009:\n1. Sempre projetar o mapa usando EPSG:4326 (WGS84)\u2009;\n\
      2. Selecionar o pol\xEDgono da edifica\xE7\xE3o na camada da planta cadastral\
      \ ou\n   do Global Building Atlas\u2009;\n\n3. Rodar o comando do menu `Vector\
      \ > Geometry Tools > Centroids` para\n  obter as coordenadas do ponto (`location`)\
      \ \u2014 ele vai criar uma camada\n  tempor\xE1ria com o ponto no centr\xF3\
      ide do pol\xEDgono selecionado\u2009;\n\n4. Usar novamente a ferramenta `Get\
      \ WKT` para visualizar as coordenadas,\n  copiar os valores e colar na ficha\
      \ com o grau de precis\xE3o (casas\n  decimais) desejado.\n"
    from_schema: https://tradicional.arq.br/schema/place
    slots:
    - srs_name
    - source
    - bibliographic_citation
    - geographicPoint__lat
    - geographicPoint__lon
    - geographicPoint__alt
    - geographicPoint__zoom
    attributes:
      lat:
        name: lat
        description: 'Latitude em graus decimais (separador decimal: ponto).'
        range: Latitude
        required: true
      lon:
        name: lon
        description: 'Longitude em graus decimais (separador decimal: ponto).'
        range: Longitude
        required: true
      alt:
        name: alt
        description: 'Altitude em metros (separador decimal: ponto)'
        range: float
        minimum_value: -1000
        maximum_value: 10000
      zoom:
        name: zoom
        description: "Usado para visualizar o mapa mais de longe se a precis\xE3o\
          \ das coordenadas for baixa.\n"
        ifabsent: integer(13)
        range: integer
        minimum_value: 0
        maximum_value: 18
    class_uri: wasth:GeographicPoint
  GeographicExtent:
    name: GeographicExtent
    definition_uri: https://tradicional.arq.br/schema/GeographicExtent
    description: "Coordenadas do pol\xEDgono que define o s\xEDtio.\n"
    from_schema: https://tradicional.arq.br/schema/place
    slots:
    - srs_name
    - source
    - bibliographic_citation
    - geographicExtent__geometry_type
    - geographicExtent__coordinates
    attributes:
      geometry_type:
        name: geometry_type
        description: Tipo da geometria descrita pelas coordenadas.
        alias: type
        range: GeometryType
        required: true
      coordinates:
        name: coordinates
        description: "No QGIS, usar a ferramenta `Get WKT` para obter as coordenadas\
          \ do pol\xEDgono (`extent`) com a op\xE7\xE3o `Get JSON` \u2014 copiar apenas\
          \ os colchetes `[[[ ]]]` e os valores num\xE9ricos dentro deles.\n"
        range: GeoJSONCoordinateArray
        required: true
    class_uri: wasth:GeographicExtent
  BibliographicCitation:
    name: BibliographicCitation
    definition_uri: https://tradicional.arq.br/schema/BibliographicCitation
    description: "Cadastro de uma refer\xEAncia bibliogr\xE1fica.\nUsar o campo `description`\
      \ para formatar a refer\xEAncia, caso a formata\xE7\xE3o autom\xE1tica do Zotero\
      \ n\xE3o for satisfat\xF3ria.\n"
    from_schema: https://tradicional.arq.br/schema/resource
    exact_mappings:
    - dcterms:BibliographicCitation
    close_mappings:
    - crm:E31_Document
    - schema:CreativeWork
    slots:
    - description
    - bibliographicCitation__refid
    - bibliographicCitation__note
    attributes:
      refid:
        name: refid
        description: "Se a fonte for cadastrada, o campo `refid` deve conter a chave\
          \ de cita\xE7\xE3o (`citation key`) que consta do registro bibliogr\xE1\
          fico na biblioteca do nosso projeto de pesquisa no [Zotero]. Em geral, a\
          \ chave de cita\xE7\xE3o \xE9 o DOI ou ISBN da publica\xE7\xE3o, mas pode\
          \ ser diferente.\n"
        range: CslCitekey
        required: true
      note:
        name: note
        description: "Se necess\xE1rio, incluir no campo `note` uma especifica\xE7\
          \xE3o adicional, como o n\xFAmero da p\xE1gina da refer\xEAncia bibliogr\xE1\
          fica de onde a informa\xE7\xE3o foi extra\xEDda.\n"
        range: string
    class_uri: dcterms:BibliographicCitation
  RelatedObject:
    name: RelatedObject
    definition_uri: https://tradicional.arq.br/schema/RelatedObject
    description: "As formas mais comuns de rela\xE7\xE3o no nosso projeto s\xE3o :\n\
      \n  - depicted in: A edifica\xE7\xE3o \xE9 representada numa pintura ou desenho\n\
      \    art\xEDstico;\n\n  - documented by: Informa\xE7\xF5es sobre a edifica\xE7\
      \xE3o est\xE3o publicadas numa\n    refer\xEAncia bibliogr\xE1fica, processo\
      \ administrativo ou outro documento\n    textual impresso, manuscrito ou eletr\xF4\
      nico;\n\n  - has plan / has floor plan / has section / has elevation / has\n\
      \    rendering: Essas rela\xE7\xF5es mostram a exist\xEAncia de desenhos t\xE9\
      cnicos\n    da edifica\xE7\xE3o, sejam eles hist\xF3ricos ou recentes, compilados\
      \ de\n    fontes externas a este projeto de pesquisa.\n\n  - has construction\
      \ drawing / has design / has sketch: Essas rela\xE7\xF5es se\n    referem a\
      \ desenhos hist\xF3ricos (fontes prim\xE1rias) que atestam o\n    processo de\
      \ projeto da edifica\xE7\xE3o.\n\nATEN\xC7\xC3O : OS DESENHOS PRODUZIDOS POR\
      \ ESTE PROJETO DE PESQUISA DEVEM SER CADASTRADOS NO GRUPO resource, MAIS ABAIXO.\n\
      O grupo relation \xE9 destinado unicamente a cadastrar rela\xE7\xF5es desta\
      \ edifica\xE7\xE3o com objetos aut\xF4nomos, tais como outras edifica\xE7\xF5\
      es, conjuntos urbanos, obras de artes visuais, refer\xEAncias bibliogr\xE1ficas\
      \ ou acervos arquiv\xEDsticos.\n"
    from_schema: https://tradicional.arq.br/schema/resource
    slots:
    - description
    - relation_type
    - related_object
    - object_type
    - resources
    - media
    - source
    - bibliographic_citation
    class_uri: wasth:RelatedObject
  RelatedWork:
    name: RelatedWork
    definition_uri: https://tradicional.arq.br/schema/RelatedWork
    description: A wrapper for identifying information about an object or work, including
      collections, related to the object/work in focus. May include a weblink.
    from_schema: https://tradicional.arq.br/schema/resource
    is_a: RelatedObject
    slots:
    - description
    - relation_type
    - object_type
    - resources
    - media
    - source
    - bibliographic_citation
    - RelatedWork_related_object
    slot_usage:
      related_object:
        name: related_object
        range: Work
    class_uri: wasth:RelatedWork
  Resource:
    name: Resource
    definition_uri: https://tradicional.arq.br/schema/Resource
    description: "This class comprises identifiable immaterial items that make propositions\
      \ about reality.\nThese propositions may be expressed in text, graphics, images,\
      \ audiograms, videograms, or by other similar means. Documentation databases\
      \ are regarded as instances of E31 Document. This class should not be confused\
      \ with the concept \u201Cdocument\u201D in Information Technology, which is\
      \ compatible with E73 Information Object.\n"
    from_schema: https://tradicional.arq.br/schema/resource
    exact_mappings:
    - crm:E31_Document
    - schema:ArchiveComponent
    is_a: Thing
    slots:
    - Thing_description
    - title_type
    - bibliographic_citation
    - content
    - thing__id
    - thing__author
    - thing__record_date
    - thing__title
    - thing__title_source
    - thing__alt_name
    - thing__category
    - thing__identifiers
    - thing__tags
    - thing__temporal
    - thing__collection
    - thing__repositories
    - thing__record_rights
    - relation_type
    - preview_image
    - provided_image
    - provided_3d
    - resource_service
    - unit
    - credit
    - resource__scale
    - resource__perspective
    attributes:
      scale:
        name: scale
        description: "N\xFAmero inverso da escala da imagem, se ela tiver uma resolu\xE7\
          \xE3o ou tamanho de p\xE1gina definidos. Por exemplo, para um desenho na\
          \ escala 1\u2009:\u2009100, `scale: 100`."
        alias: scale
        range: float
        minimum_value: 0
      perspective:
        name: perspective
        description: "Tipo de vista do desenho. Usar a numera\xE7\xE3o da ISO\u2009\
          19650\u20132\u2009:\n\n  - 0 = geral\n  - 1 = planta baixa (padr\xE3o, pode\
          \ ser omitido)\n  - 2 = eleva\xE7\xE3o\n  - 3 = corte\n  - 4 = mapa de elementos\n\
          \  - 5 = detalhe\n  - 6 = mapa de revestimentos\n  - 7 = planta de forro\n\
          \  - 8 = vista ou modelo 3D\n  - 9 = definido pelo agente\n"
        ifabsent: integer(1)
        range: integer
        minimum_value: 0
        maximum_value: 9
    class_uri: crm:E31_Document
  MediaObject:
    name: MediaObject
    definition_uri: https://tradicional.arq.br/schema/MediaObject
    description: "Descri\xE7\xE3o e refer\xEAncia a um \xFAnico arquivo de m\xEDdia.\n\
      Obrigatoriamente deve conter uma URI.\nNo caso de `preview_image` ou `provided_image`,\
      \ o link deve referenciar diretamente o arquivo (ficheiro) da imagem. Em se\
      \ tratando de `provided_3d` ou `service`, o link deve remeter a uma p\xE1gina\
      \ web que forne\xE7a a respetiva API ou as informa\xE7\xF5es acerca do modelo.\n\
      (A FAZER) Ver [Instru\xE7\xF5es para carregar imagens e desenhos].\n"
    from_schema: https://tradicional.arq.br/schema/resource
    exact_mappings:
    - schema:MediaObject
    - dctypes:Image
    slots:
    - format
    - preview_image
    - provided_image
    - provided_3d
    - resource_service
    - measurements
    - media_alt
    - description
    - source
    - bibliographic_citation
    - credit
    - rights
    class_uri: schema:MediaObject
  TypedReference:
    name: TypedReference
    definition_uri: https://tradicional.arq.br/schema/TypedReference
    description: Reference to a local record, IRI, URI, or LIDO terminology term.
    from_schema: https://tradicional.arq.br/schema/shared
    slots:
    - reference_type
    - term
    - refid
    - bibliographic_citation
    - source
    class_uri: wasth:TypedReference
  Measurement:
    name: Measurement
    definition_uri: https://tradicional.arq.br/schema/Measurement
    description: "This class comprises actions measuring physical properties and other\
      \ values that can be determined by a systematic, objective procedure of direct\
      \ observation of particular states of physical reality.\nAn instance of E16\
      \ Measurement may use simple counting or tools, such as yardsticks or radiation\
      \ detection devices. The interest is in the method and care applied, so that\
      \ the reliability of the result may be judged at a later stage, or research\
      \ continued on the associated documents. The date of the event is important\
      \ for dimensions, which may change value over time, such as the length of an\
      \ object subject to shrinkage. Methods and devices employed should be associated\
      \ with instances of E16 Measurement by properties such as: *P33 used specific\
      \ technique*: E29 Design or Procedure, *P125 used object of type*: E55 Type,\
      \ *P16 used specific object (was used for)*: E70 Thing, whereas basic techniques\
      \ such as \"carbon-14 dating\" should be encoded using *P2 has type (is type\
      \ of)*: E55 Type. Details of methods and devices reused or reusable in other\
      \ instances of E16 Measurement should be documented for these entities rather\
      \ than the measurements themselves, whereas details of particular execution\
      \ may be documented by free text or by instantiating adequate sub-activities,\
      \ if the detail may be of interest for an overarching query.\nRegardless whether\
      \ a measurement is made by an instrument or by human senses, it represents the\
      \ initial transition from physical reality to information without any other\
      \ documented information object in between within the reasoning chain that would\
      \ represent the result of the interaction of the observer or device with reality.\
      \ Therefore, determining properties of an instance of E90 Symbolic Object is\
      \ regarded as an instance of E13 Attribute Assignment, which may be inferred\
      \ from observing and measuring representative carriers. In the case that the\
      \ carrier can be named, the property *P16 used specific object (was used for)*\
      \ should be used to indicate the instance(s) of E18 Physical Thing that was\
      \ used as the empirical basis for the attribute assignment. For instance, inferring\
      \ properties of depicted items using image material, such as satellite images,\
      \ is not regarded as an instance of E16 Measurement, but as a subsequent instance\
      \ of E13 Attribute Assignment. Rather, only the production of the images, understood\
      \ as arrays of radiation intensities, is regarded as an instance of E16 Measurement.\
      \ The same reasoning holds for other sensor data.\nO campo `description` permite\
      \ uma representa\xE7\xE3o textual das medidas da edifica\xE7\xE3o, caso n\xE3\
      o seja poss\xEDvel cadastrar medidas individuais com precis\xE3o, ou seja preciso\
      \ maior flexibilidade para explicar as dimens\xF5es.\n"
    from_schema: https://tradicional.arq.br/schema/shared
    exact_mappings:
    - crm:E16_Measurement
    close_mappings:
    - dcterms:format
    slots:
    - description
    - format_extent
    - bibliographic_citation
    - unit
    - measurement__type
    - measurement__value
    - measurement__qualifier
    - measurement__shape
    attributes:
      type:
        name: type
        description: "designa a natureza da medida\u2009: largura, altura, \xE1rea,\
          \ etc. \u2014 usar um dos [tipos de dimens\xF5es ](https://www.getty.edu/vow/AATHierarchy?find=&logic=AND&note=&page=1&subjectid=300226820)\
          \ do Art and Architecture Thesaurus do Instituto Getty (AAT).\n"
        ifabsent: MeasurementType(proper)
        range: MeasurementType
      value:
        name: value
        description: "Valor num\xE9rico, usar ponto como separador decimal."
        alias: value
        range: float
        required: true
        minimum_value: 0
      qualifier:
        name: qualifier
        description: "Indica que as medidas s\xE3o aproximadas\u2009: usar um [qualificador\
          \ do AAT](https://www.getty.edu/vow/AATHierarchy?find=&logic=&note=&page=1&subjectid=300435720)\u2009\
          ;\n"
        alias: qualifier
        range: string
      shape:
        name: shape
        description: 'caso relevante, indicar a forma do elemento medido usando a
          [lista de formas do AAT](https://www.getty.edu/vow/AATHierarchy?find=&logic=AND&note=&page=1&subjectid=300056273).

          '
        alias: shape
        range: string
    class_uri: crm:E16_Measurement
  MaterialTech:
    name: MaterialTech
    definition_uri: https://tradicional.arq.br/schema/MaterialTech
    description: "Usar discernimento para identificar sistemas, materiais e t\xE9\
      cnicas que interessam ao conhecimento da edifica\xE7\xE3o no seu conjunto, n\xE3\
      o a partes menos extensas ou pouco importantes.\n"
    from_schema: https://tradicional.arq.br/schema/shared
    is_a: ConceptReference
    slots:
    - description
    - bibliographic_citation
    - conceptReference__name
    - materialTech__material_tech_type
    attributes:
      material_tech_type:
        name: material_tech_type
        description: "Tipo da refer\xEAncia a um material ou t\xE9cnica usado na obra:\
          \ material de constru\xE7\xE3o (support), revestimento (medium), t\xE9cnica,\
          \ instrumento, cor, etc.\n"
        alias: type
        range: MaterialTechType
        required: true
    class_uri: wasth:MaterialTech
  Right:
    name: Right
    definition_uri: https://tradicional.arq.br/schema/Right
    description: "* Preencher `earliest_date` com a data de in\xEDcio da vig\xEAncia\
      \ dos direitos ou a data do preenchimento da ficha. * `latest_date` pode ser\
      \ omitido se n\xE3o houver fim da vig\xEAncia. * `holder` pode ser omitido se\
      \ a obra estiver no dom\xEDnio p\xFAblico.\n"
    from_schema: https://tradicional.arq.br/schema/shared
    exact_mappings:
    - dcterms:rights
    slots:
    - right__concept
    - right__type
    - right__temporal
    - right__holder
    attributes:
      concept:
        name: concept
        description: 'Qualifies the kind of rights type, whether it refers to a generic
          kind of right, like copyright or performance rights, or is a specific rights
          or license statement, for instance, Rights Statements or Creative Commons
          Licenses.

          '
        range: RightsType
        required: true
      type:
        name: type
        description: "An index element for rights information being recorded. This\
          \ can refer to a generic kind of right, such as copyright or a related right,\
          \ but also be a specific rights or license statement like a standardized\
          \ statement on copyright, usage, or access rights.\nPor padr\xE3o, as casas\
          \ tradicionais pertencem ao dom\xEDnio p\xFAblico at\xE9 prova em contr\xE1\
          rio. Essa informa\xE7\xE3o e a declara\xE7\xE3o de direitos NKC (Sem direito\
          \ autoral conhecido) N\xC3O PODE ser omitida da ficha. Para o dom\xEDnio\
          \ p\xFAblico, indicar a refer\xEAncia: <https://rightsstatements.org/vocab/NKC/1.0/>.\n"
        range: TypedReference
        required: true
        inlined: true
      temporal:
        name: temporal
        description: Date on which a right is or was current.
        alias: temporal
        range: EventDate
        inlined: true
      holder:
        name: holder
        description: 'A set of elements identifying the person or the group of persons
          holding the rights referenced in Rights Type. Often refers to copyright
          and related rights, such as the right to reproduce, distribute, exhibit
          or use the entity in focus, for example, the object/work, resource or metadata
          record.

          '
        alias: holder
        range: LegalBody
        inlined: true
    class_uri: dcterms:rights
  LegalBody:
    name: LegalBody
    definition_uri: https://tradicional.arq.br/schema/LegalBody
    description: Personal, corporate, family, or other responsible body.
    from_schema: https://tradicional.arq.br/schema/shared
    slots:
    - legalBody__type
    - legalBody__name
    attributes:
      type:
        name: type
        ifabsent: string(corporate)
        alias: type
        range: RepositoryType
      name:
        name: name
        alias: name
        range: TypedReference
        inlined: true
    class_uri: wasth:LegalBody
  Header:
    name: Header
    definition_uri: https://tradicional.arq.br/schema/Header
    description: Presentation metadata for the WASTH interface.
    from_schema: https://tradicional.arq.br/schema/shared
    slots:
    - teaser
    - overlay_image
    - caption
    class_uri: wasth:Header
  Event:
    name: Event
    definition_uri: https://tradicional.arq.br/schema/Event
    description: "This class comprises distinct, delimited and coherent processes\
      \ and interactions of a material nature, in cultural, social or physical systems,\
      \ involving and affecting instances of E77 Persistent Item in a way characteristic\
      \ of the kind of process. Typical examples are meetings, births, deaths, actions\
      \ of decision taking, making or inventing things, but also more complex and\
      \ extended ones such as conferences, elections, building of a castle, or battles.\n\
      While the continuous growth of a tree lacks the limits characteristic of an\
      \ event, its germination from a seed does qualify as an event. Similarly, the\
      \ blowing of the wind lacks the distinctness and limits of an event, but a hurricane,\
      \ flood or earthquake would qualify as an event. Mental processes are considered\
      \ as events, in cases where they are connected with the material externalization\
      \ of their results; for example, the creation of a poem, a performance or a\
      \ change of intention that becomes obvious from subsequent actions or declarations.\n\
      The effects of an instance of E5 Event may not lead to relevant permanent changes\
      \ of properties or relations of the items involved in it, for example an unrecorded\
      \ performance. Of course, in order to be documented, some kind of evidence for\
      \ an event must exist, be it witnesses, traces or products of the event.\nWhile\
      \ instances of E4 Period always require some form of coherence between its constituent\
      \ phenomena, in addition, the essential constituents of instances of E5 Event\
      \ should contribute to an overall effect; for example, the statements made during\
      \ a meeting and the listening of the audience.\nViewed at a coarse level of\
      \ detail, an instance of E5 Event may appear as if it had an \u2018instantaneous\u2019\
      \ overall effect, but any process or interaction of material nature in reality\
      \ have an extent in time and space. At a fine level, instances of E5 Event may\
      \ be analysed into component phenomena and phases within a space and timeframe,\
      \ and as such can be seen as a period, regardless of the size of the phenomena.\
      \ The reverse is not necessarily the case: not all instances of E4 Period give\
      \ rise to a noteworthy overall effect and are thus not instances of E5 Event.\n"
    from_schema: https://tradicional.arq.br/schema/temporal
    exact_mappings:
    - crm:E5_Event
    - schema:Event
    is_a: Thing
    slots:
    - Thing_description
    - bibliographic_citation
    - content
    - thing__id
    - thing__author
    - thing__record_date
    - thing__title
    - thing__title_source
    - thing__alt_name
    - thing__category
    - thing__identifiers
    - thing__tags
    - thing__temporal
    - thing__collection
    - thing__repositories
    - thing__record_rights
    - measurements
    - material
    - technique
    - media
    - event__type
    - event__actor_role
    - event__event_date
    - event__start_date
    - event__end_date
    - event__style_period
    - event__culture
    - event__place
    - event__method
    - event__things_present
    - event__related_events
    attributes:
      type:
        name: type
        range: EventType
        required: true
      actor_role:
        name: actor_role
        description: "Identifica\xE7\xE3o de um agente e do seu papel no evento."
        range: Actor
        multivalued: true
        inlined_as_list: true
      event_date:
        name: event_date
        description: Conjunto de datas em que decorreu o evento.
        range: EventDate
        required: true
        inlined: true
      start_date:
        name: start_date
        description: 'Data inicial do evento ou mais antiga data presumida para o
          seu decurso.

          '
        alias: start_date
        range: EventDate
        inlined: true
      end_date:
        name: end_date
        description: 'Data final do evento ou mais tardia data presumida para o seu
          decurso.

          '
        alias: end_date
        range: EventDate
        inlined: true
      style_period:
        name: style_period
        description: 'An index element for the period in which the event happened,
          comprising information about geologic time scale, archaelogical, historical,
          or artistic period, style, or art movement, whose characteristics are represented
          by the object or work.

          Note that "Period/Style" corresponds to "Style" in CDWA as shorthand for
          [Style/Period/Group/Movement/Dynasty](https://www.getty.edu/research/publications/electronic_publications/cdwa/17styles.html).

          Examples may be Neolithic for a period, Impressionist for a style, or Cubism
          for a movement.

          '
        range: StylePeriod
        multivalued: true
        inlined_as_list: true
      culture:
        name: culture
        description: An index element for the cultural context from which the object/work
          in focus originated. Used if the creator or producer is unknown, or if the
          cultural context is of particular interest. Examples may include the name
          of a culture, a nation, or an ethnic group.
        range: TypedReference
        multivalued: true
        inlined_as_list: true
      place:
        name: place
        description: A set of structured information indicating the place or location
          where an object/work was associated with a particular event.
        range: EventPlace
        inlined: true
      method:
        name: method
        description: An index element for the method by which the event is or was
          carried out. Examples may include an acquisition method or a field collection
          method.
        range: ConceptReference
        multivalued: true
        inlined_as_list: true
      things_present:
        name: things_present
        description: A set of structured information for a related object or work
          that is or was present at the event in focus. Repeated if there are multiple
          related objects or works.
        range: RelatedWork
        multivalued: true
      related_events:
        name: related_events
        description: A set of structured information about an event related to the
          event in focus, indicating the type of relationship where applicable.
        range: RelatedEvent
        multivalued: true
    class_uri: crm:E5_Event
  Actor:
    name: Actor
    definition_uri: https://tradicional.arq.br/schema/Actor
    description: Agent and role in an event.
    from_schema: https://tradicional.arq.br/schema/temporal
    slots:
    - bibliographic_citation
    - actor__actor_type
    - actor__actor_name
    - actor__role_in_event
    - actor__actor_qualifier
    - actor__actor_extent
    attributes:
      actor_type:
        name: actor_type
        description: "Define se o agente \xE9 uma pessoa, uma organiza\xE7\xE3o ou\
          \ corpora\xE7\xE3o, uma oficina, uma fam\xEDlia, etc.\n"
        ifabsent: AgentType(personal)
        alias: type
        range: AgentType
      actor_name:
        name: actor_name
        description: "Nome do agente extra\xEDdo de um vocabul\xE1rio controlado."
        alias: name
        range: TypedReference
        inlined: true
      role_in_event:
        name: role_in_event
        description: "A\xE7\xE3o desempenhada pelo agente no evento."
        range: RoleType
      actor_qualifier:
        name: actor_qualifier
        description: 'For the Attribution Qualifier Actor element choose a concept
          URI from the [attribution qualifiers hierarchy](http://vocab.getty.edu/hier/aat/300404264)
          of the Art & Architecture Thesaurus, or another linked open vocabulary.

          '
        alias: qualifier
        range: TypedReference
        multivalued: true
        inlined_as_list: true
      actor_extent:
        name: actor_extent
        description: Parte da obra sobre a qual o agente interveio.
        alias: extent
        range: TypedReference
        multivalued: true
        inlined_as_list: true
    class_uri: wasth:Actor
  EventDate:
    name: EventDate
    definition_uri: https://tradicional.arq.br/schema/EventDate
    description: 'A wrapper for the expression of a date by providing a set of years
      as earliest and latest date delimiting the respective span of time, usually
      given in the proleptic Gregorian calendar.

      If it is an exact date, possibly with time, repeat the same date (and time)
      in Earliest Date and Latest Date elements.

      '
    from_schema: https://tradicional.arq.br/schema/temporal
    slots:
    - description
    - eventDate__earliest_date
    - eventDate__latest_date
    attributes:
      earliest_date:
        name: earliest_date
        description: 'An index element for the expression of an exact or estimated
          date, for instance a year or calendar date, that delimits the beginning
          of a date span.

          '
        range: DateRange
      latest_date:
        name: latest_date
        description: 'An index element for the expression of the exact or approximate
          date, for instance a year or calendar date, that delimits the end of a date
          span.

          '
        range: DateRange
    class_uri: wasth:EventDate
  DateRange:
    name: DateRange
    definition_uri: https://tradicional.arq.br/schema/DateRange
    from_schema: https://tradicional.arq.br/schema/temporal
    slots:
    - dateRange__date_type
    - dateRange__date_value
    attributes:
      date_type:
        name: date_type
        description: 'An attribute for the kind of latest date, whether it is, for
          instance, exact or estimated.

          '
        alias: type
        range: DateQualifier
        required: true
      date_value:
        name: date_value
        description: "Usar o formato ISO-8601 (por exemplo, 2026-03-17). Para datas\
          \ imprecisas, usar o primeiro dia, m\xEAs ou ano do per\xEDodo delimitado,\
          \ e descrever verbalmente o per\xEDodo no campo `description`.\n"
        range: date
    class_uri: wasth:DateRange
  StylePeriod:
    name: StylePeriod
    definition_uri: https://tradicional.arq.br/schema/StylePeriod
    from_schema: https://tradicional.arq.br/schema/temporal
    is_a: ConceptReference
    slots:
    - description
    - bibliographic_citation
    - conceptReference__name
    - stylePeriod__type
    attributes:
      type:
        name: type
        range: PeriodNameType
        required: true
    class_uri: wasth:StylePeriod
  EventPlace:
    name: EventPlace
    definition_uri: https://tradicional.arq.br/schema/EventPlace
    from_schema: https://tradicional.arq.br/schema/temporal
    slots:
    - description
    - eventPlace__type
    - eventPlace__places
    attributes:
      type:
        name: type
        range: EventPlaceType
      places:
        name: places
        description: "Lugares associados ao evento, sem incluir o pr\xF3prio local\
          \ no qual se situa a edifica\xE7\xE3o.\n"
        alias: places
        range: Site
        multivalued: true
        inlined_as_list: true
    class_uri: wasth:EventPlace
  RelatedEvent:
    name: RelatedEvent
    definition_uri: https://tradicional.arq.br/schema/RelatedEvent
    from_schema: https://tradicional.arq.br/schema/temporal
    slots:
    - description
    - relatedEvent__name
    attributes:
      name:
        name: name
        symmetric: true
        range: Event
        required: true
        multivalued: true
        inlined: false
    class_uri: wasth:RelatedEvent
  Thing:
    name: Thing
    definition_uri: https://tradicional.arq.br/schema/Thing
    description: "This class comprises all things in the universe of discourse of\
      \ the CIDOC Conceptual Reference Model.\nIt is an abstract concept providing\
      \ for three general properties:\n- Identification by name or appellation, and\
      \ in particular by a preferred\n  identifier.\n\n- Classification by type, allowing\
      \ further refinement of the specific\n  subclass to which an instance belongs.\n\
      \n- Attachment of free text and other unstructured data for the expression\n\
      \  of anything not captured by formal properties.\n\nAll other classes within\
      \ the CIDOC CRM are directly or indirectly specialisations of E1 CRM Entity.\n"
    from_schema: https://tradicional.arq.br/schema/thing
    exact_mappings:
    - crm:E1_CRM_Entity
    - schema:Thing
    abstract: true
    slots:
    - Thing_description
    - title_type
    - bibliographic_citation
    - content
    - thing__id
    - thing__author
    - thing__record_date
    - thing__title
    - thing__title_source
    - thing__alt_name
    - thing__category
    - thing__identifiers
    - thing__tags
    - thing__temporal
    - thing__collection
    - thing__repositories
    - thing__record_rights
    slot_usage:
      description:
        name: description
        required: true
    attributes:
      id:
        name: id
        description: Unique identifier for this object.
        slot_uri: dcterms:identifier
        identifier: true
        range: uriorcurie
      author:
        name: author
        description: ORCID iD of the record author or maintainer.
        slot_uri: dcterms:creator
        range: OrcidId
      record_date:
        name: record_date
        description: Date the record was created or last substantively revised.
        slot_uri: dcterms:created
        range: date
      title:
        name: title
        description: The preferred human-readable label for a Thing.
        exact_mappings:
        - schema:name
        slot_uri: dcterms:title
        range: string
        required: true
      title_source:
        name: title_source
        description: "\U0001F4DA A fonte do t\xEDtulo title_source \xE9 opcional ;\
          \ um t\xEDtulo pode ser atestado em mais de uma fonte, por isso este campo\
          \ \xE9 uma lista de itens (cada item come\xE7a com um h\xEDfen).\nSe a fonte\
          \ for cadastrada, o campo `refid` deve conter a chave de cita\xE7\xE3o (citation\
          \ key) que consta do registro bibliogr\xE1fico na biblioteca do nosso projeto\
          \ de pesquisa no Zotero. Em geral, a chave de cita\xE7\xE3o \xE9 o DOI ou\
          \ ISBN da publica\xE7\xE3o, mas pode ser diferente.\nSe necess\xE1rio, incluir\
          \ no campo note uma especifica\xE7\xE3o adicional, como o n\xFAmero da p\xE1\
          gina da refer\xEAncia bibliogr\xE1fica de onde a informa\xE7\xE3o foi extra\xED\
          da.\nTodos os campos source no restante da ficha devem ser preenchidos do\
          \ mesmo modo. (Equivalente DublinCore: bibliographiCitation)."
        range: BibliographicCitation
        multivalued: true
        inlined_as_list: true
      alt_name:
        name: alt_name
        description: "O bloco `alt_name` permite cadastrar outros nomes pelos quais\
          \ a edifica\xE7\xE3o ser\xE1 eventualmente conhecida. \xC9 uma lista opcional\
          \ de itens, e se existir, os campos de cada item da lista devem ser preenchidos\
          \ como os do t\xEDtulo principal.\nO campo `description` de cada item cont\xE9\
          m o texto do t\xEDtulo (nome).\nEste bloco pode ser omitido por completo\
          \ se n\xE3o houver t\xEDtulos alternativos.\n"
        range: Appellation
        multivalued: true
        inlined_as_list: true
      category:
        name: category
        description: 'The LIDO Category Vocabulary is a structured controlled list
          of terms recommended to use as values in the LIDO Category element.

          Examples are human-made object or natural object.'
        slot_uri: term:lidoCategory
        designates_type: true
        range: uriorcurie
        required: true
      identifiers:
        name: identifiers
        description: Published or external identifiers for the object.
        range: TypedReference
        multivalued: true
        inlined_as_list: true
      tags:
        name: tags
        description: Provisional uncontrolled keywords. Prefer `classifications` or
          `subject` for curated vocabulary terms.
        range: string
        multivalued: true
      temporal:
        name: temporal
        description: Temporalidade do objeto.
        range: Event
        multivalued: true
        inlined_as_list: true
      collection:
        name: collection
        description: Collections or aggregations to which the object belongs.
        range: TypedReference
        multivalued: true
        inlined_as_list: true
      repositories:
        name: repositories
        description: "A set of elements for the identification, name and location\
          \ of the repository that is responsible for the object/work in focus.\n\
          Repeated if there are several designations known, or if former repositories\
          \ or geographic places should be listed.\n---------------------------------------------------------------------\n\
          Nos Document\xE1rios da Arquitetura Tradicional, usamos reposit\xF3rios\
          \ para indicar a inclus\xE3o da edifica\xE7\xE3o em per\xEDmetros de s\xED\
          tios do patrim\xF4nio cultural, etc.\nOs reposit\xF3rios devem ser cadastrados\
          \ de modo semelhante \xE0s informa\xE7\xF5es de georreferenciamento, usando\
          \ o tipo `other`.\n"
        range: Repository
        multivalued: true
        inlined_as_list: true
      record_rights:
        name: record_rights
        description: "A set of structured information about rights regarding the content\
          \ provided in this LIDO record.\n---------------------------------------------------------------------\n\
          :warning: Este grupo se refere aos direitos sobre o CONTE\xDADO da ficha,\
          \ n\xE3o sobre os direitos incidentes sobre o objeto descrito.\n"
        range: Right
        required: true
        multivalued: true
        inlined_as_list: true
    class_uri: crm:E1_CRM_Entity
  Appellation:
    name: Appellation
    definition_uri: https://tradicional.arq.br/schema/Appellation
    from_schema: https://tradicional.arq.br/schema/thing
    slots:
    - description
    - title_type
    - bibliographic_citation
    - appellation__title_preference
    attributes:
      title_preference:
        name: title_preference
        description: "Indica se o nome em quest\xE3o deve ser oculto ou n\xE3o, se\
          \ \xE9 uma vers\xE3o alternativa ou uma variante de grafia, etc."
        alias: label_type
        range: LabelType
        required: true
    class_uri: wasth:Appellation
  Repository:
    name: Repository
    definition_uri: https://tradicional.arq.br/schema/Repository
    description: "Entidade com exist\xEAncia jur\xEDdica e espacial."
    from_schema: https://tradicional.arq.br/schema/thing
    exact_mappings:
    - schema:Organization
    is_a: Thing
    slots:
    - Thing_description
    - title_type
    - bibliographic_citation
    - content
    - thing__id
    - thing__author
    - thing__record_date
    - thing__title
    - thing__title_source
    - thing__alt_name
    - thing__category
    - thing__identifiers
    - thing__tags
    - thing__temporal
    - thing__collection
    - thing__repositories
    - thing__record_rights
    - site
    - legal_body
    class_uri: schema:Organization
  Work:
    name: Work
    definition_uri: https://tradicional.arq.br/schema/Work
    description: "An historical landmark or building.\nNos Document\xE1rios da Arquitetura\
      \ Tradicional, esta ficha pode ser usada para cadastrar uma edifica\xE7\xE3\
      o, um conjunto arquitet\xF4nico, ou ainda uma parte significativa de uma edifica\xE7\
      \xE3o.\n"
    from_schema: https://tradicional.arq.br/schema/work
    exact_mappings:
    - schema:LandmarksOrHistoricalBuildings
    close_mappings:
    - crm:E22_Human-Made_Object
    rank: 0
    is_a: Place
    slots:
    - Thing_description
    - bibliographic_citation
    - content
    - thing__record_date
    - thing__title
    - thing__title_source
    - thing__alt_name
    - thing__identifiers
    - thing__tags
    - thing__temporal
    - thing__repositories
    - thing__record_rights
    - place__work_type_function
    - place__work_type_context
    - place__part_of
    - place__former_site
    - place__intended_site
    - place__other_site
    - Place_title_type
    - measurements
    - material
    - technique
    - subject
    - related_works
    - resources
    - media
    - work__work_type_condition
    - work__work_type_form
    - work__work_type_material_tech
    - work__work_type_subject_type
    - work__work_type_use
    - work__classification_genre
    - work__classification_subject
    - work__classification_local
    - work__classification_special
    - work__inscriptions
    - work__location_historic
    - work__collection
    - work__work_rights
    - Work_id
    - Work_author
    - Work_category
    - Work_site
    slot_usage:
      id:
        name: id
        description: "Cada edifica\xE7\xE3o ter\xE1 um identificador gerado a partir\
          \ do seu georreferenciamento usando Open Location Code (\"PlusCode\"). Este\
          \ identificador usa o campo `id`, que ser\xE1 gerado automaticamente pelo\
          \ programa WASTH."
        is_a: place__id
        range: OlcPlusCode11
      author:
        name: author
        from_schema: https://tradicional.arq.br/schema
        slot_uri: wasth:author
        range: string
        required: true
      category:
        name: category
        from_schema: https://tradicional.arq.br/schema
        slot_uri: wasth:category
        ifabsent: string(http://terminology.lido-schema.org/lido00096)
        range: string
      site:
        name: site
        required: false
    attributes:
      work_type_condition:
        name: work_type_condition
        description: "Descriptors for objects that are distinguishable by their overall\
          \ state such as appearance, level of damage, completeness, or quality. If\
          \ an object is identified by its prevailing physical state, then it is qualified\
          \ by condition.\nBased on [AAT \"conditions\"](http://vocab.getty.edu/page/aat/300389724)\
          \ and [CIDOC CRM \"E3 Condition State\"](http://cidoc-crm.org/html/cidoc_crm_v7.1.1_with_translations.html#E3)\n\
          Atende aos campos do [SICG](https://sicg.iphan.gov.br/sicg/manual/manual.htmlhttps://sicg.iphan.gov.br/sicg/manual/manual.html)\
          \ \"estado de preserva\xE7\xE3o\" e \"estado de conserva\xE7\xE3o\"."
        slot_uri: term:lido00937
        range: ConceptReference
        recommended: true
        multivalued: true
        inlined_as_list: false
      work_type_form:
        name: work_type_form
        description: "Descriptors for objects that are distinguishable by their physical\
          \ form or by the manner in which they are presented. If an object is identified\
          \ by sight, then it is qualified by form.\nBased on [AAT Guidelines \"Types\
          \ of Guide Terms\"](https://www.getty.edu/research/tools/vocabularies/guidelines/aat_3_1_hierarchical_rels.html)\n\
          Nos Document\xE1rios da Arquitetura Tradicional, designa uma tipologia formal."
        slot_uri: term:lido00766
        range: ConceptReference
        recommended: true
        multivalued: true
        inlined_as_list: false
      work_type_material_tech:
        name: work_type_material_tech
        description: "Descriptors for objects that are distinguishable by their materials\
          \ encorporated, or the techniques used to create the object or work. If\
          \ an object is identified by the substances detected and/or the processes\
          \ employed, then it is qualified by material or technique.\nNos Document\xE1\
          rios da Arquitetura Tradicional, refere-se \xE0 caracteriza\xE7\xE3o construtiva\
          \ geral da edifica\xE7\xE3o."
        slot_uri: term:lido00789
        range: MaterialTech
        recommended: true
        multivalued: true
        inlined_as_list: false
      work_type_subject_type:
        name: work_type_subject_type
        description: "Descriptors for objects that are distinguishable by their topics,\
          \ themes, or other content of the work. If an object is identified by what\
          \ it is of or about, then it is qualified by subject.\nBased on [AAT \"\
          subjects\"](http://vocab.getty.edu/page/aat/300404126)\nNos Document\xE1\
          rios da Arquitetura Tradicional, \xE9 o \xFAnico bloco opcional desta se\xE7\
          \xE3o\u2009: ele indica, se houver, uma classifica\xE7\xE3o iconogr\xE1\
          fica mais espec\xEDfica do que `form` ou `function`."
        slot_uri: term:lido00768
        range: ConceptReference
        recommended: true
        multivalued: true
        inlined_as_list: false
      work_type_use:
        name: work_type_use
        description: "Descriptors for objects that are distinguishable by the way\
          \ they are employed, occupied, applied, or function. If an object is identifiable\
          \ by its particular mode of use, it is qualified by use.\nBased on [AAT\
          \ \"use\"](http://vocab.getty.edu/page/aat/300068844)\nNos Document\xE1\
          rios da Arquitetura Tradicional, designa propriamente a(s) classifica\xE7\
          \xE3o(\xF5es) de usos do solo ou atividades predominante(s) na edifica\xE7\
          \xE3o atualmente."
        slot_uri: term:lido00938
        range: ConceptReference
        recommended: true
        multivalued: true
        inlined_as_list: false
      classification_genre:
        name: classification_genre
        description: "A broad category for grouping objects on the basis of shared\
          \ intrinsic characteristics. The relationship between an object/work and\
          \ the object genre is a generic is-a-relation rather than a membership based\
          \ on ascription to a subject group.\nNote that the [AAT Object Genres](http://vocab.getty.edu/page/aat/300185711)\
          \ hierarchy differs in its scope from Object genre here in that the AAT\
          \ includes more specific terms grouped by various aspects. In general, AAT\
          \ descriptors are not intended to be used as indexing terms for classification.\n\
          \u2753 Ainda n\xE3o implementamos o bloco `objectClassification` do LIDO.\
          \ Talvez ele n\xE3o seja relevante para o document\xE1rio de arquitetura\
          \ dom\xE9stica, e n\xE3o \xE9 obrigat\xF3rio no padr\xE3o LIDO nem no perfil\
          \ de aplica\xE7\xE3o para arquitetura.\n"
        slot_uri: term:lido00853
        range: ConceptReference
        multivalued: true
        inlined_as_list: false
      classification_subject:
        name: classification_subject
        description: "A broad category for grouping objects or works on the basis\
          \ of a topical association, including thematic or systematic classification,\
          \ or an assignment by discipline. The relationship between an object/work\
          \ and a subject category is a kind of membership based on ascription rather\
          \ than a generic is-a relation.\n\u2753 Ainda n\xE3o implementamos o bloco\
          \ `objectClassification` do LIDO. Talvez ele n\xE3o seja relevante para\
          \ o document\xE1rio de arquitetura dom\xE9stica, e n\xE3o \xE9 obrigat\xF3\
          rio no padr\xE3o LIDO nem no perfil de aplica\xE7\xE3o para arquitetura."
        slot_uri: term:lido00932
        range: ConceptReference
        multivalued: true
        inlined_as_list: false
      classification_local:
        name: classification_local
        description: "A classification scheme for grouping objects on the basis of\
          \ locally defined criteria, including categories corresponding to the curatorial\
          \ departments of the repository, such as \"prints and drawings\", \"decorative\
          \ arts\", \"North America\", \"invertebrates\", \"Bronze Age\" or \"textiles\"\
          . [Based on CCO \"Class\"](https://vraweb.org/wp-content/uploads/2020/04/CatalogingCulturalObjectsFullv2.pdf)\n\
          \u2753 Ainda n\xE3o implementamos o bloco `objectClassification` do LIDO.\
          \ Talvez ele n\xE3o seja relevante para o document\xE1rio de arquitetura\
          \ dom\xE9stica, e n\xE3o \xE9 obrigat\xF3rio no padr\xE3o LIDO nem no perfil\
          \ de aplica\xE7\xE3o para arquitetura."
        slot_uri: term:lido01135
        range: ConceptReference
        multivalued: true
        inlined_as_list: false
      classification_special:
        name: classification_special
        description: "A classification scheme for grouping objects on the basis of\
          \ criteria defined within specific academic disciplines or cultural domains,\
          \ such as the \"Hornbostel-Sachs Classification of Musical Instruments\"\
          , the \"Nickel-Strunz classification\", biological taxonomies etc. Refers\
          \ to classification schemes that group objects on the basis of object characteristics,\
          \ not on the basis of themes or topics which the objects or works are related\
          \ to.\n\u2753 Ainda n\xE3o implementamos o bloco `objectClassification`\
          \ do LIDO. Talvez ele n\xE3o seja relevante para o document\xE1rio de arquitetura\
          \ dom\xE9stica, e n\xE3o \xE9 obrigat\xF3rio no padr\xE3o LIDO nem no perfil\
          \ de aplica\xE7\xE3o para arquitetura."
        slot_uri: term:lido01144
        range: ConceptReference
        multivalued: true
        inlined_as_list: false
      inscriptions:
        name: inscriptions
        description: "Marcas, s\xEDmbolos ou textos gravados na edifica\xE7\xE3o,\
          \ especialmente aqueles referentes \xE0 estrutura como um todo e n\xE3o\
          \ espec\xEDficos a alguma de suas partes. N\xE3o usar para iconografia."
        range: Inscription
        multivalued: true
        inlined_as_list: true
      location_historic:
        name: location_historic
        description: "Antigas jurisdi\xE7\xF5es ou designa\xE7\xF5es para o lugar\
          \ onde o objeto se encontra. Para um s\xEDtio de onde o objeto foi fisicamente\
          \ removido, usar `former_site:`."
        range: HistoricPlace
        multivalued: true
        inlined_as_list: true
      collection:
        name: collection
        description: 'A set of identifying and indexing information about the collection
          the object/work in focus is gathered into or is a member of.

          Collection applies to any accumulated group of physical or digital items,
          conceptually or physically brought together on the basis of a focal characteristic.
          Use cases for grouping items into a collection are various and may span
          curated holdings in museums, departmental collections, sets of items to
          be displayed in an exhibition, or aggregations bound informally for cataloging
          and retrieval purposes.

          '
        slot_uri: lido:collection
        range: Thing
        multivalued: true
        inlined_as_list: false
      work_rights:
        name: work_rights
        description: "> :warning: Este bloco se refere a eventuais direitos autorais\
          \ sobre A > EDIFICA\xC7\xC3O E O SEU PROJETO, n\xE3o sobre o conte\xFAdo\
          \ da ficha ou sobre a > iconografia relacionada.\n"
        slot_uri: lido:rightsWorkSet
        range: Right
        required: true
        multivalued: true
        inlined_as_list: true
    class_uri: schema:LandmarksOrHistoricalBuildings
  Inscription:
    name: Inscription
    definition_uri: https://tradicional.arq.br/schema/Inscription
    description: "A descri\xE7\xE3o da inscri\xE7\xE3o informa local, dimens\xF5es\
      \ e caracter\xEDsticas. Os tipos de descri\xE7\xE3o podem ser extra\xEDdos da\
      \ hierarquia Getty: <http://vocab.getty.edu/page/aat/300220469>.\nOs itens das\
      \ listas de `material` e `technique` DEVEM usar o nosso [vocabul\xE1rio controlado](https://vocabulario.tradicional.arq.br).\n\
      Essa distin\xE7\xE3o \xE9 especialmente relevante no caso de revestimentos,\
      \ como estuques, azulejos ou pinturas decorativas, por oposi\xE7\xE3o \xE0 base\
      \ sobre a qual eles s\xE3o aplicados."
    from_schema: https://tradicional.arq.br/schema/work
    slots:
    - format_extent
    - description
    - content
    - bibliographic_citation
    - inscription__type
    attributes:
      type:
        name: type
        ifabsent: string(text)
        range: InscriptionType
        required: true
    class_uri: wasth:Inscription
  Topic:
    name: Topic
    definition_uri: https://tradicional.arq.br/schema/Topic
    description: Subject or iconographic topic.
    from_schema: https://tradicional.arq.br/schema/work
    slots:
    - description
    - format_extent
    - Topic_concept
    - topic__type
    slot_usage:
      concept:
        name: concept
        required: true
    attributes:
      type:
        name: type
        range: SubjectType
        required: true
    class_uri: wasth:Topic
  HistoricPlace:
    name: HistoricPlace
    definition_uri: https://tradicional.arq.br/schema/HistoricPlace
    description: "Designa\xE7\xF5es alternativas ou jurisdi\xE7\xF5es antigas para\
      \ o mesmo local, N\xC3O a localiza\xE7\xE3o original de uma constru\xE7\xE3\
      o fisicamente deslocada (para tanto, cadastrar outra localiza\xE7\xE3o do tipo\
      \ `former_site`). Preencher apenas caso a nomenclatura seja relevante, por exemplo\
      \ para nomear as antigas prov\xEDncias de Portugal ou o Oeste da Bahia, que\
      \ originalmente pertencia a Pernambuco, ou ainda se for relevante informar uma\
      \ regi\xE3o f\xEDsica."
    from_schema: https://tradicional.arq.br/schema/work
    slots:
    - historicPlace__type
    - historicPlace__name
    attributes:
      type:
        name: type
        range: RepositoryType
        required: true
      name:
        name: name
        range: TypedReference
        required: true
        inlined: true
    class_uri: wasth:HistoricPlace

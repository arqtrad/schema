  EventPlaceType:
    name: EventPlaceType
    definition_uri: https://tradicional.arq.br/schema/EventPlaceType
    description: The type attribute qualifies the place according to its role or function
      in the context of an event, whether it is a place of discovery, a point of destination,
      or a point of origin.
    from_schema: https://tradicional.arq.br/schema
    reachable_from:
      source_ontology: http://terminology.lido-schema.org/eventPlace_type
      include_self: false
  PeriodNameType:
    name: PeriodNameType
    definition_uri: https://tradicional.arq.br/schema/PeriodNameType
    description: 'The LIDO Period/Style Type-Vocabulary is a controlled list of terms
      recommended to use as values for the type attribute of the Period/Style element.

      The type attribute qualifies the particular kind of period/style information,
      such as style, period, or movement. Examples may be neolithic for a period,
      impressionist for a style, or cubism for a movement.

      Based on [CDWA "Styles/Periods/Groups/Movements"](http://www.getty.edu/research/publications/electronic_publications/cdwa/17styles.html)

      '
    from_schema: https://tradicional.arq.br/schema
    reachable_from:
      source_ontology: http://terminology.lido-schema.org/periodName_type
      include_self: false
  GeometryType:

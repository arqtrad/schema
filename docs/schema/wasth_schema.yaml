  material:
    name: material
    definition_uri: https://tradicional.arq.br/schema/material
    description: "This class is a specialization of E55 Type and comprises the concepts\
      \ of materials.\nInstances of E57 Material may denote properties of matter before\
      \ its use, during its use, and as incorporated in an object, such as ultramarine\
      \ powder, tempera paste, reinforced concrete. Discrete pieces of raw-materials\
      \ kept in museums, such as bricks, sheets of fabric, pieces of metal, should\
      \ be modelled individually in the same way as other objects. Discrete used or\
      \ processed pieces, such as the stones from Nefer Titi's temple, should be modelled\
      \ as parts (cf. P46 is composed of (forms part of): E18 Physical Thing).\nThis\
      \ type is used categorically in the model without reference to instances of\
      \ it, i.e. the Model does not foresee the description of instances of instances\
      \ of E57 Material, e.g. \u201Cinstances of gold\u201D.\nIt is recommended that\
      \ internationally or nationally agreed codes and terminology should be used.\n"
    from_schema: https://tradicional.arq.br/schema/shared
